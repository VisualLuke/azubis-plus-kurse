<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Fachvokabeln: Kfz-Werkstatt</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=block">
<link rel="stylesheet" href="../../werkzeug/stil.css">
<style>
.auf-brand{/*AUF_BRAND*/}
:root{
  --n200:var(--a2273fd3-5899-46bc-985c-b3c33e3c0780,#E6E3EE);
  --b400:var(--f0297ed8-06f5-4ffd-83fc-e6cd5dbaa2cd,#8163EE);
  --warning:var(--c19df991-9894-4419-88fb-b2b58e36f9f7,#E0992B);
  --warning-text:var(--71f60857-f754-4514-8386-e3f62d71441a,#9C6712);
  --warning-bg:var(--c7c18918-fab3-46fc-af57-2ec14b380cb2,#FCF1DD);
  --error:var(--f694e88e-bdd3-4eb1-bf33-26a20f247ed4,#E2556A);
  --error-bg:var(--fb93d1a9-9399-4624-95d4-83b61d28209b,#FCE7EA);
  --info:var(--3f081c40-af4e-4425-a97f-c7528bc5ad4d,#3B82F6);
  --info-bg:var(--f939ccd9-6c46-4062-bfe6-c36c169ccafb,#E6EFFE);
}
#kamera{position:absolute;inset:0;transform-origin:1320px 540px}
/* Bühnen: Wand, Boden */
.buehne.raum{width:900px;height:720px;border-radius:48px;background:linear-gradient(var(--b50),var(--b100));overflow:hidden}
.buehne.gross{width:1680px;height:880px;border-radius:48px;background:linear-gradient(var(--b50),var(--b100));overflow:hidden}
.buehne .boden{position:absolute;left:0;right:0;top:520px;bottom:0;background:linear-gradient(var(--b200),var(--b100))}
.buehne .boden::before{content:'';position:absolute;left:0;right:0;top:0;height:14px;background:var(--b300);opacity:.55}
.buehne.gross .boden{top:640px}

/* ================= Format „Fachvokabeln“ (übernommen aus Lernvideo 31) ================= */
/* Artikel-Farben: der = b500 · die = success · das = warning */
.der{--f:var(--b500);--ft:var(--b600);--fa:var(--surface)}
.die{--f:var(--success);--ft:var(--success-text);--fa:var(--surface)}
.das{--f:var(--warning);--ft:var(--warning-text);--fa:var(--surface)}
.neutral{--f:var(--b300);--ft:var(--b600);--fa:var(--b600)}
.vk{width:640px;height:340px;border-radius:36px;background:var(--surface);box-shadow:0 18px 50px rgba(22,19,37,.10);overflow:hidden;
  padding:44px 46px 38px;display:flex;flex-direction:column}
.vk .band{position:absolute;left:0;right:0;top:0;height:14px;background:var(--f)}
.vk .kopf{display:flex;align-items:center;justify-content:space-between;height:48px;flex:none}
.vk .art{display:inline-block;padding:4px 22px;border-radius:999px;background:var(--f);color:var(--fa);font:800 32px/40px Inter;white-space:nowrap}
.vk .punkte{display:flex;gap:9px;align-items:center}
.vk .punkte i{display:block;width:12px;height:12px;border-radius:99px;background:var(--n200)}
.vk .punkte i.fertig{background:var(--b200)}
.vk .punkte i.jetzt{width:40px;background:var(--f);transform-origin:left center}
.vk .wort{margin-top:22px;font-weight:800;letter-spacing:-.03em;color:var(--ink);white-space:nowrap}
.vk.ohne .wort{margin:auto 0}
.vk .pl{margin-top:auto;display:flex;align-items:baseline;gap:18px;font:600 44px/52px Inter;color:var(--n700);white-space:nowrap}
.vk .pl small{font:700 21px/26px Inter;letter-spacing:.08em;text-transform:uppercase;color:var(--n500)}
.vk .pl u{text-decoration:none;display:inline-block}
.sl{width:640px;min-height:152px;padding:26px 32px 28px 148px;border-radius:32px;background:var(--surface);box-shadow:0 14px 40px rgba(22,19,37,.09);
  font:600 34px/45px Inter;color:var(--ink)}
.sl .sw{display:inline-block;white-space:nowrap}
.sl u{display:inline-block;text-decoration:none;opacity:0;white-space:pre}
.sl .sw.lw u{color:var(--ft);font-weight:800}
.sl .q{color:var(--b300);font-weight:800}
.lg{display:inline-block;padding:6px 24px;border-radius:999px;background:var(--f);color:var(--fa);font:800 34px/44px Inter;margin-right:16px}
.chip{display:flex;align-items:center;justify-content:center;height:58px;padding:0 26px;border-radius:999px;background:var(--f);color:var(--fa);font:800 28px/34px Inter;white-space:nowrap;
  box-shadow:0 8px 22px rgba(22,19,37,.14)}
.chip b{font-weight:600;opacity:.85;margin-right:9px}

/* Bausteine */
.portrait{border-radius:999px;overflow:hidden;background:linear-gradient(160deg,var(--b200),var(--b300));border:7px solid var(--surface);
  box-shadow:0 6px 20px rgba(22,19,37,.12)}
.portrait .ebene{position:absolute;left:0;top:0;width:100%;height:100%}
.portrait .figur{position:absolute;left:0;top:6%;width:100%;height:100%;transform-origin:50% 100%}
.portrait .augen{transform-origin:50% 45%}
.portrait .auf{transform-origin:50% 54%}
.portrait .zu{transform-origin:50% 56%}
.welle{border-radius:999px;border:5px solid var(--b300);opacity:0}
.plakette{width:72px;height:72px;border-radius:999px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(22,19,37,.18);border:5px solid var(--surface)}
.plakette svg{width:34px}
.plakette.gruen{background:var(--success)} .plakette.rot{background:var(--error)} .plakette.gelb{background:var(--warning)} .plakette.lila{background:var(--b400)} .plakette.blau{background:var(--info)}
.plakette.gross{width:112px;height:112px} .plakette.gross svg{width:56px}
.nr{width:60px;height:60px;border-radius:99px;background:var(--b500);color:var(--surface);font:800 32px/60px Inter;text-align:center;box-shadow:0 4px 12px rgba(22,19,37,.18);border:4px solid var(--surface);line-height:52px}
/* Auto (Karosserie + Räder) */
.auto .rad{position:absolute}
/* Intro: Werkstatt-Tore */
.tor{width:520px;height:430px;border-radius:30px 30px 0 0;border:16px solid var(--b300);border-bottom:0;background:linear-gradient(var(--b100),var(--b200));overflow:hidden}
.tor::before{content:'';position:absolute;left:0;right:0;top:0;height:70px;background:repeating-linear-gradient(var(--b300) 0 7px,var(--b200) 7px 18px)}
.tor::after{content:'';position:absolute;left:0;right:0;bottom:0;height:10px;background:var(--b300);opacity:.6}
/* Auftrag (Klemmbrett) */
.auftrag{width:380px;height:500px;border-radius:28px;background:linear-gradient(135deg,var(--b600),var(--b700));box-shadow:0 18px 44px rgba(22,19,37,.16);padding:52px 22px 22px}
.auftrag .kl{position:absolute;left:115px;top:-16px;width:150px;height:48px;border-radius:14px;background:var(--n300)}
.auftrag .kl::after{content:'';position:absolute;left:24px;right:24px;top:12px;height:18px;border-radius:8px;background:var(--surface)}
.auftrag .bl{height:100%;border-radius:14px;background:var(--surface);padding:18px 18px}
.auftrag .ak{display:flex;align-items:center;justify-content:space-between;font:800 27px/34px Inter;color:var(--b600);letter-spacing:-.01em;height:60px;border-bottom:3px solid var(--b100);margin-bottom:16px}
.auftrag .ak .mini{width:70px;height:41px}
.auftrag .az{position:relative;display:flex;align-items:center;gap:14px;height:62px;padding:0 12px;border-radius:14px;font:600 25px/30px Inter;color:var(--n700);white-space:nowrap}
.auftrag .az s{display:block;width:30px;height:30px;border-radius:8px;border:3.5px solid var(--b300);flex:none;background:var(--surface)}
.auftrag .az.hell{background:var(--warning-bg)}
.auftrag .zl{display:block;height:14px;border-radius:7px;background:var(--n200);margin:26px 12px 0}
/* Hebebühne */
.saeule{width:58px;border-radius:16px 16px 6px 6px;background:linear-gradient(90deg,var(--b400),var(--b600));box-shadow:0 10px 24px rgba(22,19,37,.14),inset 0 14px 0 var(--b300);transform-origin:50% 100%}
.saeule.hell{background:linear-gradient(90deg,var(--b200),var(--b300));box-shadow:inset 0 10px 0 var(--b100)}
.fuss{width:120px;height:16px;border-radius:6px;background:var(--b700)}
.fuss.hell{background:var(--b300)}
.arm{height:22px;border-radius:11px;background:linear-gradient(var(--b600),var(--b700))}
/* Bremsbeläge */
.belag{width:240px;display:flex;flex-direction:column;align-items:center}
.belag .pt{width:240px;height:24px;border-radius:8px;background:linear-gradient(var(--n200),var(--n300));box-shadow:0 4px 10px rgba(22,19,37,.12)}
.belag .ms{width:206px;border-radius:0 0 14px 14px;background:linear-gradient(var(--b600),var(--b700))}
.belag.rot .ms{background:var(--error)}
/* Ölwechsel */
.wanne{width:250px;height:90px;border-radius:10px 10px 32px 32px;background:linear-gradient(var(--n200),var(--n300));overflow:hidden;box-shadow:0 10px 24px rgba(22,19,37,.12)}
.wanne .oel{position:absolute;left:12px;right:12px;bottom:12px;height:58px;border-radius:6px 6px 24px 24px;background:var(--b700);transform-origin:50% 100%}
.strahl{width:14px;border-radius:7px;transform-origin:50% 0}
.strahl.alt{background:var(--b700)} .strahl.neu{background:var(--warning)}
.stopfen{width:22px;height:16px;border-radius:4px;background:var(--b700)}
/* Diagnose */
.diag{width:340px;height:250px;border-radius:26px;background:linear-gradient(135deg,var(--b600),var(--b700));padding:14px;box-shadow:0 16px 40px rgba(22,19,37,.16)}
.diag .scr{height:100%;border-radius:14px;background:var(--surface);padding:16px 18px;overflow:hidden}
.diag .dk{font:800 24px/30px Inter;color:var(--b600);letter-spacing:-.01em}
.diag .bar{height:14px;border-radius:7px;background:var(--b100);margin:12px 0 14px;overflow:hidden}
.diag .bar i{display:block;height:100%;width:100%;background:var(--b500);transform-origin:0 50%}
.diag .fs{font:700 18px/24px Inter;color:var(--n500);letter-spacing:.06em;text-transform:uppercase}
.diag .code{margin-top:8px;display:flex;align-items:center;gap:12px;height:62px;padding:0 16px;border-radius:14px;background:var(--warning-bg);font:800 32px/40px Inter;color:var(--warning-text);letter-spacing:.03em}
.diag .code svg{width:36px;flex:none}
.diag.leer .scr{background:var(--b50)}
.armatur{width:380px;height:150px;border-radius:34px 34px 20px 20px;background:linear-gradient(var(--b600),var(--b700));box-shadow:0 14px 30px rgba(22,19,37,.14)}
.armatur i{position:absolute;top:28px;width:84px;height:84px;border-radius:99px;background:var(--surface);box-shadow:inset 0 0 0 8px var(--b300)}
.buchse{width:86px;height:50px;border-radius:10px 10px 20px 20px;background:radial-gradient(circle,var(--n300) 3px,transparent 3.6px) 8px 6px/14px 18px,var(--ink);box-shadow:0 0 0 6px var(--b200)}
.stecker{width:62px;height:34px;border-radius:8px;background:linear-gradient(var(--b400),var(--b600));box-shadow:0 4px 10px rgba(22,19,37,.2)}
/* HU */
.kennz{width:300px;height:96px;border-radius:12px;background:var(--surface);box-shadow:inset 0 0 0 5px var(--ink),0 6px 16px rgba(22,19,37,.15);display:flex;align-items:center;padding-left:94px;
  font:800 29px/1 Inter;color:var(--ink);letter-spacing:.02em;white-space:nowrap}
.plak{width:80px;height:80px;border-radius:99px;background:var(--warning);box-shadow:0 0 0 4px var(--surface),0 4px 12px rgba(22,19,37,.25)}
.plak svg{position:absolute;left:0;top:0;width:100%}
.plak b{position:absolute;left:0;right:0;top:0;font:800 22px/80px Inter;color:var(--ink);text-align:center}
.blase{padding:12px 40px;border-radius:32px;background:var(--surface);font:800 52px/60px Inter;color:var(--b600);box-shadow:0 10px 28px rgba(22,19,37,.12);white-space:nowrap}
.blase::after{content:'';position:absolute;left:50%;bottom:-12px;width:26px;height:26px;margin-left:-13px;background:var(--surface);transform:rotate(45deg);border-radius:4px}
.zs{width:640px;height:96px}
.zs .li{position:absolute;left:40px;right:40px;top:16px;height:8px;border-radius:4px;background:var(--b200);transform-origin:0 50%}
.zs .pk{position:absolute;top:6px;width:28px;height:28px;margin-left:-14px;border-radius:99px;background:var(--surface);box-shadow:inset 0 0 0 6px var(--b400)}
.zs .pk.an{box-shadow:inset 0 0 0 14px var(--success)}
.zs span{position:absolute;top:50px;width:160px;margin-left:-80px;font:700 25px/32px Inter;color:var(--b600);text-align:center;white-space:nowrap}
.pruef{width:118px;height:118px;border-radius:99px;background:var(--surface);box-shadow:0 8px 22px rgba(22,19,37,.10);display:flex;align-items:center;justify-content:center}
.pruef > svg{width:84px}
.pruef .ok{position:absolute;right:-8px;bottom:-8px;width:46px;height:46px;border-radius:99px;background:var(--success);border:4px solid var(--surface);display:flex;align-items:center;justify-content:center}
.pruef .ok svg{width:24px}
/* Bildfenster im Schlussdialog */
.fenster{width:600px;height:400px;border-radius:40px;background:linear-gradient(var(--surface) 55%,var(--b50));box-shadow:0 18px 50px rgba(22,19,37,.12)}
/* Abspann */
.deckel{position:absolute;inset:0;background:linear-gradient(135deg,var(--b500),var(--b700));clip-path:circle(0% at 50% 50%)}
.deckel .gross{font:800 100px/110px Inter;letter-spacing:-.03em;text-align:center}
.deckel .klein{font:400 40px/54px Inter;color:var(--b100);margin-top:24px;text-align:center;max-width:1300px}
</style></head><body>

<template id="svgHaken"><svg viewBox="0 0 40 40"><path d="M9 21l7 7 15-16" stroke="var(--surface)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></template>

  <div class="a buehne gross" id="bue0"></div>

</div></div>

  <div class="gross" id="asTitel">Sofort verstehen.</div>
  <div class="klein" id="asUnter">In der Werkstatt musst du Teile, Werkzeuge und Aufträge sofort verstehen.</div>
</div></div>

<script src="../../werkzeug/motor.js"></script>
<script>
/* ---------- Aufnahme: Satz- und Wortzeiten aus sprache.json ---------- */
const VERSATZ = 0.7;
window.SPRACHE = { datei: 'sprache.mp3', versatz: VERSATZ };
const A = s => s + VERSATZ;
const W = (m, n) => A(wort(m, satz(n).start - .01));          // Filmzeit des Worts im Satz n (oder danach)
const WE = (m, n) => A(wortEnde(m, satz(n).start - .01));
const SA = n => A(satz(n).start);
const SE = n => A(satz(n).ende);
const ENDE_SPRACHE = SE(SPRACHDATEN.saetze.length);
const WELT = document.getElementById('welt');

const el = id => typeof id === 'string' ? (id.startsWith('#') ? $(id) : document.getElementById(id)) : id;
const _tw = tw; tw = (ids, ...r) => _tw([].concat(ids).map(el), ...r);
const _ak = akteur; akteur = (id, ...r) => _ak(el(id), ...r);
const wertBei = (id, p, t) => wert(AKTEURE.get(el(id)), p, t);
const pop = (id, t, basis, snd = 'pop', e = 'back') => { akteur(id, { ...basis, s: 0 }); tw(id, t, e === 'back' ? .5 : .65, { s: basis.s ?? 1 }, e); if (snd) cue(t, snd); };
const ein = (id, t, basis, von = { y: 70 }, snd = null) => {
  akteur(id, { ...basis, o: 0, x: basis.x + (von.x || 0), y: basis.y + (von.y || 0), r: von.r || 0 });
  tw(id, t, .5, { o: 1 }, 'out'); tw(id, t, .6, { x: basis.x, y: basis.y, r: basis.r || 0 }, 'sanft');
  tw(id, t + .3, .12, { sy: .93, sx: 1.05 }, 'sinus'); tw(id, t + .42, .4, { sy: 1, sx: 1 }, 'sanft');
  if (snd) cue(t, snd);
};
const aus = (ids, t, d = .35) => tw(ids, t, d, { o: 0, s: .85 }, 'in');
const wackeln = (id, t, n = 3, w = 3) => { for (let i = 0; i < n; i++) tw(id, t + i * .1, .1, { r: i % 2 ? w : -w }, 'sinus'); tw(id, t + n * .1, .25, { r: 0 }, 'sinus'); };
const huepfen = (id, t, h = 18) => {
  const y = wertBei(id, 'y', t);
  tw(id, t, .08, { sy: .94, sx: 1.04 }, 'sinus');
  tw(id, t + .08, .36, { y }, 'sinus', { bogen: h }); tw(id, t + .08, .14, { sy: 1.04, sx: .97 }, 'sinus');
  tw(id, t + .44, .08, { sy: .95, sx: 1.04 }, 'sinus'); tw(id, t + .52, .3, { sy: 1, sx: 1 }, 'sanft');
};
const bump = (id, t, s = 1.1) => { const s0 = wertBei(id, 's', t); tw(id, t, .12, { s: s0 * s }, 'sinus'); tw(id, t + .12, .4, { s: s0 }, 'sanft'); };
const flug = (id, t0, d, x, y, h = 120, extra = {}) => tw(id, t0, d, { x, y, ...extra }, 'inout', { bogen: h });
const landen = (id, t) => { tw(id, t, .08, { sy: .86, sx: 1.08 }, 'sinus'); tw(id, t + .08, .45, { sy: 1, sx: 1 }, 'sanft'); };
const lerp = (a, b, p) => a + (b - a) * p;
const tpl = id => document.getElementById(id).innerHTML;
const kopie = (id, p) => tpl(id).replace(/id="([^"]+)"/g, `id="$1_${p}"`).replace(/url\(#([^)]+)\)/g, `url(#$1_${p})`);
const neu = (id, inhalt, stil = '', attr = '', klasse = '') => { WELT.insertAdjacentHTML('beforeend', `<div class="a ${klasse}" id="${id}" style="${stil}" ${attr}>${inhalt}</div>`); return id; };
const welle = (id, t, x, y, d = .9) => { if (!el(id)) neu(id, '', 'width:160px;height:160px', 'data-frei', 'welle'); akteur(id, { x, y, o: 0, s: .8 }); set(id, t, { o: .9, s: .8 }); tw(id, t, d, { o: 0, s: 1.6 }, 'weich'); };
let WN = 0;
const wellen = (t, x, y, farbe = null, gr = 160) => { const id = 'wl' + WN++; neu(id, '', `width:${gr}px;height:${gr}px${farbe ? ';border-color:' + farbe : ''}`, 'data-frei', 'welle'); welle(id, t, x, y); };
const plakette = (id, farbe, svg, attr = 'data-frei') => neu(id, tpl(svg), '', attr, 'plakette ' + farbe);
