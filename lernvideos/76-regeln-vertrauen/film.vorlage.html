<style>
.auf-brand{/*AUF_BRAND*/}
:root{
  --border:var(--ace3a6a9-7f72-4964-bea0-331cd543a214,#EDEAF4);
  --n200:var(--a2273fd3-5899-46bc-985c-b3c33e3c0780,#E6E3EE);
  --n400:var(--7bda698f-465c-49f5-afd3-31fe7cd36aff,#9A93AD);
  --b400:var(--f0297ed8-06f5-4ffd-83fc-e6cd5dbaa2cd,#8163EE);
  --warning:var(--c19df991-9894-4419-88fb-b2b58e36f9f7,#E0992B);

}
#kamera{position:absolute;inset:0;transform-origin:0 0}
#vorne{position:absolute;inset:0;pointer-events:none}

/* ---------- Bühne: die Nacht-Kreuzung als Modell ---------- */
.buehne.nacht{width:1760px;height:940px;border-radius:48px;overflow:hidden;background:var(--b700);box-shadow:0 24px 60px rgba(22,19,37,.22)}

.ebene{position:absolute;left:0;top:0;width:100%;height:100%}

.mast{width:8px;border-radius:4px;background:linear-gradient(90deg,var(--n300),var(--n200))}

/* Schilder, Zettel, Blasen */
.mondschild{display:flex;align-items:center;gap:8px;padding:8px 14px 8px 10px;border-radius:14px;background:var(--b50);box-shadow:0 6px 16px rgba(22,19,37,.25);
  font:800 24px/28px Inter;color:var(--b700);white-space:nowrap;transform-origin:50% 0}
.mondschild svg{width:34px;height:34px}
.mondschild::before{content:'';position:absolute;left:50%;top:-14px;width:2px;height:14px;background:var(--n300)}
.kinderschild{width:176px;padding:6px 8px;border-radius:8px;background:var(--surface);border:3px solid var(--b500);text-align:center;
  font:800 13px/16px Inter;color:var(--b700);transform-origin:50% 0;box-shadow:0 4px 10px rgba(22,19,37,.25)}
.kinderschild b{display:block;font-weight:800;color:var(--b500)}
.frage{width:72px;height:72px;border-radius:999px;background:var(--surface);box-shadow:0 6px 18px rgba(22,19,37,.25);
  display:flex;align-items:center;justify-content:center;font:800 46px/1 Inter;color:var(--b500)}
.blase{padding:14px 26px;border-radius:24px;background:var(--surface);box-shadow:0 8px 24px rgba(22,19,37,.22);font:700 28px/36px Inter;color:var(--ink);white-space:nowrap}
.blase::after{content:'';position:absolute;left:38px;bottom:-11px;width:24px;height:24px;background:inherit;transform:rotate(45deg);border-radius:0 0 6px 0}
.blase.r::after{left:auto;right:38px}
.blase .rest{visibility:hidden}
.rotblase{padding:14px 26px;border-radius:6px;background:var(--error-bg);border:4px solid var(--error);font:800 32px/38px Inter;color:var(--error-text);white-space:nowrap}
.rotblase::after{content:'';position:absolute;right:-22px;top:20px;border:12px solid transparent;border-left:16px solid var(--error)}
.zettel76{width:190px;height:236px;padding:20px 20px;border-radius:12px;background:var(--surface);box-shadow:0 10px 26px rgba(22,19,37,.28);
  display:flex;flex-direction:column;gap:12px}
.zettel76 .para{font:800 64px/64px Inter;color:var(--b500)}
.zettel76 b{font:800 26px/30px Inter;color:var(--ink)}
.zettel76 i{height:10px;border-radius:5px;background:var(--n200)}
.namens{width:132px;height:88px;border-radius:14px;background:var(--surface);box-shadow:0 8px 20px rgba(22,19,37,.25);overflow:hidden}
.namens .band{height:24px;background:var(--b100)}
.namens .kopf{position:absolute;left:14px;top:36px;width:36px;height:36px;border-radius:999px;background:var(--b200)}
.namens i{position:absolute;left:60px;height:9px;border-radius:5px;background:var(--n200)}
.plakette{width:46px;height:46px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:var(--success);
  border:4px solid var(--surface);box-shadow:0 4px 12px rgba(22,19,37,.25)}
.plakette svg{width:22px}
.welle{border-radius:999px;border:5px solid var(--b300);opacity:0}

/* Puzzle */
.rahmen svg,.stueck svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
.stueck .ic{position:absolute;left:37px;top:37px;width:76px;height:76px}
.mini{position:absolute;left:12px;top:22px;width:52px;height:34px;border-radius:7px;background:var(--surface);border:3px solid var(--b200)}
.mini u{position:absolute;right:-9px;top:-9px;width:20px;height:20px;border-radius:999px;background:var(--success);border:2px solid var(--surface)}
.wort .titel{font:800 56px/62px Inter;letter-spacing:-.02em;color:var(--b600);white-space:nowrap}

/* Text im Bild: Tafeln */
.tafel{padding:24px 38px 30px;border-radius:30px;background:var(--surface);box-shadow:0 18px 44px rgba(22,19,37,.22);transform-origin:0 0}
.tafel .titel{font:800 54px/64px Inter;letter-spacing:-.02em;color:var(--ink);max-width:820px}
.tafel .titel .w:last-child .wi{color:var(--b500)}

/* Szene 5: geteilte Bühne */
.seite76{width:581px;height:310px;border-radius:30px;border:5px dashed var(--b300);background:var(--b50)}
.seite76 svg{position:absolute;left:0;top:0;width:100%;height:100%}
.riesenfrage{font:800 170px/1 Inter;color:var(--b500)}

  box-shadow:0 6px 20px rgba(22,19,37,.12);font:700 30px/36px Inter;color:var(--ink);white-space:nowrap}
.seitenchip i{width:18px;height:18px;border-radius:999px;background:var(--b500)}
.seitenchip.leer i{background:var(--surface);border:4px dashed var(--b300)}
.gedanke{width:330px;height:230px}
.gedanke svg.wolke{position:absolute;left:0;top:0;width:100%;height:100%}
.gedanke .sym{position:absolute;width:78px;height:78px}

/* Szene 6: Tipp-Seite */
.seite{width:820px;height:960px;border-radius:44px;background:var(--surface);box-shadow:0 24px 60px rgba(22,19,37,.18)}
.tipp{position:absolute;left:96px;top:0;width:660px;height:960px;display:flex;flex-direction:column;justify-content:center}
.tipp .unter{font:600 40px/50px Inter;color:var(--b600);margin-top:0}
.tipp .titel{font:800 82px/92px Inter;letter-spacing:-.03em;color:var(--ink);margin-bottom:56px}
.tipp .titel:last-child{margin-bottom:0}
.kachel76{width:110px;height:110px;background:var(--b100);border:5px solid var(--b300);display:flex;align-items:center;justify-content:center}
.kachel76 .ic{width:76px;height:76px}

/* Abspann */
.deckel{position:absolute;inset:0;background:linear-gradient(135deg,var(--b500),var(--b700));clip-path:circle(0% at 50% 50%)}
.deckel .gross{font:800 96px/106px Inter;letter-spacing:-.03em;text-align:center}
.deckel .klein{font:400 40px/54px Inter;color:var(--b100);margin-top:24px;text-align:center;max-width:1300px}

.portrait{border-radius:999px;overflow:hidden;background:linear-gradient(160deg,var(--b200),var(--b300));border:6px solid var(--surface);
  box-shadow:0 6px 20px rgba(22,19,37,.22)}

.portrait .figur{position:absolute;left:0;top:6%;width:100%;height:100%;transform-origin:50% 100%}
.portrait .augen{transform-origin:50% 45%}
.portrait .auf{transform-origin:50% 62%;opacity:0}
.portrait .froh{opacity:0}
</style></head><body>

<div id="kamera"><div id="welt">
  <div class="a buehne nacht" id="bue0"><svg class="strasse" id="strasse" viewBox="80 70 1760 940"></svg><div class="mondlicht" id="mondlicht"></div><div class="hell" id="hell0"></div></div>
</div></div>
<div id="vorne"></div>

<div class="deckel" id="abspann"><div class="ende">
  <div class="gross" id="asTitel">Regeln sind ein Versprechen an alle.</div>
  <div class="klein" id="asUnter">Viele halten sich hier an Regeln, weil das Zusammenleben auf Vertrauen beruht. Hinweis bekommen? Ruhig bleiben. Nicht verstanden? Frag nach.</div>
</div></div>

<script src="../../werkzeug/motor.js"></script>
<script>
/* ---------- Aufnahme ---------- */
const VERSATZ = 0.7;
window.SPRACHE = { datei: 'sprache.mp3', versatz: VERSATZ };
const A = s => s + VERSATZ;
const W = (m, n) => A(wort(m, satz(n).start - .01));
const WE = (m, n) => A(wortEnde(m, satz(n).start - .01));
const WI = (n, i) => A(satz(n).woerter[i].start);          // i-tes Wort im Satz n (eindeutig)
const SA = n => A(satz(n).start), SE = n => A(satz(n).ende);
const ENDE_SPRACHE = SE(SPRACHDATEN.saetze.length);
const WELT = document.getElementById('welt'), VORNE = document.getElementById('vorne');

const el = id => typeof id === 'string' ? (id.startsWith('#') ? $(id) : document.getElementById(id)) : id;
const _tw = tw; tw = (ids, ...r) => _tw([].concat(ids).map(el), ...r);
const _ak = akteur; akteur = (id, ...r) => _ak(el(id), ...r);
const wertBei = (id, p, t) => wert(AKTEURE.get(el(id)), p, t);
const pop = (id, t, basis, snd = 'pop', e = 'back') => { akteur(id, { ...basis, s: 0 }); tw(id, t, e === 'back' ? .5 : .65, { s: basis.s ?? 1 }, e); if (snd) cue(t, snd); };
const ein = (id, t, basis, von = { y: 70 }, snd = null) => {
  akteur(id, { ...basis, o: 0, x: basis.x + (von.x || 0), y: basis.y + (von.y || 0), r: von.r || 0 });
  tw(id, t, .5, { o: 1 }, 'out'); tw(id, t, .6, { x: basis.x, y: basis.y, r: basis.r || 0 }, 'sanft');
  tw(id, t + .3, .12, { sy: .93, sx: 1.05 }, 'sinus'); tw(id, t + .42, .4, { sy: 1, sx: 1 }, 'sanft');
  if (snd) cue(t, snd);
};
const aus = (ids, t, d = .35) => tw(ids, t, d, { o: 0, s: .85 }, 'in');
const wackeln = (id, t, n = 3, w = 3) => { for (let i = 0; i < n; i++) tw(id, t + i * .1, .1, { r: i % 2 ? w : -w }, 'sinus'); tw(id, t + n * .1, .25, { r: 0 }, 'sinus'); };
const huepfen = (id, t, h = 18) => {
  const y = wertBei(id, 'y', t);
  tw(id, t, .08, { sy: .94, sx: 1.04 }, 'sinus');
  tw(id, t + .08, .36, { y }, 'sinus', { bogen: h }); tw(id, t + .08, .14, { sy: 1.04, sx: .97 }, 'sinus');
  tw(id, t + .44, .08, { sy: .95, sx: 1.04 }, 'sinus'); tw(id, t + .52, .3, { sy: 1, sx: 1 }, 'sanft');
};
const bump = (id, t, s = 1.1) => { const s0 = wertBei(id, 's', t); tw(id, t, .12, { s: s0 * s }, 'sinus'); tw(id, t + .12, .4, { s: s0 }, 'sanft'); };
const flug = (id, t0, d, x, y, h = 120, extra = {}) => tw(id, t0, d, { x, y, ...extra }, 'inout', { bogen: h });
const landen = (id, t) => { tw(id, t, .08, { sy: .86, sx: 1.08 }, 'sinus'); tw(id, t + .08, .45, { sy: 1, sx: 1 }, 'sanft'); };
const schweben = (ids, a = 4) => [].concat(ids).forEach(id => { AKTEURE.get(el(id)).basis.schweben = a; });
const lerp = (a, b, p) => a + (b - a) * p;
const tpl = id => document.getElementById(id).innerHTML;
const kopie = (id, p) => tpl(id).replace(/id="([^"]+)"/g, `id="$1_${p}"`).replace(/url\(#([^)]+)\)/g, `url(#$1_${p})`);
const neu = (id, inhalt, stil = '', attr = '', klasse = '', wo = WELT) => { wo.insertAdjacentHTML('beforeend', `<div class="a ${klasse}" id="${id}" style="${stil}" ${attr}>${inhalt}</div>`); return id; };
const bild = (id, t, breite, attr = '', wo = WELT) => neu(id, kopie(t, id), `width:${breite}px`, attr, '', wo);
let WN = 0;
const welle = (t, x, y, farbe = null, gr = 160, d = .9, wo = WELT) => {
  const id = 'wl' + WN++; neu(id, '', `width:${gr}px;height:${gr}px${farbe ? ';border-color:' + farbe : ''}`, 'data-frei', 'welle', wo);
  akteur(id, { x, y, o: 0, s: .8 }); set(id, t, { o: .9, s: .8 }); tw(id, t, d, { o: 0, s: 1.6 }, 'weich');
};
const tippen = (id, text, t1, t2, n = 7) => {
  el(id).innerHTML = `<span class="tp"></span><span class="rest">${text}</span>`;
  const [a, b] = el(id).children;
  HOOKS.push(t => { const k = Math.round(text.length * clamp((t - t1) / (t2 - t1))); a.textContent = text.slice(0, k); b.textContent = text.slice(k); });
  for (let i = 0; i < n; i++) cue(t1 + i * (t2 - t1) / n, 'tipp');
};
// Teil mit stehender Unterkante: x = Mitte, yb = Standlinie (Welt), unten = Standlinie im 160er-Teil
const steht = (yb, breite, unten = 150) => yb - (unten - 80) / 160 * breite;

/* ---------- Kamera: frei über dem Modell (Fokuspunkt + Zoom), Akzente, Unschärfe ---------- */
neu('cam', '', 'display:none'); akteur('cam', { x: 900, y: 560, s: 1.22 });
const fahrt = (t, d, x, y, s, e = 'inout') => tw('cam', t, d, { x, y, s }, e);
const AKZENTE = [];
const akzent = (t, z = .035) => AKZENTE.push([t, z]);
document.body.insertAdjacentHTML('beforeend', '<svg width="0" height="0" style="position:absolute"><filter id="wisch" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur id="wischB" stdDeviation="0 0"/></filter></svg>');
const camBei = t => { const a = AKTEURE.get(el('cam')); return [wert(a, 'x', t), wert(a, 'y', t), wert(a, 's', t)]; };
HOOKS.push(t => {
  const [fx, fy, s] = camBei(t);
  let z = 1;
  for (const [a, h] of AKZENTE) { const d = (t - a) / 1.1; if (d > 0 && d < 1) z += h * Math.sin(Math.PI * E.weich(d)); }
  z *= 1 + .012 * Math.sin(t * .35);
  $('#kamera').style.transform = `translate(960px,540px) scale(${(s * z).toFixed(5)}) translate(${-fx}px,${-fy}px)`;
  const [gx, gy, gs] = camBei(t - 1 / 30);
  const vx = Math.abs(fx * s - gx * gs), vy = Math.abs(fy * s - gy * gs), vs = Math.abs(s - gs) * 900;
  const bx = Math.min(8, (vx + vs) * .025), by = Math.min(8, (vy + vs) * .025);
  $('#wischB').setAttribute('stdDeviation', `${bx.toFixed(2)} ${by.toFixed(2)}`);
  WELT.style.filter = bx + by > .6 ? 'url(#wisch)' : '';
});

/* ---------- Figur Ana (nur Porträt): Mund im eigenen Satz, blinzeln, nicken, Kopf schief, froh ---------- */
const SAETZE = SPRACHDATEN.saetze.map(s => ({ a: A(s.start), b: A(s.ende), w: s.sprecher }));
const FROH = [], KOPF = [], NEIG = [];
function portrait(id, gr, attr = '', wo = WELT) {
  neu(id, `<div class="figur"><div class="ebene">${kopie('f-ana', id)}</div>${tpl('gesicht')}</div>`, `width:${gr}px;height:${gr}px`, attr, 'portrait', wo);
  return id;
}
const froh = (id, t, bis = 999) => FROH.push([id, t, bis]);
const nicken = (id, t, d = 1.1) => KOPF.push([id, t, d]);
const neigen = (id, t, bis, w = -9) => NEIG.push([id, t, bis, w]);
HOOKS.push(t => {
  const pegel = window.PEGEL ? (window.PEGEL[Math.round((t - VERSATZ) * 30)] || 0) : .7 + .3 * Math.sin(t * 9);
  const spricht = SAETZE.some(s => s.w === 'Ana' && t >= s.a && t <= s.b);
  document.querySelectorAll('.portrait').forEach((p, i) => {
    const auf = spricht ? clamp(pegel * (.55 + .45 * Math.abs(Math.sin(t * 13 + i * 7)))) : 0;
    const f = !spricht && FROH.some(([id, a, b]) => id === p.id && t >= a && t < b);
    p.querySelector('.auf').style.transform = `scaleY(${Math.max(.05, auf)})`;
    p.querySelector('.auf').style.opacity = auf > .12 ? 1 : 0;
    p.querySelector('.froh').style.opacity = f && auf <= .12 ? 1 : 0;
    p.querySelector('.zu').style.opacity = auf > .12 || f ? 0 : 1;
    const z = (t * .29 + i * .37) % 1;
    p.querySelector('.augen').style.transform = `scaleY(${z < .035 ? .12 : 1})`;
    let r = spricht ? 1.4 * Math.sin(t * 3.1) * pegel : 1.2 * Math.max(0, Math.sin(t * 1.4 + i * 2.1)) ** 10, y = r;
    for (const [id, t0, d] of KOPF) { const q = (t - t0) / d; if (id !== p.id || q < 0 || q > 1) continue; y += 9 * Math.abs(Math.sin(q * Math.PI * 2)) * Math.sin(Math.PI * q); }
    for (const [id, a, b, w] of NEIG) if (id === p.id) r += w * E.inout(clamp((t - a) / .5)) * (1 - E.inout(clamp((t - b) / .5)));
    p.querySelector('.figur').style.transform = `translate(0px,${y.toFixed(2)}px) rotate(${r.toFixed(2)}deg)`;
  });
});

/* ================= Die Straße (Welt-Koordinaten = Bild bei Zoom 1) ================= */
akteur('bue0', { x: 960, y: 540 });
const H = 500, VPX = 1250, hw = y => 260 * (y - H) / 510;
{
  const F = 'fill', s = [];
  s.push(`<defs><linearGradient id="himmel" x2="0" y2="1"><stop offset="0" stop-color="var(--b700)"/><stop offset="1" stop-color="var(--b600)"/></linearGradient>
    <linearGradient id="nah" x2="0" y2="1"><stop offset="0" stop-color="var(--b500)"/><stop offset="1" stop-color="var(--b600)"/></linearGradient></defs>`);
  s.push(`<rect x="80" y="70" width="1760" height="580" fill="url(#himmel)"/>`);
  // Häuserschlucht der Straße nach hinten
  s.push(`<path d="M1150 450L1222 486V560L1150 640Z" fill="var(--b700)"/><path d="M1350 450L1278 486V560L1350 640Z" fill="var(--b700)"/>`);
  s.push(`<path d="M1222 560H1278L${VPX + hw(640) + 30} 640H${VPX - hw(640) - 30}Z" fill="var(--b500)"/>`);
  s.push(`<path d="M${VPX - 20} 560H${VPX + 20}L${VPX + hw(1010)} 1010H${VPX - hw(1010)}Z" fill="var(--b700)"/>`);
  // Häuser
