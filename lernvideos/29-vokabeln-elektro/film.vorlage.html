<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Fachvokabeln: Handwerk & Elektro</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=block">
<link rel="stylesheet" href="../../werkzeug/stil.css">
<style>
.auf-brand{/*AUF_BRAND*/}
:root{
  --n200:var(--a2273fd3-5899-46bc-985c-b3c33e3c0780,#E6E3EE);
  --b400:var(--f0297ed8-06f5-4ffd-83fc-e6cd5dbaa2cd,#8163EE);
  --warning:var(--c19df991-9894-4419-88fb-b2b58e36f9f7,#E0992B);
  --warning-text:var(--71f60857-f754-4514-8386-e3f62d71441a,#9C6712);
  --warning-bg:var(--c7c18918-fab3-46fc-af57-2ec14b380cb2,#FCF1DD);
  --error:var(--f694e88e-bdd3-4eb1-bf33-26a20f247ed4,#E2556A);
  --error-bg:var(--fb93d1a9-9399-4624-95d4-83b61d28209b,#FCE7EA);
  --info:var(--3f081c40-af4e-4425-a97f-c7528bc5ad4d,#3B82F6);
  --info-bg:var(--f939ccd9-6c46-4062-bfe6-c36c169ccafb,#E6EFFE);
}
#kamera{position:absolute;inset:0;transform-origin:1320px 540px}
/* Rohbau: Mauerwerk und Estrich als Teil der Bühne */
.buehne.bau{width:900px;height:720px;border-radius:48px;background:linear-gradient(var(--b50),var(--b100));overflow:hidden}
.buehne.gross{width:1680px;height:880px;border-radius:48px;background:linear-gradient(var(--b50),var(--b100));overflow:hidden}
.buehne .mauer{position:absolute;left:0;top:0;width:100%;height:520px}
.buehne .boden{position:absolute;left:0;right:0;top:520px;bottom:0;background:linear-gradient(var(--b200),var(--b100))}
.buehne .boden::before{content:'';position:absolute;left:0;right:0;top:0;height:14px;background:var(--b300);opacity:.55}
.buehne.gross .mauer{height:640px} .buehne.gross .boden{top:640px}
.buehne.voll .mauer{height:100%}

/* ================= Format „Fachvokabeln“ (übernommen aus Lernvideo 26) ================= */
/* Artikel-Farben: der = b500 · die = success · das = warning · neutral (Verb, Sicherheit) */
.der{--f:var(--b500);--ft:var(--b600);--fa:var(--surface)}
.die{--f:var(--success);--ft:var(--success-text);--fa:var(--surface)}
.das{--f:var(--warning);--ft:var(--warning-text);--fa:var(--surface)}
.neutral{--f:var(--b300);--ft:var(--b600);--fa:var(--b600)}
.vk{width:640px;height:340px;border-radius:36px;background:var(--surface);box-shadow:0 18px 50px rgba(22,19,37,.10);overflow:hidden;
  padding:44px 46px 38px;display:flex;flex-direction:column}
.vk .band{position:absolute;left:0;right:0;top:0;height:14px;background:var(--f)}
.vk .kopf{display:flex;align-items:center;justify-content:space-between;height:48px;flex:none}
.vk .art{display:inline-block;padding:4px 22px;border-radius:999px;background:var(--f);color:var(--fa);font:800 32px/40px Inter;white-space:nowrap}
.vk.neutral .art{background:var(--b100)}
.vk .punkte{display:flex;gap:9px;align-items:center}
.vk .punkte i{display:block;width:12px;height:12px;border-radius:99px;background:var(--n200)}
.vk .punkte i.fertig{background:var(--b200)}
.vk .punkte i.jetzt{width:40px;background:var(--f);transform-origin:left center}
.vk .wort{margin-top:22px;font-weight:800;letter-spacing:-.03em;color:var(--ink)}
.vk.ohne .wort{margin:auto 0}
.vk .wort .w{display:inline-block;white-space:pre}
.vk .pl{margin-top:auto;display:flex;align-items:baseline;gap:18px;font:600 44px/52px Inter;color:var(--n700);white-space:nowrap}
.vk .pl small{font:700 21px/26px Inter;letter-spacing:.08em;text-transform:uppercase;color:var(--n500)}
.sl{width:640px;min-height:152px;padding:26px 32px 28px 148px;border-radius:32px;background:var(--surface);box-shadow:0 14px 40px rgba(22,19,37,.09);
  font:600 34px/45px Inter;color:var(--ink)}
.sl .sw{display:inline-block;white-space:nowrap}
.sl u{display:inline-block;text-decoration:none;opacity:0;white-space:pre}
.sl .sw.lw u{color:var(--ft);font-weight:800}
.sl .q{color:var(--b300);font-weight:800}
.lg{display:inline-block;padding:6px 24px;border-radius:999px;background:var(--f);color:var(--fa);font:800 34px/44px Inter;margin-right:16px}
.chip{display:flex;align-items:center;justify-content:center;height:58px;border-radius:999px;background:var(--f);color:var(--fa);font:800 28px/34px Inter;white-space:nowrap;
  box-shadow:0 8px 22px rgba(22,19,37,.14)}
.chip b{font-weight:600;opacity:.85;margin-right:9px}
.chip.neutral{background:var(--b100)}

/* Bausteine */
.portrait{border-radius:999px;overflow:hidden;background:linear-gradient(160deg,var(--b200),var(--b300));border:7px solid var(--surface);
  box-shadow:0 6px 20px rgba(22,19,37,.12)}
.portrait .ebene{position:absolute;left:0;top:0;width:100%;height:100%}
.portrait .figur{position:absolute;left:0;top:6%;width:100%;height:100%;transform-origin:50% 100%}
.portrait .augen{transform-origin:50% 45%}
.portrait .auf{transform-origin:50% 54%}
.portrait .zu{transform-origin:50% 56%}
.portrait .brille{opacity:0}
.welle{border-radius:999px;border:5px solid var(--b300);opacity:0}
.plakette{width:72px;height:72px;border-radius:999px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(22,19,37,.18);border:5px solid var(--surface)}
.plakette svg{width:34px}
.plakette.gruen{background:var(--success)} .plakette.rot{background:var(--error)} .plakette.gelb{background:var(--warning)} .plakette.lila{background:var(--b400)}
.etikett{padding:10px 24px;border-radius:999px;background:var(--surface);color:var(--b600);font:700 26px/32px Inter;white-space:nowrap;box-shadow:0 6px 18px rgba(22,19,37,.09)}
.ikon{width:150px;height:150px;border-radius:999px;background:var(--surface);box-shadow:0 10px 28px rgba(22,19,37,.12);display:flex;align-items:center;justify-content:center}
.ikon svg{width:112px}
.ikon.br svg{width:300px;flex:none}
.glow{border-radius:999px;background:radial-gradient(var(--warning-bg) 0%,var(--warning-bg) 30%,transparent 70%)}
/* Schild „Baustelle“ */
.schildB{width:300px;display:flex;flex-direction:column;align-items:center}
.schildB .tafel{width:300px;height:96px;border-radius:18px;background:var(--warning);border:6px solid var(--surface);box-shadow:0 10px 26px rgba(22,19,37,.14);
  color:var(--ink);font:800 42px/84px Inter;text-align:center;letter-spacing:-.01em}
.schildB .pfosten{width:14px;height:110px;background:linear-gradient(90deg,var(--n300),var(--n200));border-radius:0 0 6px 6px}
/* Zollstock: Glieder hängen ineinander und klappen am Gelenk */
.zs{position:absolute;height:26px;border-radius:5px;background:linear-gradient(90deg,var(--ink) 2px,transparent 2px) 13px 0/11px 8px repeat-x,var(--warning);
  box-shadow:inset 0 -4px 0 rgba(22,19,37,.12)}
.zs .zs{top:0;transform-origin:13px 13px}
.zs .gl{position:absolute;right:7px;top:7px;width:12px;height:12px;border-radius:99px;background:var(--warning-text)}
.masz{height:30px;border-left:5px solid var(--b500);border-right:5px solid var(--b500);transform-origin:0 50%}
.masz::before{content:'';position:absolute;left:0;right:0;top:12px;height:5px;background:var(--b500)}
/* Wasserwaage mit Libelle */
.ww{width:440px;height:62px;border-radius:14px;background:linear-gradient(var(--b400),var(--b600));box-shadow:0 10px 24px rgba(22,19,37,.14)}
.ww .fen{position:absolute;left:50%;top:13px;width:130px;height:36px;margin-left:-65px;border-radius:18px;background:var(--success-bg);box-shadow:inset 0 0 0 4px var(--b700)}
.ww .strich{position:absolute;top:4px;bottom:4px;width:4px;background:var(--b700);opacity:.5}
.ww .blase{position:absolute;left:50%;top:9px;width:36px;height:18px;margin-left:-18px;border-radius:99px;background:var(--surface);box-shadow:inset 0 -4px 0 var(--success)}
.ww .loch{position:absolute;top:18px;width:26px;height:26px;border-radius:99px;background:var(--b700);opacity:.5}
/* Brett / Wand im Schnitt */
.latte{width:120px;height:440px;border-radius:14px;background:repeating-linear-gradient(180deg,transparent 0 46px,rgba(22,19,37,.06) 46px 50px),linear-gradient(90deg,var(--b200),var(--b300));
  box-shadow:0 12px 30px rgba(22,19,37,.12)}
.beton{width:130px;height:480px;border-radius:14px;background:linear-gradient(90deg,var(--n200),var(--n300));box-shadow:0 12px 30px rgba(22,19,37,.12)}
.schraube{width:130px;height:54px}
/* Sicherungskasten */
.sk{width:440px;height:560px;border-radius:26px;background:var(--surface);box-shadow:0 18px 44px rgba(22,19,37,.14),inset 0 0 0 8px var(--n200);padding:44px 50px}
.sk .reihe{position:relative;height:96px;display:flex;gap:8px;margin-bottom:62px}
.sk .schiene{position:absolute;left:-14px;right:-14px;top:40px;height:16px;border-radius:5px;background:var(--n300)}
.lsm{position:relative;width:50px;height:96px;border-radius:8px;background:var(--surface);box-shadow:inset 0 0 0 3px var(--n300),0 4px 10px rgba(22,19,37,.08)}
.lsm i{position:absolute;left:17px;top:18px;width:16px;height:30px;border-radius:5px;background:var(--b500)}
.lsm b{position:absolute;left:15px;top:64px;width:20px;height:10px;border-radius:3px;background:var(--error)}
.sk .nr{position:absolute;left:0;right:0;top:104px;display:flex;gap:8px}
.sk .nr span{width:50px;height:28px;border-radius:6px;background:var(--b50);color:var(--b600);font:800 17px/28px Inter;text-align:center}
.tuer{width:440px;height:560px;border-radius:26px;background:linear-gradient(135deg,var(--n200),var(--n300));box-shadow:0 18px 44px rgba(22,19,37,.14);transform-origin:0 50%}
.tuer .griff{position:absolute;right:26px;top:250px;width:16px;height:60px;border-radius:8px;background:var(--b700)}
.tuer .warn{position:absolute;left:50%;top:190px;margin-left:-50px;width:100px}
/* Freischalten: großer Sicherungsautomat, Hebel, Sperre, Schild, Dose, Prüfer */
.lss{width:200px;height:330px;border-radius:22px;background:var(--surface);box-shadow:0 16px 40px rgba(22,19,37,.14),inset 0 0 0 5px var(--n300)}
.lss .klemme{position:absolute;top:18px;width:34px;height:34px;border-radius:99px;background:var(--n200);box-shadow:inset 0 0 0 4px var(--n300)}
.lss .klemme::after{content:'';position:absolute;left:8px;top:14px;width:18px;height:6px;border-radius:3px;background:var(--n300)}
.lss .schlitz{position:absolute;left:62px;top:96px;width:76px;height:136px;border-radius:14px;background:var(--b50);box-shadow:inset 0 0 0 4px var(--n200)}
.lss .anz{position:absolute;left:78px;top:62px;width:44px;height:22px;border-radius:6px;background:var(--error)}
.hebel{width:56px;height:62px;border-radius:12px;background:linear-gradient(var(--b400),var(--b600));box-shadow:0 5px 10px rgba(22,19,37,.18)}
.sperre{width:84px;height:44px;border-radius:12px;background:var(--error);box-shadow:0 6px 14px rgba(22,19,37,.2)}
.sperre::after{content:'';position:absolute;left:32px;top:12px;width:20px;height:20px;border-radius:99px;background:var(--error-bg)}
.warnschild{width:230px;border-radius:18px;background:var(--surface);box-shadow:0 10px 26px rgba(22,19,37,.16),inset 0 0 0 5px var(--error);overflow:hidden;transform-origin:50% 0;flex:none}
.warnschild .kopf{height:46px;background:var(--error);display:flex;align-items:center;justify-content:center}
.warnschild .kopf svg{width:40px}
.warnschild .txt{padding:10px 12px 16px;color:var(--error);font:800 30px/34px Inter;text-align:center;letter-spacing:-.01em}
.haenger{width:230px;display:flex;flex-direction:column;align-items:center;transform-origin:50% 0}
.haenger .faden{width:5px;height:64px;background:var(--b700);border-radius:3px}
.anzeige{padding:8px 26px;border-radius:18px;background:var(--ink);color:var(--success);font:800 44px/54px Inter;white-space:nowrap;box-shadow:0 8px 22px rgba(22,19,37,.18)}
.kachel{width:150px;height:150px;border-radius:32px;background:var(--surface);box-shadow:0 10px 28px rgba(22,19,37,.10),inset 0 0 0 5px var(--n200);display:flex;align-items:center;justify-content:center}
.kachel svg{width:104px}
.kachel.an{box-shadow:0 10px 28px rgba(22,19,37,.10),inset 0 0 0 6px var(--success)}
/* 5 Regeln */
.regeln{position:absolute;top:0;width:640px}
.regeln .titel{font:800 72px/84px Inter;letter-spacing:-.02em}
.regel{width:620px;height:82px;border-radius:24px;background:var(--surface);box-shadow:0 10px 26px rgba(22,19,37,.08);display:flex;align-items:center;gap:22px;padding:0 24px;
  font:700 40px/48px Inter;color:var(--ink)}
.regel .nr{width:52px;height:52px;flex:none;border-radius:99px;background:var(--b100);color:var(--b600);font:800 28px/52px Inter;text-align:center}
.regel.an .nr{background:var(--success);color:var(--surface)}
.klammer{width:660px;height:300px;border-radius:34px;border:6px solid var(--success)}
/* Bildfenster im Schlussdialog */
.fenster{width:600px;height:400px;border-radius:40px;background:linear-gradient(var(--surface) 55%,var(--b50));box-shadow:0 18px 50px rgba(22,19,37,.12)}
.umriss{width:110px;height:110px;border-radius:24px;border:6px dashed var(--b400)}
/* Abspann */
.deckel{position:absolute;inset:0;background:linear-gradient(135deg,var(--b500),var(--b700));clip-path:circle(0% at 50% 50%)}
.deckel .gross{font:800 100px/110px Inter;letter-spacing:-.03em;text-align:center}
.deckel .klein{font:400 40px/54px Inter;color:var(--b100);margin-top:24px;text-align:center;max-width:1300px}
</style></head><body>

<svg width="0" height="0" style="position:absolute"><defs>
  <pattern id="ziegel" width="140" height="64" patternUnits="userSpaceOnUse" x="-20" y="6">
    <path d="M0 2H140M0 34H140M40 2V34M110 34V66" stroke="var(--b100)" stroke-width="4" fill="none"/></pattern>
</defs></svg>

<template id="mauer"><svg class="mauer" preserveAspectRatio="none"><rect width="100%" height="100%" fill="url(#ziegel)"/></svg></template>
<template id="svgHaken"><svg viewBox="0 0 40 40"><path d="M9 21l7 7 15-16" stroke="var(--surface)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></template>
<template id="svgAusruf"><svg viewBox="0 0 40 40"><path d="M20 8v15" stroke="var(--surface)" stroke-width="6" stroke-linecap="round"/><circle cx="20" cy="32" r="3.6" fill="var(--surface)"/></svg></template>
<template id="svgFrage"><svg viewBox="0 0 40 40"><path d="M13 14a7 7 0 1 1 10 6c-2 1-3 3-3 5" stroke="var(--surface)" stroke-width="5.5" stroke-linecap="round" fill="none"/><circle cx="20" cy="33" r="3.4" fill="var(--surface)"/></svg></template>
<template id="svgBlitz"><svg viewBox="0 0 40 40"><path d="M20 4L36 34H4Z" fill="var(--warning)" stroke="var(--surface)" stroke-width="3" stroke-linejoin="round"/><path d="M22 13l-5 9h6l-5 8" stroke="var(--ink)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></template>
<!-- Akkuschrauber (Seitenansicht, Bit nach rechts); Ladebalken .bar, Bit-Rillen .ra/.rb -->
<template id="svgSchrauber"><svg viewBox="0 0 200 150">
  <ellipse cx="80" cy="145" rx="62" ry="5" fill="var(--b700)" opacity=".15"/>
  <path d="M58 70h34l-6 52H64Z" fill="var(--b600)"/>
  <rect x="90" y="76" width="11" height="17" rx="4" fill="var(--ink)"/>
  <rect x="38" y="116" width="78" height="26" rx="8" fill="var(--b700)"/>
  <rect class="bar" x="50" y="125" width="15" height="8" rx="2" fill="var(--b300)"/><rect class="bar" x="70" y="125" width="15" height="8" rx="2" fill="var(--b300)"/><rect class="bar" x="90" y="125" width="15" height="8" rx="2" fill="var(--b300)"/>
  <path d="M34 20h90a14 14 0 0 1 14 14v24a14 14 0 0 1-14 14H34a16 16 0 0 1-16-16V36a16 16 0 0 1 16-16Z" fill="var(--b500)"/>
  <path d="M34 31h76" stroke="var(--b300)" stroke-width="5" stroke-linecap="round" opacity=".6"/>
  <g fill="var(--b700)" opacity=".5"><rect x="28" y="44" width="4" height="16" rx="2"/><rect x="36" y="44" width="4" height="16" rx="2"/></g>
  <rect x="138" y="31" width="22" height="30" rx="5" fill="var(--ink)"/>
  <rect x="158" y="41" width="36" height="10" rx="2" fill="var(--n300)"/>
  <path class="ra" d="M163 41l5 10M173 41l5 10M183 41l5 10" stroke="var(--n200)" stroke-width="3"/>
  <path class="rb" d="M168 41l5 10M178 41l5 10M188 41l4 8" stroke="var(--n200)" stroke-width="3" opacity="0"/>
</svg></template>
<!-- Bohrmaschine: wie oben, mit langem Bohrer -->
<template id="svgBohrer"><svg viewBox="0 0 250 150">
  <ellipse cx="80" cy="145" rx="62" ry="5" fill="var(--b700)" opacity=".15"/>
  <path d="M58 70h34l-6 52H64Z" fill="var(--b600)"/>
  <rect x="90" y="76" width="11" height="17" rx="4" fill="var(--ink)"/>
  <rect x="38" y="116" width="78" height="26" rx="8" fill="var(--b700)"/>
  <path d="M34 20h90a14 14 0 0 1 14 14v24a14 14 0 0 1-14 14H34a16 16 0 0 1-16-16V36a16 16 0 0 1 16-16Z" fill="var(--b500)"/>
  <path d="M34 31h76" stroke="var(--b300)" stroke-width="5" stroke-linecap="round" opacity=".6"/>
  <rect x="138" y="31" width="22" height="30" rx="5" fill="var(--ink)"/>
  <path d="M158 40h80l8 6-8 6h-80Z" fill="var(--n300)"/>
  <path class="ra" d="M166 40l6 12M180 40l6 12M194 40l6 12M208 40l6 12M222 40l6 12" stroke="var(--n200)" stroke-width="3.5"/>
  <path class="rb" d="M173 40l6 12M187 40l6 12M201 40l6 12M215 40l6 12M229 40l6 12" stroke="var(--n200)" stroke-width="3.5" opacity="0"/>
</svg></template>
<template id="svgSchraube"><svg viewBox="0 0 96 40"><path d="M20 14h64l10 6-10 6H20Z" fill="var(--n300)"/>
  <path d="M30 14l-4 12M42 14l-4 12M54 14l-4 12M66 14l-4 12M78 14l-4 12" stroke="var(--n200)" stroke-width="3"/>
  <rect x="4" y="4" width="18" height="32" rx="5" fill="var(--n300)"/><path d="M13 10v20" stroke="var(--b700)" stroke-width="3" stroke-linecap="round"/></svg></template>
<!-- zweipoliger Spannungsprüfer: zwei Griffe mit Prüfspitzen, Kabel; Anzeige .aa (– –) / .ab (0 V) -->
<template id="svgPruefer"><svg viewBox="0 0 160 280">
  <path d="M46 226c-4 46 72 46 64-10" stroke="var(--b700)" stroke-width="7" fill="none" stroke-linecap="round"/>
  <g transform="rotate(-8 50 150)"><rect x="48" y="16" width="8" height="48" rx="3" fill="var(--n300)"/><path d="M48 18l4-10 4 10Z" fill="var(--n300)"/>
    <rect x="26" y="58" width="52" height="176" rx="20" fill="var(--warning)"/><rect x="26" y="150" width="52" height="84" rx="20" fill="var(--warning-text)" opacity=".35"/>
    <rect x="34" y="84" width="36" height="44" rx="7" fill="var(--ink)"/>
    <text class="aa" x="52" y="113" font-family="Inter" font-weight="800" font-size="16" text-anchor="middle" fill="var(--b200)">– –</text>
    <text class="ab" x="52" y="113" font-family="Inter" font-weight="800" font-size="16" text-anchor="middle" fill="var(--success)" opacity="0">0 V</text></g>
  <g transform="rotate(8 110 150)"><rect x="102" y="22" width="8" height="48" rx="3" fill="var(--n300)"/><path d="M102 24l4-10 4 10Z" fill="var(--n300)"/>
    <rect x="84" y="66" width="44" height="160" rx="18" fill="var(--warning)"/><rect x="84" y="150" width="44" height="76" rx="18" fill="var(--warning-text)" opacity=".35"/></g>
</svg></template>
<!-- Abzweigdose, offen, mit drei Adern -->
<template id="svgDose"><svg viewBox="0 0 200 200">
  <circle cx="102" cy="104" r="92" fill="var(--b700)" opacity=".12"/>
  <circle cx="100" cy="100" r="90" fill="var(--n200)"/><circle cx="100" cy="100" r="72" fill="var(--b50)" stroke="var(--n300)" stroke-width="6"/>
  <path d="M100 190c0-40-45-60-45-116" stroke="var(--b700)" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M100 190V66" stroke="var(--info)" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M100 190c0-40 45-60 45-116" stroke="var(--success)" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M100 190c0-40 45-60 45-116" stroke="var(--warning)" stroke-width="12" fill="none" stroke-dasharray="10 12"/>
  <g fill="var(--warning-text)"><rect x="51" y="54" width="8" height="18" rx="3"/><rect x="96" y="46" width="8" height="18" rx="3"/><rect x="141" y="54" width="8" height="18" rx="3"/></g>
</svg></template>
<!-- Mini-Symbole der Kacheln -->
<template id="svgAus"><svg viewBox="0 0 100 100"><rect x="26" y="8" width="48" height="84" rx="10" fill="var(--surface)" stroke="var(--n300)" stroke-width="5"/>

<script>
/* ---------- Aufnahme: Satz- und Wortzeiten aus sprache.json ---------- */
const VERSATZ = 0.7;
window.SPRACHE = { datei: 'sprache.mp3', versatz: VERSATZ };
const A = s => s + VERSATZ;
const W = (m, n) => A(wort(m, satz(n).start - .01));          // Filmzeit des Worts im Satz n (oder danach)
const WE = (m, n) => A(wortEnde(m, satz(n).start - .01));
const SA = n => A(satz(n).start);
const SE = n => A(satz(n).ende);
const ENDE_SPRACHE = SE(SPRACHDATEN.saetze.length);
const WELT = document.getElementById('welt');

const el = id => typeof id === 'string' ? (id.startsWith('#') ? $(id) : document.getElementById(id)) : id;
const _tw = tw; tw = (ids, ...r) => _tw([].concat(ids).map(el), ...r);
const _ak = akteur; akteur = (id, ...r) => _ak(el(id), ...r);
const wertBei = (id, p, t) => wert(AKTEURE.get(el(id)), p, t);
const pop = (id, t, basis, snd = 'pop', e = 'back') => { akteur(id, { ...basis, s: 0 }); tw(id, t, e === 'back' ? .5 : .65, { s: basis.s ?? 1 }, e); if (snd) cue(t, snd); };
const ein = (id, t, basis, von = { y: 70 }, snd = null) => {
  akteur(id, { ...basis, o: 0, x: basis.x + (von.x || 0), y: basis.y + (von.y || 0), r: von.r || 0 });
  tw(id, t, .5, { o: 1 }, 'out'); tw(id, t, .6, { x: basis.x, y: basis.y, r: basis.r || 0 }, 'sanft');
  tw(id, t + .3, .12, { sy: .93, sx: 1.05 }, 'sinus'); tw(id, t + .42, .4, { sy: 1, sx: 1 }, 'sanft');
  if (snd) cue(t, snd);
};
const aus = (ids, t, d = .35) => tw(ids, t, d, { o: 0, s: .85 }, 'in');
const wackeln = (id, t, n = 3, w = 3) => { for (let i = 0; i < n; i++) tw(id, t + i * .1, .1, { r: i % 2 ? w : -w }, 'sinus'); tw(id, t + n * .1, .25, { r: 0 }, 'sinus'); };
const huepfen = (id, t, h = 18) => {
  const y = wertBei(id, 'y', t);
  tw(id, t, .08, { sy: .94, sx: 1.04 }, 'sinus');
  tw(id, t + .08, .36, { y }, 'sinus', { bogen: h }); tw(id, t + .08, .14, { sy: 1.04, sx: .97 }, 'sinus');
  tw(id, t + .44, .08, { sy: .95, sx: 1.04 }, 'sinus'); tw(id, t + .52, .3, { sy: 1, sx: 1 }, 'sanft');
};
const bump = (id, t, s = 1.1) => { const s0 = wertBei(id, 's', t); tw(id, t, .12, { s: s0 * s }, 'sinus'); tw(id, t + .12, .4, { s: s0 }, 'sanft'); };
const flug = (id, t0, d, x, y, h = 120, extra = {}) => tw(id, t0, d, { x, y, ...extra }, 'inout', { bogen: h });
const landen = (id, t) => { tw(id, t, .08, { sy: .86, sx: 1.08 }, 'sinus'); tw(id, t + .08, .45, { sy: 1, sx: 1 }, 'sanft'); };
const lerp = (a, b, p) => a + (b - a) * p;
const tpl = id => document.getElementById(id).innerHTML;
const kopie = (id, p) => tpl(id).replace(/id="([^"]+)"/g, `id="$1_${p}"`).replace(/url\(#([^)]+)\)/g, `url(#$1_${p})`);
const neu = (id, inhalt, stil = '', attr = '', klasse = '') => { WELT.insertAdjacentHTML('beforeend', `<div class="a ${klasse}" id="${id}" style="${stil}" ${attr}>${inhalt}</div>`); return id; };
const welle = (id, t, x, y, d = .9) => { if (!el(id)) neu(id, '', 'width:160px;height:160px', 'data-frei', 'welle'); akteur(id, { x, y, o: 0, s: .8 }); set(id, t, { o: .9, s: .8 }); tw(id, t, d, { o: 0, s: 1.6 }, 'weich'); };
let WN = 0;
const wellen = (t, x, y, farbe = null, gr = 160) => { const id = 'wl' + WN++; neu(id, '', `width:${gr}px;height:${gr}px${farbe ? ';border-color:' + farbe : ''}`, 'data-frei', 'welle'); welle(id, t, x, y); };
const summen = (id, t, d = .8, a = 4) => HOOKS.push(z => { const p = z - t; if (p > 0 && p < d) el(id).style.transform += ` translateX(${(a * Math.sin(p * 70) * (1 - p / d)).toFixed(2)}px)`; });
const plakette = (id, farbe, svg, attr = 'data-frei') => neu(id, tpl(svg), '', attr, 'plakette ' + farbe);
// Pendel: schwingt aus und kommt bei 0° zur Ruhe
const pendel = (id, t, a = 12, n = 5, d = .34) => { for (let k = 0; k < n; k++) tw(id, t + k * d, d, { r: (k % 2 ? -1 : 1) * a * Math.pow(.55, k) }, 'sinus'); tw(id, t + n * d, d, { r: 0 }, 'sinus'); };
// Bit dreht sich: zwei Rillen-Sätze wechseln schnell
const drehen = (id, spannen) => HOOKS.push(t => {
  const an = spannen.some(([a, b]) => t >= a && t < b), f = Math.floor(t * 24) % 2;
  el(id).querySelectorAll('.ra').forEach(p => p.style.opacity = an && f ? 0 : 1);
  el(id).querySelectorAll('.rb').forEach(p => p.style.opacity = an && f ? 1 : 0);
});
const mauer = i => el('bue' + i).insertAdjacentHTML('afterbegin', tpl('mauer') + (el('bue' + i).classList.contains('voll') ? '' : '<div class="boden"></div>'));

/* ---------- Kamera: Schwenk mit Unschärfe, Zoom-Atmer, Akzente auf Schlüsselwörtern ---------- */
const PANS = [], AKZENTE = [];
const pan2 = (t0, i) => { pan(t0, i); PANS.push(t0); };
const akzent = (t, z = .035) => AKZENTE.push([t, z]);
bewegungsunschaerfe(.1);
const N = 11;
HOOKS.push(t => {
  let z = 1;
  for (const p of PANS) z -= .07 * Math.sin(Math.PI * clamp((t - p) / .9));
  for (const [a, h] of AKZENTE) { const d = (t - a) / 1.1; if (d > 0 && d < 1) z += h * Math.sin(Math.PI * E.weich(d)); }
  const letzte = Math.max(0, ...PANS.filter(p => p <= t));
  z *= 1 + .03 * E.inout(clamp((t - letzte - .9) / 11));
  $('#kamera').style.transform = `scale(${z})`;
  const wx = wert(kamera, 'x', t);
  for (let i = 0; i < N; i++) { const b = $('#bue' + i); b.style.transform += ` translateX(${(.16 * (wx + S(i))).toFixed(1)}px)`; }
});

/* ---------- Figuren: Mund nur in den eigenen Sätzen (Sprecher exakt aus sprache.json), Nicken, froh ---------- */
const SAETZE = SPRACHDATEN.saetze.map(s => ({ a: A(s.start), b: A(s.ende), w: s.sprecher }));
const FROH = [], KOPF = [], BRILLE = [];   // [id, von, bis] · [id, t0, dauer] · [id, ab]
function portrait(id, wer, gr, attr = '') {
  neu(id, tpl(wer === 'Kwame' ? 'portraitKwame' : 'portraitGeselle'), `width:${gr}px;height:${gr}px`, attr, 'portrait');
  el(id).dataset.sprecher = wer;
  return id;
}
HOOKS.push(t => {
  const pegel = window.PEGEL ? (window.PEGEL[Math.round((t - VERSATZ) * 30)] || 0) : .7 + .3 * Math.sin(t * 9);
  document.querySelectorAll('.portrait').forEach((p, i) => {
    const spricht = SAETZE.some(s => s.w === p.dataset.sprecher && t >= s.a && t <= s.b);
    const auf = spricht ? clamp(pegel * (.55 + .45 * Math.abs(Math.sin(t * 13 + i * 7)))) : 0;
    const froh = !spricht && FROH.some(([id, a, b]) => id === p.id && t >= a && t < b);
    p.querySelector('.auf').style.transform = `scaleY(${Math.max(.05, auf)})`;
    p.querySelector('.auf').style.opacity = auf > .12 ? 1 : 0;
    p.querySelector('.froh').style.opacity = froh && auf <= .12 ? 1 : 0;
    p.querySelector('.zu').style.opacity = auf > .12 || (froh && auf <= .12) ? 0 : 1;
    const z = (t * .29 + i * .37) % 1;
    p.querySelector('.augen').style.transform = `scaleY(${z < .035 ? .12 : 1})`;
    const br = p.querySelector('.brille'); if (br) br.style.opacity = BRILLE.some(([id, a]) => id === p.id && t >= a) ? 1 : 0;
    let r = spricht ? 1.6 * Math.sin(t * 3.1) * pegel : 1.4 * Math.max(0, Math.sin(t * 1.4 + i * 2.1)) ** 10, y = r;
    for (const [id, t0, d] of KOPF) {
      const q = (t - t0) / d; if (id !== p.id || q < 0 || q > 1) continue;
      y += 9 * Math.abs(Math.sin(q * Math.PI * 2)) * Math.sin(Math.PI * q);
    }
    p.querySelector('.figur').style.transform = `translate(0px,${y.toFixed(2)}px) rotate(${r.toFixed(2)}deg)`;
    p.style.borderColor = spricht ? 'var(--b300)' : '';
  });
});
const nicken = (id, t, d = 1.1) => KOPF.push([id, t, d]);

/* ================= Format „Fachvokabeln“ ================= */
const GENUS = ['der', 'die', 'das'];
const VK_X = 470, VK_Y = 350, SL_X = 150, SL_Y = 578;
function wortkarte(i, o) {
  const X = S(i), id = 'vk' + i, kl = GENUS.includes(o.art) ? o.art : 'neutral';
  const woerter = o.wort.split(' ');
  neu(id, `<div class="band"></div>
    <div class="kopf"><span class="art" id="${id}a">${o.chip}</span><span class="punkte">${[1, 2, 3, 4, 5, 6, 7, 8].map(k => `<i class="${k === o.nr ? 'jetzt' : k < o.nr ? 'fertig' : ''}" ${k === o.nr ? `id="${id}d"` : ''}></i>`).join('')}</span></div>
    <div class="wort" style="font-size:${o.gr}px;line-height:${Math.round(o.gr * 1.1)}px">${woerter.map((w, k) => `<span class="w maske"><span class="m"><span class="wi" id="${id}w${k}">${w}</span></span></span>`).join(' ')}</div>
    ${o.zeile ? `<div class="pl" id="${id}p">${o.zeile[0] ? `<small>${o.zeile[0]}</small>` : ''}<span>${o.zeile[1]}</span></div>` : ''}`, '', '', `vk ${kl}${o.zeile ? '' : ' ohne'}`);
  const y = o.mitte ? 540 : VK_Y;
  akteur(id, { x: X + VK_X, y: y + 70, o: 0, s: .96 });
  akteur(id + 'a', { s: 0 }, true); akteur(id + 'd', { sx: .3 }, true);
  woerter.forEach((w, k) => akteur(`${id}w${k}`, { y: o.gr * 1.3 }, true));
  if (o.zeile) akteur(id + 'p', { o: 0, x: -40 }, true);
  return {
    ein: t => { tw(id, t, .45, { o: 1 }); tw(id, t, .7, { y, s: 1 }, 'sanft'); cue(t, 'whoosh'); },
    chip: t => { tw(id + 'a', t, .5, { s: 1 }, 'back'); tw(id + 'd', t, .6, { sx: 1 }, 'sanft'); cue(t, 'pop'); },
    wort: zeiten => { [].concat(zeiten).forEach((t, k) => tw(`${id}w${k}`, t - .05, .7, { y: 0 }, 'weich')); const t0 = [].concat(zeiten)[0]; akzent(t0 + .1, .03); cue(t0, 'klick'); },
    zeile: t => { tw(id + 'p', t - .05, .35, { o: 1 }); tw(id + 'p', t - .05, .6, { x: 0 }, 'sanft'); cue(t, 'pop'); },
  };
}
// Satzleiste: Beispielsatz (ein oder mehrere Sätze desselben Sprechers) tippt sich im Takt der Wortzeiten
function satzleiste(i, ns, art, lern) {
  ns = [].concat(ns);
  const X = S(i), id = 'sl' + i, kl = GENUS.includes(art) ? art : 'neutral';
  const teile = ns.flatMap(n => { const s = satz(n); let k = 0; return s.text.split(/\s+/).map(tok => ({ tok, w: /[\p{L}\p{N}]/u.test(tok) ? s.woerter[k++] : null })); });
  neu(id, teile.map((p, j) => `<span class="sw${lern.includes(_norm(p.tok)) ? ' lw' : ''}">${j === 0 ? `<span class="q" id="${id}q1">„</span>` : ''}${[...p.tok].map(c => `<u>${c}</u>`).join('')}${j === teile.length - 1 ? `<span class="q" id="${id}q2">“</span>` : ''}</span>`).join(' '),
    '', `data-gruppe="${id}"`, `sl ${kl}`);
  portrait(id + 'p', satz(ns[0]).sprecher, 96, `data-gruppe="${id}"`);
  const zeiten = [];
  el(id).querySelectorAll('.sw').forEach((sw, j) => {  // u = Buchstaben (Anführungszeichen sind .q, nicht u)
    const w = teile[j].w || teile[j - 1]?.w, us = sw.querySelectorAll('u');
    const a = A(w.start), d = Math.max(.08, w.ende - w.start);
    us.forEach((u, c) => zeiten.push([u, a + d * c / us.length]));
  });
  zeiten.push([el(id + 'q1'), SA(ns[0]) - .15], [el(id + 'q2'), SE(ns.at(-1))]);
  el(id + 'q1').style.opacity = 0; el(id + 'q2').style.opacity = 0;
  HOOKS.push(t => { for (const [u, tc] of zeiten) { const p = clamp((t - tc) / .1); u.style.opacity = p; u.style.transform = p < 1 ? `translateY(${(7 * (1 - p)).toFixed(1)}px)` : ''; } });
  akteur(id, { x: X + SL_X, y: SL_Y + 50, o: 0 }, true);
  akteur(id + 'p', { x: X + SL_X + 26 + 48, y: SL_Y + 24 + 48, s: 0 });
  return { ein: t => { tw(id, t, .4, { o: 1 }); tw(id, t, .6, { y: SL_Y }, 'sanft'); tw(id + 'p', t + .15, .5, { s: 1 }, 'back'); cue(t, 'pop'); } };
}
function buehne(i) { mauer(i); akteur('bue' + i, { x: S(i) + 1320, y: 540 }); }
const chipHTML = (art, text) => art === 'neutral' ? text : `<b>${art}</b>${text}`;

/* ---------- Bausteine dieses Kurses ---------- */
// Zollstock aus n Gliedern (Länge L); faltung: Liste [t, zu(1)/auf(0), dauer] – die Gelenke klappen nacheinander
function zollstock(id, n, L, attr = '') {
  let inner = '';
  for (let k = n - 1; k >= 1; k--) inner = `<div class="zs" id="${id}g${k}" style="left:${L - 26}px;width:${L}px">${k < n - 1 ? '<i class="gl"></i>' : ''}${inner}</div>`;
  neu(id, '<i class="gl"></i>' + inner, `width:${L}px`, attr, 'zs');
  const plan = [];
  HOOKS.push(t => {
    for (let k = 1; k < n; k++) {
      let zu = 1;
      for (const [t0, ziel, d] of plan) {
        const st = d / (n + 1), a = t0 + (ziel ? (n - 1 - k) : (k - 1)) * st;
        if (t >= a) { const p = E.sanft(clamp((t - a) / (st * 2.4))); zu = lerp(ziel ? 0 : 1, ziel, p); }
      }
      el(id + 'g' + k).style.transform = `rotate(${((k % 2 ? 1 : -1) * 180 * zu).toFixed(2)}deg)`;
    }
  });
  return { auf: (t, d = 1) => { plan.push([t, 0, d]); cue(t, 'klick'); }, zu: (t, d = .7) => { plan.push([t, 1, d]); cue(t, 'klick'); }, laenge: L + (n - 1) * (L - 26) };
}
// Wasserwaage; die Luftblase folgt der Neigung (mit kleinem Nachlauf), extra: Zusatz-Auslenkung
function wasserwaage(id, attr = '', breite = 440) {
  neu(id, `<div class="loch" style="left:30px"></div><div class="loch" style="right:30px"></div>
    <div class="fen"><div class="strich" style="left:44px"></div><div class="strich" style="right:44px"></div><div class="blase" id="${id}b"></div></div>`, `width:${breite}px`, attr, 'ww');
  HOOKS.push(t => {
    const r = wert(AKTEURE.get(el(id)), 'r', t - .12);
    el(id + 'b').style.transform = `translateX(${Math.max(-40, Math.min(40, -r * 10)).toFixed(1)}px)`;
  });
  return id;
}
function schrauber(id, breite, attr = '', lang = false) { neu(id, kopie(lang ? 'svgBohrer' : 'svgSchrauber', id), `width:${breite}px`, attr); return id; }
function laden(id, zeiten) {
  const bars = [...el(id).querySelectorAll('.bar')];
  HOOKS.push(t => bars.forEach((b, k) => { const an = t >= zeiten[k]; b.setAttribute('fill', an ? 'var(--success)' : 'var(--b300)'); }));
}
function pruefer(id, breite, attr = '') { neu(id, kopie('svgPruefer', id), `width:${breite}px`, attr); return id; }
function anzeigen(id, t) { HOOKS.push(z => { const an = z >= t; el(id).querySelector('.aa').style.opacity = an ? 0 : 1; el(id).querySelector('.ab').style.opacity = an ? 1 : 0; }); }

/* ---------- 0 · Intro: Rohbau, 7 Uhr, Kwame, Farb-Legende ---------- */
mauer(0);
akteur('bue0', { x: S(0) + 960, y: 540 });
{
  const X = S(0);
  // Kran im Hintergrund, Absperrgitter
  neu('kran0', kopie('t-kran', 'k0'), 'width:420px');
  ein('kran0', A(0) + .1, { x: X + 1500, y: 350 }, { y: 90 }, 'whoosh');
  neu('haken0', `<svg viewBox="0 0 40 150"><path d="M20 0v112" stroke="var(--b700)" stroke-width="3"/><rect x="10" y="108" width="20" height="14" rx="3" fill="var(--b700)"/>
    <path d="M20 122v10a9 9 0 1 1-9 9" stroke="var(--b700)" stroke-width="5" fill="none" stroke-linecap="round"/></svg>`, 'width:40px;transform-origin:50% 0', 'data-frei');
  akteur('haken0', { x: X + 1500 - 210 + 128 * 420 / 160, y: 350 - 210 + 34 * 420 / 160 + 75, o: 0 });
  tw('haken0', A(0) + .5, .4, { o: 1 }); pendel('haken0', A(0) + .6, 10, 5, .45);
  neu('gitter0a', kopie('t-gitter', 'g0a'), 'width:280px', 'data-gruppe="gitter0"'); neu('gitter0b', kopie('t-gitter', 'g0b'), 'width:280px', 'data-gruppe="gitter0"');
  ein('gitter0a', A(0) + .3, { x: X + 380, y: 760 }, { x: -120 }, 'whoosh');
  ein('gitter0b', A(0) + .45, { x: X + 640, y: 760 }, { x: -120 });
  // Uhr springt auf 7
  const UX = X + 560, UY = 330;
  neu('uhr0', kopie('t-uhr', 'u0'), 'width:230px', 'data-gruppe="uhr0"');
  neu('stunde0', tpl('t-stunde'), 'width:230px;transform-origin:50% 47.5%', 'data-gruppe="uhr0" data-dreht');
  neu('minute0', tpl('t-minute'), 'width:230px;transform-origin:50% 47.5%', 'data-gruppe="uhr0" data-dreht');
