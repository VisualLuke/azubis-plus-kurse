<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Fachvokabeln: Sanitär, Heizung, Klima</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=block">
<link rel="stylesheet" href="../../werkzeug/stil.css">
<style>
.auf-brand{/*AUF_BRAND*/}
:root{
  --n200:var(--a2273fd3-5899-46bc-985c-b3c33e3c0780,#E6E3EE);
  --b400:var(--f0297ed8-06f5-4ffd-83fc-e6cd5dbaa2cd,#8163EE);
  --warning:var(--c19df991-9894-4419-88fb-b2b58e36f9f7,#E0992B);
  --warning-text:var(--71f60857-f754-4514-8386-e3f62d71441a,#9C6712);
  --warning-bg:var(--c7c18918-fab3-46fc-af57-2ec14b380cb2,#FCF1DD);
  --error:var(--f694e88e-bdd3-4eb1-bf33-26a20f247ed4,#E2556A);
  --error-bg:var(--fb93d1a9-9399-4624-95d4-83b61d28209b,#FCE7EA);
  --info:var(--3f081c40-af4e-4425-a97f-c7528bc5ad4d,#3B82F6);
  --info-bg:var(--f939ccd9-6c46-4062-bfe6-c36c169ccafb,#E6EFFE);
}
body{background:linear-gradient(var(--info-bg),var(--bg) 70%)}
/* Kamera: Ausschnitt 1920 × 1080, die Welt wird verschoben und gezoomt (Ursprung oben links) */
#kamera{position:absolute;inset:0;overflow:hidden}
#welt{transform-origin:0 0}
#welt .a{will-change:auto}
#hud{position:absolute;inset:0;pointer-events:none}
.lage{position:absolute;left:0;top:0;width:0;height:0}
/* ================= Hausquerschnitt ================= */
.erde65{position:absolute;background:linear-gradient(var(--b200),var(--b300))}
.erde65::before{content:'';position:absolute;left:0;right:0;top:0;height:22px;background:var(--success);opacity:.8}
.erde65 i{position:absolute;border-radius:99px;background:var(--b400);opacity:.22}
.strasse65{position:absolute;background:linear-gradient(var(--n300),var(--n200));border-top:10px solid var(--b300)}
.strasse65 i{position:absolute;top:44px;height:12px;width:150px;border-radius:6px;background:var(--surface);opacity:.8}
.wasser65{position:absolute;background:linear-gradient(var(--info),var(--b500));opacity:.0}
.wasser65 i{position:absolute;height:10px;border-radius:5px;background:var(--surface);opacity:.5}
.mauer65{position:absolute;background:repeating-linear-gradient(45deg,var(--b300) 0 18px,var(--b400) 18px 22px)}
.dach65{position:absolute;background:linear-gradient(var(--b500),var(--b600))}
.dachinnen65{position:absolute;background:linear-gradient(var(--b100),var(--b200))}
.raum65{position:absolute;overflow:hidden;border-radius:6px;background:linear-gradient(var(--b50),var(--b100))}
.raum65.keller{background:linear-gradient(var(--n200),var(--b100))}
.raum65 .leiste{position:absolute;left:0;right:0;bottom:0;height:26px;background:var(--b200)}
.raum65.keller .leiste{background:var(--n300)}
.buehne.aussen{background:none;border-radius:0}
.fliesen{position:absolute;left:0;right:0;height:114px;
  background:linear-gradient(90deg,var(--surface) 0 6px,transparent 6px) 0 0/120px 100%,linear-gradient(var(--surface) 0 6px,transparent 6px) 0 0/100% 114px,var(--info-bg)}
.offen65{position:absolute;border-radius:10px;background:linear-gradient(90deg,rgba(22,19,37,.10),transparent 18%,transparent 82%,rgba(22,19,37,.10)),repeating-linear-gradient(var(--b200) 0 58px,var(--b300) 58px 64px),var(--b200);box-shadow:inset 0 0 0 10px var(--b300),inset 0 14px 22px rgba(22,19,37,.12)}
.fenster65{position:absolute;border-radius:14px;border:16px solid var(--surface);background:linear-gradient(var(--info-bg),var(--b50));box-shadow:0 10px 26px rgba(22,19,37,.10);overflow:hidden}
.fenster65::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:12px;margin-left:-6px;background:var(--surface)}
.fenster65 .warm{position:absolute;inset:0;background:linear-gradient(var(--warning-bg),var(--error-bg));opacity:0}
.theke65{position:absolute;border-radius:10px;background:linear-gradient(var(--b200),var(--b300))}
/* Rohre (SVG-Ebene) */
#rohre path,#faeden path{fill:none}
/* ================= Format „Fachvokabeln“: Wortkarte als Anhänger am Bauteil ================= */
.der{--f:var(--b500);--ft:var(--b600);--fa:var(--surface)}
.die{--f:var(--success);--ft:var(--success-text);--fa:var(--surface)}
.das{--f:var(--warning);--ft:var(--warning-text);--fa:var(--surface)}
.neutral{--f:var(--b200);--ft:var(--b600);--fa:var(--b700)}
.tag65{width:600px;height:262px;border-radius:30px;background:var(--surface);box-shadow:0 18px 44px rgba(22,19,37,.16);
  padding:26px 34px 24px 116px;display:flex;flex-direction:column;transform-origin:46px 46px}
.tag65 .streifen{position:absolute;left:0;top:0;bottom:0;width:92px;border-radius:30px 0 0 30px;background:var(--f)}
.tag65 .oese{position:absolute;left:28px;top:28px;width:36px;height:36px;border-radius:99px;background:var(--b100);border:7px solid var(--n300)}
.tag65 .kopf{display:flex;align-items:center;justify-content:space-between;height:46px;flex:none}
.tag65 .art{display:inline-block;padding:3px 22px;border-radius:999px;background:var(--f);color:var(--fa);font:800 30px/40px Inter;white-space:nowrap}
.tag65 .stuecke{display:flex;gap:6px;align-items:center}
.tag65 .stuecke i{display:block;width:20px;height:10px;border-radius:3px;background:var(--n200)}
.tag65 .stuecke i.fertig{background:var(--b200)}
.tag65 .stuecke i.jetzt{width:34px;background:var(--f);transform-origin:left center}
.tag65 .wort{margin-top:14px;font-weight:800;letter-spacing:-.03em;color:var(--ink);white-space:nowrap}
.tag65.ohne .wort{margin:auto 0}
.tag65 .pl{margin-top:auto;display:flex;align-items:baseline;gap:16px;font:600 38px/46px Inter;color:var(--n700);white-space:nowrap}
.tag65 .pl small{font:700 20px/24px Inter;letter-spacing:.08em;text-transform:uppercase;color:var(--n500)}
/* Satzleiste oben (Bildschirm-Ebene): Porträt + Beispielsatz, der sich tippt */
.zeile65{display:flex;align-items:center;gap:24px;padding:16px 36px 16px 16px;border-radius:999px;background:var(--surface);box-shadow:0 14px 40px rgba(22,19,37,.14);
  font:600 34px/44px Inter;color:var(--ink);white-space:nowrap;max-width:1600px}
.zeile65 .pp{position:relative;flex:none;width:96px;height:96px}
.zeile65 .pp .portrait{position:absolute;left:0;top:0}
.zeile65 .sw{display:inline-block;white-space:nowrap}
.zeile65 u{display:inline-block;text-decoration:none;opacity:0;white-space:pre}
.zeile65 .sw.lw u{color:var(--ft);font-weight:800}
.zeile65 .q{color:var(--b300);font-weight:800}
.lg{display:inline-block;padding:6px 26px;border-radius:999px;background:var(--f);color:var(--fa);font:800 34px/44px Inter;margin:0 8px;box-shadow:0 8px 22px rgba(22,19,37,.14)}
.chip{display:flex;align-items:center;justify-content:center;height:58px;padding:0 26px;border-radius:999px;background:var(--f);color:var(--fa);font:800 28px/34px Inter;white-space:nowrap;
  box-shadow:0 8px 22px rgba(22,19,37,.16)}
.chip b{font-weight:600;opacity:.85;margin-right:9px}
/* Bausteine */
.portrait{border-radius:999px;overflow:hidden;background:linear-gradient(160deg,var(--b200),var(--b300));border:7px solid var(--surface);
  box-shadow:0 6px 20px rgba(22,19,37,.12)}
.portrait .ebene{position:absolute;left:0;top:0;width:100%;height:100%}
.portrait .figur{position:absolute;left:0;top:6%;width:100%;height:100%;transform-origin:50% 100%}
.portrait .augen{transform-origin:50% 45%}
.portrait .auf{transform-origin:50% 54%}
.portrait .zu{transform-origin:50% 56%}
.welle{border-radius:999px;border:5px solid var(--b300);opacity:0}
.plakette{width:72px;height:72px;border-radius:999px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(22,19,37,.18);border:5px solid var(--surface);
  font:800 36px/1 Inter;color:var(--surface)}
.plakette svg{width:34px}
.plakette.gruen{background:var(--success)} .plakette.rot{background:var(--error)} .plakette.lila{background:var(--b400)} .plakette.blau{background:var(--info)}
.etikett{padding:10px 24px;border-radius:999px;background:var(--surface);color:var(--b600);font:700 26px/32px Inter;white-space:nowrap;box-shadow:0 6px 18px rgba(22,19,37,.10)}
.etikett b{font-weight:800;color:var(--ink)}
.etikett.gas{background:var(--warning);color:var(--ink)}
.strahl65{width:16px;border-radius:8px;background:linear-gradient(var(--info),var(--info-bg));transform-origin:50% 0}
.socket65{width:56px;height:56px;border-radius:99px;background:var(--n300);box-shadow:inset 0 0 0 10px var(--n200),0 4px 10px rgba(22,19,37,.2)}
.tint65{border-radius:20px;mix-blend-mode:multiply}
/* Schnitt-Lupe (Dichtung) */
.lupe65{border-radius:999px;background:radial-gradient(var(--surface),var(--info-bg));border:10px solid var(--b300);box-shadow:0 20px 50px rgba(22,19,37,.18);overflow:hidden}
.teil65{border-radius:16px;background:linear-gradient(90deg,var(--n300),var(--n200) 35%,var(--surface) 50%,var(--n200) 65%,var(--n300))}
.teil65.ob{border-radius:30px 30px 10px 10px}
.teil65.un{border-radius:10px 10px 30px 30px}
.teil65 i{position:absolute;left:50%;width:22%;margin-left:-11%;background:linear-gradient(90deg,var(--info),var(--info-bg) 50%,var(--info));top:0;bottom:0}
.teil65 s{position:absolute;left:0;right:0;height:30%;text-decoration:none;background:linear-gradient(90deg,var(--b600),var(--b400) 40%,var(--b300) 50%,var(--b400) 60%,var(--b600))}
.teil65.ob s{bottom:0;border-radius:0 0 10px 10px}
.teil65.un b{position:absolute;left:6%;right:6%;top:0;bottom:24%;background:repeating-linear-gradient(var(--n300) 0 5%,transparent 5% 14%)}
/* Thermostat-Walze */
.walze65{width:420px;height:170px;border-radius:40px;background:linear-gradient(var(--n200),var(--surface) 40%,var(--surface) 60%,var(--n200));box-shadow:0 14px 36px rgba(22,19,37,.16);overflow:hidden}
.walze65 .zz{position:absolute;top:0;left:0;height:100%;display:flex;align-items:center}
.walze65 .zz b{display:block;width:100px;text-align:center;font:800 76px/1 Inter;color:var(--ink)}
.walze65 .mark{position:absolute;left:50%;top:0;width:0;height:0;margin-left:-16px;border:16px solid transparent;border-top:22px solid var(--b500)}
.walze65 .sch{position:absolute;inset:0;background:linear-gradient(90deg,var(--n200),transparent 25%,transparent 75%,var(--n200))}
/* Liste auf dem Klemmbrett */
.liste65{width:200px}
.liste65 div{display:flex;align-items:center;gap:12px;height:44px}
.liste65 .bx{width:30px;height:30px;border-radius:8px;border:4px solid var(--b300);background:var(--surface);display:flex;align-items:center;justify-content:center}
.liste65 .bx svg{width:24px}
.liste65 .ln{height:10px;border-radius:5px;background:var(--n200);flex:1}
.kblatt65{width:150px;height:170px;border-radius:20px;background:var(--surface);box-shadow:0 10px 24px rgba(22,19,37,.12);overflow:hidden;text-align:center}
.kblatt65::before{content:'';display:block;height:40px;background:var(--b400)}
.kblatt65 b{display:block;margin-top:24px;font:800 30px/34px Inter;color:var(--ink)}
.kblatt65 span{display:block;font:700 22px/26px Inter;color:var(--b600)}
/* Abspann: Wasser steigt */
.deckel{position:absolute;inset:0;background:linear-gradient(135deg,var(--b500),var(--b700))}
.deckel .gross{font:800 100px/110px Inter;letter-spacing:-.03em;text-align:center}
.deckel .klein{font:400 40px/54px Inter;color:var(--b100);margin-top:24px;text-align:center;max-width:1300px}
</style></head><body>

  <div class="gross" id="asTitel">Teile kennen. Sicher arbeiten.</div>
  <div class="klein" id="asUnter">Rohr, Ventil, Heizkessel: Wer die Teile beim Namen kennt, versteht jeden Auftrag – und arbeitet sicher.</div>
</div></div>

<script src="../../werkzeug/motor.js"></script>
<script>
/* ---------- Aufnahme: Satz- und Wortzeiten aus sprache.json ---------- */
const VERSATZ = 0.7;
window.SPRACHE = { datei: 'sprache.mp3', versatz: VERSATZ };
const A = s => s + VERSATZ;
const W = (m, n) => A(wort(m, satz(n).start - .01));
const WE = (m, n) => A(wortEnde(m, satz(n).start - .01));
const SA = n => A(satz(n).start);
const SE = n => A(satz(n).ende);
const ENDE_SPRACHE = SE(SPRACHDATEN.saetze.length);
const WELT = document.getElementById('welt'), TEILE = document.getElementById('teile'), KARTEN = document.getElementById('karten'), HUD = document.getElementById('hud');
const NS = 'http://www.w3.org/2000/svg';

const el = id => typeof id === 'string' ? (id.startsWith('#') ? $(id) : document.getElementById(id)) : id;
const _tw = tw; tw = (ids, ...r) => _tw([].concat(ids).map(el), ...r);
const _ak = akteur; akteur = (id, ...r) => _ak(el(id), ...r);
const wertBei = (id, p, t) => wert(AKTEURE.get(el(id)), p, t);
const tpl = id => document.getElementById(id).innerHTML;
const kopie = (id, p) => tpl(id).replace(/id="([^"]+)"/g, `id="$1_${p}"`).replace(/url\(#([^)]+)\)/g, `url(#$1_${p})`);
const neu = (id, inhalt, stil = '', attr = '', klasse = '', lage = TEILE) => { lage.insertAdjacentHTML('beforeend', `<div class="a ${klasse}" id="${id}" style="${stil}" ${attr}>${inhalt}</div>`); return id; };
const bild = (id, t, breite, attr = '', stil = '', lage = TEILE) => neu(id, kopie(t, id), `width:${breite}px;${stil}`, attr, '', lage);
const pop = (id, t, basis, snd = 'pop', e = 'back') => { akteur(id, { ...basis, s: 0 }); tw(id, t, e === 'back' ? .5 : .65, { s: basis.s ?? 1 }, e); if (snd) cue(t, snd); };
const ein = (id, t, basis, von = { y: 70 }, snd = null) => {
  akteur(id, { ...basis, o: 0, x: basis.x + (von.x || 0), y: basis.y + (von.y || 0) });
  tw(id, t, .5, { o: 1 }, 'out'); tw(id, t, .6, { x: basis.x, y: basis.y }, 'sanft');
  tw(id, t + .3, .12, { sy: .93, sx: 1.05 }, 'sinus'); tw(id, t + .42, .4, { sy: 1, sx: 1 }, 'sanft');
  if (snd) cue(t, snd);
};
const aus = (ids, t, d = .35) => tw(ids, t, d, { o: 0, s: .85 * (wertBei([].concat(ids)[0], 's', t) || 1) }, 'in');
const wackeln = (id, t, n = 3, w = 3) => { for (let i = 0; i < n; i++) tw(id, t + i * .1, .1, { r: i % 2 ? w : -w }, 'sinus'); tw(id, t + n * .1, .25, { r: 0 }, 'sinus'); };
const huepfen = (id, t, h = 18) => {
  const y = wertBei(id, 'y', t);
  tw(id, t, .08, { sy: .94, sx: 1.04 }, 'sinus');
  tw(id, t + .08, .36, { y }, 'sinus', { bogen: h }); tw(id, t + .08, .14, { sy: 1.04, sx: .97 }, 'sinus');
  tw(id, t + .44, .08, { sy: .95, sx: 1.04 }, 'sinus'); tw(id, t + .52, .3, { sy: 1, sx: 1 }, 'sanft');
};
const bump = (id, t, s = 1.1) => { const s0 = wertBei(id, 's', t); tw(id, t, .12, { s: s0 * s }, 'sinus'); tw(id, t + .12, .4, { s: s0 }, 'sanft'); };
const flug = (id, t0, d, x, y, h = 120, extra = {}) => tw(id, t0, d, { x, y, ...extra }, 'inout', { bogen: h });
const landen = (id, t) => { tw(id, t, .08, { sy: .86, sx: 1.08 }, 'sinus'); tw(id, t + .08, .45, { sy: 1, sx: 1 }, 'sanft'); };
const federn = (id, t) => { tw(id, t, .12, { sy: .96, sx: 1.025 }, 'sinus'); tw(id, t + .12, .4, { sy: 1, sx: 1 }, 'sanft'); };
const lerp = (a, b, p) => a + (b - a) * p;
let WN = 0;
// Welle (Ring) in Weltkoordinaten; gr in Bildschirm-px, z = Zoom der Szene
const wellen = (t, x, y, farbe = null, gr = 160, z = 1, lage = TEILE) => {
  const id = 'wl' + WN++; neu(id, '', `width:${gr / z}px;height:${gr / z}px;border-width:${5 / z}px${farbe ? ';border-color:' + farbe : ''}`, 'data-frei', 'welle', lage);
  akteur(id, { x, y, o: 0, s: .8 }); set(id, t, { o: .9, s: .8 }); tw(id, t, .9, { o: 0, s: 1.6 }, 'weich');
};
const plakette = (id, farbe, svg, attr = 'data-frei', lage = TEILE) => neu(id, svg ? tpl(svg) : '', '', attr, 'plakette ' + farbe, lage);
const pendel = (id, t, a = 12, n = 5, d = .34) => { for (let k = 0; k < n; k++) tw(id, t + k * d, d, { r: (k % 2 ? -1 : 1) * a * Math.pow(.55, k) }, 'sinus'); tw(id, t + n * d, d, { r: 0 }, 'sinus'); };
const summen = (id, t, d = .8, a = 4) => HOOKS.push(z => { const p = z - t; if (p > 0 && p < d) el(id).style.transform += ` translateX(${(a * Math.sin(p * 70) * (1 - p / d)).toFixed(2)}px)`; });
const rollen = (id, t, x, d = .7, e = 'sanft') => { tw(id, t, d, { x }, e); };
function tippen(id, text, t0, d, klang = true) {
  const e = el(id), zeichen = [...text];
  e.innerHTML = zeichen.map(c => `<u style="display:inline-block;text-decoration:none;white-space:pre">${c}</u>`).join('');
