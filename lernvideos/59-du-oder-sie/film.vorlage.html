<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Du oder Sie?</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=block">
<link rel="stylesheet" href="../../werkzeug/stil.css">
<style>
.auf-brand{/*AUF_BRAND*/}
:root{
  --border:var(--ace3a6a9-7f72-4964-bea0-331cd543a214,#EDEAF4);
  --n200:var(--a2273fd3-5899-46bc-985c-b3c33e3c0780,#E6E3EE);
  --n400:var(--7bda698f-465c-49f5-afd3-31fe7cd36aff,#9A93AD);
  --b400:var(--f0297ed8-06f5-4ffd-83fc-e6cd5dbaa2cd,#8163EE);
  --warning:var(--c19df991-9894-4419-88fb-b2b58e36f9f7,#E0992B);
  --warning-text:var(--71f60857-f754-4514-8386-e3f62d71441a,#9C6712);
  --warning-bg:var(--c7c18918-fab3-46fc-af57-2ec14b380cb2,#FCF1DD);
  --error:var(--f694e88e-bdd3-4eb1-bf33-26a20f247ed4,#E2556A);
  --info:var(--3f081c40-af4e-4425-a97f-c7528bc5ad4d,#3B82F6);
  --info-bg:var(--f939ccd9-6c46-4062-bfe6-c36c169ccafb,#E6EFFE);
}
#kamera{position:absolute;inset:0;transform-origin:0 0}
.raum{position:absolute;left:0;top:0;width:1920px;height:1080px}
.block .titel{font-size:64px;line-height:74px}
.block .titel + .titel{margin-top:30px}

/* ---------- Theater: Bühnenraum, Boden, Licht ---------- */
.buehne.theater{width:1680px;height:880px;border-radius:48px;overflow:hidden;background:var(--b50)}
.buehne.theater.klein{width:900px;height:720px}
.theater > *{position:absolute}
.theater .wand{inset:0;background:radial-gradient(ellipse 75% 70% at 50% 30%,var(--b50),var(--b100) 62%,var(--b200))}
.theater .paneele{inset:0;background:repeating-linear-gradient(90deg,transparent 0 116px,var(--b200) 116px 120px);opacity:.5}
.theater .boden{left:0;width:100%}
.theater .kegel{background:linear-gradient(var(--surface),transparent 94%)}
.theater .kegel.warm{background:linear-gradient(var(--warning-bg),transparent 94%)}
.theater .kegel.kalt{background:linear-gradient(var(--info-bg),transparent 94%)}
.theater .pool{border-radius:50%;background:radial-gradient(closest-side,var(--surface),transparent)}
.theater .pool.warm{background:radial-gradient(closest-side,var(--warning-bg),transparent)}
.theater .pool.kalt{background:radial-gradient(closest-side,var(--info-bg),transparent)}
/* vorne: Gaze (Schleier), Hauptvorhang, Schals, Soffitte – liegt über allem, was auf der Bühne steht */
.vorne{position:absolute;overflow:hidden;border-radius:48px;pointer-events:none}
.vorne > *{position:absolute}
.vorhang{top:0;height:100%;background:repeating-linear-gradient(90deg,var(--b600) 0,var(--b500) 24px,var(--b400) 36px,var(--b500) 48px,var(--b600) 72px);
  box-shadow:inset 0 -60px 70px rgba(22,19,37,.16)}
.vorhang.l{transform-origin:0 0}.vorhang.r{transform-origin:100% 0}
.vorhang::after{content:'';position:absolute;left:0;right:0;bottom:0;height:30px;background:var(--b700);border-top:5px solid var(--warning)}
.schal{top:0;height:100%;background:repeating-linear-gradient(90deg,var(--b700) 0,var(--b600) 14px,var(--b500) 21px,var(--b600) 28px,var(--b700) 42px)}
.schal i{position:absolute;left:-6px;right:-6px;top:60%;height:16px;border-radius:8px;background:var(--warning)}
.gaze{top:0;height:100%;background:repeating-linear-gradient(90deg,var(--surface) 0,var(--b100) 28px,var(--surface) 56px);opacity:.58}
.gaze::after{content:'';position:absolute;left:0;right:0;bottom:0;height:16px;background:var(--b200)}
.gaze.l{border-right:4px solid var(--b200)}.gaze.r{border-left:4px solid var(--b200)}
.endvh{position:absolute;top:0;width:990px;height:1080px}

/* ---------- Was an Seilen vom Schnürboden hängt ---------- */
.haenge{transform-origin:50% -420px}
.haenge::before,.haenge::after{content:'';position:absolute;bottom:100%;width:4px;height:1000px;background:var(--n700);opacity:.5}
.haenge::before{left:30px}.haenge::after{right:30px}
.schildH{display:flex;align-items:center;gap:14px;padding:12px 30px 12px 24px;border-radius:999px;background:var(--surface);
  box-shadow:0 6px 20px rgba(22,19,37,.12);font:700 30px/36px Inter;color:var(--ink);white-space:nowrap;z-index:4}
.schildH i{width:18px;height:18px;border-radius:999px;background:var(--warning)}
.schildH.de i{background:var(--b500)}
.tafel{padding:12px 32px 16px;border-radius:24px;background:var(--surface);box-shadow:0 10px 30px rgba(22,19,37,.12);white-space:nowrap;z-index:3}
.tafel::before{left:44px}.tafel::after{right:44px}
.tafel .titel{font:800 50px/60px Inter;letter-spacing:-.02em}
.platte{padding:26px 60px 32px;border-radius:34px;background:var(--surface);box-shadow:0 18px 50px rgba(22,19,37,.14);white-space:nowrap;z-index:3}
.platte::before{left:80px}.platte::after{right:80px}
.platte .titel{font:800 72px/80px Inter;letter-spacing:-.03em}
.aushang{padding:14px 26px;border-radius:18px;background:var(--surface);border:5px solid var(--warning);box-shadow:0 8px 24px rgba(22,19,37,.14);
  font:700 30px/36px Inter;white-space:nowrap}
.aushang b{color:var(--b500)}
.kulisse{width:250px;height:262px;border-radius:26px;background:var(--surface);border:6px solid var(--b200);box-shadow:0 14px 34px rgba(22,19,37,.14)}
.kulisse .innen{position:absolute;inset:0}
.kulisse .seite{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.kulisse .bild{width:172px;height:172px;position:relative;margin-top:-8px}
.kulisse .bild > div{position:absolute}
.kulisse b{font:700 28px/34px Inter;color:var(--ink);margin-top:-4px}
.prospekt{width:430px;height:310px;border-radius:28px;background:linear-gradient(var(--b50),var(--b100));border:8px solid var(--surface);box-shadow:0 14px 34px rgba(22,19,37,.14)}
.prospekt .bild{position:absolute;left:85px;top:20px;width:260px;height:260px}

/* ---------- Waage: Balken, Fäden, zwei Blasen ---------- */
.waage{width:570px;height:250px}
.waage .seil{position:absolute;left:283px;bottom:220px;width:4px;height:1200px;background:var(--n700);opacity:.5}
.waage .balken{position:absolute;left:65px;top:22px;width:440px;height:16px;border-radius:8px;background:linear-gradient(var(--b500),var(--b700));box-shadow:0 4px 10px rgba(22,19,37,.18)}
.waage .nabe{position:absolute;left:267px;top:12px;width:36px;height:36px;border-radius:999px;background:var(--warning);border:6px solid var(--surface);box-shadow:0 3px 8px rgba(22,19,37,.25)}
.waage .faden{position:absolute;left:0;top:0;width:3px;height:46px;background:var(--n700);opacity:.55}
.wb{position:absolute;left:0;top:0;width:150px;height:104px;border-radius:32px;display:flex;align-items:center;justify-content:center;
  font:800 54px/1 Inter;letter-spacing:-.02em;box-shadow:0 10px 24px rgba(22,19,37,.16)}
.wb::after{content:'';position:absolute;left:50%;bottom:-11px;margin-left:-12px;width:24px;height:24px;background:inherit;transform:rotate(45deg);border-radius:0 0 6px 0}
.wb.du{background:var(--surface);color:var(--b500);box-shadow:0 10px 24px rgba(22,19,37,.16),inset 0 0 0 5px var(--b200)}
.wb.du::after{box-shadow:inset -5px -5px 0 var(--b200)}
.wb.sie{background:var(--b500);color:var(--surface)}
.wb .glanz{position:absolute;inset:-14px;border-radius:44px;border:6px solid var(--warning);opacity:0}
.wb .hz{position:absolute;right:-26px;top:-30px;width:62px;height:62px}

/* ---------- Bausteine ---------- */
.welle{border-radius:999px;border:5px solid var(--b300);opacity:0}
.portrait{border-radius:999px;overflow:hidden;background:linear-gradient(160deg,var(--b200),var(--b300));border:7px solid var(--surface);
  box-shadow:0 6px 20px rgba(22,19,37,.12)}
.portrait .ebene{position:absolute;left:0;top:0;width:100%;height:100%}
.portrait .figur{position:absolute;left:0;top:6%;width:100%;height:100%;transform-origin:50% 100%}
.portrait .augen{transform-origin:50% 45%}
.portrait .auf{opacity:0}
.linien path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.lage{position:absolute;left:0;top:0;width:100%;height:100%}
.sb{padding:14px 28px;border-radius:26px;background:var(--surface);box-shadow:0 8px 24px rgba(22,19,37,.12);
  font:700 30px/38px Inter;color:var(--ink);white-space:nowrap}
.sb::after{content:'';position:absolute;left:30px;bottom:-11px;width:24px;height:24px;background:inherit;transform:rotate(45deg);border-radius:0 0 6px 0}
.sb.r::after{left:auto;right:30px}
.sb.lila{background:var(--b500);color:var(--surface)}
.sb .wo{display:inline-block;white-space:pre}
.sb.ok{display:flex;align-items:center;gap:12px;font:800 40px/46px Inter;color:var(--b500);padding:12px 18px 12px 26px}
.frage{width:76px;height:76px;border-radius:999px;background:var(--surface);box-shadow:0 6px 20px rgba(22,19,37,.14);
  display:flex;align-items:center;justify-content:center;font:800 46px/1 Inter;color:var(--b500)}
.plakette{width:52px;height:52px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:var(--success);border:4px solid var(--surface)}
.plakette svg{width:26px}
.plak{width:84px;height:84px;border-radius:999px;display:flex;align-items:center;justify-content:center;font:800 32px/1 Inter;letter-spacing:-.02em;
  box-shadow:0 6px 16px rgba(22,19,37,.2);border:5px solid var(--surface)}
.plak.sie{background:var(--b500);color:var(--surface)}
.plak.du{background:var(--surface);color:var(--b500);box-shadow:0 6px 16px rgba(22,19,37,.2),inset 0 0 0 5px var(--b200)}
.plak span{position:absolute}
.eb{width:104px;height:104px;border-radius:999px;background:var(--b500);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(22,19,37,.18)}
.eb svg{width:46px}
.eb .ring{position:absolute;border-radius:999px;border:5px solid var(--b300)}
.stufe{border-radius:14px 14px 4px 4px;background:linear-gradient(var(--b200),var(--b300));box-shadow:inset 0 9px 0 var(--b100)}
.treppe{width:330px;height:330px}
.treppe .stufe,.treppe .eb{position:absolute}
.chipN{padding:10px 24px;border-radius:999px;background:var(--surface);box-shadow:0 6px 18px rgba(22,19,37,.12);font:700 28px/34px Inter;white-space:nowrap}

/* Bürotür mit Namensschild (Szene 3/4) */
.tuer{width:210px;height:420px;border-radius:14px 14px 4px 4px;background:var(--b700)}
.tuer .blatt{position:absolute;left:12px;right:12px;top:12px;bottom:0;border-radius:8px 8px 0 0;background:linear-gradient(160deg,var(--b400),var(--b600))}
.tuer .fuell{position:absolute;left:28px;right:28px;border-radius:8px;border:4px solid var(--b300);opacity:.45}
.tuer .griff{position:absolute;right:28px;top:236px;width:36px;height:14px;border-radius:7px;background:var(--warning)}
.tuer .np{position:absolute;left:22px;right:22px;top:58px;height:66px;border-radius:12px;background:var(--surface);box-shadow:0 4px 10px rgba(22,19,37,.18)}
.tuer .np > div{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 25px/1 Inter;color:var(--ink);white-space:nowrap;gap:7px}
.tuer .np .wi2{display:inline-block}
.tuer .np .feld{inset:10px 12px;border-radius:8px;border:3px dashed var(--b300);color:var(--b500)}
.tuer .np .rest{visibility:hidden}

/* Podeste (Szene 5), Tresen (Szene 6) */
.podest{border-radius:18px 18px 6px 6px;background:linear-gradient(var(--b200),var(--b300));box-shadow:inset 0 10px 0 var(--b100);transform-origin:50% 100%}
.podest .an{position:absolute;inset:0;border-radius:inherit;background:linear-gradient(var(--warning-bg),var(--warning));opacity:0}
.karteDu{width:100px;height:74px;border-radius:16px;background:var(--surface);display:flex;align-items:center;justify-content:center;font:800 38px/1 Inter;color:var(--b500);
  box-shadow:0 8px 20px rgba(22,19,37,.16),inset 0 0 0 4px var(--b200)}
.tresen{width:380px;height:130px;border-radius:12px 12px 6px 6px;background:linear-gradient(var(--b400),var(--b600))}
.tresen::before{content:'';position:absolute;left:-14px;right:-14px;top:-16px;height:22px;border-radius:8px;background:var(--b700)}
.tresen i{position:absolute;left:30px;right:30px;top:34px;height:62px;border-radius:10px;border:4px solid var(--b300);opacity:.5}

/* Abspann */
.ende .gross{font:800 96px/106px Inter;letter-spacing:-.03em;text-align:center}
.ende .klein{font:400 40px/54px Inter;color:var(--b100);margin-top:24px;text-align:center;max-width:1300px}
#abspann{opacity:0}
</style></head><body>

<template id="t-herz">{{herz}}</template>
<template id="t-haus">{{haus}}</template>

<template id="t-rathaus">{{rathaus}}</template>

<div id="kamera"><div id="welt">

<script src="../../werkzeug/motor.js"></script>
<script>
/* ---------- Aufnahme: Satz- und Wortzeiten aus sprache.json ---------- */
const VERSATZ = 0.7;
window.SPRACHE = { datei: 'sprache.mp3', versatz: VERSATZ };
const A = s => s + VERSATZ;
const W = (m, n) => A(wort(m, satz(n).start - .01));          // Filmzeit des Worts im Satz n (oder danach)
const WE = (m, n) => A(wortEnde(m, satz(n).start - .01));
const WI = (n, k) => A(satz(n).woerter[k].start);              // k-tes Wort im Satz n (für „du“/„Sie“)
const SA = n => A(satz(n).start);
const SE = n => A(satz(n).ende);
const ENDE_SPRACHE = SE(SPRACHDATEN.saetze.length);

const el = id => typeof id === 'string' ? (id.startsWith('#') ? $(id) : document.getElementById(id)) : id;
const _tw = tw; tw = (ids, ...r) => _tw([].concat(ids).map(el), ...r);
const _ak = akteur; akteur = (id, ...r) => _ak(el(id), ...r);
const wertBei = (id, p, t) => wert(AKTEURE.get(el(id)), p, t);
let RAUM = el('raum0');
const pop = (id, t, basis, snd = 'pop', e = 'back') => { akteur(id, { ...basis, s: 0 }); tw(id, t, e === 'back' ? .5 : .65, { s: basis.s ?? 1 }, e); if (snd) cue(t, snd); };
const ein = (id, t, basis, von = { y: 70 }, snd = null) => {
  akteur(id, { ...basis, o: 0, x: basis.x + (von.x || 0), y: basis.y + (von.y || 0) });
  tw(id, t, .5, { o: 1 }, 'out'); tw(id, t, .6, { x: basis.x, y: basis.y }, 'sanft');
  tw(id, t + .3, .12, { sy: .93, sx: 1.05 }, 'sinus'); tw(id, t + .42, .4, { sy: 1, sx: 1 }, 'sanft');
  if (snd) cue(t, snd);
};
const aus = (ids, t, d = .35) => tw(ids, t, d, { o: 0, s: .85 }, 'in');
const wackeln = (id, t, n = 3, w = 3) => { for (let i = 0; i < n; i++) tw(id, t + i * .1, .1, { r: i % 2 ? w : -w }, 'sinus'); tw(id, t + n * .1, .25, { r: 0 }, 'sinus'); };
const huepfen = (id, t, h = 18) => {
  const y = wertBei(id, 'y', t);
  tw(id, t, .08, { sy: .94, sx: 1.04 }, 'sinus');
  tw(id, t + .08, .36, { y }, 'sinus', { bogen: h }); tw(id, t + .08, .14, { sy: 1.04, sx: .97 }, 'sinus');
  tw(id, t + .44, .08, { sy: .95, sx: 1.04 }, 'sinus'); tw(id, t + .52, .3, { sy: 1, sx: 1 }, 'sanft');
};
const bump = (id, t, s = 1.1) => { const s0 = wertBei(id, 's', t); tw(id, t, .12, { s: s0 * s }, 'sinus'); tw(id, t + .12, .4, { s: s0 }, 'sanft'); };
const flug = (id, t0, d, x, y, h = 120, extra = {}) => tw(id, t0, d, { x, y, ...extra }, 'inout', { bogen: h });
const landen = (id, t) => { tw(id, t, .08, { sy: .86, sx: 1.08 }, 'sinus'); tw(id, t + .08, .45, { sy: 1, sx: 1 }, 'sanft'); };
const schweben = (ids, a = 4) => [].concat(ids).forEach(id => { AKTEURE.get(el(id)).basis.schweben = a; });
const lerp = (a, b, p) => a + (b - a) * p;
const tpl = id => document.getElementById(id).innerHTML;
const kopie = (id, p) => tpl(id).replace(/id="([^"]+)"/g, `id="$1_${p}"`).replace(/url\(#([^)]+)\)/g, `url(#$1_${p})`);
const neu = (id, inhalt, stil = '', attr = '', klasse = '') => { RAUM.insertAdjacentHTML('beforeend', `<div class="a ${klasse}" id="${id}" style="${stil}" ${attr}>${inhalt}</div>`); return id; };
const bild = (id, t, breite, attr = '') => neu(id, kopie(t, id), `width:${breite}px`, attr);
let WN = 0;
const welle = (t, x, y, farbe = null, gr = 160, d = .9) => {
  const id = 'wl' + WN++; neu(id, '', `width:${gr}px;height:${gr}px${farbe ? ';border-color:' + farbe : ''}`, 'data-frei', 'welle');
  akteur(id, { x, y, o: 0, s: .8 }); set(id, t, { o: .9, s: .8 }); tw(id, t, d, { o: 0, s: 1.6 }, 'weich');
};
const summen = (id, t, d = .8, a = 4) => HOOKS.push(z => { const p = z - t; if (p > 0 && p < d) el(id).style.transform += ` translateX(${(a * Math.sin(p * 70) * (1 - p / d)).toFixed(2)}px)`; });
const bogenEin = (id, t, basis, x0, y0, h = 90, d = .75, snd = 'whoosh') => {
  akteur(id, { ...basis, x: x0, y: y0, o: 0, s: (basis.s ?? 1) * .8 });
  tw(id, t, .3, { o: 1 }); flug(id, t, d, basis.x, basis.y, h, { s: basis.s ?? 1 });
  tw(id, t + d - .02, .14, { sy: .92, sx: 1.05 }, 'sinus'); tw(id, t + d + .12, .45, { sy: 1, sx: 1 }, 'sanft'); if (snd) cue(t, snd);
};
const tippen = (id, text, t1, t2, n = 7) => {
  el(id).innerHTML = `<span class="tp"></span><span class="rest">${text}</span>`;
  const [a, b] = el(id).children;
  HOOKS.push(t => { const k = Math.round(text.length * clamp((t - t1) / (t2 - t1))); a.textContent = text.slice(0, k); b.textContent = text.slice(k); });
  for (let i = 0; i < n; i++) cue(t1 + i * (t2 - t1) / n, 'tipp');
};
const linien = (id, pfade, attr = 'data-frei') => {
  const svg = pfade.map(([pid, d, farbe, breite, gepunktet]) => gepunktet
    ? `<g id="${pid}g"><mask id="${pid}m" maskUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080"><path class="zeichnen" pathLength="1" d="${d}" stroke="var(--surface)" stroke-width="${breite + 10}"/></mask><path d="${d}" stroke="${farbe}" stroke-width="${breite}" stroke-dasharray="4 20" mask="url(#${pid}m)"/></g>`
    : `<g id="${pid}g"><path class="zeichnen" pathLength="1" d="${d}" stroke="${farbe}" stroke-width="${breite}"/></g>`).join('');
  neu(id, `<svg class="linien" viewBox="0 0 1920 1080" style="width:1920px;height:1080px">${svg}</svg>`, 'width:1920px;height:1080px', attr);
  akteur(id, { x: 960, y: 540 });
  pfade.forEach(([pid]) => akteur(pid + 'g', { draw: 0 }, true));
};

const FROH = [], BLICK = [], KOPF = [];
function portrait(id, wer, gr, attr = '') {
