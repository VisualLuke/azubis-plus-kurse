<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Fachvokabeln: Hotel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=block">
<link rel="stylesheet" href="../../werkzeug/stil.css">
<style>
.auf-brand{/*AUF_BRAND*/}
:root{
  --n200:var(--a2273fd3-5899-46bc-985c-b3c33e3c0780,#E6E3EE);
  --b400:var(--f0297ed8-06f5-4ffd-83fc-e6cd5dbaa2cd,#8163EE);
  --warning:var(--c19df991-9894-4419-88fb-b2b58e36f9f7,#E0992B);
  --warning-text:var(--71f60857-f754-4514-8386-e3f62d71441a,#9C6712);
  --warning-bg:var(--c7c18918-fab3-46fc-af57-2ec14b380cb2,#FCF1DD);
  --error:var(--f694e88e-bdd3-4eb1-bf33-26a20f247ed4,#E2556A);
  --error-bg:var(--fb93d1a9-9399-4624-95d4-83b61d28209b,#FCE7EA);
  --info:var(--3f081c40-af4e-4425-a97f-c7528bc5ad4d,#3B82F6);
  --info-bg:var(--f939ccd9-6c46-4062-bfe6-c36c169ccafb,#E6EFFE);
}
#kamera{position:absolute;inset:0;transform-origin:1320px 540px}
/* Bühnen: Wand mit Sockelleiste, Boden */
.buehne.raum{width:900px;height:720px;border-radius:48px;background:linear-gradient(var(--b50),var(--b100));overflow:hidden}
.buehne.gross{width:1680px;height:880px;border-radius:48px;background:linear-gradient(var(--b50),var(--b100));overflow:hidden}
.buehne .boden{position:absolute;left:0;right:0;top:520px;bottom:0;background:linear-gradient(var(--b200),var(--b100))}
.buehne .boden::before{content:'';position:absolute;left:0;right:0;top:0;height:14px;background:var(--b300);opacity:.55}
.buehne.gross .boden{top:640px}
.buehne .lampe41{position:absolute;width:170px;transform-origin:50% 0}

/* ================= Format „Fachvokabeln“ (übernommen aus Lernvideo 31) ================= */
/* Artikel-Farben: der = b500 · die = success · das = warning */
.der{--f:var(--b500);--ft:var(--b600);--fa:var(--surface)}
.die{--f:var(--success);--ft:var(--success-text);--fa:var(--surface)}
.das{--f:var(--warning);--ft:var(--warning-text);--fa:var(--surface)}
.neutral{--f:var(--b200);--ft:var(--b600);--fa:var(--b700)}
.vk{width:640px;height:340px;border-radius:36px;background:var(--surface);box-shadow:0 18px 50px rgba(22,19,37,.10);overflow:hidden;
  padding:44px 46px 38px;display:flex;flex-direction:column}
.vk .band{position:absolute;left:0;right:0;top:0;height:14px;background:var(--f)}
.vk .kopf{display:flex;align-items:center;justify-content:space-between;height:48px;flex:none}
.vk .art{display:inline-block;padding:4px 22px;border-radius:999px;background:var(--f);color:var(--fa);font:800 32px/40px Inter;white-space:nowrap}
.vk .punkte{display:flex;gap:9px;align-items:center}
.vk .punkte i{display:block;width:12px;height:12px;border-radius:99px;background:var(--n200)}
.vk .punkte i.fertig{background:var(--b200)}
.vk .punkte i.jetzt{width:40px;background:var(--f);transform-origin:left center}
.vk .wort{margin-top:22px;font-weight:800;letter-spacing:-.03em;color:var(--ink);white-space:nowrap}
.vk.ohne .wort{margin:auto 0}
.vk .pl{margin-top:auto;display:flex;align-items:baseline;gap:18px;font:600 44px/52px Inter;color:var(--n700);white-space:nowrap}
.vk .pl small{font:700 21px/26px Inter;letter-spacing:.08em;text-transform:uppercase;color:var(--n500)}
.sl{width:640px;min-height:152px;padding:26px 32px 28px 148px;border-radius:32px;background:var(--surface);box-shadow:0 14px 40px rgba(22,19,37,.09);
  font:600 34px/45px Inter;color:var(--ink)}
.sl .sw{display:inline-block;white-space:nowrap}
.sl u{display:inline-block;text-decoration:none;opacity:0;white-space:pre}
.sl .sw.lw u{color:var(--ft);font-weight:800}
.sl .q{color:var(--b300);font-weight:800}
.lg{display:inline-block;padding:6px 24px;border-radius:999px;background:var(--f);color:var(--fa);font:800 34px/44px Inter;margin-right:16px}
.chip{display:flex;align-items:center;justify-content:center;height:58px;border-radius:999px;background:var(--f);color:var(--fa);font:800 28px/34px Inter;white-space:nowrap;
  box-shadow:0 8px 22px rgba(22,19,37,.14)}
.chip b{font-weight:600;opacity:.85;margin-right:9px}

/* Bausteine */
.portrait{border-radius:999px;overflow:hidden;background:linear-gradient(160deg,var(--b200),var(--b300));border:7px solid var(--surface);
  box-shadow:0 6px 20px rgba(22,19,37,.12)}
.portrait .ebene{position:absolute;left:0;top:0;width:100%;height:100%}
.portrait .figur{position:absolute;left:0;top:6%;width:100%;height:100%;transform-origin:50% 100%}
.portrait .augen{transform-origin:50% 45%}
.portrait .auf{transform-origin:50% 54%}
.portrait .zu{transform-origin:50% 56%}
.portrait .hand{transform-origin:80% 92%;opacity:0}
.welle{border-radius:999px;border:5px solid var(--b300);opacity:0}
.plakette{width:72px;height:72px;border-radius:999px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(22,19,37,.18);border:5px solid var(--surface);
  font:800 36px/1 Inter;color:var(--surface)}
.plakette svg{width:34px}
.plakette.gruen{background:var(--success)} .plakette.rot{background:var(--error)} .plakette.gelb{background:var(--warning)} .plakette.lila{background:var(--b400)}
.etikett{padding:10px 24px;border-radius:999px;background:var(--surface);color:var(--b600);font:700 26px/32px Inter;white-space:nowrap;box-shadow:0 6px 18px rgba(22,19,37,.09)}
.etikett b{font-weight:800;color:var(--ink)}
.tipp u{display:inline-block;text-decoration:none;white-space:pre}

/* Hotel: Tresen, Schlüsselfach, Schlüsselkarte, Namensschild */
.tresen{border-radius:20px 20px 10px 10px;background:linear-gradient(var(--b400),var(--b600));box-shadow:0 18px 40px rgba(22,19,37,.14);overflow:hidden}
.tresen::before{content:'';position:absolute;left:0;right:0;top:0;height:26px;background:var(--b700)}
.tresen::after{content:'';position:absolute;left:0;right:0;top:26px;height:8px;background:var(--b300);opacity:.5}
.tresen .pan{position:absolute;top:58px;bottom:24px;border-radius:14px;background:var(--b500);box-shadow:inset 0 0 0 3px var(--b300)}
.fach{border-radius:22px;background:var(--surface);box-shadow:0 12px 30px rgba(22,19,37,.10)}
.fach .slot{position:absolute;width:62px;height:74px;border-radius:12px;background:var(--b50);box-shadow:inset 0 -6px 0 var(--b100)}
.fach .slot i{position:absolute;left:50%;top:12px;width:12px;height:12px;margin-left:-6px;border-radius:99px;background:var(--b300)}
.fach .slot .kkarte{position:absolute;left:8px;top:28px}
.kkarte{width:46px;height:32px;border-radius:7px;background:linear-gradient(135deg,var(--b300),var(--b500));box-shadow:0 3px 8px rgba(22,19,37,.18)}
.kkarte::after{content:'';position:absolute;left:7px;right:7px;top:9px;height:5px;border-radius:3px;background:var(--surface);opacity:.65}
.kkarte.gross{width:84px;height:56px;border-radius:11px}
.kkarte.gross::after{left:11px;right:11px;top:15px;height:8px}
.nschild{display:flex;align-items:stretch;border-radius:18px;background:var(--surface);box-shadow:0 10px 26px rgba(22,19,37,.15);overflow:hidden;white-space:nowrap}
.nschild .band{width:18px;background:var(--b500);flex:none}
.nschild .tx{padding:12px 28px 14px 20px}
.nschild b{display:block;font:800 40px/46px Inter;color:var(--ink)}
.nschild span{display:block;font:700 26px/32px Inter;color:var(--b600);min-height:32px}
/* Tür mit Blatt, Griff, Nummer */
.htuer{border-radius:16px 16px 0 0;background:var(--b700)}
.htuer::before{content:'';position:absolute;inset:0;border-radius:16px 16px 0 0;border:14px solid var(--b300);border-bottom:0}
.htuer .blatt{position:absolute;left:14px;right:14px;top:14px;bottom:0;border-radius:6px 6px 0 0;background:linear-gradient(var(--b500),var(--b600));transform-origin:0 50%}
.htuer .blatt::before,.htuer .blatt::after{content:'';position:absolute;left:22px;right:22px;border-radius:10px;border:4px solid var(--b400);opacity:.8}
.htuer .blatt::before{top:24px;height:34%}
.htuer .blatt::after{bottom:26px;height:34%}
.htuer .griff{position:absolute;right:18px;top:52%;width:34px;height:12px;border-radius:6px;background:var(--warning)}
.htuer .nr{position:absolute;left:50%;top:22px;width:92px;margin-left:-46px;padding:4px 0;border-radius:10px;background:var(--surface);color:var(--b600);font:800 28px/34px Inter;text-align:center;z-index:1}
/* Türschild „Bitte nicht stören“ */
.haenger{width:110px;height:210px;border-radius:18px;background:var(--error);box-shadow:0 10px 22px rgba(22,19,37,.2);
  color:var(--surface);font:800 22px/27px Inter;text-align:center;padding-top:72px;transform-origin:50% 17.6%}
.haenger .loch{position:absolute;left:50%;top:16px;width:42px;height:42px;margin-left:-21px;border-radius:99px;background:var(--b500)}
.haenger .loch::before{content:'';position:absolute;left:3px;right:3px;top:50%;height:12px;margin-top:-6px;border-radius:6px;background:var(--warning)}
.haenger .loch::after{content:'';position:absolute;left:17px;top:-16px;width:8px;height:18px;background:var(--b500)}
.haenger.klein{width:80px;height:150px;border-radius:14px;font-size:16px;line-height:20px;padding-top:50px;transform-origin:50% 18%}
.haenger.klein .loch{width:30px;height:30px;margin-left:-15px;top:12px}
.haenger.klein .loch::before{height:9px;margin-top:-4.5px}
.haenger.klein .loch::after{left:11px;top:-12px;height:14px}
.bild41{width:200px;height:140px;border-radius:16px;border:10px solid var(--surface);background:linear-gradient(var(--info-bg),var(--b50));overflow:hidden;box-shadow:0 10px 26px rgba(22,19,37,.10)}
.bild41 i{position:absolute;bottom:0;background:var(--b300);clip-path:polygon(50% 0,100% 100%,0 100%)}
.bild41 i.v{background:var(--b400)}
/* Bildschirm mit Buchungsliste, Tastatur */
.monitor{width:600px;height:400px;border-radius:26px;background:var(--b700);box-shadow:0 18px 44px rgba(22,19,37,.14)}
.monitor .scr{position:absolute;inset:16px;border-radius:14px;background:var(--surface);overflow:hidden}
.monitor .such{position:absolute;left:24px;right:24px;top:20px;height:58px;border-radius:14px;background:var(--b50);border:3px solid var(--b200);
  font:800 30px/52px Inter;color:var(--ink);padding-left:66px;white-space:nowrap}
.monitor .such svg{position:absolute;left:16px;top:10px;width:32px}
.monitor .such .cur{display:inline-block;width:3px;height:30px;background:var(--b500);vertical-align:-5px;margin-left:2px}
.zeile41{position:absolute;left:24px;right:24px;height:46px;border-radius:12px;background:var(--b50);display:flex;align-items:center;gap:16px;padding:0 18px}
.zeile41 .dt{width:58px;height:14px;border-radius:7px;background:var(--b200);flex:none}
.zeile41 .nm{width:140px;height:14px;border-radius:7px;background:var(--n300);flex:none}
.zeile41 .zi{flex:1;height:14px;border-radius:7px;background:var(--n200)}
.zeile41 b{width:140px;font:800 26px/30px Inter;color:var(--ink);flex:none}
.zeile41.treffer{background:var(--success-bg);box-shadow:inset 0 0 0 3px var(--success)}
.zeile41.treffer b{color:var(--success-text)}
.fuss41{width:220px;height:80px}
.fuss41 i{position:absolute;left:80px;top:0;width:60px;height:56px;background:linear-gradient(var(--b600),var(--b700))}
.fuss41 s{position:absolute;left:0;right:0;bottom:0;height:26px;border-radius:13px;background:var(--b600);text-decoration:none}
.tasten{width:440px;height:74px;border-radius:16px;background:var(--surface);box-shadow:0 10px 24px rgba(22,19,37,.10);padding:12px 16px;display:grid;grid-template-columns:repeat(12,1fr);gap:6px}
.tasten i{display:block;border-radius:5px;background:var(--b100)}
.tasten i.an{background:var(--b400)}
/* Zimmer */
.zimmer{border-radius:30px;background:linear-gradient(var(--surface) 72%,var(--b100) 72%);box-shadow:0 16px 40px rgba(22,19,37,.10);border:8px solid var(--surface);overflow:hidden}
.zimmer .ld{position:absolute;right:20px;top:20px;width:28px;height:28px;border-radius:99px;background:var(--n300);box-shadow:inset 0 0 0 5px var(--n200)}
.zimmer .ld.frei{background:var(--success);box-shadow:inset 0 0 0 5px var(--success-bg)}
/* Notizzettel */
.notiz{width:300px;height:190px;border-radius:14px;background:var(--warning-bg);box-shadow:0 12px 28px rgba(22,19,37,.13);padding:28px 26px}
.notiz::before{content:'';position:absolute;left:50%;top:-12px;width:90px;height:26px;margin-left:-45px;border-radius:6px;background:var(--b200);opacity:.9}
.notiz .nz{font:800 30px/40px Inter;color:var(--ink);white-space:nowrap;min-height:40px}
.notiz .nz.rot{color:var(--error)}
.notiz i{display:block;height:10px;border-radius:5px;background:var(--warning);opacity:.35;margin-top:16px}
.notiz.leer i{margin-top:22px}
/* Fenster mit Blick auf den Fluss */
.aussicht{width:360px;height:280px;border-radius:26px;border:12px solid var(--surface);box-shadow:0 16px 40px rgba(22,19,37,.13);overflow:hidden;
  background:linear-gradient(var(--info-bg),var(--b50))}
.aussicht .st{position:absolute;left:50%;bottom:62px;width:220px;margin-left:-110px}
.aussicht .fluss{position:absolute;left:0;right:0;bottom:0;height:78px;background:linear-gradient(var(--info),var(--b500))}
.aussicht .wl{position:absolute;height:6px;border-radius:3px;background:var(--surface);opacity:.55}
.aussicht .kreuz{position:absolute;left:50%;top:0;bottom:0;width:10px;margin-left:-5px;background:var(--surface)}
.aussicht .vh{position:absolute;top:0;bottom:0;width:50%;background:linear-gradient(90deg,var(--b300),var(--b200));z-index:2}
.aussicht .vh.l{left:0;transform-origin:0 50%} .aussicht .vh.r{right:0;transform-origin:100% 50%;background:linear-gradient(270deg,var(--b300),var(--b200))}
/* Kalenderblätter (Besuche) */
.kblatt{width:84px;height:96px;border-radius:14px;background:var(--surface);box-shadow:0 8px 20px rgba(22,19,37,.10);overflow:hidden}
.kblatt::before{content:'';position:absolute;left:0;right:0;top:0;height:22px;background:var(--b400)}
.kblatt i{position:absolute;left:50%;top:38px;width:44px;height:44px;margin-left:-22px;border-radius:99px;background:var(--success);display:flex;align-items:center;justify-content:center}
.kblatt i svg{width:28px}
/* Buchungskarte im Schlussdialog */
.bkarte{width:300px;height:200px;border-radius:22px;background:var(--surface);box-shadow:0 12px 30px rgba(22,19,37,.12)}
.bkarte .zeile41{left:18px;right:18px;height:44px;padding:0 14px;gap:12px}
.bkarte .zeile41 .dt{width:40px}
.bkarte .zeile41 b{width:auto;font-size:24px}
/* Abspann */
.deckel{position:absolute;inset:0;background:linear-gradient(135deg,var(--b500),var(--b700));clip-path:circle(0% at 50% 50%)}
.deckel .gross{font:800 100px/110px Inter;letter-spacing:-.03em;text-align:center}
.deckel .klein{font:400 40px/54px Inter;color:var(--b100);margin-top:24px;text-align:center;max-width:1300px}
</style></head><body>

</div></div>

<div class="deckel" id="abspann"><div class="ende">
  <div class="gross" id="asTitel">Sicher und freundlich.</div>
  <div class="klein" id="asUnter">Im Hotel sprichst du jeden Tag mit Gästen. Die richtigen Wörter machen dich sicher und freundlich.</div>
</div></div>

<script src="../../werkzeug/motor.js"></script>
<script>
/* ---------- Aufnahme: Satz- und Wortzeiten aus sprache.json ---------- */
const VERSATZ = 0.7;
window.SPRACHE = { datei: 'sprache.mp3', versatz: VERSATZ };
const A = s => s + VERSATZ;
const W = (m, n) => A(wort(m, satz(n).start - .01));          // Filmzeit des Worts im Satz n (oder danach)
const WE = (m, n) => A(wortEnde(m, satz(n).start - .01));
const SA = n => A(satz(n).start);
const SE = n => A(satz(n).ende);
const ENDE_SPRACHE = SE(SPRACHDATEN.saetze.length);
const WELT = document.getElementById('welt');

const el = id => typeof id === 'string' ? (id.startsWith('#') ? $(id) : document.getElementById(id)) : id;
const _tw = tw; tw = (ids, ...r) => _tw([].concat(ids).map(el), ...r);
const _ak = akteur; akteur = (id, ...r) => _ak(el(id), ...r);
const wertBei = (id, p, t) => wert(AKTEURE.get(el(id)), p, t);
const pop = (id, t, basis, snd = 'pop', e = 'back') => { akteur(id, { ...basis, s: 0 }); tw(id, t, e === 'back' ? .5 : .65, { s: basis.s ?? 1 }, e); if (snd) cue(t, snd); };
const ein = (id, t, basis, von = { y: 70 }, snd = null) => {
