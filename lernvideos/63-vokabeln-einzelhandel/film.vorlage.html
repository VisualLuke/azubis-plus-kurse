#kamera{position:absolute;inset:0;transform-origin:0 0}
/* Bühnen: Ladenwand, davor das durchgehende Kassenband */
.buehne.kz63{width:1840px;height:980px;border-radius:48px;background:linear-gradient(var(--b50),var(--b100));overflow:hidden}
.buehne.kz63::before{content:'';position:absolute;left:0;right:0;top:640px;height:200px;background:linear-gradient(var(--b100),var(--b200));opacity:.55}

.vk63 .band{position:absolute;left:0;right:0;top:0;height:16px;background:var(--f)}

.staender63{width:170px;height:352px}

.staender63 .klemme{left:43px;top:0;width:84px;height:34px;border-radius:9px;background:linear-gradient(var(--b600),var(--b700))}
.staender63 .fuss{left:10px;bottom:0;width:150px;height:22px;border-radius:11px;background:linear-gradient(var(--b600),var(--b700))}

/* Bondrucker und Kassenbon */
.drucker63{width:380px;height:110px;border-radius:22px 22px 10px 10px;background:linear-gradient(var(--b500),var(--b700));box-shadow:0 10px 26px rgba(22,19,37,.16)}

.bon63.ab{clip-path:polygon(0 8px,10px 0,20px 8px,30px 0,40px 8px,50px 0,60px 8px,70px 0,80px 8px,90px 0,100px 8px,110px 0,120px 8px,130px 0,140px 8px,150px 0,160px 8px,170px 0,180px 8px,190px 0,200px 8px,210px 0,220px 8px,230px 0,240px 8px,250px 0,260px 8px,270px 0,280px 8px,290px 0,300px 8px,310px 0,320px 8px,330px 0,340px 8px,
  340px calc(100% - 8px),330px 100%,320px calc(100% - 8px),310px 100%,300px calc(100% - 8px),290px 100%,280px calc(100% - 8px),270px 100%,260px calc(100% - 8px),250px 100%,240px calc(100% - 8px),230px 100%,220px calc(100% - 8px),210px 100%,200px calc(100% - 8px),190px 100%,180px calc(100% - 8px),170px 100%,160px calc(100% - 8px),150px 100%,140px calc(100% - 8px),130px 100%,120px calc(100% - 8px),110px 100%,100px calc(100% - 8px),90px 100%,80px calc(100% - 8px),70px 100%,60px calc(100% - 8px),50px 100%,40px calc(100% - 8px),30px 100%,20px calc(100% - 8px),10px 100%,0 calc(100% - 8px))}

.pap63 .kopf63{height:136px;position:relative}
.pap63 .pk63{position:absolute;left:50%;top:24px;margin-left:-50px;border-color:var(--b100)}
.pap63 .strich63{height:16px;border-top:3px dashed var(--n300);margin-top:6px}
.pap63 .bz{height:38px;font:600 28px/38px Inter;color:var(--ink);white-space:nowrap}
.pap63 .sw{display:inline-block;white-space:pre}
.pap63 .sw u{display:inline-block;text-decoration:none;opacity:0;white-space:pre}
.pap63 .sw.lw u{color:var(--ft);font-weight:800}
.pap63 .code63{height:34px;margin:2px 30px 0;background:repeating-linear-gradient(90deg,var(--ink) 0 3px,transparent 3px 7px,var(--ink) 7px 12px,transparent 12px 15px,var(--ink) 15px 16px,transparent 16px 21px)}

/* Hängeetikett (Legende, Mini-Preisschilder) */
.etik63{padding:8px 24px 8px 40px;border-radius:12px 999px 999px 12px;background:var(--f);color:var(--fa);font:800 34px/44px Inter;white-space:nowrap;transform-origin:50% -18px;
  box-shadow:0 6px 16px rgba(22,19,37,.14)}

/* Regal */
.regal63 i{position:absolute;display:block}

.ware63{border-radius:8px;box-shadow:inset 0 -6px 0 rgba(22,19,37,.12)}

.ware63.f1{background:var(--b400)} .ware63.f2{background:var(--success)} .ware63.f3{background:var(--warning)} .ware63.f4{background:var(--info)} .ware63.f5{background:var(--error)}

.schale63::before{content:'';position:absolute;left:-10px;right:-10px;top:-8px;height:16px;border-radius:8px;background:var(--b300)}
.kschild{padding:10px 26px;border-radius:16px;background:var(--surface);color:var(--b600);font:800 34px/40px Inter;white-space:nowrap;box-shadow:0 8px 20px rgba(22,19,37,.12);transform-origin:50% -40px}
.kschild::before,.kschild::after{content:'';position:absolute;top:-40px;width:4px;height:40px;background:var(--n300)}
.kschild::before{left:30px} .kschild::after{right:30px}
.kschild.an{background:var(--warning);color:var(--surface);box-shadow:0 0 0 10px color-mix(in srgb,var(--warning) 30%,transparent),0 8px 20px rgba(22,19,37,.12)}
/* Straße, Rollbahn */
.strasse63{height:16px;border-radius:8px;background:var(--n300)}

<script src="../../werkzeug/motor.js"></script>
<script>
/* ---------- Aufnahme: Satz- und Wortzeiten aus sprache.json ---------- */
const VERSATZ = 0.7;
window.SPRACHE = { datei: 'sprache.mp3', versatz: VERSATZ };
const A = s => s + VERSATZ;
const W = (m, n) => A(wort(m, satz(n).start - .01));
const WE = (m, n) => A(wortEnde(m, satz(n).start - .01));
const SA = n => A(satz(n).start);
const SE = n => A(satz(n).ende);
const ENDE_SPRACHE = SE(SPRACHDATEN.saetze.length);
const WELT = document.getElementById('welt');

// Klänge nur mit gültigem Namen und Zeit (sonst bricht das Mischen ab)
const KLAENGE = new Set(['whoosh', 'pop', 'plopp', 'klick', 'muenze', 'ding', 'erfolg', 'tipp', 'kritzeln', 'scan']);
const ton = (t, k) => { if (k && KLAENGE.has(k) && Number.isFinite(t) && t >= 0) cue(t, k); };

const el = id => typeof id === 'string' ? (id.startsWith('#') ? $(id) : document.getElementById(id)) : id;
const _tw = tw; tw = (ids, ...r) => _tw([].concat(ids).map(el), ...r);
const _ak = akteur; akteur = (id, ...r) => _ak(el(id), ...r);
const wertBei = (id, p, t) => wert(AKTEURE.get(el(id)), p, t);
const pop = (id, t, basis, snd = 'pop', e = 'back') => { akteur(id, { ...basis, s: 0 }); tw(id, t, e === 'back' ? .5 : .65, { s: basis.s ?? 1 }, e); ton(t, snd); };
const ein = (id, t, basis, von = { y: 70 }, snd = null) => {
  akteur(id, { ...basis, o: 0, x: basis.x + (von.x || 0), y: basis.y + (von.y || 0), r: von.r || 0 });
  tw(id, t, .5, { o: 1 }, 'out'); tw(id, t, .6, { x: basis.x, y: basis.y, r: basis.r || 0 }, 'sanft');
  tw(id, t + .3, .12, { sy: .93, sx: 1.05 }, 'sinus'); tw(id, t + .42, .4, { sy: 1, sx: 1 }, 'sanft');
  ton(t, snd);
};
const aus = (ids, t, d = .35) => tw(ids, t, d, { o: 0, s: .85 }, 'in');
const wackeln = (id, t, n = 3, w = 3) => { for (let i = 0; i < n; i++) tw(id, t + i * .1, .1, { r: i % 2 ? w : -w }, 'sinus'); tw(id, t + n * .1, .25, { r: 0 }, 'sinus'); };
const huepfen = (id, t, h = 18) => {
  const y = wertBei(id, 'y', t);
  tw(id, t, .08, { sy: .94, sx: 1.04 }, 'sinus');
  tw(id, t + .08, .36, { y }, 'sinus', { bogen: h }); tw(id, t + .08, .14, { sy: 1.04, sx: .97 }, 'sinus');
  tw(id, t + .44, .08, { sy: .95, sx: 1.04 }, 'sinus'); tw(id, t + .52, .3, { sy: 1, sx: 1 }, 'sanft');
};
const bump = (id, t, s = 1.1) => { const s0 = wertBei(id, 's', t); tw(id, t, .12, { s: s0 * s }, 'sinus'); tw(id, t + .12, .4, { s: s0 }, 'sanft'); };
const flug = (id, t0, d, x, y, h = 120, extra = {}) => tw(id, t0, d, { x, y, ...extra }, 'inout', { bogen: h });
const federn = (id, t) => { tw(id, t, .12, { sy: .96, sx: 1.025 }, 'sinus'); tw(id, t + .12, .4, { sy: 1, sx: 1 }, 'sanft'); };
const landen = (id, t) => { tw(id, t, .08, { sy: .86, sx: 1.08 }, 'sinus'); tw(id, t + .08, .45, { sy: 1, sx: 1 }, 'sanft'); };
const tpl = id => document.getElementById(id).innerHTML;
const kopie = (id, p) => tpl(id).replace(/id="([^"]+)"/g, `id="$1_${p}"`).replace(/url\(#([^)]+)\)/g, `url(#$1_${p})`);
const neu = (id, inhalt, stil = '', attr = '', klasse = '') => { WELT.insertAdjacentHTML('beforeend', `<div class="a ${klasse}" id="${id}" style="${stil}" ${attr}>${inhalt}</div>`); return id; };
const welle = (id, t, x, y, d = .9) => { if (!el(id)) neu(id, '', 'width:160px;height:160px', 'data-frei', 'welle'); akteur(id, { x, y, o: 0, s: .8 }); set(id, t, { o: .9, s: .8 }); tw(id, t, d, { o: 0, s: 1.6 }, 'weich'); };
let WN = 0;
const wellen = (t, x, y, farbe = null, gr = 160) => { const id = 'wl' + WN++; neu(id, '', `width:${gr}px;height:${gr}px${farbe ? ';border-color:' + farbe : ''}`, 'data-frei', 'welle oben'); welle(id, t, x, y); };
const plakette = (id, farbe, svg, attr = 'data-frei', extra = '') => neu(id, svg ? tpl(svg) : '', '', attr, 'plakette ' + farbe + ' ' + extra);
const pendel = (id, t, a = 12, n = 5, d = .34) => { for (let k = 0; k < n; k++) tw(id, t + k * d, d, { r: (k % 2 ? -1 : 1) * a * Math.pow(.55, k) }, 'sinus'); tw(id, t + n * d, d, { r: 0 }, 'sinus'); };
const summen = (id, t, d = .8, a = 4) => HOOKS.push(z => { const p = z - t; if (p > 0 && p < d) el(id).style.transform += ` translateX(${(a * Math.sin(p * 70) * (1 - p / d)).toFixed(2)}px)`; });
// Bildteil als Akteur: Breite in px (SVG 160 × 160); Mitte so, dass der Boden des Teils (Zeile g im SVG) auf y liegt
const bild = (id, t, breite, attr = '', stil = '', klasse = '') => neu(id, kopie(t, id), `width:${breite}px;${stil}`, attr, klasse);
const steht = (breite, boden, g = 146) => boden - breite * (g / 160 - .5);
// Text, der sich Buchstabe für Buchstabe tippt
function tippen(id, text, t0, d, klang = true) {
  const e = el(id), zeichen = [...text];
  e.classList.add('tipp');
  e.innerHTML = zeichen.map(c => `<u>${c}</u>`).join('');
  const us = [...e.querySelectorAll('u')], z = us.map((u, k) => t0 + d * k / Math.max(1, us.length));
  HOOKS.push(t => us.forEach((u, k) => { const p = clamp((t - z[k]) / .08); u.style.opacity = p; u.style.transform = p < 1 ? `translateY(${(6 * (1 - p)).toFixed(1)}px)` : ''; }));
  if (klang) z.filter((_, k) => k % 2 === 0 && zeichen[k] !== ' ').forEach(tz => ton(tz, 'tipp'));
  return z;
}

/* ---------- Kassenband: läuft, wenn Ware darauf fährt ---------- */
const BAND = 812, SLOT = 712;
const RIDES = [];
const bandPos = t => RIDES.reduce((s, [t0, d, dx, e]) => s + dx * E[e](clamp((t - t0) / d)), 0);
const GURTE = [...document.querySelectorAll('.band63 .gurt')];
HOOKS.push(t => GURTE.forEach(g => { g.style.backgroundPosition = `${bandPos(t).toFixed(1)}px 0`; }));
// fahren: mehrere Akteure fahren gemeinsam auf dem Band um dx
function fahren(ids, t, dx, d = .6, e = 'out') {
  for (const id of [].concat(ids)) tw(id, t, d, { x: wertBei(id, 'x', t) + dx }, e);
  RIDES.push([t, d, dx, e]);
}

/* ---------- Kamera: Schwenk mit Unschärfe, Atmer, Akzente, Zoom in einen Punkt ---------- */
const PANS = [], AKZENTE = [], SCHNITTE = [], ZOOMS = [];
const pan2 = (t0, i) => { pan(t0, i); PANS.push(t0); };
const akzent = (t, z = .035) => AKZENTE.push([t, z]);
bewegungsunschaerfe(.1);
const N = 11;
HOOKS.push(t => {
  let z = 1, ox = 960, oy = 540;
  for (const p of PANS) z -= .07 * Math.sin(Math.PI * clamp((t - p) / .9));
  for (const [a, h] of AKZENTE) { const d = (t - a) / 1.1; if (d > 0 && d < 1) z += h * Math.sin(Math.PI * E.weich(d)); }
  const letzte = Math.max(0, ...PANS.filter(p => p <= t), ...SCHNITTE.filter(p => p <= t));
  z *= 1 + .03 * E.inout(clamp((t - letzte - .9) / 11));
  for (const [t0, d, zz, px, py] of ZOOMS) { const q = clamp((t - t0) / d); if (t >= t0 && t < t0 + d + .02) { const w = E.in(q); z *= 1 + (zz - 1) * w; ox = lerp(960, px, Math.min(1, w * 3)); oy = lerp(540, py, Math.min(1, w * 3)); } }
  $('#kamera').style.transform = `translate(${ox}px,${oy}px) scale(${z.toFixed(4)}) translate(${-ox}px,${-oy}px)`;
  const wx = wert(kamera, 'x', t);
  for (let i = 0; i < N; i++) { const b = $('#bue' + i); b.style.transform += ` translateX(${(.16 * (wx + S(i))).toFixed(1)}px)`; }
});
const lerp = (a, b, p) => a + (b - a) * p;

/* ---------- Figuren: Mund nur in den eigenen Sätzen (Sprecher exakt aus sprache.json), Nicken, froh, winken ---------- */
const SAETZE = SPRACHDATEN.saetze.map(s => ({ a: A(s.start), b: A(s.ende), w: s.sprecher }));
const FROH = [], KOPF = [], WINK = [];
const figurHTML = id => wer => `<div class="figur"><div class="ebene">${kopie('f-' + wer, id)}</div>${tpl('gesicht')}<div class="ebene hand">${kopie('t-hand', id)}</div></div>`;
function portrait(id, wer, gr, attr = '', klasse = '') {
  neu(id, figurHTML(id)(wer), `width:${gr}px;height:${gr}px`, attr, 'portrait ' + klasse);
  el(id).dataset.sprecher = wer;
  return id;
}
const portraitHTML = (id, wer, gr) => `<div class="portrait pk63" id="${id}" data-sprecher="${wer}" style="width:${gr}px;height:${gr}px">${figurHTML(id)(wer)}</div>`;
HOOKS.push(t => {
  const pegel = window.PEGEL ? (window.PEGEL[Math.round((t - VERSATZ) * 30)] || 0) : .7 + .3 * Math.sin(t * 9);
  document.querySelectorAll('.portrait').forEach((p, i) => {
    const spricht = SAETZE.some(s => s.w === p.dataset.sprecher && t >= s.a && t <= s.b);
    const auf = spricht ? clamp(pegel * (.55 + .45 * Math.abs(Math.sin(t * 13 + i * 7)))) : 0;
    const froh = !spricht && FROH.some(([id, a, b]) => id === p.id && t >= a && t < b);
    p.querySelector('.auf').style.transform = `scaleY(${Math.max(.05, auf)})`;
    p.querySelector('.auf').style.opacity = auf > .12 ? 1 : 0;
    p.querySelector('.froh').style.opacity = froh && auf <= .12 ? 1 : 0;
    p.querySelector('.zu').style.opacity = auf > .12 || (froh && auf <= .12) ? 0 : 1;
    const z = (t * .29 + i * .37) % 1;
    p.querySelector('.augen').style.transform = `scaleY(${z < .035 ? .12 : 1})`;
    let r = spricht ? 1.6 * Math.sin(t * 3.1) * pegel : 1.4 * Math.max(0, Math.sin(t * 1.4 + i * 2.1)) ** 10, y = r;
    for (const [id, t0, d] of KOPF) {
      const q = (t - t0) / d; if (id !== p.id || q < 0 || q > 1) continue;
      y += 9 * Math.abs(Math.sin(q * Math.PI * 2)) * Math.sin(Math.PI * q);
    }
    p.querySelector('.figur').style.transform = `translate(0px,${y.toFixed(2)}px) rotate(${r.toFixed(2)}deg)`;
    p.style.borderColor = spricht ? 'var(--b300)' : '';
    let hy = 60, hr = 0, ho = 0;
    for (const [id, t0, d] of WINK) {
      const q = t - t0; if (id !== p.id || q < 0 || q > d) continue;
      const ein = E.sanft(clamp(q / .35)), weg = E.in(clamp((q - d + .3) / .3));
      hy = 60 * (1 - ein) + 60 * weg; ho = 1; hr = 16 * Math.sin((q - .2) * 11) * clamp(q / .3) * (1 - weg);
    }
    const h = p.querySelector('.hand');
    h.style.opacity = ho; h.style.transform = `translateY(${hy.toFixed(1)}%) rotate(${hr.toFixed(2)}deg)`;
  });
});
const nicken = (id, t, d = 1.1) => KOPF.push([id, t, d]);
const winken = (id, t, d = 1.6) => WINK.push([id, t, d]);

/* ================= Preisschild (Wortkarte im Ständer) fährt mit der Ware auf dem Band herein ================= */
const GENUS = ['der', 'die', 'das'];
const KX = 420, KY = 315, FAHRT = 1150;
function preisschild(i, o) {
  const X = S(i), id = 'vk' + i, kl = GENUS.includes(o.art) ? o.art : 'neutral', G = `data-gruppe="ps${i}"`;
  const woerter = o.wort.split(' ');
  neu(id, `<div class="band"></div>
    <div class="kopf"><span class="art" id="${id}a">${o.chip}</span><span class="punkte">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(k => `<i class="${k === o.nr ? 'jetzt' : k < o.nr ? 'fertig' : ''}" ${k === o.nr ? `id="${id}d"` : ''}></i>`).join('')}</span></div>
    <div class="wort" id="${id}wt" style="font-size:${o.gr}px;line-height:${Math.round(o.gr * (o.zeile ? 1.02 : 1.1))}px">${woerter.map((w, k) => `<span class="w maske"><span class="m"><span class="wi" id="${id}w${k}">${w}</span></span></span>`).join(' ')}</div>
    ${o.zeile ? `<div class="pl" id="${id}p" ${o.plgr ? `style="font-size:${o.plgr}px"` : ''}><small>${o.zeile[0]}</small><span>${o.zeile[1]}</span></div>` : ''}`, '', G, `vk63 ${kl}${o.zeile ? '' : ' ohne'}`);
  neu('st' + i, '<i class="stab"></i><i class="klemme"></i><i class="fuss"></i>', '', G, 'staender63 vorn');
  const wb = o.wb || 170;
  bild('pr' + i, o.ware, wb, G, '', 'vorn');
  const ids = [id, 'st' + i, 'pr' + i];
  akteur(id, { x: X + KX - FAHRT, y: KY, o: 0 });
  akteur('st' + i, { x: X + KX - FAHRT, y: BAND - 176, o: 0 });
  akteur('pr' + i, { x: X + KX + 225 - FAHRT, y: steht(wb, BAND, o.g || 146), o: 0 });
  akteur(id + 'a', { s: 0 }, true); akteur(id + 'd', { sx: .3 }, true);
  woerter.forEach((w, k) => akteur(`${id}w${k}`, { y: o.gr * 1.3 }, true));
  if (o.zeile) akteur(id + 'p', { o: 0, x: -40 }, true);
  return {
    ein: t => { set(ids, t, { o: 1 }); fahren(ids, t, FAHRT, .62, 'out'); pendel(id, t + .55, 3, 4, .3); landen('pr' + i, t + .6); ton(t, 'whoosh'); ton(t + .6, 'plopp'); },
    chip: t => { tw(id + 'a', t, .5, { s: 1 }, 'back'); tw(id + 'd', t, .6, { sx: 1 }, 'sanft'); ton(t, 'pop'); },
    wort: zeiten => { [].concat(zeiten).forEach((t, k) => tw(`${id}w${k}`, t - .05, .7, { y: 0 }, 'weich')); const t0 = [].concat(zeiten)[0]; akzent(t0 + .1, .03); ton(t0, 'klick'); },
    zeile: t => { tw(id + 'p', t - .05, .35, { o: 1 }); tw(id + 'p', t - .05, .6, { x: 0 }, 'sanft'); ton(t, 'pop'); },
    weg: t => { },
  };
}

/* ================= Bondrucker und Kassenbon: der Beispielsatz druckt sich Zeile für Zeile ================= */
const BON_B = 340, KOPF_H = 158, LH = 38, FUSS_H = 72;
function drucker(i, x, t) {
  const id = 'dr' + i;
  neu(id, `<div class="schlitz"></div><div class="tasten"></div><div class="led" id="${id}l"></div>`, '', `data-gruppe="dr${i}"`, 'drucker63');
  akteur(id, { x, y: BAND - 55 + 150 });
  tw(id, t, .7, { y: BAND - 55 }, 'inout'); federn(id, t + .7); ton(t, 'whoosh');
  return id;
}
// Papier wächst aus dem Schlitz: schritte [t, höhe, dauer]
function papier(id, x, html, gruppe) {
  neu(id, `<div class="pap63">${html}</div>`, '', `data-gruppe="${gruppe}"`, 'bon63');
  akteur(id, { x: x - BON_B / 2, y: SLOT }, true);
  const schritte = [], e = el(id);
  let ab = Infinity;
  HOOKS.push(t => {
    let h = 0;
    for (const [t0, hz, d] of schritte) { if (t < t0) break; h = h + (hz - h) * E.out(clamp((t - t0) / d)); }
    e.style.height = h.toFixed(1) + 'px';
    e.style.transform = `translateY(${(-h).toFixed(1)}px) ` + e.style.transform;
    if (h < 1) e.style.visibility = 'hidden';
    e.classList.toggle('ab', t >= ab);
  });
  return {
    vor: (t, h, d = .2) => { schritte.push([t, h, d]); schritte.sort((a, b) => a[0] - b[0]); },
    reissen: t => { ab = t; tw(id, t, .07, { y: SLOT - 14 }, 'out'); tw(id, t + .07, .45, { y: SLOT - 22 }, 'sanft'); ton(t, 'klick'); },
  };
}
const ANZEIGE = { kassenbong: 'Kassenbon', kassenbongs: 'Kassenbons', zwei: '2', drei: '3,20', zwanzig: '' };
function satzbon(i, x, ns, art, lern, zeilen) {
  ns = [].concat(ns);
  const id = 'bo' + i, kl = GENUS.includes(art) ? art : 'neutral';
  let teile = ns.flatMap(n => { const s = satz(n); let k = 0; return s.text.split(/\s+/).map(tok => ({ tok: tok.replace(/[\p{L}\p{N}]+/u, m => ANZEIGE[m.toLowerCase()] ?? m), lern: _norm(tok), w: /[\p{L}\p{N}]/u.test(tok) ? s.woerter[k++] : null })); });
  // Zeichen je Wort mit Zeit; reine Satzzeichen hängen am Wort davor
  const toks = [];
  for (const p of teile) {
    const a = A(p.w.start), d = Math.max(.08, p.w.ende - p.w.start);
    const zeichen = [...p.tok].map((c, k, arr) => [c, a + d * k / arr.length]);
    if (!/[\p{L}\p{N}]/u.test(p.tok)) { if (toks.length && zeichen.length) toks.at(-1).z.push(...zeichen.map(([c]) => [c, a])); continue; }
    toks.push({ z: zeichen, lw: lern.includes(p.lern) });
  }
  const zl = []; let k = 0;
  for (const n of zeilen) { zl.push(toks.slice(k, k + n)); k += n; }
  if (k !== toks.length) throw new Error(`satzbon ${i}: ${toks.length} Wörter, Zeilen zählen ${k}`);
  const wer = satz(ns[0]).sprecher;
