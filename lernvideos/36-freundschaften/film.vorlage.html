.geteilt .eins{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,var(--surface),var(--b50) 45%,var(--b100))}
.geteilt .kalt{position:absolute;inset:0;background:radial-gradient(circle at 50% 55%,var(--b50),var(--info-bg) 55%,var(--b100))}
.geteilt .matt{position:absolute;top:0;bottom:0;background:var(--surface)}
.geteilt .linie{position:absolute;top:0;width:60px;height:880px}
.geteilt .knauf{position:absolute;top:392px;width:96px;height:96px;border-radius:999px;background:var(--surface);

.seitenchip{display:flex;align-items:center;gap:14px;padding:12px 28px 12px 22px;border-radius:999px;background:var(--surface);

.seitenchip i{width:18px;height:18px;border-radius:999px;background:var(--warning)}
.seitenchip.de i{background:var(--b500)}
.rechts{left:auto;right:0}
.kz .titel{font:700 64px/74px Inter;letter-spacing:-.02em;white-space:nowrap}
.kz.rechts{text-align:right}
.platte{padding:30px 64px 36px;border-radius:36px;background:var(--surface);box-shadow:0 18px 50px rgba(22,19,37,.14);text-align:center;white-space:nowrap}
.platte .titel{font:800 76px/86px Inter;letter-spacing:-.03em}

/* Bausteine */
.welle{border-radius:999px;border:5px solid var(--b300);opacity:0}
.portrait{border-radius:999px;overflow:hidden;background:linear-gradient(160deg,var(--b200),var(--b300));border:7px solid var(--surface);

.portrait .figur{position:absolute;left:0;top:6%;width:100%;height:100%;transform-origin:50% 100%}
.portrait .augen{transform-origin:50% 45%}
.portrait .auf{opacity:0}
.portrait .hand{transform-origin:80% 92%;opacity:0}
.linien path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.lage{position:absolute;left:0;top:0;width:100%;height:100%}
.kokos .herzlage{left:21%;top:18%;width:58%;height:58%}
.thermo .lage{transform-origin:50% 78.75%}

/* Sprechblasen */
.sb{padding:14px 28px;border-radius:26px;background:var(--surface);box-shadow:0 8px 24px rgba(22,19,37,.12);
  font:700 30px/38px Inter;color:var(--ink);white-space:nowrap}
.sb::after{content:'';position:absolute;left:30px;bottom:-11px;width:24px;height:24px;background:inherit;transform:rotate(45deg);border-radius:0 0 6px 0}
.sb.r::after{left:auto;right:30px}
.sb.lila{background:var(--b500);color:var(--surface)}
.sb.klein{font-size:26px;line-height:32px;padding:10px 20px;border-radius:20px}

.sb .rest{visibility:hidden}
.sb.punkte{padding:16px 22px;display:flex;gap:10px}

.sb.bild{display:flex;align-items:center;gap:10px;padding:14px 22px 14px 18px}

/* Kalender (Szene 4) */
.kal{width:660px;height:280px;border-radius:28px;background:var(--surface);box-shadow:0 14px 40px rgba(22,19,37,.14);overflow:hidden}
.kal .kopf{position:absolute;left:0;right:0;top:0;height:54px;background:linear-gradient(var(--b500),var(--b600))}

.kal .zelle{flex:1;position:relative;border-radius:14px;background:var(--n200)}
.kal .zelle .an{position:absolute;inset:0;border-radius:14px;background:var(--b100)}
.kal .zelle .sa{position:absolute;inset:0;border-radius:14px;background:var(--b500);display:flex;align-items:center;justify-content:center}
.kal .zelle .sa svg{width:34px}
.kal .lauf{position:absolute;left:0;top:0;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:999px;background:var(--b600);border:4px solid var(--surface);box-shadow:0 2px 6px rgba(22,19,37,.25)}
.kal .eintrag{position:absolute;left:20px;right:20px;top:184px;height:74px;border-radius:18px;background:var(--b50);border:3px solid var(--b200);
  display:flex;align-items:center;gap:14px;padding:0 18px;font:700 30px/36px Inter;color:var(--ink);white-space:nowrap}
.kal .eintrag .ic{width:72px;height:72px;flex:none;position:relative;margin:0 -6px 0 -10px}
.kal .eintrag .rest{visibility:hidden}
.einl{width:190px;height:124px;border-radius:18px;border:5px dashed var(--b300);background:var(--b50)}
.einl svg{position:absolute;inset:0;width:100%;height:100%}

/* Orte (Szene 5) */
.ort{width:620px;height:330px;border-radius:32px;overflow:hidden;border:8px solid var(--surface);box-shadow:0 14px 40px rgba(22,19,37,.14);background:var(--b50)}
.ort .feld{position:absolute;inset:0}
.ort .sport{background:linear-gradient(var(--success-bg),var(--success-bg))}
.ort .sport .mitte{position:absolute;left:298px;top:0;bottom:0;width:6px;background:var(--surface);opacity:.9}
.ort .sport .kreis{position:absolute;left:241px;top:97px;width:120px;height:120px;border-radius:999px;border:6px solid var(--surface);opacity:.9}
.ort .musik{background:linear-gradient(160deg,var(--b100),var(--b50))}
.ort .cafe{background:linear-gradient(160deg,var(--warning-bg),var(--b50))}
.ort .ding{position:absolute}
.ort .woche{position:absolute;right:16px;top:14px;padding:9px 12px;border-radius:999px;background:var(--surface);display:flex;gap:8px;box-shadow:0 4px 12px rgba(22,19,37,.12);z-index:5}
.ort .woche i{position:relative;width:18px;height:18px;border-radius:999px;background:var(--n200)}
.ort .woche i u{position:absolute;inset:0;border-radius:999px;background:var(--b500)}

/* Trittsteine (Szene 6) */
.stein{width:150px;height:46px;border-radius:999px;background:linear-gradient(var(--b200),var(--b300));box-shadow:0 7px 0 var(--b400)}
.stein .an{position:absolute;inset:0;border-radius:999px;background:linear-gradient(var(--success-bg),var(--success));opacity:0}

/* Rückblick (Szene 7) */
.pk{width:124px;height:124px;border-radius:999px;background:var(--surface);border:6px solid var(--b500);box-shadow:0 10px 26px rgba(22,19,37,.16);
  display:flex;align-items:center;justify-content:center}
.pk svg{width:76px}
.pk .ic{width:96px;height:96px;position:relative}
.pk .ic svg{width:100%}
#pk6ball{width:124px;height:124px}

/* Abspann */
.deckel{position:absolute;inset:0;background:linear-gradient(135deg,var(--b500),var(--b700));clip-path:circle(0% at 50% 50%)}

.deckel .klein{font:400 40px/54px Inter;color:var(--b100);margin-top:24px;text-align:center;max-width:1400px}

<script src="../../werkzeug/motor.js"></script>
<script>
/* ---------- Aufnahme: Satz- und Wortzeiten aus sprache.json ---------- */
const VERSATZ = 0.7;
window.SPRACHE = { datei: 'sprache.mp3', versatz: VERSATZ };
const A = s => s + VERSATZ;
const W = (m, n) => A(wort(m, satz(n).start - .01));          // Filmzeit des Worts im Satz n (oder danach)
const WE = (m, n) => A(wortEnde(m, satz(n).start - .01));
const SE = n => A(satz(n).ende);
const ENDE_SPRACHE = SE(SPRACHDATEN.saetze.length);
const WELT = document.getElementById('welt');

const el = id => typeof id === 'string' ? (id.startsWith('#') ? $(id) : document.getElementById(id)) : id;
const _tw = tw; tw = (ids, ...r) => _tw([].concat(ids).map(el), ...r);
const _ak = akteur; akteur = (id, ...r) => _ak(el(id), ...r);
const wertBei = (id, p, t) => wert(AKTEURE.get(el(id)), p, t);
const pop = (id, t, basis, snd = 'pop', e = 'back') => { akteur(id, { ...basis, s: 0 }); tw(id, t, e === 'back' ? .5 : .65, { s: basis.s ?? 1 }, e); if (snd) cue(t, snd); };
const ein = (id, t, basis, von = { y: 70 }, snd = null) => {
  akteur(id, { ...basis, o: 0, x: basis.x + (von.x || 0), y: basis.y + (von.y || 0), r: von.r || 0 });
  tw(id, t, .5, { o: 1 }, 'out'); tw(id, t, .6, { x: basis.x, y: basis.y, r: basis.r || 0 }, 'sanft');
  tw(id, t + .3, .12, { sy: .93, sx: 1.05 }, 'sinus'); tw(id, t + .42, .4, { sy: 1, sx: 1 }, 'sanft');
  if (snd) cue(t, snd);
};
const aus = (ids, t, d = .35) => tw(ids, t, d, { o: 0, s: .85 }, 'in');
const wackeln = (id, t, n = 3, w = 3) => { for (let i = 0; i < n; i++) tw(id, t + i * .1, .1, { r: i % 2 ? w : -w }, 'sinus'); tw(id, t + n * .1, .25, { r: 0 }, 'sinus'); };
const huepfen = (id, t, h = 18) => {
  const y = wertBei(id, 'y', t);
  tw(id, t, .08, { sy: .94, sx: 1.04 }, 'sinus');
  tw(id, t + .08, .36, { y }, 'sinus', { bogen: h }); tw(id, t + .08, .14, { sy: 1.04, sx: .97 }, 'sinus');
  tw(id, t + .44, .08, { sy: .95, sx: 1.04 }, 'sinus'); tw(id, t + .52, .3, { sy: 1, sx: 1 }, 'sanft');
};
const bump = (id, t, s = 1.1) => { const s0 = wertBei(id, 's', t); tw(id, t, .12, { s: s0 * s }, 'sinus'); tw(id, t + .12, .4, { s: s0 }, 'sanft'); };
const flug = (id, t0, d, x, y, h = 120, extra = {}) => tw(id, t0, d, { x, y, ...extra }, 'inout', { bogen: h });
const landen = (id, t) => { tw(id, t, .08, { sy: .86, sx: 1.08 }, 'sinus'); tw(id, t + .08, .45, { sy: 1, sx: 1 }, 'sanft'); };
const schweben = (ids, a = 4) => [].concat(ids).forEach(id => { AKTEURE.get(el(id)).basis.schweben = a; });
const lerp = (a, b, p) => a + (b - a) * p;
const rampe = (t, t0, d, a, b, e = 'inout') => lerp(a, b, E[e](clamp((t - t0) / d)));
const tpl = id => document.getElementById(id).innerHTML;
const kopie = (id, p) => tpl(id).replace(/id="([^"]+)"/g, `id="$1_${p}"`).replace(/url\(#([^)]+)\)/g, `url(#$1_${p})`);
const neu = (id, inhalt, stil = '', attr = '', klasse = '') => { WELT.insertAdjacentHTML('beforeend', `<div class="a ${klasse}" id="${id}" style="${stil}" ${attr}>${inhalt}</div>`); return id; };
const bild = (id, t, breite, attr = '') => neu(id, kopie(t, id), `width:${breite}px`, attr);
let WN = 0;
const welle = (t, x, y, farbe = null, gr = 160, d = .9) => {
  const id = 'wl' + WN++; neu(id, '', `width:${gr}px;height:${gr}px${farbe ? ';border-color:' + farbe : ''}`, 'data-frei', 'welle');
  akteur(id, { x, y, o: 0, s: .8 }); set(id, t, { o: .9, s: .8 }); tw(id, t, d, { o: 0, s: 1.6 }, 'weich');
};
const summen = (id, t, d = .8, a = 4) => HOOKS.push(z => { const p = z - t; if (p > 0 && p < d) el(id).style.transform += ` translateX(${(a * Math.sin(p * 70) * (1 - p / d)).toFixed(2)}px)`; });
// Auftritt auf einem Bogen: von (x0,y0) nach basis, mit Stauchen bei der Landung
const bogenEin = (id, t, basis, x0, y0, h = 90, d = .75, snd = 'whoosh') => {
  akteur(id, { ...basis, x: x0, y: y0, o: 0, s: (basis.s ?? 1) * .8 });
  tw(id, t, .3, { o: 1 }); flug(id, t, d, basis.x, basis.y, h, { s: basis.s ?? 1 });
  tw(id, t + d - .02, .14, { sy: .92, sx: 1.05 }, 'sinus'); tw(id, t + d + .12, .45, { sy: 1, sx: 1 }, 'sanft'); if (snd) cue(t, snd);
};
// Text tippt sich: getippter Teil sichtbar, Rest unsichtbar (Blase behält ihre Breite)
const tippen = (id, text, t1, t2, n = 7) => {
  el(id).innerHTML = `<span class="tp"></span><span class="rest">${text}</span>`;
  const [a, b] = el(id).children;
  HOOKS.push(t => { const k = Math.round(text.length * clamp((t - t1) / (t2 - t1))); a.textContent = text.slice(0, k); b.textContent = text.slice(k); });
  for (let i = 0; i < n; i++) cue(t1 + i * (t2 - t1) / n, 'tipp');
};
// Linien-SVG über einer ganzen Szene (Koordinaten = Bildschirm, wenn die Kamera auf der Szene steht)
// gepunktet: der Punkte-Pfad wird über eine Maske „gezeichnet“ (draw setzt die Strichelung der .zeichnen-Pfade)
const linien = (id, i, pfade) => {
  const svg = pfade.map(([pid, d, farbe, breite, gepunktet]) => gepunktet
    ? `<g id="${pid}g"><mask id="${pid}m" maskUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080"><path class="zeichnen" pathLength="1" d="${d}" stroke="var(--surface)" stroke-width="${breite + 10}"/></mask><path class="pfad" d="${d}" stroke="${farbe}" stroke-width="${breite}" mask="url(#${pid}m)"/></g>`
    : `<g id="${pid}g"><path class="zeichnen" pathLength="1" d="${d}" stroke="${farbe}" stroke-width="${breite}"/></g>`).join('');
  neu(id, `<svg class="linien" viewBox="0 0 1920 1080" style="width:1920px;height:1080px">${svg}</svg>`, 'width:1920px;height:1080px', 'data-frei');
  akteur(id, { x: S(i) + 960, y: 540 });
  pfade.forEach(([pid]) => akteur(pid + 'g', { draw: 0 }, true));
};
const zeichne = (pid, t, d = .6) => tw(pid + 'g', t, d, { draw: 1 }, 'inout');

/* ---------- Kamera: Schwenk mit Unschärfe, Zoom-Atmer, Akzente, Tiefe ---------- */
const PANS = [], AKZENTE = [];
const pan2 = (t0, i) => { pan(t0, i); PANS.push(t0); };
const akzent = (t, z = .035) => AKZENTE.push([t, z]);
bewegungsunschaerfe(.1);
const N = 7;
HOOKS.push(t => {
  let z = 1;
  for (const p of PANS) z -= .07 * Math.sin(Math.PI * clamp((t - p) / .9));
  for (const [a, h] of AKZENTE) { const d = (t - a) / 1.1; if (d > 0 && d < 1) z += h * Math.sin(Math.PI * E.weich(d)); }
  const letzte = Math.max(0, ...PANS.filter(p => p <= t));
  z *= 1 + .025 * E.inout(clamp((t - letzte - .9) / 11));
  $('#kamera').style.transform = `scale(${z})`;
  const wx = wert(kamera, 'x', t);
  for (let i = 0; i < N; i++) { const b = $('#bue' + i); b.style.transform += ` translateX(${(.16 * (wx + S(i))).toFixed(1)}px)`; }

/* ---------- Figuren (nur Porträts): lächeln, blinzeln, nicken, winken, Blick zur Seite; niemand außer der Erzählerin spricht ---------- */
const FROH = [], BLICK = [], KOPF = [], WINK = [];   // [id, von, bis] · [id, von, bis, dx %] · [id, t0, d] · [id, t0, d]
function portrait(id, wer, gr, attr = '') {
  neu(id, `<div class="figur"><div class="ebene">${kopie('f-' + wer, id)}</div>${tpl('gesicht')}<div class="ebene hand">${kopie('t-hand', id)}</div></div>`,
    `width:${gr}px;height:${gr}px`, attr, 'portrait');
  return id;
}
const froh = (id, t, bis = 999) => FROH.push([id, t, bis]);
const nicken = (id, t, d = 1.1) => KOPF.push([id, t, d]);
const winken = (id, t, d = 1.6) => WINK.push([id, t, d]);
const blick = (id, a, b, dx) => BLICK.push([id, a, b, dx]);
HOOKS.push(t => {
  document.querySelectorAll('.portrait').forEach((p, i) => {
    const f = FROH.some(([id, a, b]) => id === p.id && t >= a && t < b);
    p.querySelector('.froh').style.opacity = f ? 1 : 0;
    p.querySelector('.zu').style.opacity = f ? 0 : 1;
    const z = (t * .29 + i * .37) % 1;
    let dx = 0;
    for (const [id, a, b, w] of BLICK) if (id === p.id) dx += w * clamp((t - a) / .25) * (1 - clamp((t - b) / .3));
    p.querySelector('.augen').style.transform = `translateX(${dx.toFixed(2)}%) scaleY(${z < .035 ? .12 : 1})`;
    let r = 1.4 * Math.max(0, Math.sin(t * 1.4 + i * 2.1)) ** 10, y = r;
    for (const [id, t0, d] of KOPF) {
      const q = (t - t0) / d; if (id !== p.id || q < 0 || q > 1) continue;
      y += 9 * Math.abs(Math.sin(q * Math.PI * 2)) * Math.sin(Math.PI * q);
    }
    p.querySelector('.figur').style.transform = `translate(0px,${y.toFixed(2)}px) rotate(${r.toFixed(2)}deg)`;
    let hy = 60, hr = 0, ho = 0;
    for (const [id, t0, d] of WINK) {
      const q = t - t0; if (id !== p.id || q < 0 || q > d) continue;
      const e = E.sanft(clamp(q / .35)), weg = E.in(clamp((q - d + .3) / .3));
      hy = 60 * (1 - e) + 60 * weg; ho = 1; hr = 16 * Math.sin((q - .2) * 11) * clamp(q / .3) * (1 - weg);
    }
    const h = p.querySelector('.hand');
    h.style.opacity = ho; h.style.transform = `translateY(${hy.toFixed(1)}%) rotate(${hr.toFixed(2)}deg)`;
  });
});
