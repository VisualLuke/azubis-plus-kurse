<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Fachvokabeln: Allgemeine Wörter in der Ausbildung</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=block">
<link rel="stylesheet" href="../../werkzeug/stil.css">
<style>
.auf-brand{/*AUF_BRAND*/}
:root{
  --n200:var(--a2273fd3-5899-46bc-985c-b3c33e3c0780,#E6E3EE);
  --b400:var(--f0297ed8-06f5-4ffd-83fc-e6cd5dbaa2cd,#8163EE);
  --warning:var(--c19df991-9894-4419-88fb-b2b58e36f9f7,#E0992B);
  --warning-text:var(--71f60857-f754-4514-8386-e3f62d71441a,#9C6712);
  --warning-bg:var(--c7c18918-fab3-46fc-af57-2ec14b380cb2,#FCF1DD);
  --error:var(--f694e88e-bdd3-4eb1-bf33-26a20f247ed4,#E2556A);
  --error-bg:var(--fb93d1a9-9399-4624-95d4-83b61d28209b,#FCE7EA);
  --info:var(--3f081c40-af4e-4425-a97f-c7528bc5ad4d,#3B82F6);
  --info-bg:var(--f939ccd9-6c46-4062-bfe6-c36c169ccafb,#E6EFFE);
}
#kamera{position:absolute;inset:0;transform-origin:1320px 540px}
/* Bühnen: Wand mit Sockelleiste, Boden */
.buehne.raum{width:900px;height:720px;border-radius:48px;background:linear-gradient(var(--b50),var(--b100));overflow:hidden}
.buehne.gross{width:1680px;height:880px;border-radius:48px;background:linear-gradient(var(--b50),var(--b100));overflow:hidden}
.buehne .boden{position:absolute;left:0;right:0;top:520px;bottom:0;background:linear-gradient(var(--b200),var(--b100))}
.buehne .boden::before{content:'';position:absolute;left:0;right:0;top:0;height:14px;background:var(--b300);opacity:.55}
.buehne.gross .boden{top:640px}
.buehne .himmel{position:absolute;inset:0;opacity:0}

/* ================= Format „Fachvokabeln“ (übernommen aus Lernvideo 26/29) ================= */
/* Artikel-Farben: der = b500 · die = success · das = warning */
.der{--f:var(--b500);--ft:var(--b600);--fa:var(--surface)}
.die{--f:var(--success);--ft:var(--success-text);--fa:var(--surface)}
.das{--f:var(--warning);--ft:var(--warning-text);--fa:var(--surface)}
.neutral{--f:var(--b300);--ft:var(--b600);--fa:var(--b600)}
.vk{width:640px;height:340px;border-radius:36px;background:var(--surface);box-shadow:0 18px 50px rgba(22,19,37,.10);overflow:hidden;
  padding:44px 46px 38px;display:flex;flex-direction:column}
.vk .band{position:absolute;left:0;right:0;top:0;height:14px;background:var(--f)}
.vk .kopf{display:flex;align-items:center;justify-content:space-between;height:48px;flex:none}
.vk .art{display:inline-block;padding:4px 22px;border-radius:999px;background:var(--f);color:var(--fa);font:800 32px/40px Inter;white-space:nowrap}
.vk .punkte{display:flex;gap:9px;align-items:center}
.vk .punkte i{display:block;width:12px;height:12px;border-radius:99px;background:var(--n200)}
.vk .punkte i.fertig{background:var(--b200)}
.vk .punkte i.jetzt{width:40px;background:var(--f);transform-origin:left center}
.vk .wort{margin-top:22px;font-weight:800;letter-spacing:-.03em;color:var(--ink);white-space:nowrap}
.vk.ohne .wort{margin:auto 0}
.vk .pl{margin-top:auto;display:flex;align-items:baseline;gap:18px;font:600 44px/52px Inter;color:var(--n700);white-space:nowrap}
.vk .pl small{font:700 21px/26px Inter;letter-spacing:.08em;text-transform:uppercase;color:var(--n500)}
.sl{width:640px;min-height:152px;padding:26px 32px 28px 148px;border-radius:32px;background:var(--surface);box-shadow:0 14px 40px rgba(22,19,37,.09);
  font:600 34px/45px Inter;color:var(--ink)}
.sl .sw{display:inline-block;white-space:nowrap}
.sl u{display:inline-block;text-decoration:none;opacity:0;white-space:pre}
.sl .sw.lw u{color:var(--ft);font-weight:800}
.sl .q{color:var(--b300);font-weight:800}
.lg{display:inline-block;padding:6px 24px;border-radius:999px;background:var(--f);color:var(--fa);font:800 34px/44px Inter;margin-right:16px}
.chip{display:flex;align-items:center;justify-content:center;height:58px;border-radius:999px;background:var(--f);color:var(--fa);font:800 28px/34px Inter;white-space:nowrap;
  box-shadow:0 8px 22px rgba(22,19,37,.14)}
.chip b{font-weight:600;opacity:.85;margin-right:9px}

/* Bausteine */
.portrait{border-radius:999px;overflow:hidden;background:linear-gradient(160deg,var(--b200),var(--b300));border:7px solid var(--surface);
  box-shadow:0 6px 20px rgba(22,19,37,.12)}
.portrait .ebene{position:absolute;left:0;top:0;width:100%;height:100%}
.portrait .figur{position:absolute;left:0;top:6%;width:100%;height:100%;transform-origin:50% 100%}
.portrait .augen{transform-origin:50% 45%}
.portrait .auf{transform-origin:50% 54%}
.portrait .zu{transform-origin:50% 56%}
.portrait .helm{opacity:0}
.portrait .hand{transform-origin:80% 92%;opacity:0}
.welle{border-radius:999px;border:5px solid var(--b300);opacity:0}
.plakette{width:72px;height:72px;border-radius:999px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(22,19,37,.18);border:5px solid var(--surface)}
.plakette svg{width:34px}
.plakette.gruen{background:var(--success)} .plakette.rot{background:var(--error)} .plakette.gelb{background:var(--warning)} .plakette.lila{background:var(--b400)}
.etikett{padding:10px 24px;border-radius:999px;background:var(--surface);color:var(--b600);font:700 26px/32px Inter;white-space:nowrap;box-shadow:0 6px 18px rgba(22,19,37,.09)}
.etikett.warm{color:var(--warning-text)}
/* Intro: Kacheln der Collage */
.kachel{width:360px;height:440px;border-radius:40px;background:linear-gradient(var(--surface) 62%,var(--b100) 62%);box-shadow:0 16px 40px rgba(22,19,37,.10);
  border:8px solid var(--surface);overflow:hidden}
.kachel::after{content:'';position:absolute;left:0;right:0;top:62%;height:8px;background:var(--b200)}
.kachel.kueche{background:linear-gradient(var(--warning-bg) 62%,var(--b100) 62%)}
.kachel.pflege{background:linear-gradient(var(--success-bg) 62%,var(--b100) 62%)}
.kachel.werk{background:linear-gradient(var(--b50) 62%,var(--b100) 62%)}
.kachel.bau{background:linear-gradient(var(--info-bg) 62%,var(--b100) 62%)}
.dampf{width:34px;height:34px;border-radius:99px;background:var(--surface);opacity:0}
/* Vertrag */
.dok{width:400px;height:560px;border-radius:22px;background:var(--surface);box-shadow:0 18px 44px rgba(22,19,37,.13);overflow:hidden;padding:0 0 24px}
.dok .dkopf{height:82px;background:var(--b500);color:var(--surface);font:800 30px/82px Inter;text-align:center;letter-spacing:-.01em}
.dok .dz{position:relative;display:flex;align-items:center;gap:18px;height:62px;margin:12px 26px 0;padding:0 18px;border-radius:16px;background:var(--b50)}
.dok .dz b{width:108px;font:700 26px/32px Inter;color:var(--n700)}
.dok .dz i{display:block;height:14px;border-radius:8px;background:var(--n200);flex:1;transform-origin:0 50%}
.dok .dz.hell{background:var(--warning-bg)}
.dok .dz.hell b{color:var(--warning-text)}
.dok .sig{position:absolute;left:26px;right:26px;bottom:50px;display:flex;gap:24px}
.dok .sig > div{flex:1;height:84px;border-bottom:4px solid var(--n300);position:relative}
.dok .sig .sg{position:absolute;left:4px;top:8px;width:150px}
.dok .sig span{position:absolute;left:0;bottom:-34px;font:600 20px/24px Inter;color:var(--n500)}
.dok.leer .dz{background:var(--b50)}
.dok.leer .dkopf{color:transparent}
/* Namensschild */
.namens{display:flex;align-items:center;gap:0;height:78px;border-radius:20px;background:var(--surface);box-shadow:0 10px 26px rgba(22,19,37,.15);overflow:hidden;
  font:800 38px/78px Inter;color:var(--ink);white-space:nowrap;padding-right:28px}
.namens .band{width:22px;height:100%;background:var(--b500);margin-right:22px}
.namens u{text-decoration:none;display:inline-block;color:var(--success-text)}
.linie{width:600px;height:300px}
/* Stufen */
.stufe{width:180px;border-radius:18px 18px 6px 6px;background:linear-gradient(var(--b300),var(--b400));box-shadow:0 12px 30px rgba(22,19,37,.12),inset 0 10px 0 var(--b200);
  color:var(--surface);font:800 72px/1 Inter;display:flex;align-items:flex-start;justify-content:center;padding-top:26px;transform-origin:50% 100%}
.stufe.an{background:var(--warning);box-shadow:0 12px 30px rgba(22,19,37,.12),inset 0 10px 0 var(--warning-bg)}
.marker{width:40px;height:40px;border-radius:99px;background:var(--b600);border:6px solid var(--surface);box-shadow:0 4px 10px rgba(22,19,37,.2)}
/* Kammer: Klemmbrett-Liste, Prüfungsbogen, Einladung */
.liste4{width:92px;display:flex;flex-direction:column;gap:14px}
.liste4 div{display:flex;align-items:center;gap:8px}
.liste4 s{display:block;width:22px;height:22px;border-radius:6px;border:3px solid var(--b300);flex:none;text-decoration:none;position:relative;background:var(--surface)}
.liste4 i{display:block;height:9px;border-radius:5px;background:var(--n200);flex:1}
.liste4 svg{position:absolute;left:-4px;top:-8px;width:30px}
.bogen{width:190px;height:240px;border-radius:18px;background:var(--surface);box-shadow:0 12px 30px rgba(22,19,37,.13);padding:20px 22px}
.bogen .bk{height:34px;border-radius:9px;background:var(--b100);margin-bottom:18px}
.bogen .opt{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.bogen .opt b{width:34px;height:34px;border-radius:9px;border:3px solid var(--b300);font:800 18px/28px Inter;color:var(--b600);text-align:center;flex:none}
.bogen .opt.an b{background:var(--success);border-color:var(--success);color:var(--surface)}
.bogen .opt i{display:block;height:10px;border-radius:5px;background:var(--n200);flex:1}
.einl{width:200px;height:170px;border-radius:14px;background:var(--surface);box-shadow:0 8px 20px rgba(22,19,37,.12);padding:18px 20px}
.einl b{display:block;font:800 25px/30px Inter;color:var(--b600);letter-spacing:-.01em;margin-bottom:14px}
.einl i{display:block;height:10px;border-radius:5px;background:var(--n200);margin-bottom:12px}
/* Kalender */
.kal{width:740px;height:520px;border-radius:30px;background:var(--surface);box-shadow:0 18px 44px rgba(22,19,37,.12);overflow:hidden}
.kal .kk{height:72px;background:var(--b500);display:flex;padding:0 24px;gap:14px}
.kal .kk span{flex:1;color:var(--surface);font:800 26px/72px Inter;text-align:center}
.kal .zell{position:absolute;width:127px;height:90px;border-radius:16px;background:var(--b50)}
.kal .wn{position:absolute;left:0;width:0}
.schulpunkt{position:absolute;width:70px;height:70px}
.block{position:absolute;border-radius:20px;background:linear-gradient(135deg,var(--b400),var(--b600));box-shadow:0 10px 24px rgba(22,19,37,.18);transform-origin:0 50%;
  display:flex;align-items:center;justify-content:center;gap:18px;color:var(--surface);font:800 44px/1 Inter;letter-spacing:-.01em}
.block .ic{width:110px;height:110px;border-radius:99px;background:var(--surface);display:flex;align-items:center;justify-content:center}
.block .ic svg{width:88px}
/* Formular */
.formular{width:230px;height:290px;border-radius:18px;background:var(--surface);box-shadow:0 12px 30px rgba(22,19,37,.13);padding:22px 22px}
.formular .fk{height:30px;border-radius:9px;background:var(--error-bg);margin-bottom:18px}
.formular i{display:block;height:10px;border-radius:5px;background:var(--n200);margin-bottom:14px}
.formular .fs{position:absolute;left:22px;right:22px;bottom:30px;height:70px;border-bottom:4px solid var(--n300)}
.formular .fs svg{position:absolute;left:0;top:6px;width:150px}
.schild{width:72px}
/* Schicht: Wochenleiste */
.woche{display:flex;gap:12px}
.woche div{width:84px;height:92px;border-radius:18px;background:var(--surface);box-shadow:0 8px 20px rgba(22,19,37,.09);display:flex;flex-direction:column;align-items:center;
  font:800 22px/26px Inter;color:var(--b600);padding-top:10px}
.woche svg{width:44px;margin-top:4px}
/* Urkunde */
.urkunde{width:240px;height:170px;border-radius:16px;background:var(--surface);box-shadow:0 12px 30px rgba(22,19,37,.14),inset 0 0 0 6px var(--b200);padding:26px 28px}
.urkunde i{display:block;height:11px;border-radius:6px;background:var(--n200);margin-bottom:14px}
.urkunde i.k{height:16px;width:70%;background:var(--b200);margin-bottom:22px}
.siegel{width:66px;height:66px;border-radius:99px;background:var(--warning);border:5px solid var(--surface);box-shadow:0 4px 10px rgba(22,19,37,.18)}
/* Bildfenster im Schlussdialog */
.fenster{width:600px;height:400px;border-radius:40px;background:linear-gradient(var(--surface) 55%,var(--b50));box-shadow:0 18px 50px rgba(22,19,37,.12)}
/* Abspann */
.deckel{position:absolute;inset:0;background:linear-gradient(135deg,var(--b500),var(--b700));clip-path:circle(0% at 50% 50%)}
.deckel .gross{font:800 100px/110px Inter;letter-spacing:-.03em;text-align:center}
.deckel .klein{font:400 40px/54px Inter;color:var(--b100);margin-top:24px;text-align:center;max-width:1300px}
</style></head><body>

<script src="../../werkzeug/motor.js"></script>
<script>
/* ---------- Aufnahme: Satz- und Wortzeiten aus sprache.json ---------- */
const VERSATZ = 0.7;
window.SPRACHE = { datei: 'sprache.mp3', versatz: VERSATZ };
const A = s => s + VERSATZ;
const W = (m, n) => A(wort(m, satz(n).start - .01));          // Filmzeit des Worts im Satz n (oder danach)
const WE = (m, n) => A(wortEnde(m, satz(n).start - .01));
const SA = n => A(satz(n).start);
const SE = n => A(satz(n).ende);
const ENDE_SPRACHE = SE(SPRACHDATEN.saetze.length);
const WELT = document.getElementById('welt');

const el = id => typeof id === 'string' ? (id.startsWith('#') ? $(id) : document.getElementById(id)) : id;
const _tw = tw; tw = (ids, ...r) => _tw([].concat(ids).map(el), ...r);
const _ak = akteur; akteur = (id, ...r) => _ak(el(id), ...r);
const wertBei = (id, p, t) => wert(AKTEURE.get(el(id)), p, t);
const pop = (id, t, basis, snd = 'pop', e = 'back') => { akteur(id, { ...basis, s: 0 }); tw(id, t, e === 'back' ? .5 : .65, { s: basis.s ?? 1 }, e); if (snd) cue(t, snd); };
const ein = (id, t, basis, von = { y: 70 }, snd = null) => {
  akteur(id, { ...basis, o: 0, x: basis.x + (von.x || 0), y: basis.y + (von.y || 0), r: von.r || 0 });
  tw(id, t, .5, { o: 1 }, 'out'); tw(id, t, .6, { x: basis.x, y: basis.y, r: basis.r || 0 }, 'sanft');
  tw(id, t + .3, .12, { sy: .93, sx: 1.05 }, 'sinus'); tw(id, t + .42, .4, { sy: 1, sx: 1 }, 'sanft');
  if (snd) cue(t, snd);
};
const aus = (ids, t, d = .35) => tw(ids, t, d, { o: 0, s: .85 }, 'in');
const wackeln = (id, t, n = 3, w = 3) => { for (let i = 0; i < n; i++) tw(id, t + i * .1, .1, { r: i % 2 ? w : -w }, 'sinus'); tw(id, t + n * .1, .25, { r: 0 }, 'sinus'); };
const huepfen = (id, t, h = 18) => {
  const y = wertBei(id, 'y', t);
  tw(id, t, .08, { sy: .94, sx: 1.04 }, 'sinus');
  tw(id, t + .08, .36, { y }, 'sinus', { bogen: h }); tw(id, t + .08, .14, { sy: 1.04, sx: .97 }, 'sinus');
  tw(id, t + .44, .08, { sy: .95, sx: 1.04 }, 'sinus'); tw(id, t + .52, .3, { sy: 1, sx: 1 }, 'sanft');
};
const bump = (id, t, s = 1.1) => { const s0 = wertBei(id, 's', t); tw(id, t, .12, { s: s0 * s }, 'sinus'); tw(id, t + .12, .4, { s: s0 }, 'sanft'); };
const flug = (id, t0, d, x, y, h = 120, extra = {}) => tw(id, t0, d, { x, y, ...extra }, 'inout', { bogen: h });
const landen = (id, t) => { tw(id, t, .08, { sy: .86, sx: 1.08 }, 'sinus'); tw(id, t + .08, .45, { sy: 1, sx: 1 }, 'sanft'); };
const lerp = (a, b, p) => a + (b - a) * p;
const tpl = id => document.getElementById(id).innerHTML;

    const auf = spricht ? clamp(pegel * (.55 + .45 * Math.abs(Math.sin(t * 13 + i * 7)))) : 0;
