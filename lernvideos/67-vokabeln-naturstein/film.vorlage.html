<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Fachvokabeln: Naturwerkstein</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=block">
<link rel="stylesheet" href="../../werkzeug/stil.css">
<style>
.auf-brand{/*AUF_BRAND*/}
:root{
  --n200:var(--a2273fd3-5899-46bc-985c-b3c33e3c0780,#E6E3EE);
  --b400:var(--f0297ed8-06f5-4ffd-83fc-e6cd5dbaa2cd,#8163EE);
  --warning:var(--c19df991-9894-4419-88fb-b2b58e36f9f7,#E0992B);
  --warning-text:var(--71f60857-f754-4514-8386-e3f62d71441a,#9C6712);
  --warning-bg:var(--c7c18918-fab3-46fc-af57-2ec14b380cb2,#FCF1DD);
  --error:var(--f694e88e-bdd3-4eb1-bf33-26a20f247ed4,#E2556A);
  --error-bg:var(--fb93d1a9-9399-4624-95d4-83b61d28209b,#FCE7EA);
  --info:var(--3f081c40-af4e-4425-a97f-c7528bc5ad4d,#3B82F6);
  --info-bg:var(--f939ccd9-6c46-4062-bfe6-c36c169ccafb,#E6EFFE);
}
html,body{background:var(--b50)}
#kamera{position:absolute;inset:0;transform-origin:960px 540px}
#cam{display:none}

/* ================= Werkhalle im Querschnitt: Wand mit Hallenfenstern, Stützen, Boden; vorne der Kranträger ================= */
.halle67{width:1920px;height:1080px;overflow:hidden;background:linear-gradient(var(--b50) 0,var(--b100) 87%)}
.halle67 .fen{position:absolute;top:200px;width:250px;height:330px;border-radius:14px 14px 4px 4px;opacity:.75;
  background:linear-gradient(90deg,transparent 0 47%,var(--b200) 47% 53%,transparent 53%),linear-gradient(transparent 0 48%,var(--b200) 48% 52%,transparent 52%),linear-gradient(160deg,var(--surface),var(--b50));
  box-shadow:inset 0 0 0 10px var(--b200)}
.halle67 .stuetze{position:absolute;top:0;bottom:140px;width:64px;background:linear-gradient(90deg,var(--b200),var(--b300) 60%,var(--b200))}
.halle67 .stuetze::after{content:'';position:absolute;left:0;right:0;bottom:0;height:26px;background:var(--b400)}
.halle67 .boden{position:absolute;left:0;right:0;top:940px;bottom:0;background:linear-gradient(var(--n200),var(--n300))}
.halle67 .boden::before{content:'';position:absolute;left:0;right:0;top:0;height:8px;background:var(--b300)}
.halle67 .boden::after{content:'';position:absolute;left:0;right:0;top:44px;height:12px;background:repeating-linear-gradient(-45deg,var(--b300) 0 22px,transparent 22px 44px);opacity:.55}
#traeger{position:absolute;left:-3000px;top:-1400px;height:1520px;width:30000px;pointer-events:none;
  background:linear-gradient(transparent 0 1400px,var(--b600) 1400px 1416px,var(--b500) 1416px 1500px,var(--b700) 1500px 1520px)}
#traeger::before{content:'';position:absolute;left:0;right:0;top:0;height:1400px;background:linear-gradient(var(--b700),var(--b600))}
#traeger::after{content:'';position:absolute;left:0;right:0;top:1430px;height:56px;
  background:radial-gradient(circle,var(--b600) 0 15px,transparent 16px) 0 0/120px 56px}
.seil67{position:absolute;left:0;top:0;width:6px;margin-left:-3px;border-radius:3px;background:repeating-linear-gradient(var(--n300) 0 7px,var(--b600) 7px 9px)}

/* ================= Stein: Körnung, Oberflächen ================= */
.stein{background:
  radial-gradient(circle,color-mix(in srgb,var(--ink) 20%,transparent) 0 1.7px,transparent 2.5px) 0 0/37px 41px,
  radial-gradient(circle,color-mix(in srgb,var(--surface) 90%,transparent) 0 2px,transparent 2.8px) 11px 17px/53px 47px,
  radial-gradient(circle,color-mix(in srgb,var(--b300) 50%,transparent) 0 1.8px,transparent 2.6px) 23px 5px/43px 59px,
  radial-gradient(circle,color-mix(in srgb,var(--ink) 12%,transparent) 0 1.2px,transparent 2px) 7px 29px/19px 23px,
  linear-gradient(var(--n200),var(--n300))}
.matt{background:
  radial-gradient(circle,color-mix(in srgb,var(--ink) 10%,transparent) 0 1px,transparent 1.6px) 0 0/29px 31px,
  radial-gradient(circle,color-mix(in srgb,var(--surface) 70%,transparent) 0 1.2px,transparent 1.8px) 9px 13px/37px 33px,
  linear-gradient(160deg,var(--n200),var(--n300))}
.poliert{background:
  radial-gradient(circle,color-mix(in srgb,var(--surface) 75%,transparent) 0 1.6px,transparent 2.4px) 0 0/37px 41px,
  radial-gradient(circle,color-mix(in srgb,var(--b300) 80%,transparent) 0 1.8px,transparent 2.6px) 23px 5px/43px 59px,
  radial-gradient(circle,color-mix(in srgb,var(--surface) 45%,transparent) 0 1.1px,transparent 1.8px) 7px 29px/19px 23px,
  linear-gradient(150deg,var(--b600),var(--b700) 70%)}
.glanz67{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.glanz67 i{position:absolute;top:-60%;height:220%;width:34%;left:-60%;transform:rotate(24deg);
  background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--surface) 75%,transparent),transparent)}

/* ================= Wortkarte = Steinschild an zwei Ketten ================= */
.der{--f:var(--b500);--ft:var(--b600);--fa:var(--surface)}
.die{--f:var(--success);--ft:var(--success-text);--fa:var(--surface)}
.das{--f:var(--warning);--ft:var(--warning-text);--fa:var(--surface)}
.schild67{width:780px;height:270px;border-radius:22px;padding:42px 50px 0;transform-origin:50% 0;
  box-shadow:0 22px 50px rgba(22,19,37,.16),inset 0 -10px 0 color-mix(in srgb,var(--b300) 45%,transparent),inset 0 4px 0 color-mix(in srgb,var(--surface) 80%,transparent)}
.schild67 .kette{position:absolute;bottom:100%;margin-bottom:-6px;width:12px;height:1100px;border-radius:6px;
  background:repeating-linear-gradient(var(--n300) 0 18px,var(--b600) 18px 22px,var(--n200) 22px 40px,var(--b600) 40px 44px)}
.schild67 .kette.l{left:114px} .schild67 .kette.r{right:114px}
.schild67 .oese{position:absolute;top:10px;width:30px;height:30px;border-radius:99px;background:var(--b600);box-shadow:inset 0 0 0 7px var(--b400)}
.schild67 .oese.l{left:105px} .schild67 .oese.r{right:105px}
.schild67 .z1{display:flex;align-items:center;gap:20px;height:120px;margin-top:18px;white-space:nowrap}
.schild67.ohne .z1{height:186px;margin-top:0}
.dot67{display:inline-block;width:44px;height:44px;border-radius:99px;background:var(--f);flex:none;box-shadow:0 0 0 7px color-mix(in srgb,var(--f) 25%,transparent)}
.dot67.klein{width:26px;height:26px;box-shadow:0 0 0 5px color-mix(in srgb,var(--f) 25%,transparent)}
.art67{display:inline-block;font:800 56px/64px Inter;color:var(--ft);letter-spacing:-.01em}
.wort67{display:inline-block;font-weight:800;letter-spacing:-.03em;color:var(--n700);
  text-shadow:0 3px 0 color-mix(in srgb,var(--surface) 85%,transparent),0 -2px 0 rgba(22,19,37,.22)}
.schild67 .pl67{display:flex;align-items:center;gap:16px;margin-top:6px;font:700 44px/52px Inter;color:var(--n700);white-space:nowrap;
  text-shadow:0 2px 0 color-mix(in srgb,var(--surface) 85%,transparent)}
.schild67 .pl67 .art67{font-size:44px;line-height:52px}
.schild67 .pl67 small{font:700 20px/26px Inter;letter-spacing:.1em;text-transform:uppercase;color:var(--n500);margin-right:4px}

/* ================= Beispielsatz = gravierte Steintafel auf einem Bock ================= */
.tafel67{width:800px;min-height:150px;padding:26px 30px 28px 150px;border-radius:20px;
  font:600 34px/45px Inter;color:var(--ink);border-left:12px solid var(--f);
  box-shadow:0 16px 40px rgba(22,19,37,.12),inset 0 -6px 0 color-mix(in srgb,var(--b300) 40%,transparent)}
.tafel67::before,.tafel67::after{content:'';position:absolute;top:100%;height:80px;width:16px;border-radius:0 0 6px 6px;
  background:linear-gradient(90deg,var(--b500),var(--b700))}
.tafel67::before{left:120px;transform:skewX(8deg)} .tafel67::after{right:120px;transform:skewX(-8deg)}
.tafel67 .sw{display:inline-block;white-space:nowrap}
.tafel67 u{display:inline-block;text-decoration:none;opacity:0;white-space:pre;text-shadow:0 2px 0 color-mix(in srgb,var(--surface) 80%,transparent)}
.tafel67 .sw.lw u{color:var(--ft);font-weight:800}
.tafel67 .q{color:var(--b400);font-weight:800}
.tafel67 .portrait{position:absolute;left:24px;top:24px}

/* ================= Bausteine ================= */
.portrait{border-radius:999px;overflow:hidden;background:linear-gradient(160deg,var(--b200),var(--b300));border:7px solid var(--surface);
  box-shadow:0 6px 20px rgba(22,19,37,.12)}
.portrait .ebene{position:absolute;left:0;top:0;width:100%;height:100%}
.portrait .figur{position:absolute;left:0;top:6%;width:100%;height:100%;transform-origin:50% 100%}
.portrait .augen{transform-origin:50% 45%}
.portrait .auf{transform-origin:50% 54%}
.portrait .zu{transform-origin:50% 56%}
.portrait .maske{transform-origin:50% 55%}
.portrait.spiegel{border:0;background:none;box-shadow:none}
.welle{border-radius:999px;border:5px solid var(--b300);opacity:0}
.plakette{width:72px;height:72px;border-radius:999px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(22,19,37,.18);border:5px solid var(--surface);
  font:800 34px/1 Inter;color:var(--surface)}
.plakette svg{width:34px}
.plakette.gruen{background:var(--success)} .plakette.rot{background:var(--error)} .plakette.gelb{background:var(--warning)} .plakette.lila{background:var(--b400)}
.etikett{padding:10px 24px;border-radius:999px;background:var(--surface);color:var(--b600);font:700 28px/34px Inter;white-space:nowrap;box-shadow:0 6px 18px rgba(22,19,37,.09)}
.etikett.gross{padding:12px 30px;font-size:38px;line-height:46px;color:var(--ink)}
.etikett.rot{background:var(--error-bg);color:var(--error)}
.etikett.gruen{background:var(--success-bg);color:var(--success-text)}
.lg{display:inline-flex;align-items:center;gap:14px;padding:10px 32px 10px 18px;border-radius:999px;background:var(--surface);color:var(--ft);font:800 46px/56px Inter;margin:0 12px;
  box-shadow:0 6px 18px rgba(22,19,37,.10)}
.lg .dot67{width:36px;height:36px}
.chip{display:flex;align-items:center;justify-content:center;gap:12px;height:70px;border-radius:999px;background:var(--surface);color:var(--ink);font:800 34px/40px Inter;white-space:nowrap;
  box-shadow:0 8px 22px rgba(22,19,37,.14),inset 0 0 0 4px var(--f)}
.chip b{font-weight:800;color:var(--ft)}
.chip .dot67{width:24px;height:24px;box-shadow:none}
.deko{position:absolute;left:0;top:0;will-change:transform}
.grp{position:absolute}
.grp > *{position:absolute}
/* Staub, Wasser */
.wolke{border-radius:999px;background:radial-gradient(circle,color-mix(in srgb,var(--n300) 95%,transparent) 0 35%,color-mix(in srgb,var(--n300) 0%,transparent) 70%)}
.tropfen{width:16px;height:22px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:var(--info)}
.strahl67{width:8px;border-radius:4px;background:repeating-linear-gradient(var(--info) 0 18px,color-mix(in srgb,var(--info) 35%,transparent) 18px 30px)}
.brocken{width:46px;height:38px;clip-path:polygon(10% 20%,55% 0,100% 30%,88% 90%,30% 100%,0 70%)}
/* Lampe (Szene 1) */
.lampe67{width:150px;height:110px}
.lampe67::before{content:'';position:absolute;left:72px;top:-200px;width:6px;height:210px;background:var(--b700)}
.lampe67 .schirm{position:absolute;left:0;top:10px;width:150px;height:70px;border-radius:75px 75px 8px 8px;background:linear-gradient(var(--b500),var(--b700))}
.lampe67 .birne{position:absolute;left:45px;top:70px;width:60px;height:28px;border-radius:0 0 30px 30px;background:var(--n300)}
.lampe67.an .birne{background:var(--surface);box-shadow:0 0 40px 18px color-mix(in srgb,var(--surface) 85%,transparent)}
.kegel67{width:760px;height:820px;clip-path:polygon(41% 0,59% 0,100% 100%,0 100%);
  background:linear-gradient(color-mix(in srgb,var(--surface) 80%,transparent),color-mix(in srgb,var(--surface) 0%,transparent))}
/* Hallentor (Anfang) */
.tor67{position:absolute;top:0;width:960px;height:1080px;z-index:5;
  background:repeating-linear-gradient(90deg,transparent 0 150px,color-mix(in srgb,var(--b700) 40%,transparent) 150px 158px),repeating-linear-gradient(var(--b500) 0 84px,var(--b600) 84px 92px)}
.tor67 .fenster{position:absolute;top:360px;height:120px;width:520px;border-radius:12px;background:linear-gradient(160deg,var(--b200),var(--b300));box-shadow:inset 0 0 0 8px var(--b700)}
#torL{left:0} #torR{left:960px}
#torL .fenster{right:120px} #torR .fenster{left:120px}
#torL::after,#torR::after{content:'';position:absolute;top:500px;width:24px;height:140px;border-radius:12px;background:var(--b200)}
#torL::after{right:40px} #torR::after{left:40px}
#dunkel{position:absolute;inset:0;background:var(--ink);z-index:4;pointer-events:none}
#staubwisch{position:absolute;inset:0;z-index:4;pointer-events:none}
#staubwisch i{position:absolute;border-radius:999px;background:radial-gradient(circle,var(--n300) 0 45%,color-mix(in srgb,var(--n300) 0%,transparent) 70%)}
#blitz{position:absolute;inset:0;background:var(--surface);z-index:4;opacity:0;pointer-events:none}
/* Abspann: polierte Steinplatte senkt sich an zwei Ketten */
#abspann{position:absolute;left:60px;right:60px;top:60px;bottom:60px;border-radius:40px;z-index:6;overflow:visible;
  box-shadow:0 30px 80px rgba(22,19,37,.35)}
#abspann .kette{position:absolute;bottom:100%;width:16px;height:1200px;border-radius:8px;
  background:repeating-linear-gradient(var(--n300) 0 22px,var(--b700) 22px 27px,var(--n200) 27px 49px,var(--b700) 49px 54px)}
#abspann .kette.l{left:300px} #abspann .kette.r{right:300px}
#abspann .glanz67{border-radius:40px}
#abspann .gross{font:800 108px/118px Inter;letter-spacing:-.03em;text-align:center;color:var(--surface)}
#abspann .klein{font:400 42px/56px Inter;color:var(--b100);margin-top:24px;text-align:center;max-width:1300px}
#abspannGrund{position:absolute;inset:0;background:var(--b700);z-index:5;opacity:0}

/* ================= Stationen ================= */
/* Kran: Anschlagkette, Gefahrenzone, Fußabdruck */
.zone67{border-radius:999px;border:6px dashed var(--error);background:repeating-linear-gradient(-45deg,color-mix(in srgb,var(--error) 26%,transparent) 0 16px,color-mix(in srgb,var(--error) 8%,transparent) 16px 32px)}
/* Säge: Tisch, Säule, Bock für Platten, Haube über dem Blatt */
.tisch67{border-radius:8px 8px 0 0;background:linear-gradient(var(--b500),var(--b700))}
.tisch67::before{content:'';position:absolute;left:0;right:0;top:0;height:10px;border-radius:8px 8px 0 0;background:var(--b300)}
.tisch67 i{position:absolute;top:100%;width:26px;height:var(--bein,60px);background:linear-gradient(90deg,var(--b600),var(--b700))}
.saeule67{border-radius:10px 10px 0 0;background:linear-gradient(90deg,var(--b500),var(--b700))}
.saeule67::after{content:'';position:absolute;left:14px;right:14px;top:30px;bottom:30px;border-radius:6px;background:repeating-linear-gradient(transparent 0 26px,color-mix(in srgb,var(--b300) 60%,transparent) 26px 32px)}
.saege67 .arm{position:absolute;left:50%;top:50%;margin-top:-20px;height:40px;border-radius:10px;background:linear-gradient(var(--b500),var(--b700))}
.saege67 .blatt{position:absolute;inset:0}
.saege67 .haube{position:absolute;inset:-7%;border-radius:50%;border:30px solid var(--b600);border-right-color:transparent;border-bottom-color:transparent;transform:rotate(45deg)}
.saege67 .strahl67{position:absolute;top:44%;height:46%}
.saege67 .glut{position:absolute;inset:-6%;border-radius:999px;background:radial-gradient(circle,transparent 52%,color-mix(in srgb,var(--warning) 70%,transparent) 62%,transparent 72%);opacity:0}
.bock67{width:150px;height:300px}
.bock67 i{position:absolute;bottom:0;width:18px;height:300px;border-radius:8px;background:linear-gradient(90deg,var(--b500),var(--b700));transform-origin:50% 100%}
.bock67 b{position:absolute;left:-10px;right:-10px;bottom:0;height:20px;border-radius:6px;background:var(--b700)}
.scheibe67{border-radius:4px;box-shadow:inset -6px 0 0 color-mix(in srgb,var(--b300) 55%,transparent),inset 0 6px 0 color-mix(in srgb,var(--surface) 70%,transparent)}
.lupe67{border-radius:999px;border:10px solid var(--b500);box-shadow:0 12px 30px rgba(22,19,37,.18);overflow:hidden;background:var(--surface)}
.lupe67::after{content:'';position:absolute;inset:0;border-radius:999px;background:linear-gradient(140deg,color-mix(in srgb,var(--surface) 55%,transparent),transparent 40%)}
.griff67{width:30px;height:120px;border-radius:15px;background:linear-gradient(90deg,var(--b500),var(--b700));transform-origin:50% 0}
/* Rohplatte: raue Kanten */
.platte67{clip-path:polygon(0 2%,8% 0,22% 1.5%,40% 0,58% 1%,76% 0,92% 1.5%,100% 0,99% 22%,100% 48%,99% 74%,100% 100%,82% 98.5%,60% 100%,38% 98.8%,18% 100%,0 98.5%,1% 70%,0 44%,1% 20%)}
.schnitt67{border:6px dashed var(--b600);border-radius:4px}
.verschnitt{box-shadow:inset 0 0 0 52px color-mix(in srgb,var(--ink) 22%,transparent)}
/* Maß: Werktisch, liegende Platte, Zollstock, Fenster */
.liegend .oben{position:absolute;left:0;top:0;width:560px;height:110px;transform:skewX(-20deg);transform-origin:0 100%;border-radius:6px 6px 0 0}
.liegend .vorne{position:absolute;left:0;top:110px;width:560px;height:34px;border-radius:0 0 6px 6px;background:linear-gradient(var(--n300),var(--b300))}
.zs67{position:absolute;left:0;top:0;width:112px;height:28px;border-radius:4px;transform-origin:0 50%;
  background:repeating-linear-gradient(90deg,var(--b600) 0 2px,transparent 2px 11px) 0 0/100% 9px no-repeat,var(--b100);box-shadow:inset 0 -3px 0 var(--b300),inset 0 0 0 2px var(--b300)}
.zs67 > .zs67{left:108px}
.zs67::after{content:'';position:absolute;right:-4px;top:9px;width:10px;height:10px;border-radius:99px;background:var(--b700)}
/* Kante: Nahaufnahme */
.kband{position:absolute;left:0;right:0;top:0;height:44px}
.kband.zack{background:linear-gradient(var(--n300),var(--b300));clip-path:polygon(0 100%,0 40%,3% 0,6% 55%,9% 10%,12% 60%,15% 5%,18% 50%,21% 0,24% 58%,27% 8%,30% 52%,33% 2%,36% 60%,39% 10%,42% 55%,45% 0,48% 58%,51% 6%,54% 50%,57% 0,60% 56%,63% 8%,66% 52%,69% 0,72% 60%,75% 6%,78% 54%,81% 0,84% 58%,87% 8%,90% 52%,93% 2%,96% 56%,100% 10%,100% 100%)}
.kband.glatt{border-radius:30px 30px 0 0;background:linear-gradient(var(--surface),var(--n200) 60%,var(--n300))}
.kseite{position:absolute;top:44px;bottom:0;width:30px;left:100%}
.kseite.zack{background:linear-gradient(90deg,var(--n300),var(--b300));clip-path:polygon(0 0,100% 4%,40% 9%,95% 15%,35% 21%,100% 27%,45% 33%,95% 39%,35% 45%,100% 51%,40% 57%,95% 63%,35% 69%,100% 75%,45% 81%,95% 87%,35% 93%,100% 99%,0 100%)}
.kseite.glatt{border-radius:0 30px 30px 0;background:linear-gradient(90deg,var(--n200),var(--surface) 40%,var(--n300))}
.rot67{position:absolute;inset:0;background:var(--error);opacity:0}
.fuss67 .fp{fill:var(--error)} .fuss67.gut .fp{fill:var(--success)}
/* Oberfläche: Musterbrett und Fliesen */
.brett67{border-radius:26px;background:linear-gradient(var(--b100),var(--b200));box-shadow:inset 0 0 0 10px var(--b200)}
.fliese67{border-radius:14px;overflow:hidden;box-shadow:0 12px 26px rgba(22,19,37,.16)}
.fliese67 > .lage{position:absolute;inset:0}
.pad67{border-radius:999px;background:radial-gradient(circle,var(--b200) 0 30%,var(--b300) 32% 58%,var(--b100) 60%);box-shadow:0 8px 18px rgba(22,19,37,.18),inset 0 0 0 8px var(--b400)}
.pad67.ohnearm::after{display:none}
.pad67::after{content:'';position:absolute;left:50%;bottom:50%;width:24px;height:900px;margin-left:-12px;background:linear-gradient(90deg,var(--b500),var(--b700));z-index:-1}
/* Staub: Schlauch der Absaugung */
.schlauch67{width:56px;border-radius:0 0 18px 18px;background:repeating-linear-gradient(var(--b500) 0 14px,var(--b600) 14px 20px)}
.schlauch67::after{content:'';position:absolute;left:-14px;right:-14px;bottom:-26px;height:34px;border-radius:6px 6px 20px 20px;background:var(--b700)}
.arm67{position:absolute;left:50%;bottom:50%;width:30px;height:1000px;margin-left:-15px;background:linear-gradient(90deg,var(--b500),var(--b700));z-index:-1}
/* Gehörschutz: Schallbögen, Gebotszeichen */
.bogen67{border-radius:999px;border:10px solid transparent;border-right-color:var(--error)}
.bogen67.gut{border-right-color:var(--success)}
.gebot67{width:130px;height:130px;border-radius:999px;background:var(--info);border:8px solid var(--surface);box-shadow:0 6px 16px rgba(22,19,37,.18)}

<script src="../../werkzeug/motor.js"></script>
<script>
/* ---------- Aufnahme: Satz- und Wortzeiten aus sprache.json ---------- */
const VERSATZ = 1.3;
window.SPRACHE = { datei: 'sprache.mp3', versatz: VERSATZ };
const A = s => s + VERSATZ;
const W = (m, n) => A(wort(m, satz(n).start - .01));
const WE = (m, n) => A(wortEnde(m, satz(n).start - .01));
const SA = n => A(satz(n).start);
const SE = n => A(satz(n).ende);
const ENDE_SPRACHE = SE(SPRACHDATEN.saetze.length);
const WELT = document.getElementById('welt');

const el = id => typeof id === 'string' ? (id.startsWith('#') ? $(id) : document.getElementById(id)) : id;
const _tw = tw; tw = (ids, ...r) => _tw([].concat(ids).map(el), ...r);
const _ak = akteur; akteur = (id, ...r) => _ak(el(id), ...r);
const wertBei = (id, p, t) => wert(AKTEURE.get(el(id)), p, t);
const pop = (id, t, basis, snd = 'pop', e = 'back') => { akteur(id, { ...basis, s: 0 }); tw(id, t, e === 'back' ? .5 : .65, { s: basis.s ?? 1 }, e); if (snd) cue(t, snd); };
const ein = (id, t, basis, von = { y: 70 }, snd = null) => {
  akteur(id, { ...basis, o: 0, x: basis.x + (von.x || 0), y: basis.y + (von.y || 0), r: von.r || 0 });
  tw(id, t, .5, { o: basis.o ?? 1 }, 'out'); tw(id, t, .6, { x: basis.x, y: basis.y, r: basis.r || 0 }, 'sanft');
  tw(id, t + .3, .12, { sy: .93, sx: 1.05 }, 'sinus'); tw(id, t + .42, .4, { sy: 1, sx: 1 }, 'sanft');
  if (snd) cue(t, snd);
};
const aus = (ids, t, d = .35) => tw(ids, t, d, { o: 0, s: .85 }, 'in');
const wackeln = (id, t, n = 3, w = 3) => { for (let i = 0; i < n; i++) tw(id, t + i * .1, .1, { r: i % 2 ? w : -w }, 'sinus'); tw(id, t + n * .1, .25, { r: 0 }, 'sinus'); };
const huepfen = (id, t, h = 18) => {
  const y = wertBei(id, 'y', t);
  tw(id, t, .08, { sy: .94, sx: 1.04 }, 'sinus');
  tw(id, t + .08, .36, { y }, 'sinus', { bogen: h }); tw(id, t + .08, .14, { sy: 1.04, sx: .97 }, 'sinus');
  tw(id, t + .44, .08, { sy: .95, sx: 1.04 }, 'sinus'); tw(id, t + .52, .3, { sy: 1, sx: 1 }, 'sanft');
};
const bump = (id, t, s = 1.1) => { const s0 = wertBei(id, 's', t); tw(id, t, .12, { s: s0 * s }, 'sinus'); tw(id, t + .12, .4, { s: s0 }, 'sanft'); };
const flug = (id, t0, d, x, y, h = 120, extra = {}) => tw(id, t0, d, { x, y, ...extra }, 'sinus', { bogen: h });
const federn = (id, t) => { tw(id, t, .12, { sy: .96, sx: 1.025 }, 'sinus'); tw(id, t + .12, .4, { sy: 1, sx: 1 }, 'sanft'); };
const landen = (id, t, k = 1) => { tw(id, t, .08, { sy: 1 - .14 * k, sx: 1 + .08 * k }, 'sinus'); tw(id, t + .08, .45, { sy: 1, sx: 1 }, 'sanft'); };
const tpl = id => document.getElementById(id).innerHTML;
const kopie = (id, p) => tpl(id).replace(/id="([^"]+)"/g, `id="$1_${p}"`).replace(/url\(#([^)]+)\)/g, `url(#$1_${p})`);
// Klasse „deko“: reine Kulisse, die über den Bühnenrand hinausreicht (Lichtkegel, Rohr hinter dem Kranträger) – nicht in pruefen.mjs
const neu = (id, inhalt, stil = '', attr = '', klasse = '', ziel = WELT) => { const k = /\bdeko\b/.test(klasse) ? klasse : 'a ' + klasse; el(ziel).insertAdjacentHTML('beforeend', `<div class="${k}" id="${id}" style="${stil}" ${attr}>${inhalt}</div>`); return id; };
let WN = 0;
const wellen = (t, x, y, farbe = null, gr = 160, s = 1) => {
  const id = 'wl' + WN++; neu(id, '', `width:${gr}px;height:${gr}px${farbe ? ';border-color:' + farbe : ''}${s !== 1 ? ';border-width:' + (5 * s) + 'px' : ''}`, 'data-frei', 'welle');
  akteur(id, { x, y, o: 0, s: .8 }); set(id, t, { o: .9, s: .8 }); tw(id, t, .9, { o: 0, s: 1.6 }, 'weich');
};
const plakette = (id, farbe, svg, attr = 'data-frei') => neu(id, svg ? tpl(svg) : '', '', attr, 'plakette ' + farbe);
const pendel = (id, t, a = 12, n = 5, d = .34) => { for (let k = 0; k < n; k++) tw(id, t + k * d, d, { r: (k % 2 ? -1 : 1) * a * Math.pow(.55, k) }, 'sinus'); tw(id, t + n * d, d, { r: 0 }, 'sinus'); };
const summen = (id, t, d = .8, a = 4) => HOOKS.push(z => { const p = z - t; if (p > 0 && p < d) el(id).style.transform += ` translateX(${(a * Math.sin(p * 70) * (1 - p / d)).toFixed(2)}px)`; });
const bild = (id, t, breite, attr = '', stil = '', ziel = WELT) => neu(id, kopie(t, id), `width:${breite}px;${stil}`, attr, '', ziel);
const haken = (id, t, x, y, attr = 'data-frei', snd = 'ding') => { plakette(id, 'gruen', 'svgHaken', attr); pop(id, t, { x, y }, snd); return id; };
// Drehen ohne Ende (Sägeblatt, Schleifscheibe): Umdrehungen je Sekunde, ab t0 bis t1 (an- und auslaufend)
function drehen(id, t0, t1, uprs = 1.6, an = .5) {
  const a = AKTEURE.get(el(id));
  HOOKS.push(t => {
    // Winkel = Integral der Drehzahl (an- und auslaufen linear) – stetig, ohne Sprünge
    const v = (z) => { if (z <= t0) return 0; const e = Math.min(z, t1); let w = 0;
      const ra = Math.min(e, t0 + an); w += uprs * ((ra - t0) ** 2) / (2 * an);
      if (e > t0 + an) w += uprs * (e - t0 - an);
      if (z > t1) { const q = Math.min(z - t1, an); w += uprs * (q - q * q / (2 * an)); }
      return w; };
    a.extraR = (a.extraR || 0);
    el(id).style.transform += ` rotate(${(v(t) * 360 % 360).toFixed(2)}deg)`;
  });
}
function tippen(id, text, t0, d, klang = true) {
  const e = el(id), zeichen = [...text];
  e.innerHTML = zeichen.map(c => `<u style="display:inline-block;white-space:pre;text-decoration:none">${c}</u>`).join('');
  const us = [...e.querySelectorAll('u')], z = us.map((u, k) => t0 + d * k / Math.max(1, us.length));
  HOOKS.push(t => us.forEach((u, k) => { const p = clamp((t - z[k]) / .08); u.style.opacity = p; u.style.transform = p < 1 ? `translateY(${(6 * (1 - p)).toFixed(1)}px)` : ''; }));
  if (klang) z.filter((_, k) => k % 2 === 0 && zeichen[k] !== ' ').forEach(tz => cue(tz, 'tipp'));
  return z;
}

/* ---------- Welt: eine Werkhalle, die Stationen liegen nebeneinander. Die Kamera fährt mit der Laufkatze die Kranbahn entlang ---------- */
const FW = 1920, FH = 1080, GY = 940, NB = 11;
const XS = i => (i - 1) * FW;
for (let i = 1; i <= NB; i++) {
  WELT.insertAdjacentHTML('beforeend', `<div class="a buehne halle67" id="bue${i}">
    ${[270, 835, 1400].map(x => `<div class="fen" style="left:${x}px"></div>`).join('')}
    <div class="stuetze" style="left:-32px"></div><div class="stuetze" style="right:-32px"></div>
    <div class="boden"></div></div>`);
  akteur('bue' + i, { x: XS(i) + FW / 2, y: FH / 2 });
}

/* ---------- Kamera: Mitte (x, y) und Zoom (log) als Akteur; Fahrten mit Unschärfe, Zoom-Atmer, Akzente, Rütteln ---------- */
akteur('cam', { x: XS(1) + 960, y: 540, r: 0 }, true);
const FAHRTEN = [], AKZENTE = [], RUETTELN = [];
const akzent = (t, z = .035) => AKZENTE.push([t, z]);
const ruetteln = (t, a = 8, d = .45) => RUETTELN.push([t, a, d]);
function fahrt(t, x, y, z, d = 1, atmen = true, e = 'inout') { tw('cam', t, d, { x, y, r: Math.log(z) }, e); FAHRTEN.push([t, d, atmen]); cue(t, 'whoosh'); }
document.body.insertAdjacentHTML('beforeend', '<svg width="0" height="0" style="position:absolute"><filter id="wischer" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur id="wischerBlur" stdDeviation="0 0"/></filter></svg>');
const camAk = AKTEURE.get(el('cam'));
const camBei = t => ({ x: wert(camAk, 'x', t), y: wert(camAk, 'y', t), z: Math.exp(wert(camAk, 'r', t)) });
HOOKS.push(t => {
  const c = camBei(t), v = camBei(t - 1 / 30);
  let z = c.z, dx = 0, dy = 0;
  for (const [t0, d, atmen] of FAHRTEN) if (atmen) z *= 1 - .06 * Math.sin(Math.PI * clamp((t - t0) / d));
  for (const [a, h] of AKZENTE) { const d = (t - a) / 1.1; if (d > 0 && d < 1) z *= 1 + h * Math.sin(Math.PI * E.weich(d)); }
  for (const [a, amp, d] of RUETTELN) { const q = (t - a) / d; if (q > 0 && q < 1) { const k = amp * (1 - q) ** 2; dx += k * Math.sin(q * 61); dy += k * Math.cos(q * 47); } }
  const letzte = Math.max(0, ...FAHRTEN.filter(f => f[0] + f[1] <= t).map(f => f[0] + f[1]));
  z *= 1 + .025 * E.inout(clamp((t - letzte) / 11));
  WELT.style.transform = `translate(${(960 - c.x + dx).toFixed(2)}px,${(540 - c.y + dy).toFixed(2)}px)`;
  $('#kamera').style.transform = `scale(${z.toFixed(5)})`;
  const zoomt = Math.abs(Math.log(c.z) - Math.log(v.z)) > .002;
  const bx = zoomt ? 0 : Math.min(18, Math.abs(c.x - v.x) * c.z * .09), by = zoomt ? 0 : Math.min(18, Math.abs(c.y - v.y) * c.z * .09);
  $('#wischerBlur').setAttribute('stdDeviation', `${(bx / c.z).toFixed(2)} ${(by / c.z).toFixed(2)}`);
  WELT.style.filter = bx + by > .3 ? 'url(#wischer)' : '';
});

/* ---------- Figuren: Mund nur in den eigenen Sätzen, Nicken, froh; Maske und Gehörschutz als Ebenen ---------- */
const SAETZE = SPRACHDATEN.saetze.map(s => ({ a: A(s.start), b: A(s.ende), w: s.sprecher }));
const FROH = [], KOPF = [], MASKE = {}, GEHOER = {};
function portrait(id, wer, gr, attr = '', ziel = null, klasse = '') {
  const extra = wer === 'Kwame' ? `<div class="ebene gehoer">${kopie('t-gehoer', id)}</div><div class="ebene maske">${kopie('t-maske', id)}</div>` : '';
  const html = `<div class="a portrait ${klasse}" id="${id}" style="width:${gr}px;height:${gr}px" ${attr}><div class="figur"><div class="ebene">${kopie('f-' + wer, id)}</div>${tpl('gesicht')}${extra}</div></div>`;
  (ziel ? el(ziel) : WELT).insertAdjacentHTML('beforeend', html);
  el(id).dataset.sprecher = wer;
  return id;
}
// an/aus-Zustand einer Ebene: Liste [t_an, t_aus]
const zustand = (liste, t, dd = .5) => { let q = 0; for (const [a, b, d = dd] of liste || []) { if (t >= a) q = E.sanft(clamp((t - a) / d)); if (t >= b) q = 1 - E.inout(clamp((t - b) / dd)); } return q; };
HOOKS.push(t => {
  const pegel = window.PEGEL ? (window.PEGEL[Math.round((t - VERSATZ) * 30)] || 0) : .7 + .3 * Math.sin(t * 9);
  const alle = [...document.querySelectorAll('.portrait')];
  alle.forEach((p, i) => {
    const quelle = p.dataset.spiegel ? el(p.dataset.spiegel) : p, iq = alle.indexOf(quelle);
    const spricht = SAETZE.some(s => s.w === p.dataset.sprecher && t >= s.a && t <= s.b);
    const auf = spricht ? clamp(pegel * (.55 + .45 * Math.abs(Math.sin(t * 13 + iq * 7)))) : 0;
    const froh = !spricht && FROH.some(([id, a, b]) => id === quelle.id && t >= a && t < b);
    p.querySelector('.auf').style.transform = `scaleY(${Math.max(.05, auf)})`;
    p.querySelector('.auf').style.opacity = auf > .12 ? 1 : 0;
    p.querySelector('.froh').style.opacity = froh && auf <= .12 ? 1 : 0;
    p.querySelector('.zu').style.opacity = auf > .12 || (froh && auf <= .12) ? 0 : 1;
    const z = (t * .29 + iq * .37) % 1;
    p.querySelector('.augen').style.transform = `scaleY(${z < .035 ? .12 : 1})`;
    let r = spricht ? 1.6 * Math.sin(t * 3.1) * pegel : 1.4 * Math.max(0, Math.sin(t * 1.4 + iq * 2.1)) ** 10, y = r;
    for (const [id, t0, d] of KOPF) {
      const q = (t - t0) / d; if (id !== quelle.id || q < 0 || q > 1) continue;
      y += 9 * Math.abs(Math.sin(q * Math.PI * 2)) * Math.sin(Math.PI * q);
    }
    p.querySelector('.figur').style.transform = `translate(0px,${y.toFixed(2)}px) rotate(${r.toFixed(2)}deg)`;
    if (!p.classList.contains('spiegel')) p.style.borderColor = spricht ? 'var(--b300)' : '';
    const m = p.querySelector('.maske'), g = p.querySelector('.gehoer');
    if (m) { const q = zustand(MASKE[quelle.id], t); m.style.opacity = q > .01 ? 1 : 0; m.style.transform = `translateY(${(45 * (1 - q)).toFixed(1)}%) scale(${(1 + .05 * auf).toFixed(3)},${(1 + .08 * auf).toFixed(3)})`; }
    if (g) { const q = zustand(GEHOER[quelle.id], t); g.style.opacity = q > .01 ? 1 : 0; g.style.transform = `translateY(${(-60 * (1 - q)).toFixed(1)}%)`; }
  });
});
const nicken = (id, t, d = 1.1) => KOPF.push([id, t, d]);

/* ---------- Kranträger (vorne) mit Laufkatze und Haken; das Seil wird je Frame gezeichnet ---------- */
const KATZE_B = 200, KATZE_Y = 162, KATZE_U = KATZE_Y + (116 - 80) * KATZE_B / 160;     // Unterkante der Katze
const HAKEN_B = 120, HAKEN_OBEN = -55;                                               // Hakenoberkante relativ zur Mitte
const PARK = 1050;                                                                    // Ruheplatz der Laufkatze je Station
bild('katze', 't-katze', KATZE_B, 'data-frei data-dreht'); akteur('katze', { x: XS(1) + 1300, y: KATZE_Y });
WELT.insertAdjacentHTML('beforeend', '<div class="seil67" id="seil"></div>');
bild('haken', 't-haken', HAKEN_B, 'data-frei data-dreht', 'transform-origin:50% 5%'); akteur('haken', { x: XS(1) + 1300, y: KATZE_U + 18 - HAKEN_OBEN });
HOOKS.push(t => {
  const x = wertBei('katze', 'x', t), hy = wertBei('haken', 'y', t) + HAKEN_OBEN + 4, s = el('seil').style;
  s.left = x.toFixed(1) + 'px'; s.top = (KATZE_U - 6) + 'px'; s.height = Math.max(0, hy - KATZE_U + 6).toFixed(1) + 'px';
});
const HAKEN_RUHE = KATZE_U + 18 - HAKEN_OBEN;
// Fahrt der Laufkatze (Haken fährt mit, pendelt beim Anfahren und Bremsen)
function katzeFahren(t, x, d = 1, mit = [], e = 'inout') {
  const dx = x - wertBei('katze', 'x', t);
  tw(['katze', 'haken'], t, d, { x }, e);
  for (const m of mit) tw(m, t, d, { x: wertBei(m, 'x', t) + dx }, e);
  pendel('haken', t, 7 * Math.sign(dx), 2, .3); pendel('haken', t + d - .05, -9 * Math.sign(dx), 4, .32);
}
// Weiterfahrt zur nächsten Station: Kamera und Laufkatze gemeinsam
function weiter(t, i, d = 1.3, mit = [], park = PARK) {
  fahrt(t, XS(i) + 960, 540, 1, d);
  katzeFahren(t - .08, XS(i) + park, d + .08, mit);
}

/* ---------- Steinschild (Wortkarte) und Steintafel (Beispielsatz) ---------- */
const GENUS = ['der', 'die', 'das'];
const SCH_X = 560, SCH_Y = 352;
function steinschild(i, o) {
  const X = XS(i), id = 'ss' + i;
  const woerter = o.wort.split(' ');
  neu(id, `<i class="kette l"></i><i class="kette r"></i><i class="oese l"></i><i class="oese r"></i>
    <div class="z1"><span class="dot67" id="${id}d"></span><span class="art67" id="${id}a">${o.art}</span>
      <span class="wort67" style="font-size:${o.gr}px;line-height:${Math.round(o.gr * 1.12)}px">${woerter.map((w, k) => `<span class="w maske"><span class="m"><span class="wi" id="${id}w${k}">${w}</span></span></span>`).join(' ')}</span></div>
