<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Fachvokabeln: Naturwerkstein</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=block">
<link rel="stylesheet" href="../../werkzeug/stil.css">
<style>
.auf-brand{/*AUF_BRAND*/}
:root{
  --n200:var(--a2273fd3-5899-46bc-985c-b3c33e3c0780,#E6E3EE);
  --b400:var(--f0297ed8-06f5-4ffd-83fc-e6cd5dbaa2cd,#8163EE);
  --warning:var(--c19df991-9894-4419-88fb-b2b58e36f9f7,#E0992B);
  --warning-text:var(--71f60857-f754-4514-8386-e3f62d71441a,#9C6712);
  --warning-bg:var(--c7c18918-fab3-46fc-af57-2ec14b380cb2,#FCF1DD);
  --error:var(--f694e88e-bdd3-4eb1-bf33-26a20f247ed4,#E2556A);
  --error-bg:var(--fb93d1a9-9399-4624-95d4-83b61d28209b,#FCE7EA);
  --info:var(--3f081c40-af4e-4425-a97f-c7528bc5ad4d,#3B82F6);
  --info-bg:var(--f939ccd9-6c46-4062-bfe6-c36c169ccafb,#E6EFFE);
}
html,body{background:var(--b50)}
#kamera{position:absolute;inset:0;transform-origin:960px 540px}
#cam{display:none}

/* ================= Werkhalle im Querschnitt: Wand mit Hallenfenstern, Stützen, Boden; vorne der Kranträger ================= */
.halle67{width:1920px;height:1080px;overflow:hidden;background:linear-gradient(var(--b50) 0,var(--b100) 87%)}
.halle67 .fen{position:absolute;top:200px;width:250px;height:330px;border-radius:14px 14px 4px 4px;opacity:.75;
  background:linear-gradient(90deg,transparent 0 47%,var(--b200) 47% 53%,transparent 53%),linear-gradient(transparent 0 48%,var(--b200) 48% 52%,transparent 52%),linear-gradient(160deg,var(--surface),var(--b50));
  box-shadow:inset 0 0 0 10px var(--b200)}
.halle67 .stuetze{position:absolute;top:0;bottom:140px;width:64px;background:linear-gradient(90deg,var(--b200),var(--b300) 60%,var(--b200))}
.halle67 .stuetze::after{content:'';position:absolute;left:0;right:0;bottom:0;height:26px;background:var(--b400)}
.halle67 .boden{position:absolute;left:0;right:0;top:940px;bottom:0;background:linear-gradient(var(--n200),var(--n300))}
.halle67 .boden::before{content:'';position:absolute;left:0;right:0;top:0;height:8px;background:var(--b300)}
.halle67 .boden::after{content:'';position:absolute;left:0;right:0;top:44px;height:12px;background:repeating-linear-gradient(-45deg,var(--warning) 0 22px,transparent 22px 44px);opacity:.55}
#traeger{position:absolute;left:-3000px;top:-1400px;height:1520px;width:30000px;pointer-events:none;
  background:linear-gradient(transparent 0 1400px,var(--b600) 1400px 1416px,var(--b500) 1416px 1500px,var(--b700) 1500px 1520px)}
#traeger::before{content:'';position:absolute;left:0;right:0;top:0;height:1400px;background:linear-gradient(var(--b700),var(--b600))}
#traeger::after{content:'';position:absolute;left:0;right:0;top:1430px;height:56px;
  background:radial-gradient(circle,var(--b600) 0 15px,transparent 16px) 0 0/120px 56px}
.seil67{position:absolute;left:0;top:0;width:6px;margin-left:-3px;border-radius:3px;background:repeating-linear-gradient(var(--n300) 0 7px,var(--b600) 7px 9px)}

/* ================= Stein: Körnung, Oberflächen ================= */
.stein{background:
  radial-gradient(circle,color-mix(in srgb,var(--ink) 20%,transparent) 0 1.7px,transparent 2.5px) 0 0/37px 41px,
  radial-gradient(circle,color-mix(in srgb,var(--surface) 90%,transparent) 0 2px,transparent 2.8px) 11px 17px/53px 47px,
  radial-gradient(circle,color-mix(in srgb,var(--b300) 50%,transparent) 0 1.8px,transparent 2.6px) 23px 5px/43px 59px,
  radial-gradient(circle,color-mix(in srgb,var(--ink) 12%,transparent) 0 1.2px,transparent 2px) 7px 29px/19px 23px,
  linear-gradient(var(--n200),var(--n300))}
.matt{background:
  radial-gradient(circle,color-mix(in srgb,var(--ink) 10%,transparent) 0 1px,transparent 1.6px) 0 0/29px 31px,
  radial-gradient(circle,color-mix(in srgb,var(--surface) 70%,transparent) 0 1.2px,transparent 1.8px) 9px 13px/37px 33px,
  linear-gradient(160deg,var(--n200),var(--n300))}
.poliert{background:
  radial-gradient(circle,color-mix(in srgb,var(--surface) 75%,transparent) 0 1.6px,transparent 2.4px) 0 0/37px 41px,
  radial-gradient(circle,color-mix(in srgb,var(--b300) 80%,transparent) 0 1.8px,transparent 2.6px) 23px 5px/43px 59px,
  radial-gradient(circle,color-mix(in srgb,var(--surface) 45%,transparent) 0 1.1px,transparent 1.8px) 7px 29px/19px 23px,
  linear-gradient(150deg,var(--b600),var(--b700) 70%)}
.glanz67{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.glanz67 i{position:absolute;top:-60%;height:220%;width:34%;left:-60%;transform:rotate(24deg);
  background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--surface) 75%,transparent),transparent)}

/* ================= Wortkarte = Steinschild an zwei Ketten ================= */
.der{--f:var(--b500);--ft:var(--b600);--fa:var(--surface)}
.die{--f:var(--success);--ft:var(--success-text);--fa:var(--surface)}
.das{--f:var(--warning);--ft:var(--warning-text);--fa:var(--surface)}
.schild67{width:780px;height:270px;border-radius:22px;padding:42px 50px 0;transform-origin:50% 0;
  box-shadow:0 22px 50px rgba(22,19,37,.16),inset 0 -10px 0 color-mix(in srgb,var(--b300) 45%,transparent),inset 0 4px 0 color-mix(in srgb,var(--surface) 80%,transparent)}
.schild67 .kette{position:absolute;bottom:100%;margin-bottom:-6px;width:12px;height:1100px;border-radius:6px;
  background:repeating-linear-gradient(var(--n300) 0 18px,var(--b600) 18px 22px,var(--n200) 22px 40px,var(--b600) 40px 44px)}
.schild67 .kette.l{left:114px} .schild67 .kette.r{right:114px}
.schild67 .oese{position:absolute;top:10px;width:30px;height:30px;border-radius:99px;background:var(--b600);box-shadow:inset 0 0 0 7px var(--b400)}
.schild67 .oese.l{left:105px} .schild67 .oese.r{right:105px}
.schild67 .z1{display:flex;align-items:center;gap:20px;height:120px;margin-top:18px;white-space:nowrap}
.schild67.ohne .z1{height:186px;margin-top:0}
.dot67{display:inline-block;width:44px;height:44px;border-radius:99px;background:var(--f);flex:none;box-shadow:0 0 0 7px color-mix(in srgb,var(--f) 25%,transparent)}
.dot67.klein{width:26px;height:26px;box-shadow:0 0 0 5px color-mix(in srgb,var(--f) 25%,transparent)}
.art67{display:inline-block;font:800 56px/64px Inter;color:var(--ft);letter-spacing:-.01em}
.wort67{display:inline-block;font-weight:800;letter-spacing:-.03em;color:var(--n700);
  text-shadow:0 3px 0 color-mix(in srgb,var(--surface) 85%,transparent),0 -2px 0 rgba(22,19,37,.22)}
.schild67 .pl67{display:flex;align-items:center;gap:16px;margin-top:6px;font:700 44px/52px Inter;color:var(--n700);white-space:nowrap;
  text-shadow:0 2px 0 color-mix(in srgb,var(--surface) 85%,transparent)}
.schild67 .pl67 .art67{font-size:44px;line-height:52px}
.schild67 .pl67 small{font:700 20px/26px Inter;letter-spacing:.1em;text-transform:uppercase;color:var(--n500);margin-right:4px}

/* ================= Beispielsatz = gravierte Steintafel auf einem Bock ================= */
.tafel67{width:800px;min-height:150px;padding:26px 30px 28px 150px;border-radius:20px;
  font:600 34px/45px Inter;color:var(--ink);border-left:12px solid var(--f);
  box-shadow:0 16px 40px rgba(22,19,37,.12),inset 0 -6px 0 color-mix(in srgb,var(--b300) 40%,transparent)}
.tafel67::before,.tafel67::after{content:'';position:absolute;top:100%;height:80px;width:16px;border-radius:0 0 6px 6px;
  background:linear-gradient(90deg,var(--b500),var(--b700))}
.tafel67::before{left:120px;transform:skewX(8deg)} .tafel67::after{right:120px;transform:skewX(-8deg)}
.tafel67 .sw{display:inline-block;white-space:nowrap}
.tafel67 u{display:inline-block;text-decoration:none;opacity:0;white-space:pre;text-shadow:0 2px 0 color-mix(in srgb,var(--surface) 80%,transparent)}
.tafel67 .sw.lw u{color:var(--ft);font-weight:800}
.tafel67 .q{color:var(--b400);font-weight:800}
.tafel67 .portrait{position:absolute;left:24px;top:24px}

/* ================= Bausteine ================= */
.portrait{border-radius:999px;overflow:hidden;background:linear-gradient(160deg,var(--b200),var(--b300));border:7px solid var(--surface);
  box-shadow:0 6px 20px rgba(22,19,37,.12)}
.portrait .ebene{position:absolute;left:0;top:0;width:100%;height:100%}
.portrait .figur{position:absolute;left:0;top:6%;width:100%;height:100%;transform-origin:50% 100%}
.portrait .augen{transform-origin:50% 45%}
.portrait .auf{transform-origin:50% 54%}
.portrait .zu{transform-origin:50% 56%}
.portrait .maske{transform-origin:50% 55%}
.portrait.spiegel{border:0;background:none;box-shadow:none}
.welle{border-radius:999px;border:5px solid var(--b300);opacity:0}
.plakette{width:72px;height:72px;border-radius:999px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(22,19,37,.18);border:5px solid var(--surface);
  font:800 34px/1 Inter;color:var(--surface)}
.plakette svg{width:34px}
.plakette.gruen{background:var(--success)} .plakette.rot{background:var(--error)} .plakette.gelb{background:var(--warning)} .plakette.lila{background:var(--b400)}
.etikett{padding:10px 24px;border-radius:999px;background:var(--surface);color:var(--b600);font:700 28px/34px Inter;white-space:nowrap;box-shadow:0 6px 18px rgba(22,19,37,.09)}
.etikett.gross{padding:12px 30px;font-size:38px;line-height:46px;color:var(--ink)}
.etikett.rot{background:var(--error-bg);color:var(--error)}
.etikett.gruen{background:var(--success-bg);color:var(--success-text)}
.lg{display:inline-flex;align-items:center;gap:12px;padding:8px 26px 8px 14px;border-radius:999px;background:var(--surface);color:var(--ft);font:800 36px/44px Inter;margin:0 9px;
  box-shadow:0 6px 18px rgba(22,19,37,.10)}
.lg .dot67{width:30px;height:30px}
.chip{display:flex;align-items:center;justify-content:center;gap:12px;height:62px;border-radius:999px;background:var(--surface);color:var(--ink);font:800 30px/36px Inter;white-space:nowrap;
  box-shadow:0 8px 22px rgba(22,19,37,.14),inset 0 0 0 4px var(--f)}
.chip b{font-weight:800;color:var(--ft)}
.chip .dot67{width:24px;height:24px;box-shadow:none}
.grp{position:absolute}
.grp > *{position:absolute}
/* Staub, Wasser */
.wolke{border-radius:999px;background:radial-gradient(circle,color-mix(in srgb,var(--n300) 95%,transparent) 0 35%,color-mix(in srgb,var(--n300) 0%,transparent) 70%)}
.tropfen{width:16px;height:22px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:var(--info)}
.strahl67{width:8px;border-radius:4px;background:repeating-linear-gradient(var(--info) 0 18px,color-mix(in srgb,var(--info) 35%,transparent) 18px 30px)}
.brocken{width:46px;height:38px;clip-path:polygon(10% 20%,55% 0,100% 30%,88% 90%,30% 100%,0 70%)}
/* Lampe (Szene 1) */
.lampe67{width:150px;height:110px}
.lampe67::before{content:'';position:absolute;left:72px;top:-200px;width:6px;height:210px;background:var(--b700)}
.lampe67 .schirm{position:absolute;left:0;top:10px;width:150px;height:70px;border-radius:75px 75px 8px 8px;background:linear-gradient(var(--b500),var(--b700))}
.lampe67 .birne{position:absolute;left:45px;top:70px;width:60px;height:28px;border-radius:0 0 30px 30px;background:var(--n300)}
.lampe67.an .birne{background:var(--warning-bg);box-shadow:0 0 40px 18px color-mix(in srgb,var(--warning-bg) 80%,transparent)}
.kegel67{width:760px;height:820px;clip-path:polygon(41% 0,59% 0,100% 100%,0 100%);
  background:linear-gradient(color-mix(in srgb,var(--warning-bg) 75%,transparent),color-mix(in srgb,var(--warning-bg) 0%,transparent))}
/* Hallentor (Anfang) */
.tor67{position:absolute;top:0;width:960px;height:1080px;z-index:5;
  background:repeating-linear-gradient(90deg,transparent 0 150px,color-mix(in srgb,var(--b700) 40%,transparent) 150px 158px),repeating-linear-gradient(var(--b500) 0 84px,var(--b600) 84px 92px)}
.tor67 .fenster{position:absolute;top:360px;height:120px;width:520px;border-radius:12px;background:linear-gradient(160deg,var(--b200),var(--b300));box-shadow:inset 0 0 0 8px var(--b700)}
#torL{left:0} #torR{left:960px}
#torL .fenster{right:120px} #torR .fenster{left:120px}
#torL::after,#torR::after{content:'';position:absolute;top:500px;width:24px;height:140px;border-radius:12px;background:var(--warning)}
#torL::after{right:40px} #torR::after{left:40px}
#dunkel{position:absolute;inset:0;background:var(--ink);z-index:4;pointer-events:none}
#staubwisch{position:absolute;inset:0;z-index:4;pointer-events:none}
#staubwisch i{position:absolute;border-radius:999px;background:radial-gradient(circle,var(--n300) 0 45%,color-mix(in srgb,var(--n300) 0%,transparent) 70%)}
#blitz{position:absolute;inset:0;background:var(--surface);z-index:4;opacity:0;pointer-events:none}
/* Abspann: polierte Steinplatte senkt sich an zwei Ketten */
#abspann{position:absolute;left:60px;right:60px;top:60px;bottom:60px;border-radius:40px;z-index:6;overflow:visible;
  box-shadow:0 30px 80px rgba(22,19,37,.35)}
#abspann .kette{position:absolute;bottom:100%;width:16px;height:1200px;border-radius:8px;
  background:repeating-linear-gradient(var(--n300) 0 22px,var(--b700) 22px 27px,var(--n200) 27px 49px,var(--b700) 49px 54px)}
#abspann .kette.l{left:300px} #abspann .kette.r{right:300px}
#abspann .glanz67{border-radius:40px}
#abspann .gross{font:800 108px/118px Inter;letter-spacing:-.03em;text-align:center;color:var(--surface)}
#abspann .klein{font:400 42px/56px Inter;color:var(--b100);margin-top:24px;text-align:center;max-width:1300px}
#abspannGrund{position:absolute;inset:0;background:var(--b700);z-index:5;opacity:0}
</style></head><body>

<template id="svgHaken"><svg viewBox="0 0 40 40"><path d="M9 21l7 7 15-16" stroke="var(--surface)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></template>
<template id="svgAchtung"><svg viewBox="0 0 40 40"><path d="M20 9v14" stroke="var(--surface)" stroke-width="6" stroke-linecap="round"/><circle cx="20" cy="31" r="3.6" fill="var(--surface)"/></svg></template>
<template id="svgZack"><svg viewBox="0 0 40 40"><path d="M6 26l7-12 7 12 7-12 7 12" stroke="var(--surface)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></template>

<template id="t-block">{{rohblock}}</template>
<template id="t-katze">{{laufkatze}}</template>
<template id="t-haken">{{kranhaken}}</template>
<template id="t-blatt">{{saegeblatt}}</template>
<template id="t-scheibe">{{schleifscheibe}}</template>
<template id="t-lunge">{{lunge}}</template>
<template id="t-lungeg">{{lunge-grau}}</template>

<template id="gesicht"><div class="ebene augen">{{figur-augen}}</div><div class="ebene zu">{{figur-mund-zu}}</div><div class="ebene auf">{{figur-mund-auf}}</div><div class="ebene froh">{{figur-mund-froh}}</div></template>
<template id="f-Kwame">{{figur-kwame}}</template>
<template id="f-Sabine">{{figur-sabine}}</template>
<template id="t-maske">{{kwame-maske}}</template>
<template id="t-gehoer">{{kwame-gehoerschutz}}</template>

<!-- Produkte als Umriss (Szene 1): Treppe, Fensterbank, Arbeitsplatte -->
<template id="p-treppe"><svg viewBox="0 0 200 180"><path class="fl" d="M12 170V128h60V86h60V44h56v126Z" fill="var(--n300)"/>
  <path class="zeichnen" pathLength="1" d="M12 170V128h60V86h60V44h56v126Z" stroke="var(--b500)" stroke-width="6" stroke-linejoin="round" fill="none"/>
  <path class="zeichnen" pathLength="1" d="M12 128h60M72 86h60M132 44h56" stroke="var(--surface)" stroke-width="4" stroke-linecap="round" fill="none"/></svg></template>
<template id="p-fenster"><svg viewBox="0 0 180 220"><rect class="fl" x="24" y="10" width="132" height="150" rx="6" fill="var(--b50)"/>
  <path class="fl" d="M6 160h168v20H6Z" fill="var(--n300)"/>
  <path class="zeichnen" pathLength="1" d="M24 160V16a6 6 0 0 1 6-6h120a6 6 0 0 1 6 6v144M90 10v150M24 84h132" stroke="var(--b500)" stroke-width="6" stroke-linejoin="round" fill="none"/>
  <path class="zeichnen" pathLength="1" d="M6 160h168v20H6Z" stroke="var(--b500)" stroke-width="6" stroke-linejoin="round" fill="none"/></svg></template>
<template id="p-kueche"><svg viewBox="0 0 220 170"><rect class="fl" x="16" y="44" width="188" height="122" rx="4" fill="var(--b50)"/>
  <path class="fl" d="M4 20h212v24H4Z" fill="var(--n300)"/>
  <path class="zeichnen" pathLength="1" d="M16 44v122h188V44M110 50v110M90 70v24M130 70v24" stroke="var(--b500)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path class="zeichnen" pathLength="1" d="M4 20h212v24H4Z" stroke="var(--b500)" stroke-width="6" stroke-linejoin="round" fill="none"/></svg></template>

<div id="cam"></div>
<div id="kamera"><div id="welt"></div></div>
<div id="dunkel"></div>

<div class="tor67" id="torR"><div class="fenster"></div></div>

  <div class="gross" id="asTitel">Genauer und sicherer.</div>
  <div class="klein" id="asUnter">Wer die Wörter kennt, arbeitet genauer und sicherer.</div>
</div></div>

<script src="../../werkzeug/motor.js"></script>
<script>
/* ---------- Aufnahme: Satz- und Wortzeiten aus sprache.json ---------- */
const VERSATZ = 1.3;
window.SPRACHE = { datei: 'sprache.mp3', versatz: VERSATZ };
const A = s => s + VERSATZ;
const W = (m, n) => A(wort(m, satz(n).start - .01));
const WE = (m, n) => A(wortEnde(m, satz(n).start - .01));
const SA = n => A(satz(n).start);
const SE = n => A(satz(n).ende);
const ENDE_SPRACHE = SE(SPRACHDATEN.saetze.length);
const WELT = document.getElementById('welt');

const el = id => typeof id === 'string' ? (id.startsWith('#') ? $(id) : document.getElementById(id)) : id;
const _tw = tw; tw = (ids, ...r) => _tw([].concat(ids).map(el), ...r);
const _ak = akteur; akteur = (id, ...r) => _ak(el(id), ...r);
const wertBei = (id, p, t) => wert(AKTEURE.get(el(id)), p, t);
const pop = (id, t, basis, snd = 'pop', e = 'back') => { akteur(id, { ...basis, s: 0 }); tw(id, t, e === 'back' ? .5 : .65, { s: basis.s ?? 1 }, e); if (snd) cue(t, snd); };
const ein = (id, t, basis, von = { y: 70 }, snd = null) => {
  akteur(id, { ...basis, o: 0, x: basis.x + (von.x || 0), y: basis.y + (von.y || 0), r: von.r || 0 });
  tw(id, t, .5, { o: basis.o ?? 1 }, 'out'); tw(id, t, .6, { x: basis.x, y: basis.y, r: basis.r || 0 }, 'sanft');
  tw(id, t + .3, .12, { sy: .93, sx: 1.05 }, 'sinus'); tw(id, t + .42, .4, { sy: 1, sx: 1 }, 'sanft');
  if (snd) cue(t, snd);
};
const aus = (ids, t, d = .35) => tw(ids, t, d, { o: 0, s: .85 }, 'in');
const wackeln = (id, t, n = 3, w = 3) => { for (let i = 0; i < n; i++) tw(id, t + i * .1, .1, { r: i % 2 ? w : -w }, 'sinus'); tw(id, t + n * .1, .25, { r: 0 }, 'sinus'); };
const huepfen = (id, t, h = 18) => {
  const y = wertBei(id, 'y', t);
  tw(id, t, .08, { sy: .94, sx: 1.04 }, 'sinus');
  tw(id, t + .08, .36, { y }, 'sinus', { bogen: h }); tw(id, t + .08, .14, { sy: 1.04, sx: .97 }, 'sinus');
  tw(id, t + .44, .08, { sy: .95, sx: 1.04 }, 'sinus'); tw(id, t + .52, .3, { sy: 1, sx: 1 }, 'sanft');
};
const bump = (id, t, s = 1.1) => { const s0 = wertBei(id, 's', t); tw(id, t, .12, { s: s0 * s }, 'sinus'); tw(id, t + .12, .4, { s: s0 }, 'sanft'); };
const flug = (id, t0, d, x, y, h = 120, extra = {}) => tw(id, t0, d, { x, y, ...extra }, 'sinus', { bogen: h });
const federn = (id, t) => { tw(id, t, .12, { sy: .96, sx: 1.025 }, 'sinus'); tw(id, t + .12, .4, { sy: 1, sx: 1 }, 'sanft'); };
