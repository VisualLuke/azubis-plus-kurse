<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Fachvokabeln: Lager und Logistik</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=block">
<link rel="stylesheet" href="../../werkzeug/stil.css">
<style>
.auf-brand{/*AUF_BRAND*/}
:root{
  --n200:var(--a2273fd3-5899-46bc-985c-b3c33e3c0780,#E6E3EE);
  --b400:var(--f0297ed8-06f5-4ffd-83fc-e6cd5dbaa2cd,#8163EE);
  --warning:var(--c19df991-9894-4419-88fb-b2b58e36f9f7,#E0992B);
  --warning-text:var(--71f60857-f754-4514-8386-e3f62d71441a,#9C6712);
  --warning-bg:var(--c7c18918-fab3-46fc-af57-2ec14b380cb2,#FCF1DD);
  --error:var(--f694e88e-bdd3-4eb1-bf33-26a20f247ed4,#E2556A);
  --error-bg:var(--fb93d1a9-9399-4624-95d4-83b61d28209b,#FCE7EA);
  --info:var(--3f081c40-af4e-4425-a97f-c7528bc5ad4d,#3B82F6);
  --info-bg:var(--f939ccd9-6c46-4062-bfe6-c36c169ccafb,#E6EFFE);
}
html,body{background:var(--b50)}
#kamera{position:absolute;inset:0;transform-origin:960px 540px}
#cam{display:none}
/* Halle: Wand und Boden hinter dem Hochregal (nur in der Übersicht zu sehen) */
#halle{position:absolute;left:-4000px;top:-6000px;width:13760px;height:10500px;
  background:linear-gradient(var(--b50) 0,var(--b100) 66.6%,var(--b200) 66.67%,var(--b100) 100%)}
#halle .linie{position:absolute;left:0;right:0;top:7900px;height:46px;background:var(--warning);opacity:.75}
#halle .decke{position:absolute;left:0;right:0;height:120px;background:linear-gradient(var(--b500),var(--b700))}
#halle .saeule{position:absolute;top:0;height:7080px;width:150px;background:linear-gradient(90deg,var(--b100),var(--b200))}

/* ================= Regalfach = Bühne (1920 × 1080): Rückwand, Stützen, Traversen, Rollenbahn, Scan-Tor ================= */
.fach{width:1920px;height:1080px;overflow:hidden;
  background:repeating-linear-gradient(90deg,transparent 0 118px,color-mix(in srgb,var(--b200) 38%,transparent) 118px 122px),
             repeating-linear-gradient(transparent 0 118px,color-mix(in srgb,var(--b200) 38%,transparent) 118px 122px),
             linear-gradient(var(--b50),var(--b100))}
.fach .st{position:absolute;top:0;bottom:0;width:36px;background:linear-gradient(90deg,var(--b600),var(--b700))}
.fach .st::after{content:'';position:absolute;left:12px;width:12px;top:10px;bottom:10px;background:repeating-linear-gradient(transparent 0 22px,var(--b400) 22px 32px)}
.fach .st.l{left:0} .fach .st.r{right:0}
.fach .tr{position:absolute;left:0;right:0;bottom:0;height:56px;background:linear-gradient(var(--warning) 0 78%,var(--warning-text) 78%)}
.fach .tr::before{content:'';position:absolute;left:0;right:0;top:6px;height:5px;background:var(--warning-bg);opacity:.55}
.fach .dach{position:absolute;left:0;right:0;top:0;height:40px;background:linear-gradient(var(--warning) 0 78%,var(--warning-text) 78%)}
.fach .deck{position:absolute;left:36px;right:36px;top:960px;height:64px;background:linear-gradient(var(--b200),var(--b300))}
.fach .deck::before{content:'';position:absolute;left:0;right:0;top:0;height:8px;background:var(--b100)}
.fach .bahn{position:absolute;left:44px;width:840px;top:916px;height:52px}
.fach .bahn .schiene{position:absolute;left:0;right:0;top:28px;height:24px;border-radius:6px;background:linear-gradient(var(--b500),var(--b700))}
.rolle{position:absolute;top:0;width:30px;height:30px;border-radius:99px;background:var(--n300);box-shadow:inset 0 0 0 4px var(--n200);transform:rotate(var(--rw,0deg))}
.rolle::after{content:'';position:absolute;left:13px;top:3px;width:4px;height:24px;border-radius:2px;background:var(--b500)}
.fach .tor{position:absolute;left:96px;width:748px;top:438px;height:524px}
.fach .tor .p{position:absolute;top:22px;bottom:0;width:16px;border-radius:6px 6px 0 0;background:linear-gradient(90deg,var(--n300),var(--n200))}
.fach .tor .p.l{left:6px} .fach .tor .p.r{right:6px}
.fach .tor .q{position:absolute;left:0;right:0;top:0;height:24px;border-radius:12px;background:linear-gradient(var(--b500),var(--b700))}
/* Scan-Kopf mit Laserlinie (fährt über den Karton) */
.kopf64{width:58px;height:30px;border-radius:0 0 10px 10px;background:var(--b700)}
.kopf64 i{position:absolute;left:21px;bottom:-5px;width:16px;height:10px;border-radius:5px;background:var(--error)}
.laser{width:6px;height:466px;border-radius:3px;background:var(--error);box-shadow:0 0 14px 4px color-mix(in srgb,var(--error) 55%,transparent)}

/* ================= Wortkarte = Karton mit Strichcode ================= */
.der{--f:var(--b500);--ft:var(--b600);--fa:var(--surface)}
.die{--f:var(--success);--ft:var(--success-text);--fa:var(--surface)}
.das{--f:var(--warning);--ft:var(--warning-text);--fa:var(--surface)}
.neutral{--f:var(--b200);--ft:var(--b600);--fa:var(--b700)}
.kt{width:680px;height:350px;border-radius:10px;background:linear-gradient(var(--surface),var(--n200));box-shadow:0 18px 44px rgba(22,19,37,.12),inset 0 -8px 0 var(--n300);
  padding:40px 44px 34px;display:flex;flex-direction:column}
.kt::before{content:'';position:absolute;left:0;right:0;top:-34px;height:34px;background:linear-gradient(var(--n200),var(--n300));clip-path:polygon(3% 0,97% 0,100% 100%,0 100%)}
.kt .klebe{position:absolute;left:302px;width:76px;top:-34px;height:96px;background:var(--f);opacity:.85;clip-path:polygon(4% 0,96% 0,100% 35%,100% 100%,0 100%,0 35%)}
.kt .kopf{display:flex;align-items:center;justify-content:space-between;height:66px;flex:none;position:relative}
.kt .art{display:inline-block;padding:4px 22px;border-radius:999px;background:var(--f);color:var(--fa);font:800 32px/40px Inter;white-space:nowrap;box-shadow:0 4px 10px rgba(22,19,37,.12)}
.kt .code{width:206px;height:66px;border-radius:8px;background:var(--surface);box-shadow:inset 0 0 0 3px var(--n300);padding:7px 12px 0}
.kt .code svg{width:100%;height:40px}
.kt .code.ok{box-shadow:inset 0 0 0 4px var(--success);background:var(--success-bg)}
.kt .wort{margin-top:24px;font-weight:800;letter-spacing:-.03em;color:var(--ink);white-space:nowrap}
.kt.ohne .wort{margin:auto 0}
.kt .pl{margin-top:auto;display:flex;align-items:baseline;gap:18px;font:600 44px/52px Inter;color:var(--n700);white-space:nowrap}
.kt .pl small{font:700 21px/26px Inter;letter-spacing:.08em;text-transform:uppercase;color:var(--n500)}
/* Hängeschild mit Beispielsatz (tippt sich im Takt der Stimme) */
.sl{width:720px;min-height:152px;padding:24px 30px 26px 140px;border-radius:28px;background:var(--surface);box-shadow:0 14px 40px rgba(22,19,37,.10);
  font:600 34px/45px Inter;color:var(--ink);transform-origin:50% -96px;border-top:10px solid var(--f)}
.sl::before,.sl::after{content:'';position:absolute;top:-106px;height:106px;width:6px;border-radius:3px;
  background:repeating-linear-gradient(var(--n300) 0 12px,var(--n500) 12px 15px)}
.sl::before{left:110px} .sl::after{right:110px}
.sl .sw{display:inline-block;white-space:nowrap}
.sl u{display:inline-block;text-decoration:none;opacity:0;white-space:pre}
.sl .sw.lw u{color:var(--ft);font-weight:800}
.sl .q{color:var(--b300);font-weight:800}
.sl .portrait{position:absolute;left:22px;top:24px}
.lg{display:inline-block;padding:6px 24px;border-radius:999px;background:var(--f);color:var(--fa);font:800 34px/44px Inter;margin-right:16px}
.chip.gross{height:72px;font-size:36px;line-height:42px}
.chip{display:flex;align-items:center;justify-content:center;height:58px;border-radius:999px;background:var(--f);color:var(--fa);font:800 28px/34px Inter;white-space:nowrap;
  box-shadow:0 8px 22px rgba(22,19,37,.14)}
.chip b{font-weight:600;opacity:.85;margin-right:9px}

/* Bausteine */
.portrait{border-radius:999px;overflow:hidden;background:linear-gradient(160deg,var(--b200),var(--b300));border:7px solid var(--surface);
  box-shadow:0 6px 20px rgba(22,19,37,.12)}
.portrait .ebene{position:absolute;left:0;top:0;width:100%;height:100%}
.portrait .figur{position:absolute;left:0;top:6%;width:100%;height:100%;transform-origin:50% 100%}
.portrait .augen{transform-origin:50% 45%}
.portrait .auf{transform-origin:50% 54%}
.portrait .zu{transform-origin:50% 56%}
.welle{border-radius:999px;border:5px solid var(--b300);opacity:0}
.plakette{width:72px;height:72px;border-radius:999px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(22,19,37,.18);border:5px solid var(--surface);
  font:800 34px/1 Inter;color:var(--surface)}
.plakette svg{width:34px}
.plakette.gruen{background:var(--success)} .plakette.rot{background:var(--error)} .plakette.gelb{background:var(--warning)} .plakette.lila{background:var(--b400)}
.etikett{padding:10px 24px;border-radius:999px;background:var(--surface);color:var(--b600);font:700 26px/32px Inter;white-space:nowrap;box-shadow:0 6px 18px rgba(22,19,37,.09)}
.etikett b{font-weight:800;color:var(--ink)}
.etikett.gross{padding:12px 30px;font-size:38px;line-height:46px}
.etikett.klein{padding:7px 18px;font-size:22px;line-height:28px}
.tipp u{display:inline-block;text-decoration:none;white-space:pre}
/* kleiner Karton (Vorderseite, Deckel, Klebeband) */
.kiste{border-radius:6px;background:linear-gradient(var(--surface),var(--n200));box-shadow:inset 0 -5px 0 var(--n300),0 6px 14px rgba(22,19,37,.10)}
.kiste::before{content:'';position:absolute;left:0;right:0;top:-16%;height:16%;background:linear-gradient(var(--n200),var(--n300));clip-path:polygon(4% 0,96% 0,100% 100%,0 100%)}
.kiste::after{content:'';position:absolute;left:42%;width:16%;top:-16%;height:40%;background:var(--b400);opacity:.8}
.kiste .ad{position:absolute;left:12%;bottom:16%;width:38%;height:26%;border-radius:4px;background:var(--surface);box-shadow:inset 0 0 0 2px var(--n300)}
.kiste .ad::before,.kiste .ad::after{content:'';position:absolute;left:12%;height:14%;border-radius:2px;background:var(--n300)}
.kiste .ad::before{top:28%;width:70%} .kiste .ad::after{top:60%;width:46%}
.kiste.delle{clip-path:polygon(0 -20%,100% -20%,100% 100%,62% 100%,54% 86%,46% 100%,0 100%)}
.riss{width:60px;height:60px}
/* Palette */
.pal{height:34px}
.pal i{position:absolute;background:var(--warning);border-radius:3px}
.pal .o{left:0;right:0;top:0;height:10px} .pal .u{left:0;right:0;bottom:0;height:7px;opacity:.85}
.pal .k{top:8px;bottom:5px;width:14%;background:var(--warning-text);opacity:.55}
.grp{position:absolute}
.grp > *{position:absolute}
/* Lagertür mit Gebotszeichen */
.htuer{border-radius:16px 16px 0 0;background:var(--b700)}
.htuer::before{content:'';position:absolute;inset:0;border-radius:16px 16px 0 0;border:14px solid var(--b300);border-bottom:0}
.htuer .blatt{position:absolute;left:14px;right:14px;top:14px;bottom:0;border-radius:6px 6px 0 0;background:linear-gradient(var(--b500),var(--b600));transform-origin:0 50%}
.htuer .griff{position:absolute;right:18px;top:55%;width:34px;height:12px;border-radius:6px;background:var(--warning)}
.gebot{width:120px;height:120px;border-radius:999px;background:var(--info);border:7px solid var(--surface);box-shadow:0 6px 16px rgba(22,19,37,.18)}
.gebot svg{position:absolute;left:18px;top:22px;width:70px}
.glanz{border-radius:999px;background:radial-gradient(circle,color-mix(in srgb,var(--warning) 70%,transparent) 0,color-mix(in srgb,var(--warning) 0%,transparent) 70%)}
/* Rolltor */
.rolltor{width:300px;height:500px}
.rolltor .rahmen{position:absolute;inset:0;border:16px solid var(--b600);border-top:58px solid var(--b700);border-bottom:0;border-radius:14px 14px 0 0}
.rolltor .lamellen{position:absolute;left:16px;right:16px;top:58px;bottom:0;transform-origin:50% 0;
  background:repeating-linear-gradient(var(--n200) 0 30px,var(--n300) 30px 34px)}
.rolltor .lamellen::after{content:'';position:absolute;left:0;right:0;bottom:0;height:16px;background:var(--b500)}
/* Klemmbrett mit Lieferschein */
.klemm{width:220px;height:280px;border-radius:18px;background:linear-gradient(var(--b500),var(--b700));box-shadow:0 14px 30px rgba(22,19,37,.16)}
.klemm .papier{position:absolute;left:16px;right:16px;top:30px;bottom:16px;border-radius:8px;background:linear-gradient(var(--surface),var(--n200))}
.klemm .clip{position:absolute;left:66px;top:-12px;width:88px;height:34px;border-radius:10px;background:var(--n300);box-shadow:inset 0 0 0 5px var(--n200)}
.klemm .zl{position:absolute;left:16px;right:16px;height:34px;display:flex;align-items:center;gap:10px}
.klemm .zl i{display:block;height:9px;border-radius:5px;background:var(--n300)}
.klemm .zl s{display:block;width:30px;height:30px;border-radius:99px;flex:none;margin-left:auto;background:var(--n200);box-shadow:inset 0 0 0 3px var(--n300);text-decoration:none}
.klemm .zl s.ok{background:var(--success);box-shadow:none}
.klemm .zl s.nein{background:var(--error);box-shadow:none}
.klemm .zl s svg{width:22px;margin:4px}
/* Hochregal (klein) */
.mreg{position:absolute}
.mreg i{position:absolute;background:var(--b600);border-radius:3px}
.mreg b{position:absolute;left:0;right:0;height:16px;background:var(--warning);border-radius:3px}
/* Monitor */
.mon{width:380px;height:250px;border-radius:22px;background:var(--b700);box-shadow:0 14px 34px rgba(22,19,37,.14)}
.mon .scr{position:absolute;inset:14px;border-radius:12px;background:var(--surface);overflow:hidden}
.mon .z{position:absolute;left:20px;right:20px;height:40px;border-radius:10px;background:var(--b50);display:flex;align-items:center;gap:12px;padding:0 14px}
.mon .z i{display:block;height:12px;border-radius:6px;background:var(--n300)}
.mon .z.neu{background:var(--success-bg);box-shadow:inset 0 0 0 3px var(--success);font:800 26px/30px Inter;color:var(--success-text);white-space:nowrap}
.monfuss{width:150px;height:60px}
.monfuss i{position:absolute;left:55px;top:0;width:40px;height:40px;background:var(--b600)}
.monfuss s{position:absolute;left:0;right:0;bottom:0;height:22px;border-radius:11px;background:var(--b600);text-decoration:none}
.strahl{height:8px;border-radius:4px;background:var(--error);box-shadow:0 0 12px 3px color-mix(in srgb,var(--error) 50%,transparent);transform-origin:0 50%}
.punkt64{width:26px;height:26px;border-radius:99px;background:var(--b400);box-shadow:0 0 0 7px color-mix(in srgb,var(--b400) 30%,transparent)}
.balken{width:360px;height:30px;border-radius:5px;background:linear-gradient(var(--warning),var(--warning-text))}
.balken b{position:absolute;left:130px;top:-14px;padding:3px 18px;border-radius:10px;background:var(--surface);box-shadow:inset 0 0 0 3px var(--n300);font:800 34px/44px Inter;color:var(--ink)}
.balken b.ok{box-shadow:inset 0 0 0 4px var(--success);background:var(--success-bg)}
.fachrahmen{border-radius:6px;border:6px dashed var(--b400);opacity:0}
.fachrahmen.voll{border:none;background:color-mix(in srgb,var(--success) 30%,transparent);box-shadow:inset 0 0 0 6px var(--success)}
/* Auftragszettel */
.auftrag{width:230px;height:300px;border-radius:14px;background:linear-gradient(var(--surface),var(--n200));box-shadow:0 12px 28px rgba(22,19,37,.14)}
.auftrag::before{content:'';position:absolute;left:18px;top:20px;width:110px;height:14px;border-radius:7px;background:var(--b400)}
.auftrag .zl{position:absolute;left:18px;right:18px;height:50px;display:flex;align-items:center;gap:12px}
.auftrag .zl em{display:block;width:30px;height:30px;border-radius:7px;flex:none}
.auftrag .zl i{display:block;height:10px;border-radius:5px;background:var(--n300)}
.auftrag .zl s{display:block;width:30px;height:30px;border-radius:99px;flex:none;margin-left:auto;background:var(--n200);box-shadow:inset 0 0 0 3px var(--n300);text-decoration:none}
.auftrag .zl s.ok{background:var(--success);box-shadow:none}
.auftrag .zl s svg{width:22px;margin:4px}
.regalzeile{position:absolute}
.regalzeile i{position:absolute;background:var(--b600);border-radius:3px}
.regalzeile b{position:absolute;left:0;right:0;height:18px;background:var(--warning);border-radius:3px}
.licht{width:30px;height:30px;border-radius:99px;background:var(--n300);box-shadow:inset 0 0 0 4px var(--n200)}
.licht.an{background:var(--success);box-shadow:0 0 0 8px color-mix(in srgb,var(--success) 30%,transparent)}
.ware{border-radius:8px}
.ware.a{background:linear-gradient(var(--info),var(--b600))} .ware.b{background:linear-gradient(var(--success),var(--success-text));border-radius:40px 40px 8px 8px}
.ware.c{background:linear-gradient(var(--warning),var(--warning-text))}
/* Versand: offener Karton mit Klappen, Klebeband, Adressaufkleber */
.paket{width:250px;height:170px;border-radius:6px;background:linear-gradient(var(--surface),var(--n200));box-shadow:inset 0 -6px 0 var(--n300),0 10px 22px rgba(22,19,37,.10)}
.paket .kl{position:absolute;top:-70px;width:50%;height:70px;background:linear-gradient(var(--n300),var(--n200));transform-origin:50% 100%}
.paket .kl.l{left:0;clip-path:polygon(0 0,92% 18%,100% 100%,0 100%)} .paket .kl.r{right:0;clip-path:polygon(8% 18%,100% 0,100% 100%,0 100%)}
.paket .deckel{position:absolute;left:0;right:0;top:-26px;height:26px;background:linear-gradient(var(--n200),var(--n300));clip-path:polygon(4% 0,96% 0,100% 100%,0 100%);transform-origin:50% 100%}
.paket .band{position:absolute;left:100px;width:50px;top:-26px;height:90px;background:var(--b400);opacity:.85;transform-origin:50% 0}
.paket .adr{position:absolute;left:24px;bottom:24px;width:120px;height:74px;border-radius:8px;background:var(--surface);box-shadow:inset 0 0 0 3px var(--n300)}
.paket .adr i{position:absolute;left:14px;height:9px;border-radius:5px;background:var(--n300)}
.rampe{width:360px;height:90px;border-radius:10px 10px 0 0;background:linear-gradient(var(--b300),var(--b500))}
.rampe::before{content:'';position:absolute;left:0;right:0;top:0;height:14px;border-radius:10px 10px 0 0;background:repeating-linear-gradient(90deg,var(--warning) 0 26px,var(--ink) 26px 52px)}
/* Gabelstapler: Fahrbereich, Abstandspfeil, Hubmast-Verlängerung, Warnleuchte */
.zone{border-radius:18px;border:7px dashed var(--warning);background:color-mix(in srgb,var(--warning) 14%,transparent)}
.pfeil2{height:12px;background:var(--b500);border-radius:6px}
.pfeil2::before,.pfeil2::after{content:'';position:absolute;top:-12px;width:0;height:0;border:18px solid transparent}
.pfeil2::before{left:-22px;border-right:22px solid var(--b500);border-left:0}
.pfeil2::after{right:-22px;border-left:22px solid var(--b500);border-right:0}
.mast2{width:24px;transform-origin:50% 100%;background:linear-gradient(90deg,var(--b600),var(--b400));border-radius:4px 4px 0 0}
.leuchte{width:56px;height:56px;border-radius:99px;background:radial-gradient(circle,color-mix(in srgb,var(--warning) 85%,transparent) 0,color-mix(in srgb,var(--warning) 0%,transparent) 70%)}
.hoehe{width:12px;background:var(--b400);border-radius:6px}
.hoehe::before,.hoehe::after{content:'';position:absolute;left:-14px;width:0;height:0;border:20px solid transparent}
.hoehe::before{top:-26px;border-bottom:26px solid var(--b400);border-top:0}
.hoehe::after{bottom:-26px;border-top:26px solid var(--b400);border-bottom:0}
/* Übersicht: Hallenlampen, Lichtkegel, Förderband, Leuchtrahmen eines Fachs */
.kegel{width:900px;height:2600px;clip-path:polygon(38% 0,62% 0,100% 100%,0 100%);background:linear-gradient(color-mix(in srgb,var(--warning-bg) 70%,transparent),color-mix(in srgb,var(--warning-bg) 0%,transparent))}
.band64{height:150px}
.band64 .schiene{position:absolute;left:0;right:0;top:80px;height:70px;border-radius:20px;background:linear-gradient(var(--b500),var(--b700))}
.band64 .rolle{width:90px;height:90px;top:0}
.band64 .rolle::after{left:39px;top:9px;width:12px;height:72px;border-radius:6px}
.glut{width:1920px;height:1080px;border:44px solid var(--f);box-shadow:inset 0 0 120px color-mix(in srgb,var(--f) 60%,transparent);opacity:0}
/* Rolltor als Vorhang (Anfang) und Abspann */
#vortor{position:absolute;inset:0;background:repeating-linear-gradient(var(--n200) 0 64px,var(--n300) 64px 72px);z-index:5}
#vortor::after{content:'';position:absolute;left:0;right:0;bottom:0;height:40px;background:var(--b600)}

</div></div>

  <div class="gross" id="asTitel">Schneller und sicherer.</div>

</div></div>

<script src="../../werkzeug/motor.js"></script>
<script>
/* ---------- Aufnahme: Satz- und Wortzeiten aus sprache.json ---------- */
const VERSATZ = 0.7;
window.SPRACHE = { datei: 'sprache.mp3', versatz: VERSATZ };
const A = s => s + VERSATZ;
const W = (m, n) => A(wort(m, satz(n).start - .01));
const WE = (m, n) => A(wortEnde(m, satz(n).start - .01));
const SA = n => A(satz(n).start);
const SE = n => A(satz(n).ende);
const ENDE_SPRACHE = SE(SPRACHDATEN.saetze.length);
const WELT = document.getElementById('welt');

const el = id => typeof id === 'string' ? (id.startsWith('#') ? $(id) : document.getElementById(id)) : id;
const _tw = tw; tw = (ids, ...r) => _tw([].concat(ids).map(el), ...r);
const _ak = akteur; akteur = (id, ...r) => _ak(el(id), ...r);
const wertBei = (id, p, t) => wert(AKTEURE.get(el(id)), p, t);
const pop = (id, t, basis, snd = 'pop', e = 'back') => { akteur(id, { ...basis, s: 0 }); tw(id, t, e === 'back' ? .5 : .65, { s: basis.s ?? 1 }, e); if (snd) cue(t, snd); };
const ein = (id, t, basis, von = { y: 70 }, snd = null) => {
  akteur(id, { ...basis, o: 0, x: basis.x + (von.x || 0), y: basis.y + (von.y || 0), r: von.r || 0 });
  tw(id, t, .5, { o: 1 }, 'out'); tw(id, t, .6, { x: basis.x, y: basis.y, r: basis.r || 0 }, 'sanft');
  tw(id, t + .3, .12, { sy: .93, sx: 1.05 }, 'sinus'); tw(id, t + .42, .4, { sy: 1, sx: 1 }, 'sanft');
  if (snd) cue(t, snd);
};
const aus = (ids, t, d = .35) => tw(ids, t, d, { o: 0, s: .85 }, 'in');
const wackeln = (id, t, n = 3, w = 3) => { for (let i = 0; i < n; i++) tw(id, t + i * .1, .1, { r: i % 2 ? w : -w }, 'sinus'); tw(id, t + n * .1, .25, { r: 0 }, 'sinus'); };
const huepfen = (id, t, h = 18) => {
  const y = wertBei(id, 'y', t);
  tw(id, t, .08, { sy: .94, sx: 1.04 }, 'sinus');
  tw(id, t + .08, .36, { y }, 'sinus', { bogen: h }); tw(id, t + .08, .14, { sy: 1.04, sx: .97 }, 'sinus');
  tw(id, t + .44, .08, { sy: .95, sx: 1.04 }, 'sinus'); tw(id, t + .52, .3, { sy: 1, sx: 1 }, 'sanft');
};
const bump = (id, t, s = 1.1) => { const s0 = wertBei(id, 's', t); tw(id, t, .12, { s: s0 * s }, 'sinus'); tw(id, t + .12, .4, { s: s0 }, 'sanft'); };
const flug = (id, t0, d, x, y, h = 120, extra = {}) => tw(id, t0, d, { x, y, ...extra }, 'sinus', { bogen: h });
const federn = (id, t) => { tw(id, t, .12, { sy: .96, sx: 1.025 }, 'sinus'); tw(id, t + .12, .4, { sy: 1, sx: 1 }, 'sanft'); };
const landen = (id, t) => { tw(id, t, .08, { sy: .86, sx: 1.08 }, 'sinus'); tw(id, t + .08, .45, { sy: 1, sx: 1 }, 'sanft'); };
const tpl = id => document.getElementById(id).innerHTML;
const kopie = (id, p) => tpl(id).replace(/id="([^"]+)"/g, `id="$1_${p}"`).replace(/url\(#([^)]+)\)/g, `url(#$1_${p})`);
const neu = (id, inhalt, stil = '', attr = '', klasse = '') => { WELT.insertAdjacentHTML('beforeend', `<div class="a ${klasse}" id="${id}" style="${stil}" ${attr}>${inhalt}</div>`); return id; };
let WN = 0;
const wellen = (t, x, y, farbe = null, gr = 160, s = 1) => {
  const id = 'wl' + WN++; neu(id, '', `width:${gr}px;height:${gr}px${farbe ? ';border-color:' + farbe : ''}${s !== 1 ? ';border-width:' + (5 * s) + 'px' : ''}`, 'data-frei', 'welle');
  akteur(id, { x, y, o: 0, s: .8 }); set(id, t, { o: .9, s: .8 }); tw(id, t, .9, { o: 0, s: 1.6 }, 'weich');
};
const plakette = (id, farbe, svg, attr = 'data-frei') => neu(id, svg ? tpl(svg) : '', '', attr, 'plakette ' + farbe);
const pendel = (id, t, a = 12, n = 5, d = .34) => { for (let k = 0; k < n; k++) tw(id, t + k * d, d, { r: (k % 2 ? -1 : 1) * a * Math.pow(.55, k) }, 'sinus'); tw(id, t + n * d, d, { r: 0 }, 'sinus'); };
const summen = (id, t, d = .8, a = 4) => HOOKS.push(z => { const p = z - t; if (p > 0 && p < d) el(id).style.transform += ` translateX(${(a * Math.sin(p * 70) * (1 - p / d)).toFixed(2)}px)`; });
const bild = (id, t, breite, attr = '', stil = '') => neu(id, kopie(t, id), `width:${breite}px;${stil}`, attr);
const rollen = (id, t, x, d = .7, e = 'sanft') => { tw(id, t, d, { x }, e); const n = Math.max(2, Math.round(d / .18)); for (let k = 0; k < n; k++) tw(id, t + k * d / n, d / n, { r: k % 2 ? -1.2 : 1.2 }, 'sinus'); tw(id, t + d, .25, { r: 0 }, 'sinus'); };
const haken = (id, t, x, y, attr = 'data-frei', snd = 'ding') => { plakette(id, 'gruen', 'svgHaken', attr); pop(id, t, { x, y }, snd); return id; };
function tippen(id, text, t0, d, klang = true) {
  const e = el(id), zeichen = [...text];
  e.classList.add('tipp');
  e.innerHTML = zeichen.map(c => `<u>${c}</u>`).join('');
  const us = [...e.querySelectorAll('u')], z = us.map((u, k) => t0 + d * k / Math.max(1, us.length));
  HOOKS.push(t => us.forEach((u, k) => { const p = clamp((t - z[k]) / .08); u.style.opacity = p; u.style.transform = p < 1 ? `translateY(${(6 * (1 - p)).toFixed(1)}px)` : ''; }));
  if (klang) z.filter((_, k) => k % 2 === 0 && zeichen[k] !== ' ').forEach(tz => cue(tz, 'tipp'));
  return z;
}
// Zähler, der im Takt hochzählt (Text wird je Frame gesetzt)
function zaehler(id, von, bis, t0, d, fmt = n => n, klick = 2) {
  HOOKS.push(t => { const n = Math.round(von + (bis - von) * clamp((t - t0) / d)); el(id).textContent = fmt(n); });
  for (let n = von + 1; n <= bis; n++) if ((n - von) % klick === 0) cue(t0 + d * (n - von) / (bis - von), 'klick');
}

/* ---------- Welt: ein Hochregal aus 3 × 3 Fächern. Die Kamera fährt wie ein Regalbediengerät von Fach zu Fach ---------- */
const FW = 1920, FH = 1080, GY = 960;
const FACH = { 2: [0, 0], 3: [0, 1], 4: [0, 2], 5: [1, 2], 6: [1, 1], 7: [1, 0], 8: [2, 0], 9: [2, 1], 10: [2, 2] };
const FX = i => FACH[i][1] * FW, FY = i => -FACH[i][0] * FH;
// Übersicht: das ganze Regal im Bild (Kamera-Zoom Z0, Bildmitte C0)
const Z0 = .2, C0 = { x: 2880, y: -110 };
const W0 = (sx, sy) => ({ x: C0.x + (sx - 960) / Z0, y: C0.y + (sy - 540) / Z0 });

// Hallenwand: Säulen links und rechts des Regals
el('halle').insertAdjacentHTML('beforeend', `<div class="decke" style="top:${W0(0, 22).y + 6000}px"></div>`);
[-1500, -900, 6660, 7260].forEach(x => el('halle').insertAdjacentHTML('beforeend', `<div class="saeule" style="left:${x + 4000}px"></div>`));

// Fächer anlegen (Bühnen) – in Reihen von unten nach oben
for (const i of [2, 3, 4, 7, 6, 5, 8, 9, 10]) {
  const [r] = FACH[i];
  const rollen64 = Array.from({ length: 13 }, (_, k) => `<div class="rolle" style="left:${8 + k * 64}px"></div>`).join('');
  WELT.insertAdjacentHTML('beforeend', `<div class="a buehne fach" id="bue${i}">
    <div class="deck"></div>
    <div class="tor"><div class="p l"></div><div class="p r"></div><div class="q"></div></div>
    <div class="bahn">${rollen64}<div class="schiene"></div></div>
    <div class="st l"></div><div class="st r"></div><div class="tr"></div>${r === 2 ? '<div class="dach"></div>' : ''}</div>`);
  akteur('bue' + i, { x: FX(i) + FW / 2, y: FY(i) + FH / 2 });
}

/* ---------- Kamera: Mitte (x, y) und Zoom (log) als Akteur; Fahrten mit Unschärfe, Zoom-Atmer, Akzente ---------- */
akteur('cam', { x: C0.x, y: C0.y, r: Math.log(Z0) }, true);
const FAHRTEN = [], AKZENTE = [];
const akzent = (t, z = .035) => AKZENTE.push([t, z]);
function fahrt(t, x, y, z, d = 1, atmen = true) { tw('cam', t, d, { x, y, r: Math.log(z) }, 'inout'); FAHRTEN.push([t, d, atmen]); cue(t, 'whoosh'); }
const zuFach = (t, i, d = 1) => fahrt(t, FX(i) + FW / 2, FY(i) + FH / 2, 1, d);
document.body.insertAdjacentHTML('beforeend', '<svg width="0" height="0" style="position:absolute"><filter id="wischer" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur id="wischerBlur" stdDeviation="0 0"/></filter></svg>');
const camAk = AKTEURE.get(el('cam'));
const camBei = t => ({ x: wert(camAk, 'x', t), y: wert(camAk, 'y', t), z: Math.exp(wert(camAk, 'r', t)) });
HOOKS.push(t => {
  const c = camBei(t), v = camBei(t - 1 / 30);
  let z = c.z;
  for (const [t0, d, atmen] of FAHRTEN) if (atmen) z *= 1 - .07 * Math.sin(Math.PI * clamp((t - t0) / d));
  for (const [a, h] of AKZENTE) { const d = (t - a) / 1.1; if (d > 0 && d < 1) z *= 1 + h * Math.sin(Math.PI * E.weich(d)); }
  const letzte = Math.max(0, ...FAHRTEN.filter(f => f[0] + f[1] <= t).map(f => f[0] + f[1]));
  z *= 1 + .025 * E.inout(clamp((t - letzte) / 11));
  WELT.style.transform = `translate(${(960 - c.x).toFixed(2)}px,${(540 - c.y).toFixed(2)}px)`;
  $('#kamera').style.transform = `scale(${z.toFixed(5)})`;
  // Bewegungsunschärfe in Fahrtrichtung (nur bei Fahrten zwischen Fächern, nicht beim Zoom)
  const zoomt = Math.abs(Math.log(c.z) - Math.log(v.z)) > .002;
  const bx = zoomt ? 0 : Math.min(18, Math.abs(c.x - v.x) * c.z * .09), by = zoomt ? 0 : Math.min(18, Math.abs(c.y - v.y) * c.z * .09);
  $('#wischerBlur').setAttribute('stdDeviation', `${(bx / c.z).toFixed(2)} ${(by / c.z).toFixed(2)}`);
  WELT.style.filter = bx + by > .3 ? 'url(#wischer)' : '';
});

/* ---------- Figuren: Mund nur in den eigenen Sätzen, Nicken, froh; Yusuf mit Warnweste ---------- */
const SAETZE = SPRACHDATEN.saetze.map(s => ({ a: A(s.start), b: A(s.ende), w: s.sprecher }));
const FROH = [], KOPF = [], WESTE = {};
function portrait(id, wer, gr, attr = '', ziel = null) {
  const weste = wer === 'Yusuf' ? `<div class="ebene weste">${kopie('t-weste', id)}</div>` : '';
  const html = `<div class="a portrait" id="${id}" style="width:${gr}px;height:${gr}px" ${attr}><div class="figur"><div class="ebene">${kopie('f-' + wer, id)}</div>${weste}${tpl('gesicht')}</div></div>`;
  (ziel ? el(ziel) : WELT).insertAdjacentHTML('beforeend', html);
  el(id).dataset.sprecher = wer;
  return id;
}
HOOKS.push(t => {
  const pegel = window.PEGEL ? (window.PEGEL[Math.round((t - VERSATZ) * 30)] || 0) : .7 + .3 * Math.sin(t * 9);
  document.querySelectorAll('.portrait').forEach((p, i) => {
    const spricht = SAETZE.some(s => s.w === p.dataset.sprecher && t >= s.a && t <= s.b);
    const auf = spricht ? clamp(pegel * (.55 + .45 * Math.abs(Math.sin(t * 13 + i * 7)))) : 0;
    const froh = !spricht && FROH.some(([id, a, b]) => id === p.id && t >= a && t < b);
    p.querySelector('.auf').style.transform = `scaleY(${Math.max(.05, auf)})`;
    p.querySelector('.auf').style.opacity = auf > .12 ? 1 : 0;
    p.querySelector('.froh').style.opacity = froh && auf <= .12 ? 1 : 0;
    p.querySelector('.zu').style.opacity = auf > .12 || (froh && auf <= .12) ? 0 : 1;
    const z = (t * .29 + i * .37) % 1;
    p.querySelector('.augen').style.transform = `scaleY(${z < .035 ? .12 : 1})`;
    let r = spricht ? 1.6 * Math.sin(t * 3.1) * pegel : 1.4 * Math.max(0, Math.sin(t * 1.4 + i * 2.1)) ** 10, y = r;
    for (const [id, t0, d] of KOPF) {
      const q = (t - t0) / d; if (id !== p.id || q < 0 || q > 1) continue;
      y += 9 * Math.abs(Math.sin(q * Math.PI * 2)) * Math.sin(Math.PI * q);
    }
    p.querySelector('.figur').style.transform = `translate(0px,${y.toFixed(2)}px) rotate(${r.toFixed(2)}deg)`;
    p.style.borderColor = spricht ? 'var(--b300)' : '';
    const w = p.querySelector('.weste');
    if (w) { const t0 = WESTE[p.id] ?? -1, q = E.sanft(clamp((t - t0) / .55)); w.style.transform = `translateY(${(70 * (1 - q)).toFixed(1)}%)`; w.style.opacity = t < t0 ? 0 : 1; }
  });
});
const nicken = (id, t, d = 1.1) => KOPF.push([id, t, d]);

/* ================= Format „Fachvokabeln“: Karton mit Strichcode, Scan-Tor, Hängeschild ================= */
const GENUS = ['der', 'die', 'das'];
// Strichcode (fest, deterministisch)
const CODE = (() => { let x = 4, s = ''; const b = [3, 1, 2, 1, 1, 3, 2, 1, 4, 1, 1, 2, 3, 1, 2, 2, 1, 1, 3, 1, 2, 4, 1, 2, 1, 3, 1, 1, 2, 3];
  b.forEach((w, k) => { if (k % 2 === 0) s += `<rect x="${x}" y="0" width="${w * 1.6}" height="40" fill="var(--ink)"/>`; x += w * 1.6 + 1.4; });
  return `<svg viewBox="0 0 ${Math.ceil(x + 4)} 40" preserveAspectRatio="none">${s}</svg>`; })();
const KT_X = 470, KT_Y = 741;     // Kartonmitte im Fach
function karton(i, o) {
  const X = FX(i), Y = FY(i), id = 'kt' + i, kl = GENUS.includes(o.art) ? o.art : 'neutral';
  const woerter = o.wort.split(' ');
  neu(id, `<div class="klebe"></div>
    <div class="kopf"><span class="art" id="${id}a">${o.art}</span><div class="code" id="${id}c">${CODE}</div></div>
    <div class="wort" style="font-size:${o.gr}px;line-height:${Math.round(o.gr * 1.1)}px">${woerter.map((w, k) => `<span class="w maske"><span class="m"><span class="wi" id="${id}w${k}">${w}</span></span></span>`).join(' ')}</div>
    ${o.zeile ? `<div class="pl" id="${id}p" ${o.plgr ? `style="font-size:${o.plgr}px"` : ''}><small>${o.zeile[0]}</small><span>${o.zeile[1]}</span></div>` : ''}`, '', '', `kt ${kl}${o.zeile ? '' : ' ohne'}`);
  const x = X + KT_X, y = Y + KT_Y;
  akteur(id, { x: x - 330, y, o: 0 });
  akteur(id + 'a', { s: 0, r: -8 }, true); akteur(id + 'c', {}, true);
  woerter.forEach((w, k) => akteur(`${id}w${k}`, { y: o.gr * 1.3 }, true));
  if (o.zeile) akteur(id + 'p', { o: 0, x: -40 }, true);
  // Scan-Kopf und Laserlinie
  neu(id + 'k', '<i></i>', '', 'data-frei', 'kopf64'); neu(id + 'l', '', '', 'data-frei', 'laser');
  akteur(id + 'k', { x: X + 160, y: Y + 477, o: 0 }); akteur(id + 'l', { x: X + 160, y: Y + 723, o: 0 });
  // Rollen der Rollenbahn drehen sich mit dem Karton
  const bue = el('bue' + i);
  HOOKS.push(t => bue.style.setProperty('--rw', ((wertBei(id, 'x', t) - x) / 15 * 57.3).toFixed(1) + 'deg'));
  return {
    ein: (t, d = .75) => { tw([id, id + 'k'], t, .3, { o: 1 }); tw(id, t, d, { x }, 'sanft'); cue(t, 'whoosh'); tw(id, t + d - .15, .12, { sx: 1.03, sy: .97 }, 'sinus'); tw(id, t + d - .03, .35, { sx: 1, sy: 1 }, 'sanft'); },
    // Laser fährt über den Karton; am Strichcode piept es, der Artikel-Aufkleber klebt sich auf
    scan: t => {
      const t0 = t - .6;
      tw(id + 'l', t0, .08, { o: 1 }); tw([id + 'k', id + 'l'], t0, .55, { x: X + 790 }, 'sinus'); tw(id + 'l', t0 + .55, .15, { o: 0 });
      tw(id + 'k', t0 + .7, .6, { x: X + 160 }, 'inout');
      cue(t0, 'scan'); cue(t - .07, 'ding');
      HOOKS.push(z => el(id + 'c').classList.toggle('ok', z >= t - .07));
      bump(id + 'c', t - .07, 1.08);
      tw(id + 'a', t, .5, { s: 1, r: -2 }, 'back'); cue(t + .05, 'plopp');
    },
    wort: zeiten => { [].concat(zeiten).forEach((t, k) => tw(`${id}w${k}`, t - .05, .7, { y: 0 }, 'weich')); const t0 = [].concat(zeiten)[0]; akzent(t0 + .1, .03); cue(t0, 'klick'); },
    zeile: t => { tw(id + 'p', t - .05, .35, { o: 1 }); tw(id + 'p', t - .05, .6, { x: 0 }, 'sanft'); cue(t, 'pop'); },
  };
}
// Hängeschild mit Beispielsatz: schwingt an zwei Ketten herein, der Satz tippt sich im Takt der Wortzeiten
