<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Mythos oder Wahrheit: Fahrrad fahren</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=block">
<link rel="stylesheet" href="../../werkzeug/stil.css">
<style>
.auf-brand{/*AUF_BRAND*/}
:root{
  --n200:var(--a2273fd3-5899-46bc-985c-b3c33e3c0780,#E6E3EE);
  --n400:var(--7bda698f-465c-49f5-afd3-31fe7cd36aff,#9A93AD);
  --b400:var(--f0297ed8-06f5-4ffd-83fc-e6cd5dbaa2cd,#8163EE);
  --warning:var(--c19df991-9894-4419-88fb-b2b58e36f9f7,#E0992B);
  --warning-bg:var(--c7c18918-fab3-46fc-af57-2ec14b380cb2,#FCF1DD);
  --error:var(--f694e88e-bdd3-4eb1-bf33-26a20f247ed4,#E2556A);
  --error-text:var(--d7fd93d3-1584-4a75-90a2-a9f7bacacacb,#C73E53);
  --error-bg:var(--fb93d1a9-9399-4624-95d4-83b61d28209b,#FCE7EA);
  --info:var(--3f081c40-af4e-4425-a97f-c7528bc5ad4d,#3B82F6);
}
#kamera{position:absolute;inset:0;transform-origin:960px 640px}
#himmel{position:absolute;left:-200px;top:-200px;width:2320px;height:1480px;background:linear-gradient(var(--b50),var(--b100) 60%)}
#vorne{position:absolute;left:0;top:0;width:1920px;height:1080px}
#mond{position:absolute;left:0;top:0}
/* Landschaft */
.lage{position:absolute;left:0;top:0}
.band{position:absolute;left:-400px}
.band.fahr{top:690px;height:140px;background:var(--n700)}
.band.fahr::before,.band.fahr::after{content:'';position:absolute;left:0;right:0;height:6px;background:var(--surface);opacity:.5}
.band.fahr::before{top:8px} .band.fahr::after{bottom:8px}
.band.rad{top:830px;height:70px;background:var(--b200)}
.band.geh{top:900px;height:90px;background:var(--n200);background-image:repeating-linear-gradient(90deg,transparent 0 86px,var(--n300) 86px 90px)}
.band.wiese{top:990px;height:300px;background:var(--b100)}
#nacht{position:absolute;left:-400px;top:-300px;height:1700px;background:linear-gradient(170deg,var(--b700),var(--ink));opacity:0}
.buehne.rahmen{width:1920px;height:1080px;background:none;border-radius:0}

/* Bausteine */
.chip{display:flex;align-items:center;gap:12px;padding:12px 24px;border-radius:999px;font:700 28px/34px Inter;white-space:nowrap;
  background:var(--surface);color:var(--ink);box-shadow:0 6px 20px rgba(22,19,37,.12)}
.chip svg{width:34px;height:34px;flex:none}
.chip.brand{background:var(--b500);color:var(--surface)}
.chip.gross{font-size:34px;line-height:40px;padding:14px 30px 14px 18px}
.chip.gross svg{width:44px;height:44px}
.welle{border-radius:999px;border:5px solid var(--b300);opacity:0}
.welle.gruen{border-color:var(--success)} .welle.gelb{border-color:var(--warning)} .welle.rot{border-color:var(--error)} .welle.weiss{border-color:var(--surface)}
.plakette{width:84px;height:84px;border-radius:999px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(22,19,37,.18)}
.plakette svg{width:44px}
.plakette.gruen{background:var(--success)} .plakette.rot{background:var(--error)}
.glanz{background:var(--success);opacity:0}
.glanz.rot{background:var(--error)}

/* Stationsschild am Wegrand: Tafel auf zwei Pfosten, Vorderseite Behauptung, Rückseite Ergebnis */
.tafel{width:720px;height:540px}
.tafel .pf{position:absolute;top:300px;width:22px;height:240px;border-radius:6px;background:linear-gradient(90deg,var(--n300),var(--n400))}
.tafel .flaeche{position:absolute;left:0;top:0;width:720px;height:330px;border-radius:30px;background:var(--surface);border:10px solid var(--b500);
  box-shadow:0 18px 40px rgba(22,19,37,.22)}
.tafel .flaeche::before,.tafel .flaeche::after{content:'';position:absolute;top:14px;width:14px;height:14px;border-radius:999px;background:var(--n300)}
.tafel .flaeche::before{left:16px} .tafel .flaeche::after{right:16px}
.tafel .seite{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:0 44px}
.tafel .titel{font:700 46px/56px Inter;letter-spacing:-.02em;text-align:center;color:var(--ink)}
.tafel .hinten .titel{font-size:52px;line-height:62px}
.tafel.tipp .flaeche{background:var(--b500);border-color:var(--b700)}
.tafel.tipp .titel{color:var(--surface);font-size:54px;line-height:64px}
.titel .w.rot .wi{color:var(--error-text)} .titel .w.gruen .wi{color:var(--success-text)}
.kchip{display:flex;align-items:center;gap:10px;padding:8px 20px 8px 14px;border-radius:999px;background:var(--b50);
  color:var(--b600);font:800 20px/26px Inter;letter-spacing:.1em;text-transform:uppercase}
.kchip svg{width:26px;height:26px}
.abdruck{position:absolute;right:26px;bottom:-44px;width:270px;height:88px;border-radius:18px;border:7px solid var(--error);
  background:var(--error-bg);color:var(--error-text);display:flex;align-items:center;justify-content:center;
  font:800 44px/1 Inter;letter-spacing:.1em;text-transform:uppercase;box-shadow:0 8px 20px rgba(22,19,37,.14)}
.abdruck.stimmt{border-color:var(--success);background:var(--success-bg);color:var(--success-text)}
.abdruck.gross{position:absolute;right:auto;bottom:auto;width:300px;height:96px;font-size:50px}
.tinte{border-radius:30px;border:6px solid var(--error);opacity:0}
.tinte.stimmt{border-color:var(--success)}
/* Schranke mit Anzeige (Countdown) */
.schranke{width:300px;height:300px}
.schranke .post{position:absolute;left:258px;top:60px;width:24px;height:240px;border-radius:8px;background:linear-gradient(90deg,var(--n300),var(--n400))}
.schranke .arm{position:absolute;left:20px;top:253px;width:262px;height:26px;border-radius:13px;transform-origin:250px 13px;
  background:repeating-linear-gradient(90deg,var(--error) 0 34px,var(--surface) 34px 68px);box-shadow:0 4px 10px rgba(22,19,37,.2)}
.schranke .arm::after{content:'';position:absolute;right:6px;top:3px;width:20px;height:20px;border-radius:999px;background:var(--n400)}
.anzeige{width:130px;height:130px;border-radius:999px;background:var(--b700);box-shadow:0 8px 22px rgba(22,19,37,.3);border:6px solid var(--surface)}
.anzeige.rot{background:var(--error)} .anzeige.gruen{background:var(--success)}
.anzeige svg.ring{position:absolute;inset:4px;width:110px;height:110px}
.anzeige b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:800 60px/1 Inter;color:var(--surface)}
.anzeige .erg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.anzeige .erg svg{width:70px}

/* Porträts */
.portrait{border-radius:999px;overflow:hidden;background:linear-gradient(160deg,var(--b200),var(--b300));border:7px solid var(--surface);
  box-shadow:0 6px 20px rgba(22,19,37,.12)}
.portrait .ebene{position:absolute;left:0;top:0;width:100%;height:100%}
.portrait .figur{position:absolute;left:0;top:6%;width:100%;height:100%;transform-origin:50% 100%}
.portrait .augen{transform-origin:50% 45%}
/* Fahrrad mit Fahrer: Kopf (Porträt + Helm) über dem Sattel */
.fahrer{width:300px;height:300px}
.fahrer>svg{position:absolute;left:0;top:0;width:300px;height:300px}
.fahrer .kopf{position:absolute;left:66px;top:28px;width:120px;height:120px}
.fahrer .kopf .portrait{position:absolute;inset:0;border-width:6px}
.fahrer .helm{position:absolute;left:26px;top:-8px;width:68px}
.fahrer .akkul{position:absolute;left:183px;top:103px;width:58px}

/* 1 · Gesetzbuch */
.gbuch{width:540px;height:340px}
.gseite{position:absolute;top:0;width:270px;height:340px;background:var(--surface);box-shadow:0 12px 30px rgba(22,19,37,.14);
  padding:32px 30px;display:flex;flex-direction:column;gap:14px}
.gseite.l{left:0;border-radius:22px 4px 4px 22px;transform-origin:100% 50%} .gseite.r{left:270px;border-radius:4px 22px 22px 4px}
.gseite i{display:block;height:10px;border-radius:5px;background:var(--n200)}
.gseite .para{font:800 44px/48px Inter;color:var(--b500)}
.gseite b{font:800 40px/46px Inter;color:var(--ink)}
.gseite .leer{flex:1;border-radius:14px;border:3px dashed var(--n300)}
.gseite .xp{position:absolute;left:93px;top:170px}
.gdeckel{position:absolute;left:270px;top:0;width:270px;height:340px;border-radius:4px 22px 22px 4px;transform-origin:0 50%;
  background:linear-gradient(155deg,var(--b500),var(--b700));display:flex;align-items:center;justify-content:center;
  font:800 130px/1 Inter;color:var(--b200);box-shadow:0 12px 30px rgba(22,19,37,.18)}
/* 2 · Akku */
.akku{display:flex;align-items:center;gap:16px;padding:14px 30px 14px 20px;border-radius:999px;background:var(--surface);
  font:800 36px/42px Inter;color:var(--ink);white-space:nowrap;box-shadow:0 8px 24px rgba(22,19,37,.25)}
.batt{position:relative;width:86px;height:44px;border:5px solid var(--ink);border-radius:10px;padding:3px;display:flex;gap:3px}
.batt::after{content:'';position:absolute;right:-12px;top:8px;width:7px;height:12px;border-radius:0 4px 4px 0;background:var(--ink)}
.batt i{flex:1;border-radius:3px;background:var(--success)}
/* 3 · Handy */
.handy{width:80px;height:140px;border-radius:18px;background:linear-gradient(155deg,var(--b600),var(--b700));padding:8px 7px;
  box-shadow:0 8px 20px rgba(22,19,37,.25)}
.handy .schirm{position:relative;width:100%;height:100%;border-radius:11px;background:var(--b100);overflow:hidden}
.handy .schirm .gruen{position:absolute;inset:0;background:var(--success-bg)}
.handy .sym{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.handy .sym svg{width:48px}
/* 7 · Notizzettel */
.zettel{width:540px;padding:26px 30px 28px;border-radius:24px;background:var(--surface);box-shadow:0 12px 30px rgba(22,19,37,.16);display:flex;flex-direction:column;gap:16px}
.zettel .zeile{font:800 44px/52px Inter;color:var(--ink);white-space:pre;min-height:42px}
.zettel .zeile .cursor{display:inline-block;width:4px;height:34px;margin-left:3px;vertical-align:-5px;background:var(--b500)}
.zettel .platz{display:flex;gap:10px}
.zettel .platz i{width:50px;height:18px;border-radius:9px;background:var(--n200)}
/* 8 · Streckenkarte */
#karte{position:absolute;inset:0;background:linear-gradient(150deg,var(--b500),var(--b700));clip-path:inset(0 0 0 100%)}
#karte svg.route{position:absolute;left:0;top:0;width:1920px;height:1080px}
.halt{position:absolute;left:0;top:0;width:76px;height:76px;border-radius:999px;background:var(--surface);border:7px solid var(--b300);
  display:flex;align-items:center;justify-content:center;font:800 32px/1 Inter;color:var(--b600);box-shadow:0 8px 22px rgba(22,19,37,.3)}
.halt.mythos{border-color:var(--error)} .halt.stimmt{border-color:var(--success)}
.hname{position:absolute;left:0;top:0;font:800 32px/38px Inter;color:var(--surface);white-space:nowrap}
.hstempel{position:absolute;left:0;top:0;width:170px;height:54px;border-radius:12px;border:5px solid var(--error);background:var(--error-bg);
  color:var(--error-text);display:flex;align-items:center;justify-content:center;font:800 26px/1 Inter;letter-spacing:.1em;text-transform:uppercase}
.hstempel.stimmt{border-color:var(--success);background:var(--success-bg);color:var(--success-text)}
.stand{position:absolute;left:0;top:0;display:flex;align-items:center;gap:14px;padding:14px 30px 14px 16px;border-radius:999px;background:var(--surface);font:800 38px/44px Inter;white-space:nowrap;
  box-shadow:0 10px 30px rgba(22,19,37,.25)}
.stand svg{width:46px;height:46px}
.stand.mythos{color:var(--error-text)} .stand.stimmt{color:var(--success-text)}
.mini-kopf{position:absolute;left:0;top:0;width:84px;height:84px;margin:-42px 0 0 -42px}
.mini-kopf .portrait{position:absolute;inset:0;border-width:5px}

/* Abspann */
.deckel{position:absolute;inset:0;background:linear-gradient(135deg,var(--b500),var(--b700));clip-path:circle(0% at 50% 50%)}
.deckel .gross{font:800 96px/106px Inter;letter-spacing:-.03em;text-align:center}
.deckel .klein{font:400 40px/54px Inter;color:var(--b100);margin-top:24px;text-align:center;max-width:1300px}
</style></head><body>

<script>
/* ---------- Aufnahme: Satz- und Wortzeiten aus sprache.json ---------- */
const VERSATZ = 0.7;
window.SPRACHE = { datei: 'sprache.mp3', versatz: VERSATZ };
const A = s => s + VERSATZ;
const W = (m, n) => A(wort(m, satz(n).start - .01));          // Filmzeit des Worts im Satz n (oder danach)
const WE = (m, n) => A(wortEnde(m, satz(n).start - .01));
const SE = n => A(satz(n).ende);
const ENDE_SPRACHE = SE(SPRACHDATEN.saetze.length);
const WELT = document.getElementById('welt'), VORNE = document.getElementById('vorne');

const el = id => typeof id === 'string' ? (id.startsWith('#') ? $(id) : document.getElementById(id)) : id;
const _tw = tw; tw = (ids, ...r) => _tw([].concat(ids).map(el), ...r);
const _ak = akteur; akteur = (id, ...r) => _ak(el(id), ...r);
const wertBei = (id, p, t) => wert(AKTEURE.get(el(id)), p, t);
const pop = (id, t, basis, snd = 'pop', e = 'back') => { akteur(id, { ...basis, s: 0 }); tw(id, t, e === 'back' ? .5 : .65, { s: basis.s ?? 1 }, e); if (snd) cue(t, snd); };
const ein = (id, t, basis, von = { y: 70 }, snd = null) => {
  akteur(id, { ...basis, o: 0, x: basis.x + (von.x || 0), y: basis.y + (von.y || 0), r: von.r || 0 });
  tw(id, t, .5, { o: 1 }, 'out'); tw(id, t, .6, { x: basis.x, y: basis.y, r: basis.r || 0 }, 'sanft');
  tw(id, t + .3, .12, { sy: .93, sx: 1.05 }, 'sinus'); tw(id, t + .42, .4, { sy: 1, sx: 1 }, 'sanft');
  if (snd) cue(t, snd);

    SPUREN.forEach(s => s.setAttribute('opacity', (1 - .55 * p).toFixed(2))); });
  tw('gl4g', tP, .25, { o: .3 }); tw('gl4g', tP + .8, .4, { o: 0 });
  pop('x4', tP + .05, { x: X + 860, y: 640 }, 'plopp'); wackeln('x4', tP + .5, 3, 4); akzent(tP + .05, .045);
  spur(WE('Gehweg', 22) + .15, 'rad', 560, .55);
  aus('x4', WE('Gehweg', 22) + .2, .3);
  // Auf dem Gehweg nur mit Schild: „Radverkehr frei“ klappt herunter – im Schritttempo auf den Gehweg
  const tSch = W('Schild', 23) - .5;
  akteur('zs4', { x: X + 1150, y: 985 - 165, o: 0, sy: 0 }); AKTEURE.get(el('zs4')).el.style.transformOrigin = '50% 100%';
  set('zs4', tSch, { o: 1 }); tw('zs4', tSch, .45, { sy: 1 }, 'back'); cue(tSch, 'pop');
  akteur('zsp4', { sy: 0 }, true); tw('zsp4', tSch + .35, .45, { sy: 1 }, 'back'); cue(tSch + .4, 'klick');
  bump('zsp4', W('Radfahren', 23), 1.08);
  const tEr = W('erlaubt', 23) - .1;
  akteur('gl4z', { x: X + 960, y: 945, o: 0 }); tw('gl4z', tEr, .3, { o: .35 }); cue(tEr, 'erfolg'); akzent(tEr, .035);
  spur(tEr, 'geh', 620, .6);
  tw(Y, tEr + .6, SE(23) + .2 - tEr - .6, { x: 760 }, 'sinus');
}

/* ---------- 5 · Radweg-Pflicht – Mythos ---------- */
{
  const tAb = SE(23) + .2, tAn = A(satz(24).start) - .15;
  reise(tAb, tAn - tAb, CAM[5]); spur(tAb + .1, 'rad', 560, tAn - tAb - .1); bremsen(Y, tAn - .1);
  const { X, tF } = station(5, { c: 24, v: 25, u: 'mythos', titel: 'MYTHOS – nur mit blauem Schild' });
  neu(`<div class="a" id="schild5" style="width:240px;height:420px;transform-origin:50% 100%" data-frei><div style="position:absolute;left:113px;top:165px;width:14px;height:255px;border-radius:6px;background:linear-gradient(90deg,var(--n300),var(--n400))"></div>
      <div style="position:absolute;left:0;top:0;width:240px">{{schild-radweg}}</div></div>
    <div class="a chip brand gross" id="pflicht5">Pflicht</div>
    <svg class="a" id="pfeile5" viewBox="0 0 560 200" style="width:560px;height:200px" data-frei>
      <g id="pz5" stroke="var(--b500)" fill="none" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"><path id="pz5p" pathLength="1" d="M10 150H500"/><path id="pz5k" d="M478 124l30 26-30 26"/></g>
      <g id="pa5" stroke="var(--surface)" fill="none" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"><path id="pa5p" pathLength="1" d="M10 150H500"/><path id="pa5k" d="M478 124l30 26-30 26"/></g>
      <g id="pb5" stroke="var(--surface)" fill="none" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"><path id="pb5p" pathLength="1" d="M10 150C200 150 230 50 500 50"/><path id="pb5k" d="M478 24l30 26-30 26"/></g>
    </svg>
    <div class="a glanz" id="gl5f" style="width:1900px;height:140px" data-frei></div>
    <div class="a plakette gruen" id="ok5">${tpl('svgHakenW')}</div>`);
  // Pflicht ist der Radweg: der Radweg leuchtet kurz
  akteur('gl5f', { x: X + 960, y: 760, o: 0 });
  // blaues, rundes Schild: es wächst aus dem Boden am Wegrand
  const tB = W('blaues', 26) - .15;
  akteur('schild5', { x: X + 800, y: 985 - 210, o: 0, sy: 0 });
  set('schild5', tB, { o: 1 }); tw('schild5', tB, .7, { sy: 1 }, 'back'); cue(tB, 'pop');
  bump('schild5', W('Schild', 26) - .05, 1.08); akzent(W('Schild', 26), .035);
  // mit Fahrrad: ein Pfeil zeigt – du musst auf dem Radweg bleiben; Chip „Pflicht“
  akteur('pfeile5', { x: X + 700 + 270, y: 862 - 150 + 100 });
  const zeichne = (g, t0, d = .5) => HOOKS.push(t => {
    const p = E.inout(clamp((t - t0) / d)), pf = el(g + 'p'), kk = el(g + 'k');
    pf.style.strokeDasharray = '1 1'; pf.style.strokeDashoffset = 1 - p; kk.setAttribute('opacity', p > .95 ? 1 : 0);
  });
  const tP = W('Fahrrad', 26) - .2, tSo = W('Sonst', 27) - .25;
  HOOKS.push(t => { el('pz5').setAttribute('opacity', t > tP && t < tSo ? 1 : 0); });
  zeichne('pz5', tP); cue(tP, 'scan');
  pop('pflicht5', tP + .3, { x: X + 640, y: 470 }, 'plopp'); akzent(tP + .3, .03);
  wackeln('schild5', W('steht', 26), 2, 2);
  // Sonst: das Schild kippt weg, zwei Pfeile – beide grün, Yusuf nimmt die Straße
  tw('schild5', tSo, .5, { r: 80, o: 0 }, 'in'); cue(tSo, 'whoosh'); aus('pflicht5', tSo, .3);
  const tA = tSo + .4;
  HOOKS.push(t => { ['pa5', 'pb5'].forEach(g => el(g).setAttribute('opacity', t > tA ? 1 : 0)); });
  zeichne('pa5', tA, .45); zeichne('pb5', tA + .1, .45); cue(tA, 'scan');
  const tD = W('darfst', 27) - .05;
  HOOKS.push(t => { const f = t >= tD ? 'var(--success)' : 'var(--surface)'; ['pa5', 'pb5'].forEach(g => el(g).setAttribute('stroke', f)); });
  cue(tD, 'ding'); cue(tD + .12, 'ding'); akzent(tD, .03);
  const tSt = W('Straße', 27) - .25;
  spur(tSt, 'nah', 760, .9); cue(tSt, 'whoosh');
  tw('gl5f', tSt + .3, .3, { o: .22 }); tw('gl5f', tSt + 1.3, .4, { o: 0 });
  HOOKS.push(t => { ['pa5', 'pb5'].forEach(g => el(g).style.opacity = t > tSt + .5 ? (1 - clamp((t - tSt - .5) / .4)).toFixed(2) : ''); });
  pop('ok5', tSt + .9, { x: X + 780, y: 470 }, 'erfolg');
}

/* ---------- 6 · Zu zweit nebeneinander – Stimmt ---------- */
{
  const tAb = SE(27) + .2, tAn = A(satz(28).start) - .15;
  reise(tAb, tAn - tAb, CAM[6]); tw(Y, tAb, tAn - tAb, { x: 600 }, 'inout'); bremsen(Y, tAn - .1);
  const { X, tF } = station(6, { c: 28, v: 29, u: 'stimmt', titel: 'STIMMT – wenn niemand behindert wird', boden: 'nah' });
  // Zu zweit: Kwame kommt auf der äußeren Spur dazu
  const SK = 1;
  rad('rk', { x: -300, y: yRad('fern', SK), s: SK }, { vorne: true, farbe: 'var(--b300)' });
  const tKw = W('zweit', 28) - .4;
  tw('rk', tKw, 1.1, { x: 700 }, 'out'); cue(tKw, 'whoosh'); bremsen('rk', tKw + .95);
  klingel('rk', tKw + 1.1, 'wkK'); froh('pk', tKw + 1.1);
  // Die Schranke ist offen: beide fahren langsam weiter, die Klingeln klingeln im Takt
  const t0 = tF + .5, tEnde = SE(31) + .2;
  CAM[6.5] = rollen(t0, tEnde, 120, .7, .7);
  HOOKS.push(t => { if (t > t0 && t < tEnde + .5) { el('rk').style.transform += ` translateY(${(1.3 * Math.sin(t * 9 + 1)).toFixed(1)}px)`; el(Y).style.transform += ` translateY(${(1.3 * Math.sin(t * 9)).toFixed(1)}px)`; } });
  const tKl = W('Aber', 30) - .1;
  klingel(Y, tKl, 'wkY'); klingel('rk', tKl + .32, 'wkK'); klingel(Y, tKl + .64, null); klingel('rk', tKl + .96, null);
  froh('py', tKl);
  // behindert: von hinten kommt ein Auto und muss bremsen, Warn-Dreieck
  const CY = BODEN.fern - 44 * 380 / 160, tC = W('niemanden', 30) - .4, CX = 390;
  akteur('auto6', { x: -400, y: CY });
  tw('auto6', tC, 1, { x: CX }, 'out'); cue(tC, 'whoosh');
  tw('auto6', tC + .85, .1, { r: 2 }, 'sinus'); tw('auto6', tC + .95, .35, { r: 0 }, 'sanft');
  const tW = W('behindert', 30);
  pop('warn6', tW, { x: CX - 20, y: CY - 150 }, 'plopp'); wackeln('warn6', tW + .5, 4, 3); akzent(tW, .045);
  froh('pk', tW, false); froh('py', tW, false);
  // hintereinander: Kwame lässt sich zurückfallen und reiht sich hinter Yusuf ein, das Auto überholt mit Abstand
  const tH = W('Sonst', 31);
  tw(Y, tH, 1.1, { x: 820 }, 'inout');
  tw('rk', tH, 1.3, { x: 440, y: yRad('nah', SK), s: SK }, 'inout'); cue(tH, 'whoosh');
  tw('auto6', tH, .4, { x: CX - 60 }, 'out');
  const tU = W('hintereinander', 31) + .45;
  aus('warn6', tU - .2, .3);
  tw('auto6', tU, 1.4, { x: 2350 }, 'in'); cue(tU + .2, 'whoosh');
  froh('pk', tU + .3); froh('py', tU + .4);
  neu(`<div class="a plakette gruen" id="ok6">${tpl('svgHakenW')}</div>`, VORNE);
  pop('ok6', tU + .9, { x: 330, y: 420 }, 'erfolg'); akzent(tU + .9, .035);
  aus('ok6', SE(31) + .5, .3);
}

/* ---------- 7 · Ziel: der Betrieb – Tipp: Rahmen anschließen ---------- */
{
  const tAb = SE(31) + .5, tAn = A(satz(32).start) - .3;
  reise(tAb, tAn - tAb, CAM[7]);
  tw('rk', tAb, .9, { x: -400 }, 'in');                    // Kwame biegt ab
  spur(tAb, 'rad', 560, tAn - tAb); bremsen(Y, tAn - .1);
  const X = CAM[7];
  neu(`<div class="a" id="betrieb7" style="width:420px">{{betrieb}}</div>
    <div class="a tafel tipp" id="tafel7" style="transform-origin:50% 100%"><div class="pf" style="left:100px"></div><div class="pf" style="right:100px"></div>
      <div class="flaeche"><div class="seite"><div id="tt7"><div class="titel">Tipp: Rahmen anschließen</div></div></div></div></div>
    <div class="a" id="stand7a" style="width:260px" data-gruppe="rad7a">{{fahrradstaender}}</div>
    <div class="a" id="stand7b" style="width:260px" data-gruppe="rad7b">{{fahrradstaender~b}}</div>
    <div class="a fahrer" id="r7b" data-gruppe="rad7b"></div>
    <svg class="a" id="vr7b" viewBox="0 0 80 80" style="width:85px;height:85px" data-gruppe="rad7b"></svg>
    <div class="a" id="kleinschloss7" style="width:60px" data-gruppe="rad7b">{{schloss}}</div>
    <div class="a welle" id="welle7" style="width:220px;height:220px" data-frei></div>
    <div class="a plakette rot" id="x7">${tpl('svgXW')}</div>
    <div class="a plakette gruen" id="ok7a">${tpl('svgHakenW')}</div>
    <div class="a zettel" id="zettel7"><div class="zeile" id="tipp7"></div><div class="platz" id="platz7"><i></i><i></i><i></i><i></i><i></i></div></div>
    <div class="a" id="stift7" style="width:100px" data-frei>{{stift}}</div>
    <div class="a plakette gruen" id="ok7b" data-frei>${tpl('svgHakenW')}</div>`);
  // Der Betrieb und das Tipp-Schild
  akteur('betrieb7', { x: X + 330, y: 690 - 58 * 420 / 160 });
  const tT = A(satz(32).start) - .4;
  akteur('tafel7', { x: X + 1420, y: 430, sy: 0, o: 0 }); set('tafel7', tT - .1, { o: 1 }); tw('tafel7', tT - .1, .6, { sy: 1 }, 'back'); cue(tT, 'pop');
  titelEin('tt7', tT + .2);
  // zwei Fahrradständer auf dem Gehweg, rechts steht ein Rad – nur das Vorderrad ist abgeschlossen
  const G = 975, SA = 760, SB = 1240, SYs = G - 107;
  ein('stand7a', tT, { x: X + SA, y: SYs }, { y: 60 }); ein('stand7b', tT + .1, { x: X + SB, y: SYs }, { y: 60 });
  rad('r7b', { x: X + SB - 15, y: G - 135 * SY, s: SY }, { ohneVR: true, staender: true, farbe: 'var(--b400)' });
  ein('r7b', tT + .15, { x: X + SB - 15, y: G - 135 * SY, s: SY }, { y: 60 });
  const [vx, vy] = radPunkt('r7b', 182, 110, tT + 2);
  el('vr7b').innerHTML = `<circle cx="40" cy="40" r="34" fill="none" stroke="var(--ink)" stroke-width="8"/><circle cx="40" cy="40" r="27" fill="none" stroke="var(--n300)" stroke-width="2"/>
    <path d="M14 40H66M40 14V66M21.6 21.6L58.4 58.4M58.4 21.6L21.6 58.4" stroke="var(--n300)" stroke-width="1.6"/><circle cx="40" cy="40" r="5.5" fill="var(--n300)"/>`;
  ein('vr7b', tT + .15, { x: vx, y: vy, s: 1.25 * SY * 80 / 85 }, { y: 60 });
  ein('kleinschloss7', tT + .25, { x: vx + 4, y: vy - 30 }, { y: 60 });
  // Schließ dein Rad: Yusuf steigt ab und schiebt das Rad an den Ständer
  const tR = W('Schließ', 32) - .35;
  tw('kopfY', tR, .5, { x: -150, y: 80 }, 'inout', { bogen: 60 }); cue(tR, 'pop');
  tw(Y, tR + .4, .9, { x: SA - 15, y: G - 135 * SY }, 'inout'); cue(tR + .4, 'whoosh');
  tw(`${Y}-st`, tR + 1.2, .35, { r: 13 }, 'back'); cue(tR + 1.3, 'klick');
  // Rahmen: das Bügelschloss legt sich um Rahmen und Ständer und schnappt zu, der Schlüssel dreht sich
  const tRa = W('Rahmen', 32) - .3, [bx, by] = radPunkt(Y, 128, 96, tR + 2);
  akteur('buegel7', { x: bx, y: by - 260, o: 0, s: .9 });
  tw('buegel7', tRa, .15, { o: 1 }); tw('buegel7', tRa, .4, { y: by, s: 1 }, 'in'); landen('buegel7', tRa + .4);
  cue(tRa + .4, 'klick'); cue(tRa + .48, 'plopp'); akzent(tRa + .4, .05);
  akteur('schluessel7', { x: bx + 50, y: by + 26, o: 0, s: .6 });
  tw('schluessel7', tRa + .55, .2, { o: 1, s: 1 }, 'back');
  tw('schluessel7', tRa + .8, .3, { r: 55 }, 'inout'); cue(tRa + 1.05, 'klick');
  tw('schluessel7', tRa + 1.2, .3, { r: 0 }, 'inout'); tw('schluessel7', tRa + 1.55, .35, { o: 0, x: bx + 110 }, 'in');
  // an etwas Festem – zum Beispiel an einem Fahrradständer
  bump('stand7a', W('Festem', 32), 1.05);
  welle('welle7', W('Fahrradständer', 32), X + SA, SYs - 30, 1); cue(W('Fahrradständer', 32), 'ding');
  bump('stand7b', W('Fahrradständer', 32) + .12, 1.06);
  // Nimm ein gutes Schloss: das rechte Rad hebt ab und schwebt weg – nur das Vorderrad bleibt, rotes ✕
  const tN = W('Nimm', 33) - .25;
  tw('r7b', tN, .3, { y: G - 135 * SY - 30 }, 'out'); tw('r7b', tN + .3, 1.1, { x: X + SB + 360, y: G - 520, o: 0, r: 3 }, 'in'); cue(tN, 'whoosh');
  pop('x7', W('gutes', 33) - .05, { x: X + SB, y: SYs - 165 }, 'plopp'); wackeln('x7', W('gutes', 33) + .4, 3, 4);
  froh('py', W('gutes', 33), false);
  const tS = W('Schloss', 33) - .1;
  bump('buegel7', tS, 1.15); pop('ok7a', tS + .1, { x: X + SA + 90, y: SYs - 140 }, 'erfolg'); akzent(tS, .04); froh('py', tS + .1);
  // Rahmennummer: auf dem Zettel tippt sich „Rahmennummer:“, der Stift schreibt, Haken
  const tZ = W('schreib', 34) - .35;
  ein('zettel7', tZ, { x: X + 760, y: 300 }, { y: -50 }, 'whoosh');
  const TEXT = 'Rahmennummer:', z0 = W('Rahmennummer', 34) - .05, z1 = WE('Rahmennummer', 34) + .1;
  for (let i = 0; i < TEXT.length; i += 2) cue(z0 + i * (z1 - z0) / TEXT.length, 'tipp');
  HOOKS.push(t => { const n = Math.round(clamp((t - z0) / (z1 - z0)) * TEXT.length);
    el('tipp7').innerHTML = TEXT.slice(0, n) + `<span class="cursor" style="opacity:${t > tZ + .3 && Math.floor(t * 2.5) % 2 === 0 ? 1 : 0}"></span>`; });
  const PL = [...el('platz7').querySelectorAll('i')];
  HOOKS.push(t => PL.forEach((p, i) => { p.style.opacity = t > z1 + .1 + i * .1 ? 1 : 0; }));
  akteur('stift7', { x: X + 920, y: 470, o: 0, s: .8 });
  tw('stift7', z1 - .2, .2, { o: 1 }); tw('stift7', z1 - .2, .4, { x: X + 620, y: 350, s: 1 }, 'inout', { bogen: 30 });
  tw('stift7', z1 + .2, .6, { x: X + 860 }, 'inout'); cue(z1 + .2, 'kritzeln');
  tw('stift7', z1 + .85, .4, { x: X + 940, y: 450, o: 0, s: .8 }, 'in');
  pop('ok7b', z1 + .9, { x: X + 1010, y: 380 }, 'erfolg'); bump('zettel7', z1 + .9, 1.05);
}

/* ---------- 8 · Die Strecke: Wie viele hattest du richtig? ---------- */
{
  const tW = SE(34) + .1;
  HOOKS.push(t => { const p = E.inout(clamp((t - tW) / .7)); el('karte').style.clipPath = `inset(0 0 0 ${(100 - 100 * p).toFixed(2)}%)`; });
  cue(tW, 'whoosh');
  const K = el('karte'), pfad = el('routeP'), L = pfad.getTotalLength();
  const HALTE = [['Helm', 'mythos'], ['Licht', 'stimmt'], ['Handy', 'stimmt'], ['Gehweg', 'mythos'], ['Radweg', 'mythos'], ['Zu zweit', 'stimmt']];
  el('standM').innerHTML = `${tpl('svgX')}<span><span id="zM">0</span> × Mythos</span>`;
  el('standS').innerHTML = `${tpl('svgHaken')}<span><span id="zS">0</span> × Stimmt</span>`;
  pop('standM', tW + .4, { x: 760, y: 200 }, null); pop('standS', tW + .5, { x: 1160, y: 200 }, null);
  // Linie zeichnet sich, Yusuf fährt sie ab, an jedem Halt schlägt ein Stempel auf
  const tL0 = tW + .5, tL1 = W('richtig', 35) + 1.1, U = HALTE.map((_, i) => .06 + i * .16);
  const LAND = [];
  HALTE.forEach(([name, u], i) => {
    const pt = pfad.getPointAtLength(U[i] * L), tH = tL0 + (tL1 - tL0) * U[i] / U.at(-1) * .95;
    K.insertAdjacentHTML('beforeend', `<div class="halt" id="halt${i}">${i + 1}</div><div class="hname" id="hn${i}">${name}</div><div class="hstempel ${u}" id="hs${i}">${u === 'mythos' ? 'Mythos' : 'Stimmt'}</div>`);
    akteur('halt' + i, { x: pt.x, y: pt.y, s: 0 }); tw('halt' + i, tH - .3, .45, { s: 1 }, 'back');
    akteur('hn' + i, { x: pt.x, y: pt.y + 66, o: 0 }); tw('hn' + i, tH - .2, .4, { o: 1 });
    akteur('hs' + i, { x: pt.x, y: pt.y - 92, o: 0, s: 1.5, r: -3 }); tw('hs' + i, tH, .05, { o: 1 }); tw('hs' + i, tH, .22, { s: 1 }, 'out');
    cue(tH, 'plopp'); LAND.push([tH, u]);
    klasse('halt' + i, u, tH);
    bump(u === 'mythos' ? 'standM' : 'standS', tH, 1.08);
  });
  HOOKS.push(t => {
    el('zM').textContent = LAND.filter(([z, u]) => u === 'mythos' && t >= z).length;
    el('zS').textContent = LAND.filter(([z, u]) => u === 'stimmt' && t >= z).length;
  });
  // Yusuf (klein) fährt die Strecke ab
  const tY0 = tL0 - .2, tY1 = LAND.at(-1)[0] + .6;
  akteur('miniY', { s: 0 }, true); tw('miniY', tY0, .4, { s: 1 }, 'back');
  HOOKS.push(t => { const p = E.inout(clamp((t - tY0) / (tY1 - tY0))), pt = pfad.getPointAtLength((.02 + p * .96) * L);
    el('miniY').style.left = pt.x + 'px'; el('miniY').style.top = (pt.y - 4) + 'px'; });
  const tE = LAND.at(-1)[0] + .5;
  huepfen('standM', tE, 16); huepfen('standS', tE + .12, 16); cue(tE, 'erfolg');
  froh(el('miniY').querySelector('.portrait'), tE);
}

/* ---------- Abspann ---------- */
const AB = Math.max(ENDE_SPRACHE, 0) + 2.6;
HOOKS.push(t => { const p = E.inout(clamp((t - AB) / .7)); $('#abspann').style.clipPath = `circle(${(p * 120).toFixed(2)}% at 50% 50%)`; });
cue(AB, 'whoosh');
akteur('asTitel', { o: 0, y: 50 }, true); tw('asTitel', AB + .5, .7, { o: 1, y: 0 }, 'weich');
akteur('asUnter', { o: 0, y: 36 }, true); tw('asUnter', AB + .85, .6, { o: 1, y: 0 }, 'weich');

start(AB + 3.8, AB + 2);
</script>
