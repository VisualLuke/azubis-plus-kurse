<script src="../../werkzeug/motor.js"></script>
<script>
/* ---------- Aufnahme ---------- */
const VERSATZ = 0.7;
window.SPRACHE = { datei: 'sprache.mp3', versatz: VERSATZ };
const A = s => s + VERSATZ;
const W = (m, n) => A(wort(m, satz(n).start - .01));
const WE = (m, n) => A(wortEnde(m, satz(n).start - .01));
const SA = n => A(satz(n).start);
const SE = n => A(satz(n).ende);
const ENDE_SPRACHE = SE(SPRACHDATEN.saetze.length);
const WELT = document.getElementById('welt');

/* ---------- Helfer (wie Lernvideo 36/39) ---------- */
const el = id => typeof id === 'string' ? (id.startsWith('#') ? $(id) : document.getElementById(id)) : id;
const _tw = tw; tw = (ids, ...r) => _tw([].concat(ids).map(el), ...r);
const _ak = akteur; akteur = (id, ...r) => _ak(el(id), ...r);
const wertBei = (id, p, t) => wert(AKTEURE.get(el(id)), p, t);
const pop = (id, t, basis, snd = 'pop', e = 'back') => { akteur(id, { ...basis, s: 0 }); tw(id, t, e === 'back' ? .5 : .65, { s: basis.s ?? 1 }, e); if (snd) cue(t, snd); };
const ein = (id, t, basis, von = { y: 70 }, snd = null) => {
  akteur(id, { ...basis, o: 0, x: basis.x + (von.x || 0), y: basis.y + (von.y || 0), r: von.r || 0 });
  tw(id, t, .5, { o: 1 }, 'out'); tw(id, t, .6, { x: basis.x, y: basis.y, r: basis.r || 0 }, 'sanft');
  tw(id, t + .3, .12, { sy: .93, sx: 1.05 }, 'sinus'); tw(id, t + .42, .4, { sy: 1, sx: 1 }, 'sanft');
  if (snd) cue(t, snd);
};
const aus = (ids, t, d = .35) => tw(ids, t, d, { o: 0, s: .85 }, 'in');
const weg = (ids, t, d = .4) => tw(ids, t, d, { o: 0 }, 'inout');
const wackeln = (id, t, n = 3, w = 3) => { for (let i = 0; i < n; i++) tw(id, t + i * .1, .1, { r: i % 2 ? w : -w }, 'sinus'); tw(id, t + n * .1, .25, { r: 0 }, 'sinus'); };
const huepfen = (id, t, h = 18) => {
  const y = wertBei(id, 'y', t);
  tw(id, t, .08, { sy: .94, sx: 1.04 }, 'sinus');
  tw(id, t + .08, .36, { y }, 'sinus', { bogen: h }); tw(id, t + .08, .14, { sy: 1.04, sx: .97 }, 'sinus');
  tw(id, t + .44, .08, { sy: .95, sx: 1.04 }, 'sinus'); tw(id, t + .52, .3, { sy: 1, sx: 1 }, 'sanft');
};
const bump = (id, t, s = 1.1) => { const s0 = wertBei(id, 's', t); tw(id, t, .12, { s: s0 * s }, 'sinus'); tw(id, t + .12, .4, { s: s0 }, 'sanft'); };
const flug = (id, t0, d, x, y, h = 120, extra = {}) => tw(id, t0, d, { x, y, ...extra }, 'inout', { bogen: h });
const landen = (id, t) => { tw(id, t, .08, { sy: .86, sx: 1.08 }, 'sinus'); tw(id, t + .08, .45, { sy: 1, sx: 1 }, 'sanft'); };
const schweben = (ids, a = 4) => [].concat(ids).forEach(id => { AKTEURE.get(el(id)).basis.schweben = a; });
const lerp = (a, b, p) => a + (b - a) * p;
const tpl = id => document.getElementById(id).innerHTML;
const kopie = (id, p) => tpl(id).replace(/id="([^"]+)"/g, `id="$1_${p}"`).replace(/url\(#([^)]+)\)/g, `url(#$1_${p})`);
const neu = (id, inhalt, stil = '', attr = '', klasse = '', in_ = WELT) => { in_.insertAdjacentHTML('beforeend', `<div class="a ${klasse}" id="${id}" style="${stil}" ${attr}>${inhalt}</div>`); return id; };
const bild = (id, t, breite, attr = '') => neu(id, kopie(t, id), `width:${breite}px`, attr);
const rel = (id, basis = {}, o = null) => { if (o) el(id).style.transformOrigin = o; akteur(id, basis, true); };
let WN = 0;
const welle = (t, x, y, gr = 200, farbe = null, d = .9) => {
  const id = 'wl' + WN++; neu(id, '', `width:${gr}px;height:${gr}px${farbe ? ';border-color:' + farbe : ''}`, 'data-frei', 'welle');
  akteur(id, { x, y, o: 0, s: .8 }); set(id, t, { o: .9, s: .8 }); tw(id, t, d, { o: 0, s: 1.6 }, 'weich');
};
const kurve = (keys, t, d = .45) => { let v = keys[0][1]; for (const [a, w, dd] of keys.slice(1)) if (t >= a) v = lerp(v, w, E.inout(clamp((t - a) / (dd ?? d)))); return v; };
// Wörter einer Sprechblase nacheinander (Breite steht von Anfang an)
const woerter = (id, zeiten) => { const ws = [...el(id).querySelectorAll('.wd')]; ws.forEach((w, i) => { akteur(w, { o: 0, y: 8 }, true); tw(w, zeiten[i], .25, { o: 1, y: 0 }, 'out'); }); };
// Text tippt sich
const tippen = (id, text, t1, t2, n = 8) => {
  el(id).innerHTML = `<span class="tp"></span><span class="rest">${text}</span>`;
  const [a, b] = el(id).children;
  HOOKS.push(t => { const k = Math.round(text.length * clamp((t - t1) / (t2 - t1))); a.textContent = text.slice(0, k); b.textContent = text.slice(k); });
  for (let i = 0; i < n; i++) cue(t1 + i * (t2 - t1) / n, 'tipp');
};
const pol = (r, a) => [r * Math.cos(a * Math.PI / 180), r * Math.sin(a * Math.PI / 180)];
const f1 = v => v.toFixed(1);

/* ================= Kamera: Fahrt + Zoom (geometrisch), Atmer, Akzente ================= */
const CAMS = [];
const C = { hub: [0, 0, 1], hubR: [-360, 0, 1], rad: [0, 0, .58], ringe: [0, 0, .37], radR: [-360 / .56, 0, .56], plan: [1350, 0, 1], split: [1361, 0, .36] };
const cam = (t0, d, [cx, cy, z], e = 'inout') => CAMS.push({ t0, d, cx, cy, z, e });
const AKZENTE = [];
const akzent = (t, z = .03) => AKZENTE.push([t, z]);
let CAMFERTIG = null;
function camVorbereiten() {
  CAMS.sort((a, b) => a.t0 - b.t0);
  let s = { cx: C.hub[0], cy: C.hub[1], z: C.hub[2] };
  for (const m of CAMS) { m.von = { ...s }; s = { cx: m.cx, cy: m.cy, z: m.z }; }
  CAMFERTIG = s;
}
function camBei(t) {
  let s = { cx: C.hub[0], cy: C.hub[1], z: C.hub[2] };
  for (const m of CAMS) {
    if (t <= m.t0) break;
    const u = E[m.e](clamp((t - m.t0) / m.d));
    s = { cx: lerp(m.von.cx, m.cx, u), cy: lerp(m.von.cy, m.cy, u), z: m.von.z * Math.pow(m.z / m.von.z, u) };
  }
  // Atmer: in jeder Ruhephase fährt die Kamera ganz langsam heran, die nächste Fahrt nimmt das weich zurück
  let atem = 0;
  const ruhen = [[0, CAMS[0]]].concat(CAMS.map((m, i) => [m.t0 + m.d, CAMS[i + 1]]));
  for (const [a, n] of ruhen) {
    if (t < a) continue;
    let v = .022 * E.inout(clamp((t - a) / 9));
    if (n) v *= 1 - E.inout(clamp((t - n.t0) / n.d));
    atem += v;
  }
  let k = 1 + atem;
  for (const [a, h] of AKZENTE) { const d = (t - a) / 1.1; if (d > 0 && d < 1) k += h * Math.sin(Math.PI * E.weich(d)); }
  return { ...s, z: s.z * k };
}
HOOKS.unshift(t => {
  const c = camBei(t);
  WELT.style.transform = `translate(${f1(960 - c.z * c.cx)}px,${f1(540 - c.z * c.cy)}px) scale(${c.z.toFixed(5)})`;
});

/* ================= Rad: Drehung θ(t) ================= */
const DREH_V = [[0, 3]];                      // [t, Grad/s] – Geschwindigkeit, weich dazwischen
const DREH_E = [];                            // [t0, d, Grad] – zusätzliche Drehungen
const thetaBasis = (() => { let cache = null, n = -1; return t => {
  if (!cache || n !== DREH_V.length) { n = DREH_V.length; cache = [0]; const dt = 1 / 120; for (let i = 1; i < 150 * 120; i++) { const tt = i * dt; cache.push(cache[i - 1] + kurve(DREH_V, tt, 1.2) * dt); } }
  const i = Math.max(0, Math.min(cache.length - 2, Math.floor(t * 120))), f = t * 120 - i; return 30 + lerp(cache[i], cache[i + 1], f);
}; })();
const theta = t => { let v = thetaBasis(t); for (const [a, d, g, e] of DREH_E) v += g * E[e || 'inout'](clamp((t - a) / d)); return v; };

/* Geometrie (Weltkoordinaten, Nabe in 0|0) */

/* ---------- Abspann: ruhig und warm ---------- */
const AB = ENDE_SPRACHE + 1.6;
{

}
HOOKS.push(t => { const p = E.inout(clamp((t - AB) / .8)); $('#abspann').style.clipPath = `circle(${(p * 120).toFixed(2)}% at 50% 50%)`; });
cue(AB, 'whoosh');
