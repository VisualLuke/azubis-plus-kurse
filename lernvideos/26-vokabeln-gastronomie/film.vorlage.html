<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Fachvokabeln: Gastronomie</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=block">
<link rel="stylesheet" href="../../werkzeug/stil.css">
<style>
.auf-brand{/*AUF_BRAND*/}
:root{
  --n200:var(--a2273fd3-5899-46bc-985c-b3c33e3c0780,#E6E3EE);
  --b400:var(--f0297ed8-06f5-4ffd-83fc-e6cd5dbaa2cd,#8163EE);
  --warning:var(--c19df991-9894-4419-88fb-b2b58e36f9f7,#E0992B);
  --warning-text:var(--71f60857-f754-4514-8386-e3f62d71441a,#9C6712);
  --warning-bg:var(--c7c18918-fab3-46fc-af57-2ec14b380cb2,#FCF1DD);
  --error:var(--f694e88e-bdd3-4eb1-bf33-26a20f247ed4,#E2556A);
  --error-bg:var(--fb93d1a9-9399-4624-95d4-83b61d28209b,#FCE7EA);
}
#kamera{position:absolute;inset:0;transform-origin:1320px 540px}
.buehne.hell{width:900px;height:720px;border-radius:48px;background:linear-gradient(var(--b50),var(--b100));overflow:hidden}
.buehne.gross{width:1680px;height:880px;border-radius:48px;background:linear-gradient(var(--b50),var(--b100));overflow:hidden}
/* Küche: Fliesenwand und Arbeitsplatte als Teil der Bühne */
.buehne .fliesen{position:absolute;left:0;right:0;top:0;height:520px;
  background-image:linear-gradient(90deg,var(--b100) 4px,transparent 4px),linear-gradient(var(--b100) 4px,transparent 4px);
  background-size:72px 72px;background-position:14px 20px;opacity:.85}
.buehne .platte{position:absolute;left:0;right:0;top:520px;bottom:0;background:linear-gradient(var(--b200),var(--b100))}
.buehne .platte::before{content:'';position:absolute;left:0;right:0;top:0;height:16px;background:var(--b300);opacity:.6}
.buehne .kabel{position:absolute;top:0;width:5px;height:120px;background:var(--n300)}
.buehne.gross .fliesen{height:640px} .buehne.gross .platte{top:640px}
.block .titel{font-size:84px;line-height:94px}

/* ================= Format „Fachvokabeln“ ================= */
/* Artikel-Farben: der = b500 · die = success · das = warning · neutral (Verb, Ruf, Frage) */
.der{--f:var(--b500);--ft:var(--b600);--fa:var(--surface)}
.die{--f:var(--success);--ft:var(--success-text);--fa:var(--surface)}
.das{--f:var(--warning);--ft:var(--warning-text);--fa:var(--surface)}
.neutral{--f:var(--b300);--ft:var(--b600);--fa:var(--b600)}
/* Wortkarte */
.vk{width:640px;height:340px;border-radius:36px;background:var(--surface);box-shadow:0 18px 50px rgba(22,19,37,.10);overflow:hidden;
  padding:44px 46px 38px;display:flex;flex-direction:column}
.vk .band{position:absolute;left:0;right:0;top:0;height:14px;background:var(--f)}
.vk .kopf{display:flex;align-items:center;justify-content:space-between;height:48px;flex:none}
.vk .art{display:inline-block;padding:4px 22px;border-radius:999px;background:var(--f);color:var(--fa);font:800 32px/40px Inter;white-space:nowrap}
.vk.neutral .art{background:var(--b100)}
.vk .punkte{display:flex;gap:9px;align-items:center}
.vk .punkte i{display:block;width:12px;height:12px;border-radius:99px;background:var(--n200)}
.vk .punkte i.fertig{background:var(--b200)}
.vk .punkte i.jetzt{width:40px;background:var(--f);transform-origin:left center}
.vk .wort{margin-top:22px;font-weight:800;letter-spacing:-.03em;color:var(--ink)}
.vk.ohne .wort{margin:auto 0}
.vk .wort .w{display:inline-block;white-space:pre}
.vk .pl{margin-top:auto;display:flex;align-items:baseline;gap:18px;font:600 44px/52px Inter;color:var(--n700);white-space:nowrap}
.vk .pl small{font:700 21px/26px Inter;letter-spacing:.08em;text-transform:uppercase;color:var(--n500)}
/* Satzleiste: Porträt des Sprechers + Beispielsatz, der sich im Takt tippt */
.sl{width:640px;min-height:152px;padding:26px 32px 28px 148px;border-radius:32px;background:var(--surface);box-shadow:0 14px 40px rgba(22,19,37,.09);
  font:600 34px/45px Inter;color:var(--ink)}
.sl .sw{display:inline-block;white-space:nowrap}
.sl u{display:inline-block;text-decoration:none;opacity:0;white-space:pre}
.sl .sw.lw u{color:var(--ft);font-weight:800}
.sl .q{color:var(--b300);font-weight:800}
/* Farb-Legende */
.lg{display:inline-block;padding:6px 24px;border-radius:999px;background:var(--f);color:var(--fa);font:800 34px/44px Inter;margin-right:16px}
/* Wort-Chips im Schlussdialog */
.chip{display:flex;align-items:center;justify-content:center;height:58px;border-radius:999px;background:var(--f);color:var(--fa);font:800 28px/34px Inter;white-space:nowrap;
  box-shadow:0 8px 22px rgba(22,19,37,.14)}
.chip b{font-weight:600;opacity:.85;margin-right:9px}
.chip.neutral{background:var(--b100)}

/* Bausteine */
.portrait{border-radius:999px;overflow:hidden;background:linear-gradient(160deg,var(--b200),var(--b300));border:7px solid var(--surface);
  box-shadow:0 6px 20px rgba(22,19,37,.12)}
.portrait .ebene{position:absolute;left:0;top:0;width:100%;height:100%}
.portrait .figur{position:absolute;left:0;top:6%;width:100%;height:100%;transform-origin:50% 100%}
.portrait .augen{transform-origin:50% 45%}
.portrait .auf{transform-origin:50% 54%}
.portrait .zu{transform-origin:50% 56%}
.welle{border-radius:999px;border:5px solid var(--b300);opacity:0}
.plakette{width:72px;height:72px;border-radius:999px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(22,19,37,.18);border:5px solid var(--surface)}
.plakette svg{width:34px}
.plakette.gruen{background:var(--success)} .plakette.rot{background:var(--error)} .plakette.gelb{background:var(--warning)}
.etikett{padding:10px 24px;border-radius:999px;background:var(--surface);color:var(--b600);font:700 26px/32px Inter;white-space:nowrap;box-shadow:0 6px 18px rgba(22,19,37,.09)}
/* Bon */
.bon{position:absolute;left:0;top:0;width:100%;height:100%;background:var(--surface);box-shadow:inset 0 0 0 3px var(--n200);padding:30px 16px 0;display:flex;flex-direction:column;gap:12px;
  clip-path:polygon(0 0,100% 0,100% 94%,90% 100%,80% 94%,70% 100%,60% 94%,50% 100%,40% 94%,30% 100%,20% 94%,10% 100%,0 94%)}
.bonflug{width:170px;height:220px}
.bonflug .bon{box-shadow:none}
.bon .kl{position:absolute;left:50%;top:0;width:54px;height:14px;margin-left:-27px;border-radius:0 0 8px 8px;background:var(--b600)}
.bon i{display:block;height:9px;border-radius:5px;background:var(--n200)}
.bon span{font:800 21px/24px Inter;color:var(--ink);white-space:nowrap}
.schiene{width:760px;height:18px;border-radius:9px;background:linear-gradient(var(--n200),var(--n300));box-shadow:0 5px 12px rgba(22,19,37,.1)}
/* Speisekarte */
.menu{width:400px;height:540px;border-radius:30px;background:var(--surface);box-shadow:0 16px 44px rgba(22,19,37,.12);padding:40px 38px;display:flex;flex-direction:column;gap:30px}
.menu small{font:800 20px/24px Inter;letter-spacing:.12em;text-transform:uppercase;color:var(--b600);text-align:center}
.menu .gz{display:flex;flex-direction:column;gap:12px;padding-bottom:22px;border-bottom:3px solid var(--n200)}
.menu .gz:last-child{border-bottom:0}
.menu .gz i{display:block;height:14px;border-radius:7px;background:var(--n300)}
.menu .gz .bz{display:flex;gap:8px}
.menu .gz .bz span{width:34px;height:34px;border-radius:99px;background:var(--b100);color:var(--b600);font:800 19px/34px Inter;text-align:center}
.ikon{width:170px;height:170px;border-radius:999px;background:var(--surface);box-shadow:0 10px 28px rgba(22,19,37,.12);display:flex;align-items:center;justify-content:center}
.ikon svg{width:110px}
.ring{border-radius:999px;border:9px solid var(--warning)}
/* Tisch von oben */
.tisch{border-radius:44px;background:var(--b100);box-shadow:inset 0 0 0 14px var(--b200),0 14px 36px rgba(22,19,37,.1)}
.schild5{width:84px;height:74px;border-radius:16px;background:var(--surface);box-shadow:0 6px 16px rgba(22,19,37,.14);color:var(--b600);font:800 44px/74px Inter;text-align:center}
.beleg{width:104px;height:136px;background:var(--surface);border-radius:10px;padding:18px 14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 8px 20px rgba(22,19,37,.14)}
.beleg i{display:block;height:9px;border-radius:5px;background:var(--n200)}
.beleg i.s{background:var(--b300);width:60%}
.beleg.k{width:56px;height:74px;padding:10px 9px;gap:6px;border-radius:7px}
.beleg.k i{height:6px}
/* Bildfenster im Schlussdialog */
.fenster{width:600px;height:400px;border-radius:40px;background:linear-gradient(var(--surface) 55%,var(--b50));box-shadow:0 18px 50px rgba(22,19,37,.12)}

/* Abspann */
.deckel{position:absolute;inset:0;background:linear-gradient(135deg,var(--b500),var(--b700));clip-path:circle(0% at 50% 50%)}
.deckel .gross{font:800 104px/112px Inter;letter-spacing:-.03em;text-align:center}
.deckel .klein{font:400 40px/54px Inter;color:var(--b100);margin-top:24px;text-align:center;max-width:1300px}

/* Kein Kurstitel im Video (Vorgabe 29.09.2026) */
#tb0{display:none!important}
</style></head><body>

<script src="../../werkzeug/motor.js"></script>
<script>
/* ---------- Aufnahme: Satz- und Wortzeiten aus sprache.json ---------- */
const VERSATZ = 0.7;
window.SPRACHE = { datei: 'sprache.mp3', versatz: VERSATZ };
const A = s => s + VERSATZ;
const W = (m, n) => A(wort(m, satz(n).start - .01));          // Filmzeit des Worts im Satz n (oder danach)
const WE = (m, n) => A(wortEnde(m, satz(n).start - .01));
const SA = n => A(satz(n).start);
const SE = n => A(satz(n).ende);
const ENDE_SPRACHE = SE(SPRACHDATEN.saetze.length);
const WELT = document.getElementById('welt');

const el = id => typeof id === 'string' ? (id.startsWith('#') ? $(id) : document.getElementById(id)) : id;
const _tw = tw; tw = (ids, ...r) => _tw([].concat(ids).map(el), ...r);
const _ak = akteur; akteur = (id, ...r) => _ak(el(id), ...r);
const wertBei = (id, p, t) => wert(AKTEURE.get(el(id)), p, t);
const pop = (id, t, basis, snd = 'pop', e = 'back') => { akteur(id, { s: 0, ...basis }); tw(id, t, e === 'back' ? .5 : .65, { s: basis.s ?? 1 }, e); if (snd) cue(t, snd); };
const ein = (id, t, basis, von = { y: 70 }, snd = null) => {
  akteur(id, { ...basis, o: 0, x: basis.x + (von.x || 0), y: basis.y + (von.y || 0), r: von.r || 0 });
  tw(id, t, .5, { o: 1 }, 'out'); tw(id, t, .6, { x: basis.x, y: basis.y, r: basis.r || 0 }, 'sanft');
  tw(id, t + .3, .12, { sy: .93, sx: 1.05 }, 'sinus'); tw(id, t + .42, .4, { sy: 1, sx: 1 }, 'sanft');
  if (snd) cue(t, snd);
};
const aus = (ids, t, d = .35) => tw(ids, t, d, { o: 0, s: .85 }, 'in');
const wackeln = (id, t, n = 3, w = 3) => { for (let i = 0; i < n; i++) tw(id, t + i * .1, .1, { r: i % 2 ? w : -w }, 'sinus'); tw(id, t + n * .1, .25, { r: 0 }, 'sinus'); };
const huepfen = (id, t, h = 18) => {
  const y = wertBei(id, 'y', t);
  tw(id, t, .08, { sy: .94, sx: 1.04 }, 'sinus');
  tw(id, t + .08, .36, { y }, 'sinus', { bogen: h }); tw(id, t + .08, .14, { sy: 1.04, sx: .97 }, 'sinus');
  tw(id, t + .44, .08, { sy: .95, sx: 1.04 }, 'sinus'); tw(id, t + .52, .3, { sy: 1, sx: 1 }, 'sanft');
};
const bump = (id, t, s = 1.1) => { const s0 = wertBei(id, 's', t); tw(id, t, .12, { s: s0 * s }, 'sinus'); tw(id, t + .12, .4, { s: s0 }, 'sanft'); };
const flug = (id, t0, d, x, y, h = 120, extra = {}) => tw(id, t0, d, { x, y, ...extra }, 'inout', { bogen: h });
const landen = (id, t) => { tw(id, t, .08, { sy: .86, sx: 1.08 }, 'sinus'); tw(id, t + .08, .45, { sy: 1, sx: 1 }, 'sanft'); };
const schweben = (ids, a = 4) => [].concat(ids).forEach(id => { AKTEURE.get(el(id)).basis.schweben = a; });
const lerp = (a, b, p) => a + (b - a) * p;
const tpl = id => document.getElementById(id).innerHTML;
const kopie = (id, p) => tpl(id).replace(/id="([^"]+)"/g, `id="$1_${p}"`).replace(/url\(#([^)]+)\)/g, `url(#$1_${p})`);
// neues Element in der Welt: neu(id, inhalt, stil, attribute, klasse)
const neu = (id, inhalt, stil = '', attr = '', klasse = '') => { WELT.insertAdjacentHTML('beforeend', `<div class="a ${klasse}" id="${id}" style="${stil}" ${attr}>${inhalt}</div>`); return id; };
const welle = (id, t, x, y, d = .9) => { if (!el(id)) neu(id, '', 'width:160px;height:160px', 'data-frei', 'welle'); akteur(id, { x, y, o: 0, s: .8 }); set(id, t, { o: .9, s: .8 }); tw(id, t, d, { o: 0, s: 1.6 }, 'weich'); };
let WN = 0;
const wellen = (t, x, y, farbe = null, gr = 160) => { const id = 'wl' + WN++; neu(id, '', `width:${gr}px;height:${gr}px${farbe ? ';border-color:' + farbe : ''}`, 'data-frei', 'welle'); welle(id, t, x, y); };
// Handy/Drucker summt: kleines Zittern von t bis t+d
const summen = (id, t, d = .8, a = 4) => HOOKS.push(z => { const p = z - t; if (p > 0 && p < d) $('#' + id).style.transform += ` translateX(${(a * Math.sin(p * 70) * (1 - p / d)).toFixed(2)}px)`; });
// Dampf über einem Topf
function dampf(id, x, y, t0, gr = 120) {
  WELT.insertAdjacentHTML('beforeend', `<svg class="a" id="${id}" viewBox="0 0 120 90" style="width:${gr}px;height:${gr * .75}px" data-frei>

// Gedeck von oben: Teller, Gabel links, Messer rechts, Glas oben rechts (gegenüber gedreht)
function gedeck(p, cx, cy, flip, gr = 150, besteck = true) {
  const f = flip ? -1 : 1, teile = [[p + 't', 'svgTeller', gr, 0, 0]];
  if (besteck) teile.push([p + 'g', 'svgGabel', 30, -f * gr * .68, 0], [p + 'm', 'svgMesser', 30, f * gr * .68, 0]);
  teile.push([p + 'k', 'svgGlas', 64, f * gr * (besteck ? .7 : .6), -f * gr * (besteck ? .74 : .64)]);
  return teile.map(([id, svg, w, dx, dy]) => { neu(id, tpl(svg), `width:${w}px`, 'data-gruppe="tisch"'); akteur(id, { x: cx + dx, y: cy + dy, o: 0, r: flip && svg !== 'svgTeller' && svg !== 'svgGlas' ? 180 : 0 }); return id; });
}
// eindecken: Teller landet, Besteck gleitet von der Seite, Glas ploppt
function eindecken(ids, t, schnell = 1) {
  const [tl, ...rest] = ids;
  const b = AKTEURE.get(el(tl)).basis;
  akteur(tl, { ...b, s: 1.25 }); tw(tl, t, .2, { o: 1 }); tw(tl, t, .45 * schnell, { s: 1 }, 'in'); landen(tl, t + .45 * schnell); cue(t + .45 * schnell, 'plopp');
  rest.forEach((id, n) => {
    const a = AKTEURE.get(el(id)), bx = a.basis.x, t0 = t + (.3 + n * .15) * schnell;
    if (n < 2 && rest.length === 3) { a.basis.x = bx + (n ? 60 : -60); tw(id, t0, .25, { o: 1 }); tw(id, t0, .5, { x: bx }, 'sanft'); }
    else { a.basis.s = 0; set(id, t0, { o: 1 }); tw(id, t0, .45, { s: 1 }, 'back'); }
    cue(t0, 'klick');
  });
}

  plakette('ok9', 'gruen', 'svgHaken');
  el('ok9').dataset.gruppe = 'f9'; delete el('ok9').dataset.frei;
  pop('ok9', W('Chef', 28) - .1, { x: FX, y: FY - 100 }, 'ding');
  huepfen('priya9', W('Ja', 28), 14); FROH.push(['chef9', W('Chef', 28) + .2, W('Neuer', 30) - .3]);
  SCH.forEach((id, n) => bump(id, W('Chef', 28) + n * .06, 1.12));
  // Neuer Bon: zweimal Risotto
  const tB = W('Neuer', 30) - .25;
  weg([...SCH, 'ok9'], tB - .15);
  neu('bf9', '<div class="bon" id="bi9"><i style="width:55%"></i><span id="bz9">2× Risotto</span><i></i><i style="width:70%"></i></div>', 'width:170px;height:200px;overflow:hidden', 'data-gruppe="f9"');
  M('dr9', kopie('t-drucker', '9'), 240, FX, FY + 110, tB);
  akteur('bf9', { x: FX, y: FY + 110 + (57 - 80) * 1.5 - 100, o: 0 }); tw('bf9', tB, .3, { o: 1 });
  akteur('bi9', { y: 210 }, true); tw('bi9', tB + .2, 1.0, { y: 0 }, 'inout'); summen('dr9', tB + .2, 1, 3); cue(tB + .2, 'scan');
  const za = W('zweimal', 30), zb = WE('Risotto', 30);
  HOOKS.push(t => { el('bz9').style.clipPath = `inset(0 ${(100 - 100 * clamp((t - za) / (zb - za))).toFixed(1)}% 0 0)`; });
  nicken('priya9', W('Risotto', 30) + .2, 1);
  // Schmeck es bitte ab: Topf, Löffel probiert
  const tS = W('Schmeck', 31) - .25;
  weg(['dr9', 'bf9'], tS - .1);
  M('topf9', kopie('t-topfo', '9'), 230, FX - 60, FY + 50, tS);
  dampf('dampf9', FX - 60, FY - 70, tS + .3, 110); el('dampf9').dataset.gruppe = 'f9'; delete el('dampf9').dataset.frei;
  neu('loe9', kopie('t-loeffel', '9'), 'width:170px', 'data-gruppe="f9"');
  akteur('loe9', { x: FX + 170, y: FY + 120, o: 0 }); tw('loe9', tS + .1, .3, { o: 1 });
  flug('loe9', W('bitte', 31) - .2, .5, FX - 80, FY - 10, 60, { r: -24 }); tw('loe9', W('ab', 31) - .15, .15, { y: FY + 15 }, 'inout');
  flug('loe9', W('ab', 31) + .05, .6, FX + 170, FY - 40, 90, { r: 6 });
  // … die Allergene, der Gast verträgt keine Nüsse
  const tA = W('Allergene', 31) - .15;
  weg(['topf9', 'dampf9', 'loe9'], tA - .1);
  neu('nuss9', tpl('svgNuss'), '', 'data-gruppe="f9"', 'ikon');
  pop('nuss9', tA, { x: FX, y: FY }, 'pop');
  plakette('x9', 'rot', 'svgX'); el('x9').dataset.gruppe = 'f9'; delete el('x9').dataset.frei;
  pop('x9', W('Nüsse', 31) - .05, { x: FX + 70, y: FY - 70 }, 'plopp'); wackeln('nuss9', W('Nüsse', 31), 3, 4); akzent(W('Nüsse', 31), .04);
  nicken('priya9', W('verträgt', 31), 1.2);
  // Verstanden. Hinter dir! – der Topf wird durchs Bild getragen
  weg(['nuss9', 'x9'], W('Verstanden', 32) + .3);
  nicken('chef9', W('Verstanden', 32) + .1, 1);
  const tH = W('Hinter', 33) - .3;
  neu('topfH9', kopie('t-topf', 'h9'), 'width:190px', 'data-gruppe="f9"');
  akteur('topfH9', { x: FX - 170, y: FY + 40, o: 0 }); tw('topfH9', tH, .25, { o: 1 });
  tw('topfH9', tH, 1.5, { x: FX + 170 }, 'inout'); for (let n = 0; n < 5; n++) tw('topfH9', tH + n * .3, .3, { y: FY + 40 }, 'sinus', { bogen: 8 });
  cue(tH, 'whoosh');
  // Zwei Risotto auf dem Pass!
  const tP = W('Zwei', 34) - .3;
  weg('topfH9', tP - .2);
  neu('pass9', tpl('svgPass'), 'width:480px', 'data-gruppe="f9"');
  ein('pass9', tP - .1, { x: FX, y: FY + 90 }, { y: 50 });
  const PY9 = FY + 90 - 50 * .667 + 14 * .667 - 44 * .8;
  [W('Zwei', 34), W('Risotto', 34)].forEach((t, n) => {

  wackeln('gl9', W('Pass', 34), 3, 4); cue(W('Pass', 34), 'ding'); akzent(W('Pass', 34), .04);
  FROH.push(['chef9', W('Pass', 34) + .3, 99]); FROH.push(['priya9', SE(34) + .1, 99]);
  // Wort-Chips: ploppen beim Sprechen auf, blinken, reihen sich unten ein
  const CHIPS = [['die', 'Mise en place', 300, W('Mise', 27)], ['der', 'Bon', 170, W('Bon', 30)], ['neutral', 'abschmecken', 240, W('ab', 31)],
                 ['das', 'Allergen', 230, W('Allergene', 31)], ['neutral', 'Hinter dir!', 210, W('Hinter', 33)], ['der', 'Pass', 170, W('Pass', 34)]];
  const GAP = 22, summe = CHIPS.reduce((s, c) => s + c[2], 0) + GAP * 5;
  let cx = FX - summe / 2;
  CHIPS.forEach(([art, text, w, t], n) => {

    // blinken: zwei Pulse mit Lichtring

    const tF = t + .75;
    flug(id, tF, .7, zx, 800, 40, { s: 1 }); landen(id, tF + .7); cue(tF, 'whoosh');
  });
  CHIPS.forEach((c, n) => bump('chip9' + n, SE(34) + 1.3 + n * .08, 1.1));
}

/* ---------- Abspann ---------- */
const AB = ENDE_SPRACHE + 2.0;
HOOKS.push(t => { const p = E.inout(clamp((t - AB) / .7)); $('#abspann').style.clipPath = `circle(${(p * 120).toFixed(2)}% at 50% 50%)`; });
cue(AB, 'whoosh');
akteur('asTitel', { o: 0, y: 50 }, true); tw('asTitel', AB + .5, .7, { o: 1, y: 0 }, 'weich');
akteur('asUnter', { o: 0, y: 36 }, true); tw('asUnter', AB + .85, .6, { o: 1, y: 0 }, 'weich');

start(AB + 3.8, AB + 2);
