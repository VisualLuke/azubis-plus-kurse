<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Was würdest du tun? Notruf richtig nutzen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=block">
<link rel="stylesheet" href="../../werkzeug/stil.css">
<style>
.auf-brand{/*AUF_BRAND*/}
:root{
  --n200:var(--a2273fd3-5899-46bc-985c-b3c33e3c0780,#E6E3EE);
  --n400:var(--7bda698f-465c-49f5-afd3-31fe7cd36aff,#9A93AD);
  --b400:var(--f0297ed8-06f5-4ffd-83fc-e6cd5dbaa2cd,#8163EE);
  --warning:var(--c19df991-9894-4419-88fb-b2b58e36f9f7,#E0992B);
  --warning-text:var(--71f60857-f754-4514-8386-e3f62d71441a,#9C6712);
  --warning-bg:var(--c7c18918-fab3-46fc-af57-2ec14b380cb2,#FCF1DD);
  --error:var(--f694e88e-bdd3-4eb1-bf33-26a20f247ed4,#E2556A);
  --error-text:var(--d7fd93d3-1584-4a75-90a2-a9f7bacacacb,#C73E53);
  --error-bg:var(--fb93d1a9-9399-4624-95d4-83b61d28209b,#FCE7EA);
  --info:var(--3f081c40-af4e-4425-a97f-c7528bc5ad4d,#3B82F6);
  --info-bg:var(--f939ccd9-6c46-4062-bfe6-c36c169ccafb,#E6EFFE);
}
html,body{background:var(--b700)}
#welt{transform-origin:0 0}
.z{position:absolute;left:0;top:0}
/* Die Welt: eine Straße am Abend, ein Mehrfamilienhaus im Schnitt (Puppenhaus), weiter rechts Leitstelle und Wachen */
.buehne.welt{width:8400px;height:1700px;border-radius:0;overflow:hidden;background:var(--b700)}
.buehne.welt > *{position:absolute}
.himmel{left:0;top:0;width:8400px;height:1150px;background:linear-gradient(var(--b700),var(--b600) 62%,var(--b500))}
.daemmer{left:0;top:0;width:8400px;height:1150px;background:linear-gradient(var(--b500),var(--b300) 70%,var(--b200))}
.boden{left:0;top:1150px;width:8400px;height:550px;background:linear-gradient(var(--b300) 0,var(--b300) 30px,var(--n700) 30px,var(--n700) 270px,var(--b300) 270px,var(--b300) 300px,var(--b700) 300px)}
.boden::after{content:'';position:absolute;left:0;right:0;top:146px;height:8px;background:repeating-linear-gradient(90deg,var(--b400) 0 70px,transparent 70px 140px);opacity:.55}
.hausbild{left:0;top:0}

/* Räume: Licht aus (Overlay), Rauch, Glut */
.dunkel{background:var(--b700)}
.clip{overflow:hidden}
.clip > *{position:absolute}
.puff{border-radius:999px}
.decke{left:0;right:0;top:0}
.glut{border-radius:999px;background:radial-gradient(circle,var(--warning) 0,color-mix(in srgb,var(--warning) 55%,transparent) 30%,transparent 68%)}
.lampe{border-radius:999px;background:radial-gradient(circle,var(--warning-bg) 0,color-mix(in srgb,var(--warning-bg) 40%,transparent) 35%,transparent 70%)}

/* Türen (Blatt dreht sich um das Scharnier), Klingel, Rauchmelder */
.tuer{width:76px;height:176px;border-radius:8px 8px 0 0;background:var(--b700)}
.tuer i{position:absolute;left:6px;top:6px;right:6px;bottom:0;border-radius:5px 5px 0 0;background:var(--b500)}
.tuer b{position:absolute;left:6px;top:6px;width:64px;height:170px;border-radius:5px 5px 0 0;transform-origin:0 50%;
  background:linear-gradient(160deg,var(--b300),var(--b400));box-shadow:inset 0 0 0 4px var(--b500)}
.tuer b::after{content:'';position:absolute;right:9px;top:88px;width:9px;height:24px;border-radius:5px;background:var(--b700)}
.tuer .spalt{position:absolute;left:4px;right:4px;bottom:-4px;height:8px;border-radius:4px;background:var(--warning);opacity:0}
.klingel{width:34px;height:46px;border-radius:9px;background:var(--surface);box-shadow:0 3px 8px rgba(22,19,37,.25)}
.klingel::after{content:'';position:absolute;left:9px;top:14px;width:16px;height:16px;border-radius:999px;background:var(--b500)}
.led{width:16px;height:16px;border-radius:999px;background:var(--error);box-shadow:0 0 18px 8px rgba(226,85,106,.7)}
.welle{border-radius:999px;border:5px solid var(--b200);opacity:0}
.welle.rot{border-color:var(--error)} .welle.gruen{border-color:var(--success)} .welle.grau{border-color:var(--n400)}
.welle.hell{border-color:var(--surface)}

/* Fassade (klappt auf wie ein Puppenhaus) */
.fassade{width:1200px;height:780px;transform-origin:0 50%;backface-visibility:hidden;background:linear-gradient(var(--b200),var(--b300));
  box-shadow:inset 0 0 0 10px var(--b400)}
.fassade .gurt{position:absolute;left:0;right:0;height:16px;background:var(--b400)}
.fassade .fenster{position:absolute;width:118px;height:132px;border-radius:10px;background:var(--b700);box-shadow:inset 0 0 0 8px var(--surface)}
.fassade .fenster::after{content:'';position:absolute;left:55px;top:8px;width:8px;height:116px;background:var(--surface)}
.fassade .hell{position:absolute;inset:8px;border-radius:4px;background:linear-gradient(var(--warning-bg),var(--warning));opacity:0}
.fassade .ftuer{position:absolute;width:110px;height:190px;bottom:0;border-radius:10px 10px 0 0;background:var(--b700)}
.fassade .ftuer b{position:absolute;left:8px;top:8px;right:8px;bottom:0;border-radius:6px 6px 0 0;transform-origin:0 50%;background:linear-gradient(var(--b400),var(--b500))}
.fassade .ftuer b::after{content:'';position:absolute;right:10px;top:90px;width:10px;height:26px;border-radius:5px;background:var(--b700)}
.fassade .nummer{position:absolute;width:56px;height:44px;border-radius:8px;background:var(--info);color:var(--surface);font:800 28px/44px Inter;text-align:center}

/* Porträt Mai */
.portrait{border-radius:999px;overflow:hidden;background:linear-gradient(160deg,var(--b200),var(--b300));border:7px solid var(--surface);
  box-shadow:0 6px 20px rgba(22,19,37,.25)}
.portrait .ebene{position:absolute;left:0;top:0;width:100%;height:100%}
.portrait .figur{position:absolute;left:0;top:6%;width:100%;height:100%;transform-origin:50% 100%}
.portrait .augen{transform-origin:50% 45%}
.portrait .auf{transform-origin:50% 54%}
.frage{width:72px;height:72px;border-radius:999px;background:var(--surface);color:var(--b600);font:800 46px/72px Inter;text-align:center;
  box-shadow:0 6px 18px rgba(22,19,37,.25)}
.ausruf{width:78px;height:78px;border-radius:999px;background:var(--error);color:var(--surface);font:800 50px/76px Inter;text-align:center;border:5px solid var(--surface);
  box-shadow:0 6px 18px rgba(22,19,37,.3)}

/* Wege (Optionen) und Wegkarten */
.wkarte{width:250px;height:190px;border-radius:28px;background:var(--surface);box-shadow:0 16px 40px rgba(22,19,37,.35)}
.wkarte > *{position:absolute}
.wkarte .licht{inset:0;border-radius:28px;box-shadow:0 0 0 8px var(--b300);opacity:0}
.wkarte .licht.rot{box-shadow:0 0 0 8px var(--error)} .wkarte .licht.gruen{box-shadow:0 0 0 8px var(--success),0 0 50px 8px rgba(31,169,113,.45)}
.wkarte .bst{left:-22px;top:-22px;width:68px;height:68px;border-radius:999px;background:var(--b500);color:var(--surface);font:800 40px/68px Inter;text-align:center;
  border:5px solid var(--surface);box-shadow:0 6px 14px rgba(22,19,37,.3)}
.mtuer{width:66px;height:118px;border-radius:7px 7px 0 0;background:var(--b700)}
.mtuer i{position:absolute;left:5px;top:5px;right:5px;bottom:0;background:var(--warning-bg);border-radius:4px 4px 0 0}
.mtuer b{position:absolute;left:5px;top:5px;width:56px;height:113px;border-radius:4px 4px 0 0;transform-origin:0 50%;background:linear-gradient(160deg,var(--b300),var(--b400))}
.gedanke{width:124px;height:96px;border-radius:44px;background:var(--b100)}
.gedanke::before{content:'';position:absolute;left:-14px;bottom:-6px;width:20px;height:20px;border-radius:999px;background:var(--b100)}
.dampf path{fill:none;stroke:var(--n400);stroke-width:6;stroke-linecap:round}

/* Handys */
.tel{width:120px;height:190px;border-radius:24px;background:linear-gradient(150deg,var(--b600),var(--b700));padding:9px;box-shadow:0 10px 26px rgba(22,19,37,.3)}
.tel .schirm{position:relative;width:100%;height:100%;border-radius:17px;background:var(--b50);overflow:hidden}
.tel .schirm > *{position:absolute;left:0;right:0;text-align:center}
.tel .wer{top:34px;font:800 19px/24px Inter;color:var(--ink)}
.tel .nr{top:28px;font:800 40px/46px Inter;color:var(--ink);letter-spacing:.02em}
.tel .av{left:31px;top:-46px;width:42px;height:42px;border-radius:999px;background:var(--b200);display:flex;align-items:center;justify-content:center}
.tel .knopf{left:auto;right:auto;width:44px;height:44px;border-radius:999px;bottom:16px;display:flex;align-items:center;justify-content:center}
.tel .knopf svg{width:24px}
.tel .knopf.gruen{background:var(--success)} .tel .knopf.rot{background:var(--error)}
.tel.gross{width:200px;height:370px;border-radius:38px;padding:13px}
.tel.gross .schirm{border-radius:27px}
.tel.gross .guthaben{top:22px;font:600 20px/26px Inter;color:var(--n500)}
.tel.gross .guthaben b{font-weight:800;color:var(--error-text)}
.tel.gross .nr{top:92px;font:800 66px/72px Inter}
.tel.gross .zeit{top:176px;font:600 22px/28px Inter;color:var(--success-text)}
.tel.gross .knopf{width:74px;height:74px;bottom:26px}
.tel.gross .knopf svg{width:38px}
.tel .ring{left:auto;right:auto;border-radius:999px;border:6px solid var(--success);opacity:0}

/* Symbole, Chips, Notizblock */
.plakette{width:60px;height:60px;border-radius:999px;display:flex;align-items:center;justify-content:center;border:4px solid var(--surface);box-shadow:0 4px 12px rgba(22,19,37,.25)}
.plakette svg{width:30px}
.plakette.gruen{background:var(--success)} .plakette.rot{background:var(--error)}
.chip{height:84px;border-radius:42px;background:var(--surface);box-shadow:0 10px 26px rgba(22,19,37,.28);display:flex;align-items:center;gap:14px;padding:0 26px 0 12px;
  font:800 30px/1 Inter;color:var(--ink);white-space:nowrap}
.chip .ic{width:60px;height:60px;border-radius:999px;background:var(--b500);flex:none;display:flex;align-items:center;justify-content:center}
.chip .ic svg{width:36px}
.chip.gruen{background:var(--success-bg);color:var(--success-text)} .chip.gruen .ic{background:var(--success)}
.ichip{width:92px;height:92px;border-radius:999px;background:var(--surface);box-shadow:0 10px 26px rgba(22,19,37,.28);display:flex;align-items:center;justify-content:center}
.ichip svg{width:58px}
.notiz{width:230px;height:290px;border-radius:22px;background:var(--surface);box-shadow:0 14px 34px rgba(22,19,37,.3)}
.notiz::before{content:'';position:absolute;left:0;right:0;top:0;height:46px;border-radius:22px 22px 0 0;background:var(--b500)}
.notiz .zeile{position:absolute;left:26px;height:12px;border-radius:6px;background:var(--n200)}
.notiz .hk{position:absolute;left:150px;width:44px;height:44px;border-radius:999px;background:var(--success);display:flex;align-items:center;justify-content:center}
.notiz .hk svg{width:26px}
.sanduhr{width:90px;height:120px}
.sanduhr svg{width:100%;height:100%}

/* Funk-Blasen zwischen Handy und Leitstelle */
.funk{height:104px;border-radius:52px 52px 52px 14px;background:var(--surface);box-shadow:0 12px 30px rgba(22,19,37,.3);display:flex;align-items:center;gap:18px;
  padding:0 34px 0 18px;font:800 46px/1 Inter;color:var(--ink);white-space:nowrap}
.funk .ic{width:70px;height:70px;border-radius:999px;background:var(--b500);flex:none;display:flex;align-items:center;justify-content:center}
.funk .ic svg{width:40px}
.funk .ok{position:absolute;right:-20px;top:-20px;width:56px;height:56px;border-radius:999px;background:var(--success);border:4px solid var(--surface);
  display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(22,19,37,.25)}
.funk .ok svg{width:28px}

/* Wachen: Rolltor, Schild mit Nummer, Blaulicht */
.rtor{overflow:hidden;border-radius:12px 12px 0 0;background:var(--b700)}
.rtor > *{position:absolute}
.rtor .lam{left:0;right:0;top:0;height:100%;background:repeating-linear-gradient(var(--b200) 0 22px,var(--b300) 22px 26px)}
.nschild{height:96px;min-width:150px;padding:0 26px;border-radius:22px;background:var(--surface);box-shadow:0 8px 22px rgba(22,19,37,.3);
  font:800 64px/96px Inter;color:var(--error-text);text-align:center;white-space:nowrap}
.nschild.blau{color:var(--info)} .nschild.lila{color:var(--b600)}
.blau{border-radius:999px;background:radial-gradient(circle,var(--info-bg) 0,var(--info) 28%,color-mix(in srgb,var(--info) 30%,transparent) 50%,transparent 70%)}
.wtext .titel{font:800 40px/48px Inter;color:var(--surface);white-space:nowrap;text-align:center}
.kal{width:150px;height:140px;border-radius:20px;background:var(--surface);box-shadow:0 10px 26px rgba(22,19,37,.3);overflow:hidden}
.kal::before{content:'';position:absolute;left:0;right:0;top:0;height:34px;background:var(--b500)}
.kal i{position:absolute;width:14px;height:14px;border-radius:4px;background:var(--n200)}
.kal i.we{background:var(--b300)}
.pfeil path{fill:none;stroke:var(--success);stroke-width:12;stroke-linecap:round;stroke-linejoin:round}

/* Text im Bild: dunkle Bauchbinde oben links (fest im Bild, nicht in der Welt) */
.kap{position:absolute;left:64px;top:50px;padding:14px 30px 12px;border-radius:26px;background:color-mix(in srgb,var(--b700) 88%,transparent);
  box-shadow:0 10px 30px rgba(22,19,37,.3);transform-origin:0 50%}
.kap .titel{font:800 50px/62px Inter;letter-spacing:-.01em;color:var(--surface);white-space:nowrap}
.kap .w.rot .wi{color:var(--error-bg)} .kap .w.gruen .wi{color:var(--success-bg)}
.kap .w.hell .wi{color:var(--b200)}
/* Optionen A · B · C: Leiste oben rechts */
.hb{width:84px;height:84px;border-radius:999px;background:var(--b500);color:var(--surface);font:800 46px/84px Inter;text-align:center;border:5px solid var(--surface);
  box-shadow:0 8px 20px rgba(22,19,37,.3)}
.hb .mk{position:absolute;right:-16px;top:-16px;width:46px;height:46px;border-radius:999px;display:flex;align-items:center;justify-content:center;border:3px solid var(--surface)}
.hb .mk svg{width:24px}
.hb .mk.rot{background:var(--error)} .hb .mk.gruen{background:var(--success)}
.ring3{width:190px;height:190px}
.ring3 svg{position:absolute;inset:0;width:190px;height:190px}
.ring3 b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:800 86px/1 Inter;color:var(--surface)}

/* Abspann: ein Rollladen fährt herunter */
.laden{position:absolute;inset:0;background:repeating-linear-gradient(var(--b600) 0 52px,var(--b700) 52px 58px);clip-path:inset(0 0 100% 0)}
.laden .ende{background:radial-gradient(ellipse at 50% 50%,color-mix(in srgb,var(--b500) 70%,transparent) 0,transparent 70%)}
.laden .gross{font:800 96px/108px Inter;letter-spacing:-.03em;text-align:center}
.laden .klein{font:400 40px/54px Inter;color:var(--b100);margin-top:26px;text-align:center;max-width:1300px}
</style></head><body>

<template id="svgSand"><svg viewBox="0 0 40 40"><path d="M10 5h20M10 35h20" stroke="var(--surface)" stroke-width="4" stroke-linecap="round"/>
  <path d="M13 6c0 8 5 10 5 14s-5 6-5 14h14c0-8-5-10-5-14s5-6 5-14Z" stroke="var(--surface)" stroke-width="3.4" stroke-linejoin="round" fill="none"/>

  <circle cx="20" cy="19" r="2.6" fill="var(--error)"/><path d="M12 30q8 5 16 0" stroke="var(--surface)" stroke-width="3" stroke-linecap="round" fill="none"/></svg></template>
<template id="svgStock"><svg viewBox="0 0 40 40"><path d="M6 34V18L20 7l14 11v16Z" fill="var(--surface)"/><rect x="11" y="15" width="18" height="6" rx="1.5" fill="var(--b500)"/><rect x="11" y="24" width="18" height="6" rx="1.5" fill="var(--b300)"/></svg></template>
<template id="svgSandgross"><svg viewBox="0 0 90 120">
  <rect x="10" y="4" width="70" height="12" rx="5" fill="var(--b600)"/><rect x="10" y="104" width="70" height="12" rx="5" fill="var(--b600)"/>
  <path d="M20 16h50c0 26-18 34-18 44s18 18 18 44H20c0-26 18-34 18-44S20 42 20 16Z" fill="var(--b50)" stroke="var(--b300)" stroke-width="4" stroke-linejoin="round"/>
  <path class="oben" d="M26 22h38c-2 16-14 26-19 30-5-4-17-14-19-30Z" fill="var(--warning)"/>
  <path class="unten" d="M24 102c2-14 12-24 21-26 9 2 19 12 21 26Z" fill="var(--warning)"/>
  <path class="strahl" d="M45 58v42" stroke="var(--warning)" stroke-width="3"/></svg></template>
<template id="tplMai"><div class="figur"><div class="ebene">{{figur-mai}}</div><div class="ebene augen">{{figur-augen}}</div>
  <div class="ebene zu">{{figur-mund-zu}}</div><div class="ebene auf">{{figur-mund-auf}}</div><div class="ebene froh">{{figur-mund-froh}}</div></div></template>

<div id="welt">
  <div class="a buehne welt" id="bue"><div class="himmel"></div><div class="daemmer" id="daemmer"></div><div class="boden"></div>
    <svg class="hausbild" id="hausbild" viewBox="0 0 8400 1700" style="width:8400px;height:1700px"></svg></div>
  <div class="a" id="mond" style="width:170px">{{mond}}</div>
  <!-- Räume: Licht aus, Lampen -->
  <div class="z lampe" id="lampeM" style="left:1560px;top:330px;width:300px;height:300px;opacity:0"></div>
  <div class="z dunkel" id="dunkelN" style="left:724px;top:390px;width:364px;height:240px;opacity:.55"></div>
  <div class="z dunkel" id="dunkelM" style="left:1512px;top:390px;width:364px;height:240px;opacity:.6"></div>
  <!-- Rauch: Nachbarwohnung, Treppenhaus; Glut hinter der Nachbartür; Glut in Mais Wohnung (Szene 8) -->
  <div class="z clip" id="clipN" style="left:724px;top:390px;width:364px;height:240px"><div class="glut" id="glutN" style="left:30px;top:-40px;width:360px;height:360px;opacity:0"></div></div>
  <div class="z clip" id="clipT" style="left:1112px;top:390px;width:376px;height:500px"></div>
  <div class="z clip" id="clipM" style="left:1512px;top:390px;width:364px;height:240px"><div class="glut" id="glutM" style="left:218px;top:100px;width:200px;height:200px;opacity:0"></div></div>
  <!-- Rauchmelder -->
  <div class="a" id="melderN" style="width:120px" data-gruppe="haus">{{rauchmelder}}</div>
  <div class="z led" id="ledN" style="opacity:0"></div>
  <div class="a" id="melderM" style="width:120px" data-gruppe="haus">{{rauchmelder~m}}</div>
  <div class="z led" id="ledM" style="opacity:0"></div>
  <!-- Türen -->

// Sanduhr: der obere Sand sinkt, der untere wächst, der Strahl läuft
function sanduhr(id, t0, d) {
  const o = el(id).querySelector('.oben'), u = el(id).querySelector('.unten'), s = el(id).querySelector('.strahl');

}
