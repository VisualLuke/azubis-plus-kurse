<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>Eingeladen sein</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=block">
<link rel="stylesheet" href="../../werkzeug/stil.css">
<style>
.auf-brand{/*AUF_BRAND*/}
:root{
  --border:var(--ace3a6a9-7f72-4964-bea0-331cd543a214,#EDEAF4);
  --n200:var(--a2273fd3-5899-46bc-985c-b3c33e3c0780,#E6E3EE);
  --n400:var(--7bda698f-465c-49f5-afd3-31fe7cd36aff,#9A93AD);
  --b400:var(--f0297ed8-06f5-4ffd-83fc-e6cd5dbaa2cd,#8163EE);
  --error:var(--f694e88e-bdd3-4eb1-bf33-26a20f247ed4,#E2556A);
  --warning-bg:var(--c7c18918-fab3-46fc-af57-2ec14b380cb2,#FCF1DD);
}
/* Leitidee: die Wohnung im Querschnitt (Puppenhaus). Kamera = #welt (translate + scale, Ursprung oben links) */
#welt{transform-origin:0 0}
#himmel{position:absolute;inset:0;background:linear-gradient(var(--b700),var(--b600) 55%,var(--b500));opacity:0}
.boden0{position:absolute;left:-4000px;top:1030px;width:14000px;height:1400px;background:linear-gradient(var(--b100),var(--b50) 30%)}
.boden0::before{content:'';position:absolute;left:0;right:0;top:0;height:8px;background:var(--b200)}
.boden0 .nacht{position:absolute;inset:0;background:linear-gradient(var(--b600),var(--b700));opacity:0}

.huelle{position:absolute;left:0;top:0;width:0;height:0}
.schale{position:absolute;top:50px;height:980px;background:linear-gradient(var(--b300),var(--b400))}
.dach{position:absolute;overflow:visible}
.dach svg,.raum svg.bg,.huelle svg{overflow:visible}
.a.buehne.raum{border-radius:8px;background:none;overflow:hidden}
.raum .tapete{position:absolute;inset:0;background:linear-gradient(var(--surface),var(--b50))}
#rT .tapete{background:repeating-linear-gradient(90deg,transparent 0 58px,var(--b50) 58px 64px),linear-gradient(var(--surface),var(--b50))}
#rF .tapete{background:radial-gradient(circle,var(--b100) 3px,transparent 4px) 0 0/56px 56px,linear-gradient(var(--surface),var(--b50))}
.raum .fussboden{position:absolute;left:0;right:0;bottom:0;height:70px;background:linear-gradient(var(--b100),var(--b200));border-top:5px solid var(--b200)}
.raum svg.bg{position:absolute;left:0;top:0}
.inhalt{position:absolute;inset:0}
.tuerlicht{position:absolute;left:940px;top:240px;width:190px;height:270px;background:linear-gradient(var(--b50),var(--b100))}
.tuerblatt{position:absolute;left:940px;top:240px;width:190px;height:270px;border-radius:6px 6px 0 0;background:linear-gradient(160deg,var(--b400),var(--b600));transform-origin:0 50%}
.tuerblatt::before,.tuerblatt::after{content:'';position:absolute;left:26px;right:26px;border-radius:8px;background:var(--b500);opacity:.7}
.tuerblatt::before{top:24px;height:96px}.tuerblatt::after{top:142px;height:100px}
.tuerblatt i{position:absolute;right:20px;top:138px;width:18px;height:18px;border-radius:999px;background:var(--surface);box-shadow:0 2px 0 var(--b700)}
.leer{position:absolute;inset:40px 40px 110px;border:7px dashed var(--b300);border-radius:28px;background:var(--b50)}
.a.buehne.spalt{background:none;border-radius:0}
.spalt .schwelle{position:absolute;left:30px;right:30px;top:792px;height:30px;border-radius:8px;background:linear-gradient(var(--b200),var(--b300))}
.spalt .schein{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 60%,var(--surface),transparent 70%);opacity:.8}

/* Fassade: die Front des Puppenhauses klappt zu */
.fassade{position:absolute;top:50px;height:980px;z-index:20;background:linear-gradient(var(--b100),var(--b50));border:8px solid var(--b300)}
#fasL{left:-60px;width:2350px;border-radius:14px 0 0 14px;transform-origin:0 50%}
#fasR{left:2290px;width:1590px;border-radius:0 14px 14px 0;transform-origin:100% 50%}
.fassade::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(var(--b100) 0 46px,var(--b200) 46px 49px);opacity:.45}
.fenster{position:absolute;border-radius:12px;background:var(--b300);box-shadow:0 10px 0 var(--b200)}
.fenster .glas,.fenster .licht{position:absolute;inset:12px;border-radius:6px}
.fenster .glas{background:linear-gradient(160deg,var(--b50),var(--b100))}
.fenster .licht{background:linear-gradient(var(--surface),var(--warning-bg));box-shadow:0 0 60px 18px var(--warning-bg);opacity:0}
.fenster::before,.fenster::after{content:'';position:absolute;background:var(--b300);z-index:2}
.fenster::before{left:50%;top:12px;bottom:12px;width:10px;margin-left:-5px}
.fenster::after{top:50%;left:12px;right:12px;height:10px;margin-top:-5px}
.haustuer{position:absolute;border-radius:14px 14px 0 0;background:linear-gradient(160deg,var(--b400),var(--b600))}
.haustuer i{position:absolute;right:26px;top:48%;width:22px;height:22px;border-radius:999px;background:var(--surface)}

/* Figuren */
.portrait{z-index:10;border-radius:999px;overflow:hidden;background:linear-gradient(160deg,var(--b200),var(--b300));border:7px solid var(--surface);
  box-shadow:0 6px 20px rgba(22,19,37,.12)}
.portrait .ebene{position:absolute;left:0;top:0;width:100%;height:100%}
.portrait .figur{position:absolute;left:0;top:6%;width:100%;height:100%;transform-origin:50% 100%}
.portrait .augen{transform-origin:50% 45%}
.portrait .auf{opacity:0;transform-origin:50% 56%}
.flieg{z-index:12}

/* Text im Bild: Tafel, die von der Zimmerdecke hängt */
.tafel{padding:16px 34px 20px;border-radius:20px;background:var(--surface);border-top:7px solid var(--b500);
  box-shadow:0 14px 34px rgba(22,19,37,.14);white-space:nowrap;text-align:center;transform-origin:50% -150px}
.tafel .titel{font:700 1em/1.22 Inter;letter-spacing:-.01em;color:var(--ink)}
.tafel .schnur{position:absolute;bottom:100%;width:4px;height:900px;background:var(--b300)}
.tafel .schnur.l{left:20%}.tafel .schnur.r{right:20%}

/* Bausteine */
.welle{border-radius:999px;border:5px solid var(--b300);opacity:0}
.sym{width:124px;height:124px;border-radius:999px;background:var(--surface);border:5px solid var(--b200);box-shadow:0 8px 22px rgba(22,19,37,.12)}
.sym .ic{position:absolute;left:14px;top:12px;width:86px;height:86px}
.fz{position:absolute;width:46px;height:46px;border-radius:999px;background:var(--b500);color:var(--surface);
  font:800 30px/46px Inter;text-align:center;box-shadow:0 3px 8px rgba(22,19,37,.2)}
.sym .fz{right:-12px;top:-12px}
.einladung{width:240px;height:160px;border-radius:22px;background:var(--surface);box-shadow:0 10px 26px rgba(22,19,37,.16);overflow:hidden}
.einladung .kopf{position:absolute;left:0;right:0;top:0;height:34px;background:linear-gradient(var(--b500),var(--b600))}
.einladung .ic{position:absolute;left:10px;top:40px;width:110px;height:110px}
.einladung b{position:absolute;right:20px;top:72px;font:800 42px/48px Inter;color:var(--ink);letter-spacing:-.02em}
.nachricht{display:flex;align-items:center;gap:10px;padding:12px 20px 12px 14px;border-radius:24px;background:var(--b500);box-shadow:0 8px 20px rgba(22,19,37,.16)}
.nachricht::after{content:'';position:absolute;left:24px;bottom:-9px;width:22px;height:22px;background:inherit;transform:rotate(45deg);border-radius:0 0 5px 0}
.nachricht .ic{width:52px;height:52px;position:relative}
.nachricht i{width:12px;height:12px;border-radius:999px;background:var(--b200)}
.blase{padding:14px 28px;border-radius:26px;background:var(--surface);box-shadow:0 8px 24px rgba(22,19,37,.12);
  font:700 30px/38px Inter;color:var(--ink);white-space:nowrap}
.blase::after{content:'';position:absolute;left:30px;bottom:-11px;width:24px;height:24px;background:inherit;transform:rotate(45deg);border-radius:0 0 6px 0}
.blase.r::after{left:auto;right:30px}
.blase .rest,.chat .rest{visibility:hidden}
.blase.bild{display:flex;align-items:center;gap:6px;padding:10px 20px 10px 14px}
.blase.bild .ic{width:70px;height:70px;position:relative}
.blase.bild b{font:800 46px/1 Inter;color:var(--b500)}
.blase.gross{width:190px;height:136px;padding:0}
.blase.gross .q{position:absolute;left:0;right:0;top:20px;text-align:center;font:800 84px/96px Inter;color:var(--b500)}
.blase.gross svg{position:absolute;left:45px;top:18px;width:100px}
.chat{padding:16px 30px;border-radius:26px 26px 6px 26px;background:var(--b500);color:var(--surface);font:700 30px/38px Inter;white-space:nowrap;
  box-shadow:0 8px 24px rgba(22,19,37,.16)}
.platz{width:118px;height:66px;border-radius:10px;background:var(--surface);border:4px solid var(--b200);box-shadow:0 5px 0 var(--b200)}
.platz::before{content:'';position:absolute;left:22px;right:22px;top:24px;height:8px;border-radius:4px;background:var(--b300)}
.bon{width:112px;height:200px;background:var(--surface);box-shadow:0 6px 16px rgba(22,19,37,.12);transform-origin:50% 100%;
  clip-path:polygon(0 8px,10% 0,20% 8px,30% 0,40% 8px,50% 0,60% 8px,70% 0,80% 8px,90% 0,100% 8px,100% 100%,0 100%)}
.bon i,.bonh i{position:absolute;left:16px;height:9px;border-radius:5px;background:var(--n200)}
.bon u,.bonh u{position:absolute;left:16px;right:16px;height:12px;border-radius:6px;background:var(--b500)}
.bonh{width:112px;height:96px;background:var(--surface);box-shadow:0 6px 16px rgba(22,19,37,.12)}
.bonh.oben{clip-path:polygon(0 8px,10% 0,20% 8px,30% 0,40% 8px,50% 0,60% 8px,70% 0,80% 8px,90% 0,100% 8px,100% 92%,90% 100%,80% 92%,70% 100%,60% 92%,50% 100%,40% 92%,30% 100%,20% 92%,10% 100%,0 92%)}
.bonh.unten{clip-path:polygon(0 0,10% 8px,20% 0,30% 8px,40% 0,50% 8px,60% 0,70% 8px,80% 0,90% 8px,100% 0,100% 100%,0 100%)}
.zettel{width:190px;height:250px;border-radius:16px;background:var(--surface);box-shadow:0 10px 26px rgba(22,19,37,.14);overflow:hidden}
.zettel .kopf{position:absolute;left:0;right:0;top:0;height:30px;background:linear-gradient(var(--b500),var(--b600))}
.zettel .zeile{position:absolute;left:18px;right:18px;height:34px}
.zettel .kasten{position:absolute;left:0;top:0;width:34px;height:34px;border-radius:9px;border:4px solid var(--b200);background:var(--surface)}
.zettel .strich{position:absolute;left:48px;top:12px;height:10px;border-radius:5px;background:var(--n200)}
.zettel .ok{position:absolute;left:-4px;top:-8px;width:44px;height:44px}
.abz{width:150px;height:150px;border-radius:999px;background:var(--surface);border:6px solid var(--b500);box-shadow:0 10px 24px rgba(22,19,37,.12)}
.abz .ic{position:absolute;left:20px;top:16px;width:98px;height:98px}
.abz.geist{background:none;border:6px dashed var(--b300);box-shadow:none}
.abz.geist .ic{opacity:.3}
.riesen{width:300px;height:300px;border-radius:999px;border:8px dashed var(--b300);background:var(--surface);
  font:800 220px/284px Inter;color:var(--b500);text-align:center}
.denk{width:440px;height:300px;border-radius:150px;background:var(--surface);box-shadow:0 12px 30px rgba(22,19,37,.14)}
.denk i{position:absolute;border-radius:999px;background:var(--surface);box-shadow:0 8px 18px rgba(22,19,37,.12)}
.denk .ds{position:absolute;width:120px;height:120px}
.dampf path{fill:none;stroke-linecap:round}
.band{width:520px;height:900px;z-index:15;background:linear-gradient(90deg,transparent,var(--surface),transparent)}
.endplatte{z-index:25;padding:26px 70px 34px;border-radius:40px;background:var(--surface);border-top:9px solid var(--b500);
  box-shadow:0 22px 60px rgba(22,19,37,.18);white-space:nowrap;text-align:center}
.endplatte .titel{font:800 104px/118px Inter;letter-spacing:-.03em;color:var(--ink)}
#schluss{position:absolute;left:0;right:0;top:62px;text-align:center;font:700 54px/66px Inter;letter-spacing:-.01em;color:var(--surface);opacity:0}
</style></head><body>

<template id="t-blumen">{{blumen}}</template>
<template id="t-pralinen">{{pralinen}}</template>
<template id="t-schuhe">{{schuhe}}</template>
<template id="t-hausschuhe">{{hausschuhe}}</template>
<template id="t-schuessel">{{schuessel}}</template>
<template id="t-teller">{{teller}}</template>
<template id="t-kasse">{{kasse}}</template>
<template id="t-loeffel">{{kochloeffel}}</template>
<template id="t-herz">{{herz}}</template>
<template id="t-topf">{{topf-offen}}</template>
<template id="t-deckel">{{topf-deckel}}</template>
<template id="t-handy">{{handy}}</template>
<template id="t-uhr">{{uhr}}</template>
<template id="t-uhrs">{{uhrsymbol}}</template>
<template id="f-amir">{{figur-amir}}</template>
<template id="f-jonas">{{figur-jonas}}</template>
<template id="gesicht"><div class="ebene augen">{{figur-augen}}</div><div class="ebene zu">{{figur-mund-zu}}</div><div class="ebene auf">{{figur-mund-auf}}</div><div class="ebene froh">{{figur-mund-froh}}</div></template>
<template id="svgHaken"><svg viewBox="0 0 40 40"><path class="zeichnen" pathLength="1" d="M9 21l7 7 15-16" stroke="var(--b500)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg></template>

<div id="himmel"></div>
<div id="kamera"><div id="welt">
  <div class="boden0"><div class="nacht" id="nacht"></div></div>

  <!-- linke Haushälfte: Treppenhaus + Flur -->
  <div class="huelle" id="hausL">
    <div class="dach" id="dachL" style="left:0;top:0"><svg viewBox="-160 -400 2460 460" style="position:absolute;left:-160px;top:-400px;width:2460px;height:460px">
      <path d="M-140 50L1910-360L2290-284V50Z" fill="var(--b500)"/>
      <path d="M-140 50L1910-360L2290-284" stroke="var(--b300)" stroke-width="10" fill="none" stroke-linejoin="round"/>
      <path d="M115 50L1910-309L2290-233V50Z" fill="var(--b50)"/>
      <g stroke="var(--b100)" stroke-width="6"><path d="M600 50V-46M1100 50V-146M1600 50V-246M2100 50V-271"/></g>
      <rect x="1850" y="-150" width="120" height="96" rx="12" fill="var(--b200)"/><rect x="1862" y="-138" width="96" height="72" rx="6" fill="var(--b100)"/>
      <path d="M1910-138v72M1862-102h96" stroke="var(--b200)" stroke-width="7"/></svg></div>
    <div class="schale" id="schaleL" style="left:-60px;width:2350px;border-radius:14px 0 0 14px"></div>

    <div class="a buehne raum" id="rT" style="left:0;top:110px;width:1300px;height:860px">
      <div class="tapete"></div><div class="fussboden"></div>
      <svg class="bg" width="1300" height="860" viewBox="0 0 1300 860">
        <path d="M380 790V734H450V678H520V622H590V566H660V510H1300V790Z" fill="var(--b100)"/>
        <g fill="var(--b200)"><rect x="380" y="734" width="70" height="56"/><rect x="450" y="678" width="70" height="112"/><rect x="520" y="622" width="70" height="168"/><rect x="590" y="566" width="70" height="224"/></g>
        <path d="M380 734H450V678H520V622H590V566H660V510H1300" stroke="var(--b300)" stroke-width="7" fill="none" stroke-linejoin="round"/>
        <path d="M660 540H1300" stroke="var(--b200)" stroke-width="4"/>
        <g stroke="var(--b200)" stroke-width="5"><path d="M415 734V618M485 678V562M555 622V506M625 566V450M700 510V394M790 510V394M870 510V394"/></g>
        <path d="M400 618L660 410H880" stroke="var(--b300)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <rect x="926" y="226" width="218" height="286" rx="8" fill="var(--b200)"/>
        <rect x="930" y="500" width="210" height="12" rx="6" fill="var(--b300)"/>
      </svg>
      <div class="tuerlicht"></div><div class="tuerblatt" id="tuer"><i></i></div>
    </div>

    <div class="a buehne raum" id="rF" style="left:1360px;top:110px;width:900px;height:860px">
      <div class="tapete"></div><div class="fussboden"></div>
      <svg class="bg" width="900" height="860" viewBox="0 0 900 860">
        <rect x="716" y="232" width="150" height="14" rx="7" fill="var(--b400)"/>
        <g fill="var(--b500)"><circle cx="738" cy="254" r="7"/><circle cx="791" cy="254" r="7"/><circle cx="844" cy="254" r="7"/></g>
        <path d="M762 254c-26 10-34 40-34 70v80h68v-80c0-30-8-60-34-70Z" fill="var(--b300)"/>
        <path d="M762 254v150" stroke="var(--b400)" stroke-width="4"/>
        <path d="M844 254c-18 8-22 32-22 56v60h36v-60c0-24-2-48-14-56Z" fill="var(--b200)"/>
        <rect x="360" y="600" width="240" height="190" rx="10" fill="var(--b200)"/>
        <rect x="374" y="616" width="212" height="160" rx="6" fill="var(--b50)"/>
        <rect x="360" y="596" width="240" height="16" rx="7" fill="var(--b400)"/>
        <rect x="374" y="690" width="212" height="10" rx="4" fill="var(--b300)"/>
        <rect x="104" y="782" width="204" height="14" rx="7" fill="var(--b300)"/>
      </svg>
    </div>
  </div>

  <!-- rechte Haushälfte: Küche -->
  <div class="huelle" id="hausR">
    <div class="dach" id="dachR" style="left:0;top:0"><svg viewBox="2280 -400 1700 460" style="position:absolute;left:2280px;top:-400px;width:1700px;height:460px">
      <rect x="3190" y="-190" width="96" height="140" rx="6" fill="var(--b400)"/><rect x="3178" y="-200" width="120" height="22" rx="6" fill="var(--b500)"/>
      <path d="M2290-284L3960 50H2290Z" fill="var(--b500)"/>
      <path d="M2290-284L3960 50" stroke="var(--b300)" stroke-width="10" fill="none"/>
      <path d="M2290-233L3705 50H2290Z" fill="var(--b50)"/>
      <g stroke="var(--b100)" stroke-width="6"><path d="M2700 50V-150M3200 50V-50"/></g></svg></div>
    <div class="schale" id="schaleR" style="left:2290px;width:1590px;border-radius:0 14px 14px 0"></div>
    <div class="a buehne raum" id="rK" style="left:2320px;top:110px;width:1500px;height:860px">
      <div class="tapete"></div><div class="fussboden"></div>
      <div class="inhalt" id="kInhalt">
        <svg class="bg" width="1500" height="860" viewBox="0 0 1500 860">
          <rect x="70" y="380" width="300" height="170" fill="var(--b50)"/>
          <g stroke="var(--b100)" stroke-width="4"><path d="M70 437h300M70 494h300M145 380v170M220 380v170M295 380v170"/></g>
          <rect x="80" y="560" width="280" height="230" rx="12" fill="var(--b200)"/>
          <rect x="70" y="548" width="300" height="18" rx="7" fill="var(--b400)"/>
          <rect x="112" y="612" width="216" height="118" rx="12" fill="var(--b600)"/><rect x="126" y="626" width="188" height="90" rx="8" fill="var(--b500)"/>
          <rect x="130" y="748" width="180" height="10" rx="5" fill="var(--b400)"/>
          <g fill="var(--b500)"><circle cx="130" cy="589" r="8"/><circle cx="220" cy="589" r="8"/><circle cx="310" cy="589" r="8"/></g>
          <rect x="430" y="250" width="210" height="540" rx="10" fill="var(--b300)"/>
          <rect x="444" y="264" width="182" height="512" rx="6" fill="var(--b50)"/>
          <g fill="var(--b400)"><rect x="444" y="398" width="182" height="12"/><rect x="444" y="540" width="182" height="12"/><rect x="444" y="680" width="182" height="12"/></g>
          <rect x="462" y="330" width="46" height="68" rx="9" fill="var(--b200)"/><rect x="458" y="322" width="54" height="14" rx="5" fill="var(--b400)"/>
          <rect x="524" y="346" width="40" height="52" rx="8" fill="var(--b100)"/><rect x="520" y="338" width="48" height="12" rx="5" fill="var(--b300)"/>
          <rect x="580" y="352" width="32" height="46" rx="7" fill="var(--b200)"/>
          <g fill="var(--b100)" stroke="var(--b200)" stroke-width="3"><ellipse cx="535" cy="672" rx="62" ry="9"/><ellipse cx="535" cy="660" rx="62" ry="9"/><ellipse cx="535" cy="648" rx="62" ry="9"/></g>
          <rect x="468" y="716" width="60" height="60" rx="10" fill="var(--b200)"/><rect x="544" y="728" width="60" height="48" rx="10" fill="var(--b100)"/>
          <path d="M870 600V480a60 60 0 0 1 120 0V600Z" fill="var(--b200)"/>
          <path d="M1190 600V480a60 60 0 0 1 120 0V600Z" fill="var(--b200)"/>
          <rect x="780" y="560" width="620" height="28" rx="9" fill="var(--b400)"/>
          <rect x="792" y="586" width="596" height="14" rx="5" fill="var(--b500)"/>
          <rect x="812" y="598" width="24" height="192" rx="6" fill="var(--b500)"/><rect x="1344" y="598" width="24" height="192" rx="6" fill="var(--b500)"/>
        </svg>
      </div>

<script>
/* ---------- Aufnahme: Satz- und Wortzeiten aus sprache.json ---------- */

const akzent = (t, h = .035, wx = null, wy = null, d = 1.1) => AKZENTE.push([t, h, wx, wy, d]);
function kamBei(t) {
  const c = AKTEURE.get(el('cam'));

function portrait(id, wer, gr, attr = '', ort = 'welt') {

const SAETZE_Z = SPRACHDATEN.saetze.map(s => [A(s.start), A(s.ende), s.sprecher]);

HOOKS.push(t => {

  const wer = sprecherBei(t), pegel = pegelBei(t);
